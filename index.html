    // ============================================================================

    function calculateWeeksSinceJoin(joinedAtTimestamp) {
      if (!joinedAtTimestamp) return 1;
      const diffMs = Math.max(0, Date.now() - joinedAtTimestamp);
      return Math.max(1, Math.ceil(diffMs / MS_PER_WEEK));
    }

    function formatDateAr(timestamp) {
      const d = new Date(timestamp);
      return `${d.getDate()} ${MONTHS_AR[d.getMonth()]} ${d.getFullYear()}`;
    }

    function getWeekDateRangeLabel(weekIndex, totalWeeks) {
      const today = new Date();
      const weeksAgo = totalWeeks - weekIndex;
      const endOfWeek = new Date(today);
      endOfWeek.setDate(today.getDate() - (weeksAgo * 7));
      const startOfWeek = new Date(endOfWeek);
      startOfWeek.setDate(endOfWeek.getDate() - 6);

      const sDay = startOfWeek.getDate();
      const eDay = endOfWeek.getDate();
      const sMonth = MONTHS_AR[startOfWeek.getMonth()];
      const eMonth = MONTHS_AR[endOfWeek.getMonth()];
      return sMonth === eMonth ? `${sDay} - ${eDay} ${sMonth}` : `${sDay} ${sMonth} - ${eDay} ${eMonth}`;
    }

    function formatTimeAr(timeStr = "19:00") {
      const [hStr, mStr] = timeStr.split(':');
      let h = parseInt(hStr, 10);
      const period = h >= 12 ? 'مساءً' : 'صباحاً';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return `${String(h12).padStart(2, '0')}:${mStr} ${period}`;
    }

    function computeWeekSchedule(sched, taskDefs) {
      const meetDay = parseInt(sched.meetDay, 10);
      const duration = parseInt(sched.meetDuration, 10);
      const [h, m] = (sched.meetTime || "19:00").split(':').map(Number);
      const agendaDay = (meetDay + 6) % 7;

      const totalMinutes = h * 60 + m + duration;
      const endDayOffset = Math.floor(totalMinutes / (24 * 60));
      const endH = Math.floor((totalMinutes % (24 * 60)) / 60);
      const endM = totalMinutes % 60;
      const endTimeStr = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
      const minutesDay = (meetDay + endDayOffset + 1) % 7;

      return {
        lecture: {
          dayName: 'طوال الأسبوع',
          timeLabel: 'مرن حسب وقتك',
          durationMinutes: taskDefs.lecture.durationMinutes,
          badge: taskDefs.lecture.badge
        },
        agenda: {
          dayName: DAYS_AR[agendaDay],
          timeLabel: `قبل ${formatTimeAr(sched.meetTime)}`,
          durationMinutes: taskDefs.agenda.durationMinutes,
          badge: taskDefs.agenda.badge
        },
        attendance: {
          dayName: DAYS_AR[meetDay],
          timeLabel: `${formatTimeAr(sched.meetTime)} - ${formatTimeAr(endTimeStr)}`,
          durationMinutes: duration || taskDefs.attendance.durationMinutes,
          badge: taskDefs.attendance.badge
        },
        minutes: {
          dayName: DAYS_AR[minutesDay],
          timeLabel: `حتى ${formatTimeAr(endTimeStr)}`,
          durationMinutes: taskDefs.minutes.durationMinutes,
          badge: taskDefs.minutes.badge
        }
      };
    }

    function getTaskScorePoints(taskObj) {
      if (!taskObj || taskObj.status === 'pending') return 0;
      if (taskObj.status === 'on_time') return 100;
      if (taskObj.status === 'late') return 50;
      return 0;
    }

    function computeCadreMetrics(user) {
      const totalWeeks = calculateWeeksSinceJoin(user.joinedAt);
      let totalPossiblePoints = totalWeeks * 4 * 100;
      let earnedPoints = 0;
      let onTimeCount = 0;
      let lateCount = 0;
      let pendingCount = 0;
      let quizScores = [];

      const byTaskKey = {
        lecture: { onTime: 0, late: 0, pending: 0 },
        agenda: { onTime: 0, late: 0, pending: 0 },
        attendance: { onTime: 0, late: 0, pending: 0 },
        minutes: { onTime: 0, late: 0, pending: 0 }
      };

      for (let w = 1; w <= totalWeeks; w++) {
        const wRec = (user.tasksRecord && user.tasksRecord[w]) || {};
        ['lecture', 'agenda', 'attendance', 'minutes'].forEach(k => {
          const t = wRec[k] || { status: 'pending' };
          earnedPoints += getTaskScorePoints(t);
          if (t.status === 'on_time') {
            onTimeCount++;
            byTaskKey[k].onTime++;
          } else if (t.status === 'late') {
            lateCount++;
            byTaskKey[k].late++;
          } else {
            pendingCount++;
            byTaskKey[k].pending++;
          }
          if (k === 'lecture' && t.quizSubmission) {
            const qPct = Math.round((t.quizSubmission.score / t.quizSubmission.total) * 100);
            quizScores.push(qPct);
          }
        });
      }

      const overallScorePct = totalPossiblePoints > 0 ? Math.round((earnedPoints / totalPossiblePoints) * 100) : 0;
      const avgQuizPct = quizScores.length > 0 ? Math.round(quizScores.reduce((a, b) => a + b, 0) / quizScores.length) : null;

      return {
        totalWeeks,
        overallScorePct,
        onTimeCount,
        lateCount,
        pendingCount,
        totalTasksCount: totalWeeks * 4,
        avgQuizPct,
        byTaskKey
      };
    }

    function getYoutubeEmbedUrl(url) {
      if (!url) return "";
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : url;
    }

    function normalizeDb(raw) {
      if (!raw || typeof raw !== "object") return INITIAL_STATE;
      const safeSystemConfig = {
        ...INITIAL_STATE.systemConfig,
        ...(raw.systemConfig || {}),
        availableCurriculumWeeks: Array.isArray(raw.systemConfig?.availableCurriculumWeeks)
          ? raw.systemConfig.availableCurriculumWeeks
          : INITIAL_STATE.systemConfig.availableCurriculumWeeks,
        quotes: Array.isArray(raw.systemConfig?.quotes)
          ? raw.systemConfig.quotes
          : INITIAL_STATE.systemConfig.quotes,
        taskDefinitions: {
          ...INITIAL_STATE.systemConfig.taskDefinitions,
          ...(raw.systemConfig?.taskDefinitions || {})
        }
      };

      const safeBulletins = Array.isArray(raw.bulletins) ? raw.bulletins : INITIAL_STATE.bulletins;
      const safeCurriculums = {
        ...INITIAL_STATE.weeklyCurriculums,
        ...(raw.weeklyCurriculums || {})
      };

      const rawUsers = Array.isArray(raw.users) && raw.users.length > 0 ? raw.users : INITIAL_STATE.users;
      const hasExec = rawUsers.some(u => u.roleType === "executive");
      const mergedUsers = hasExec
        ? rawUsers
        : [...rawUsers, INITIAL_STATE.users.find(u => u.roleType === "executive")].filter(Boolean);

      const safeUsers = mergedUsers.map(u => {
        if (u.roleType !== "cadre") return u;
        return {
          ...u,
          joinedAt: u.joinedAt || Date.now(),
          defaultSchedule: {
            meetDay: u.defaultSchedule?.meetDay ?? 2,
            meetTime: u.defaultSchedule?.meetTime || "19:00",
            meetDuration: u.defaultSchedule?.meetDuration || 90
          },
          weekOverrides: u.weekOverrides || {},
          tasksRecord: u.tasksRecord || {}
        };
      });

      return {
        systemConfig: safeSystemConfig,
        bulletins: safeBulletins,
        weeklyCurriculums: safeCurriculums,
        users: safeUsers
      };
    }

        <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className={`bg-white rounded-[32px] ${maxWidth} w-full p-6 sm:p-7 shadow-2xl border border-stone-100 max-h-[92vh] overflow-y-auto relative`}>
            <div className="flex items-center justify-between pb-4 mb-4 border-b border-stone-100">
              <div>
                {badge && <span className="text-xs font-bold text-orange-600 block">{badge}</span>}
                <h3 className="text-lg font-black text-stone-900">{title}</h3>
              </div>
              <button
                onClick={onClose}
                title="إغلاق"
                className="w-9 h-9 rounded-full bg-stone-100 text-stone-600 flex items-center justify-center font-bold hover:bg-stone-200 transition"
              >
                ✕
              </button>

            {children}

    // ============================================================================
    // 3.5 SUPABASE & NETLIFY CLOUD SYNC ENGINE
    // ============================================================================
    const CLOUD_CONFIG_KEY = "MADYAN_SUPABASE_CLOUD_CONFIG_V1";
    const SQL_SCHEMA_SNIPPET = `-- شغل هذا الكود في Supabase -> SQL Editor -> New Query
CREATE TABLE IF NOT EXISTS public.madyan_app_state (
  id TEXT PRIMARY KEY DEFAULT 'global',
  state_data JSONB NOT NULL,
  updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
  updated_by TEXT DEFAULT 'system'
);
ALTER TABLE public.madyan_app_state ENABLE ROW LEVEL SECURITY;
DROP POLICY IF EXISTS "Allow public read/write on madyan_app_state" ON public.madyan_app_state;
CREATE POLICY "Allow public read/write on madyan_app_state"
  ON public.madyan_app_state FOR ALL USING (true) WITH CHECK (true);`;

    function loadCloudConfig() {
      try {
        const saved = localStorage.getItem(CLOUD_CONFIG_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.supabaseUrl && parsed.supabaseAnonKey) return parsed;
        }
      } catch (e) {}
      return { supabaseUrl: "", supabaseAnonKey: "" };
    }

    function saveCloudConfigToStorage(url, key) {
      const cfg = {
        supabaseUrl: (url || "").trim().replace(/\/$/, ""),
        supabaseAnonKey: (key || "").trim()
      };
      localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cfg));
      return cfg;
    }

    // ============================================================================
    // 4. MAIN APPLICATION COMPONENT
    // ============================================================================
    function App() {
      const [db, setDb] = useState(() => {
        try {
          const saved = localStorage.getItem("MADYAN_DB_V6_SAFE");
          if (saved) return normalizeDb(JSON.parse(saved));
        } catch (e) {}
        return normalizeDb(INITIAL_STATE);
      });

      const [currentUserId, setCurrentUserId] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);
      const [cloudConfig, setCloudConfig] = useState(() => loadCloudConfig());
      const [cloudStatus, setCloudStatus] = useState("checking"); // 'checking' | 'connected' | 'local_only' | 'error'
      const [cloudError, setCloudError] = useState("");
      const [lastSyncAt, setLastSyncAt] = useState(null);
      const [cloudModalOpen, setCloudModalOpen] = useState(false);
      const isRemoteUpdateRef = React.useRef(false);
      const supabaseClientRef = React.useRef(null);
      const initialPullDoneRef = React.useRef(false);

      // تلقائياً: فحص إعدادات Netlify Serverless API (/api/config) عند فتح الموقع
      useEffect(() => {
        let cancelled = false;
        async function discoverServerlessConfig() {
          try {
            const res = await fetch("/api/config", { method: "GET" });
            if (res.ok) {
              const data = await res.json();
              if (!cancelled && data && data.configured && data.supabaseUrl && data.supabaseAnonKey) {
                const merged = saveCloudConfigToStorage(data.supabaseUrl, data.supabaseAnonKey);
                setCloudConfig(merged);
              }
            }
          } catch (e) {}
        }
        discoverServerlessConfig();
        return () => { cancelled = true; };
      }, []);

      // الاتصال بـ Supabase PostgreSQL ومزامنة البيانات + Realtime WebSocket
      useEffect(() => {
        if (!cloudConfig.supabaseUrl || !cloudConfig.supabaseAnonKey || !window.supabase) {
          setCloudStatus("local_only");
          return;
        }

        let channel = null;
        let active = true;
        setCloudStatus("checking");
        setCloudError("");

        try {
          const client = window.supabase.createClient(cloudConfig.supabaseUrl, cloudConfig.supabaseAnonKey);
          supabaseClientRef.current = client;

          async function initSync() {
            const { data, error } = await client
              .from("madyan_app_state")
              .select("*")
              .eq("id", "global")
              .maybeSingle();

            if (!active) return;

            if (error) {
              setCloudStatus("error");
              setCloudError(error.message || "تعذر القراءة من جدول madyan_app_state. تأكد من تشغيل ملف schema.sql في Supabase.");
              return;
            }

            if (data && data.state_data) {
              isRemoteUpdateRef.current = true;
              setDb(normalizeDb(data.state_data));
              setLastSyncAt(new Date().toLocaleTimeString("ar-EG"));
              initialPullDoneRef.current = true;
              setCloudStatus("connected");
            } else {
              // الجدول فارغ: نرفع البيانات الابتدائية لقاعدة البيانات
              const { error: upsertErr } = await client
                .from("madyan_app_state")
                .upsert({
                  id: "global",
                  state_data: db,
                  updated_at: new Date().toISOString(),
                  updated_by: "initial_seed"
                });
              if (upsertErr) {
                setCloudStatus("error");
                setCloudError(upsertErr.message);
                return;
              }
              initialPullDoneRef.current = true;
              setLastSyncAt(new Date().toLocaleTimeString("ar-EG"));
              setCloudStatus("connected");
            }
          }

          initSync();

          // الاشتراك اللحظي (Supabase Realtime)
          channel = client
            .channel("madyan_global_sync")
            .on(
              "postgres_changes",
              { event: "*", schema: "public", table: "madyan_app_state", filter: "id=eq.global" },
              (payload) => {
                if (payload.new && payload.new.state_data) {
                  isRemoteUpdateRef.current = true;
                  setDb(normalizeDb(payload.new.state_data));
                  setLastSyncAt(new Date().toLocaleTimeString("ar-EG"));
                }
              }
            )
            .subscribe();
        } catch (err) {
          setCloudStatus("error");
          setCloudError(String(err.message || err));
        }

        return () => {
          active = false;
          if (channel && supabaseClientRef.current) {
            supabaseClientRef.current.removeChannel(channel);
          }
        };
      }, [cloudConfig.supabaseUrl, cloudConfig.supabaseAnonKey]);

      // حفظ أي تعديل في localStorage + دفعه تلقائياً إلى Supabase PostgreSQL و Netlify API
      useEffect(() => {
        try {
          localStorage.setItem("MADYAN_DB_V6_SAFE", JSON.stringify(db));
        } catch (e) {}

        if (isRemoteUpdateRef.current) {
          isRemoteUpdateRef.current = false;
          return;
        }

        if (cloudStatus === "connected" && supabaseClientRef.current && initialPullDoneRef.current) {
          const timer = setTimeout(async () => {
            try {
              const { error } = await supabaseClientRef.current
                .from("madyan_app_state")
                .upsert({
                  id: "global",
                  state_data: db,
                  updated_at: new Date().toISOString(),
                  updated_by: currentUserId || "anonymous"
                });
              if (!error) {
                setLastSyncAt(new Date().toLocaleTimeString("ar-EG"));
              }
            } catch (e) {}
          }, 250);
          return () => clearTimeout(timer);
        }
      }, [db, cloudStatus, currentUserId]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3200);
      };

      const currentUser = useMemo(() => {
        return db.users.find(u => u.id === currentUserId) || null;
      }, [db.users, currentUserId]);

      const updateUserRecord = (userId, updaterFn) => {
        setDb(prev => ({
          ...prev,
          users: prev.users.map(u => u.id === userId ? updaterFn(u) : u)
        }));
      };

      const isUsernameTaken = (newUsername, ignoreUserId) => {
        const clean = newUsername.trim().toLowerCase();
        return db.users.some(u => u.id !== ignoreUserId && u.username.toLowerCase() === clean);
      };

      // تأكيد استيعاب وقراءة التعميم الإداري (One-Way Acknowledgment)
      const acknowledgeBulletin = (bulletinId, userId) => {
        const now = new Date();
        const stamp = `اليوم ${formatTimeAr(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`)}`;
        setDb(prev => ({
          ...prev,
          bulletins: (prev.bulletins || []).map(b => {
            if (b.id !== bulletinId) return b;
            return {
              ...b,
              acknowledgedBy: {
                ...(b.acknowledgedBy || {}),
                [userId]: stamp
              }
            };
          })
        }));
        showToast("تم تسجيل الاطلاع والاستيعاب للتعميم الإداري ✓");
      };

      const resetDemoData = () => {
        localStorage.removeItem("MADYAN_DB_V6_SAFE");
        setDb(normalizeDb(INITIAL_STATE));
        setCurrentUserId(null);
        showToast("تمت استعادة البيانات الافتراضية للنظام بنجاح");
      };

      return (
        <div className="min-h-screen pb-20">
          {toastMsg && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-[60] bg-stone-900 text-white text-xs font-bold px-5 py-3 rounded-2xl shadow-xl border border-stone-700 animate-bounce">
              {toastMsg}
            </div>
          )}

          {!currentUser ? (
            <LoginView
              users={db.users}
              onLoginSuccess={(user) => setCurrentUserId(user.id)}
              onResetDemo={resetDemoData}
            />
          ) : currentUser.roleType === "admin" ? (
            <AdminPortal
              db={db}
              setDb={setDb}
              currentUser={currentUser}
              onLogout={() => setCurrentUserId(null)}
              showToast={showToast}
            />
          ) : currentUser.roleType === "executive" ? (
            <ExecutivePortal
              db={db}
              setDb={setDb}
              currentUser={currentUser}
              onLogout={() => setCurrentUserId(null)}
              showToast={showToast}
            />
          ) : (
            <CadrePortal
              db={db}
              currentUser={currentUser}
              updateUserRecord={updateUserRecord}
              isUsernameTaken={isUsernameTaken}
              onAcknowledgeBulletin={acknowledgeBulletin}
              onLogout={() => setCurrentUserId(null)}
              showToast={showToast}
            />
          )}

          {/* شريط الحالة السحابية العائم (Supabase + Netlify Full-Stack Status) */}
          <div className="fixed bottom-4 left-4 z-40 flex items-center gap-2">
            <button
              onClick={() => setCloudModalOpen(true)}
              className={`px-3.5 py-2 rounded-2xl text-xs font-black shadow-lg border flex items-center gap-2 transition ${
                cloudStatus === "connected"
                  ? "bg-emerald-950/95 text-emerald-100 border-emerald-700 hover:bg-emerald-900"
                  : cloudStatus === "error"
                  ? "bg-rose-950/95 text-rose-100 border-rose-700 hover:bg-rose-900"
                  : "bg-stone-900/95 text-white border-stone-700 hover:bg-stone-800"
              }`}
            >
              <span className={`w-2.5 h-2.5 rounded-full ${
                cloudStatus === "connected"
                  ? "bg-emerald-400 animate-pulse"
                  : cloudStatus === "error"
                  ? "bg-rose-400"
                  : "bg-amber-400"
              }`} />
              <span>
                {cloudStatus === "connected"
                  ? `☁️ متصل بـ Supabase لحظياً ${lastSyncAt ? `(${lastSyncAt})` : ""}`
                  : cloudStatus === "error"
                  ? "⚠️ تنبيه اتصال Supabase (اضغط للإصلاح)"
                  : "☁️ إعداد الربط السحابي (Supabase / Netlify)"}
              </span>
            </button>
          </div>

          <CloudSetupModal
            isOpen={cloudModalOpen}
            onClose={() => setCloudModalOpen(false)}
            cloudConfig={cloudConfig}
            cloudStatus={cloudStatus}
            cloudError={cloudError}
            lastSyncAt={lastSyncAt}
            onSaveConfig={(url, key) => {
              const saved = saveCloudConfigToStorage(url, key);
              initialPullDoneRef.current = false;
              setCloudConfig(saved);
              showToast("تم حفظ بيانات الاتصال بـ Supabase وجاري المزامنة ☁️");
            }}
            onDisconnect={() => {
              localStorage.removeItem(CLOUD_CONFIG_KEY);
              supabaseClientRef.current = null;
              initialPullDoneRef.current = false;
              setCloudConfig({ supabaseUrl: "", supabaseAnonKey: "" });
              setCloudStatus("local_only");
              showToast("تم فصل الاتصال السحابي والعودة للوضع المحلي");
            }}
            showToast={showToast}
          />
        </div>
      );
    }

    // ============================================================================
    // 6. CADRE PORTAL COMPONENT (With Administrative Bulletin Feed & Archive)
    // ============================================================================
    function CadrePortal({ db, currentUser, updateUserRecord, isUsernameTaken, onAcknowledgeBulletin, onLogout, showToast }) {
      const totalWeeks = useMemo(() => calculateWeeksSinceJoin(currentUser.joinedAt), [currentUser.joinedAt]);
      const [selectedWeek, setSelectedWeek] = useState(totalWeeks);
      const [showOnboarding, setShowOnboarding] = useState(!currentUser.onboarded);
      const [settingsModalScope, setSettingsModalScope] = useState(null);
      const [lectureModalOpen, setLectureModalOpen] = useState(false);
      const [noteModalTaskKey, setNoteModalTaskKey] = useState(null);
      const [bulletinArchiveOpen, setBulletinArchiveOpen] = useState(false);

      useEffect(() => {
        let needsInit = false;
        const currentRec = currentUser.tasksRecord || {};
        const updatedRec = { ...currentRec };
        for (let w = 1; w <= totalWeeks; w++) {
          if (!updatedRec[w]) {
            needsInit = true;
            updatedRec[w] = {
              lecture: { status: "pending" },
              agenda: { status: "pending" },
              attendance: { status: "pending" },
              minutes: { status: "pending" }
            };
          }
        }
        if (needsInit) {
          updateUserRecord(currentUser.id, u => ({ ...u, tasksRecord: updatedRec }));
        }
      }, [totalWeeks, currentUser.id]);

      // فلترة النشرة الإدارية بحيث يرى الكادر فقط الرسائل الموجهة للجميع أو الموجهة له شخصياً
      const myBulletins = useMemo(() => {
        const list = db.bulletins || [];
        return list.filter(b => b.targetType === "all" || (b.recipientIds || []).includes(currentUser.id));
      }, [db.bulletins, currentUser.id]);

      const unreadBulletins = useMemo(() => {
        return myBulletins.filter(b => !(b.acknowledgedBy && b.acknowledgedBy[currentUser.id]));
      }, [myBulletins, currentUser.id]);

      const isPastWeek = selectedWeek < totalWeeks;
      const activeSched = (currentUser.weekOverrides && currentUser.weekOverrides[selectedWeek]) || currentUser.defaultSchedule;
      const computedSched = computeWeekSchedule(activeSched, db.systemConfig.taskDefinitions);
      const weekRecord = (currentUser.tasksRecord && currentUser.tasksRecord[selectedWeek]) || {
        lecture: { status: "pending" },
        agenda: { status: "pending" },
        attendance: { status: "pending" },
        minutes: { status: "pending" }
      };

      const metrics = useMemo(() => computeCadreMetrics(currentUser), [currentUser]);
      const activeCurriculum = db.weeklyCurriculums[selectedWeek] || db.weeklyCurriculums.default;
      const randomQuote = db.systemConfig.quotes[selectedWeek % Math.max(1, db.systemConfig.quotes.length)] || db.systemConfig.quotes[0];

      const handleTaskAction = (taskKey) => {
        if (taskKey === "lecture") {
          setLectureModalOpen(true);
          return;
        }
        if (isPastWeek) {
          showToast("🔒 لا يمكن تعديل حالة هذه المهمة لأن الأسبوع قد انتهى بالفعل.");
          return;
        }

        const currentStatus = weekRecord[taskKey]?.status || "pending";
        const nextStatus = currentStatus === "pending" ? "on_time" : "pending";
        const now = new Date();
        const timeFormatted = formatTimeAr(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);

        updateUserRecord(currentUser.id, u => ({
          ...u,
          tasksRecord: {
            ...u.tasksRecord,
            [selectedWeek]: {
              ...u.tasksRecord[selectedWeek],
              [taskKey]: {
                ...u.tasksRecord[selectedWeek][taskKey],
                status: nextStatus,
                completedAt: nextStatus === "on_time" ? `اليوم ${timeFormatted}` : null
              }
            }
          }
        }));
      };

      const weekStats = useMemo(() => {
        let completedCount = 0;
        let weekPoints = 0;
        ['lecture', 'agenda', 'attendance', 'minutes'].forEach(k => {
          const st = weekRecord[k]?.status || 'pending';
          if (st !== 'pending') completedCount++;
          weekPoints += getTaskScorePoints(weekRecord[k]);
        });
        return {
          completedCount,
          weekScorePct: Math.round((weekPoints / 400) * 100)
        };
      }, [weekRecord]);

      const getCategoryBadgeStyle = (cat) => {
        switch (cat) {
          case "توجيه عاجل": return "bg-rose-100 text-rose-800 border-rose-200";
          case "سياسة جديدة": return "bg-orange-100 text-orange-800 border-orange-200";
          case "تعميم مشروع": return "bg-amber-100 text-amber-800 border-amber-200";
          default: return "bg-sky-100 text-sky-800 border-sky-200";
        }
      };

      return (

                    lecture: {
                      ...u.tasksRecord[selectedWeek].lecture,
                      status: finalStatus,
                      completedAt: isPastWeek ? `أُنجز متأخراً (${timeFormatted})` : `اليوم ${timeFormatted}`,
                      quizSubmission: submission
                    }
                  }
                }
              }));
              showToast(
                isPastWeek
                  ? "تم اعتماد إجاباتك! نظراً لانتهاء الأسبوع، تم رصد المحاضرة كمكتملة متأخراً (50% سكور)."
                  : "تم اعتماد إجابات الاختبار وتسجيل إنجاز المحاضرة بالعلامة الكاملة ✓"
              );
            }}
          />

          <OnboardingModal
            isOpen={showOnboarding}
            onClose={() => {
              updateUserRecord(currentUser.id, u => ({ ...u, onboarded: true }));
              setShowOnboarding(false);
            }}
            currentUser={currentUser}
            taskDefs={db.systemConfig.taskDefinitions}
            isUsernameTaken={isUsernameTaken}
            onSaveOnboarding={(updatedFields) => {
              updateUserRecord(currentUser.id, u => ({
                ...u,
                ...updatedFields,
                onboarded: true
              }));
              setShowOnboarding(false);
              showToast("تم حفظ إعداداتك وبيانات دخولك بنجاح ✓");
            }}
          />

          <CadreSettingsModal
            scope={settingsModalScope}
            onClose={() => setSettingsModalScope(null)}
            currentUser={currentUser}
            selectedWeek={selectedWeek}
            isPastWeek={isPastWeek}
            isUsernameTaken={isUsernameTaken}
            onSaveSettings={(updater) => {
              updateUserRecord(currentUser.id, updater);
              setSettingsModalScope(null);
              showToast("تم حفظ الإعدادات بنجاح ✓");
            }}
          />

          <TaskNoteModal
            isOpen={Boolean(noteModalTaskKey)}
            onClose={() => setNoteModalTaskKey(null)}
            initialNote={noteModalTaskKey ? (weekRecord[noteModalTaskKey]?.note || "") : ""}
            onSaveNote={(val) => {
              updateUserRecord(currentUser.id, u => ({
                ...u,
                tasksRecord: {
                  ...u.tasksRecord,
                  [selectedWeek]: {
                    ...u.tasksRecord[selectedWeek],
                    [noteModalTaskKey]: {
                      ...u.tasksRecord[selectedWeek][noteModalTaskKey],
                      note: val
                    }
                  }
                }
              }));
              setNoteModalTaskKey(null);
              showToast("تم حفظ المسودة الشخصية ✓");
            }}
          />

          {/* نافذة أرشيف وسجل النشرة الإدارية للكادر (كل الرسائل السابقة) */}
          <CadreBulletinArchiveModal
            isOpen={bulletinArchiveOpen}
            onClose={() => setBulletinArchiveOpen(false)}
            bulletins={myBulletins}
            currentUserId={currentUser.id}
            onAcknowledge={onAcknowledgeBulletin}
          />
        </div>
      );
    }

    // ============================================================================
    // 6.1 CADRE BULLETIN ARCHIVE MODAL (سجل النشرة الإدارية وجميع الرسائل السابقة)
    // ============================================================================
    function CadreBulletinArchiveModal({ isOpen, onClose, bulletins, currentUserId, onAcknowledge }) {
      const [filterCategory, setFilterCategory] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");

      if (!isOpen) return null;

      const filtered = bulletins.filter(b => {
        const matchesCat = filterCategory === "all" || b.category === filterCategory;
        const matchesSearch = !searchQuery.trim() ||
          b.title.includes(searchQuery.trim()) ||
          b.content.includes(searchQuery.trim());
        return matchesCat && matchesSearch;
      });

      const getCategoryBadgeStyle = (cat) => {
        switch (cat) {
          case "توجيه عاجل": return "bg-rose-100 text-rose-800 border-rose-200";
          case "سياسة جديدة": return "bg-orange-100 text-orange-800 border-orange-200";
          case "تعميم مشروع": return "bg-amber-100 text-amber-800 border-amber-200";
          default: return "bg-sky-100 text-sky-800 border-sky-200";
        }
      };

      return (
        <ModalContainer
          isOpen={isOpen}
          onClose={onClose}
          badge="سجل النشرة الإدارية والتعميمات (One-Way Archive)"
          title={`جميع الرسائل والتعميمات الواردة (${bulletins.length})`}
          maxWidth="max-w-2xl"
        >
          <div className="space-y-4">
            {/* شريط البحث والفلترة حسب نوع التعميم */}
            <div className="flex flex-wrap items-center justify-between gap-2 bg-stone-50 p-3 rounded-2xl border border-stone-200/80">
              <input
                type="text"
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                placeholder="ابحث في عنوان أو نص التعميمات السابقة..."
                className="flex-1 min-w-[180px] rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold focus:outline-none focus:border-orange-500"
              />
              <select
                value={filterCategory}
                onChange={e => setFilterCategory(e.target.value)}
                className="rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-black text-stone-700"
              >
                <option value="all">كل التصنيفات ({bulletins.length})</option>
                <option value="سياسة جديدة">سياسة جديدة</option>
                <option value="تعميم مشروع">تعميم مشروع</option>
                <option value="توجيه عاجل">توجيه عاجل</option>
                <option value="معلومة إدارية">معلومة إدارية</option>
              </select>
            </div>

            {/* قائمة الرسائل الحالية والسابقة */}
            <div className="space-y-3 max-h-[60vh] overflow-y-auto pr-1">
              {filtered.length === 0 ? (
                <div className="text-center py-8 text-xs text-stone-400 font-bold">
                  لا توجد رسائل مطابقة للبحث في سجلك.
                </div>
              ) : (
                filtered.map(bul => {
                  const ackTime = bul.acknowledgedBy?.[currentUserId];
                  return (
                    <div
                      key={bul.id}
                      className={`p-4 rounded-2xl border transition space-y-2.5 ${
                        ackTime
                          ? "bg-stone-50/70 border-stone-200/90"
                          : "bg-orange-50/40 border-2 border-orange-300 shadow-sm"
                      }`}
                    >
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div className="flex flex-wrap items-center gap-1.5">
                          <span className={`text-[10px] font-black px-2.5 py-0.5 rounded-full border ${getCategoryBadgeStyle(bul.category)}`}>
                            {bul.category}
                          </span>
                          <span className="text-[11px] font-bold text-stone-700">
                            🏛️ {bul.senderName} ({bul.senderRole})
                          </span>
                          {bul.targetType === "custom" ? (
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-purple-50 text-purple-700 border border-purple-200">
                              🎯 تعميم مخصص
                            </span>
                          ) : (
                            <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-stone-200/70 text-stone-600">
                              🌐 تعميم عام
                            </span>
                          )}
                        </div>
                        <span className="text-[11px] font-semibold text-stone-400">{bul.createdAt}</span>
                      </div>

                      <h4 className="text-sm font-black text-stone-900">{bul.title}</h4>
                      <p className="text-xs text-stone-600 leading-relaxed whitespace-pre-line">{bul.content}</p>

                      <div className="pt-2 border-t border-stone-200/60 flex items-center justify-between">
                        {ackTime ? (
                          <span className="text-[11px] font-bold text-emerald-700 flex items-center gap-1">
                            <span>✓ تم الاطلاع والاستيعاب</span>
                            <span className="text-stone-400 font-normal">({ackTime})</span>
                          </span>
                        ) : (
                          <span className="text-[11px] font-bold text-rose-600">
                            ⏳ لم يتم تأكيد الاستيعاب بعد
                          </span>
                        )}

                        {!ackTime && (
                          <button
                            onClick={() => onAcknowledge(bul.id, currentUserId)}

              <button
                onClick={onClose}
                className="px-6 py-2.5 rounded-2xl bg-stone-900 text-white text-xs font-bold"
              >
                إغلاق السجل
              </button>
            </div>
          </div>
        </ModalContainer>
      );
    }

    // ============================================================================
    // 7. LECTURE VIDEO & LOCKED QUIZ MODAL
    // ============================================================================
    function LectureQuizModal({ isOpen, onClose, weekNumber, isPastWeek, curriculum, lectureRecord, onSubmitQuiz }) {
      const existingSubmission = lectureRecord?.quizSubmission || null;
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [errorMsg, setErrorMsg] = useState("");

      useEffect(() => {
        if (existingSubmission && existingSubmission.answers) {
          const map = {};
          existingSubmission.answers.forEach((ans, i) => { map[i] = ans; });
          setSelectedAnswers(map);
        } else {
          setSelectedAnswers({});
        }
        setErrorMsg("");
      }, [isOpen, existingSubmission]);

      if (!isOpen) return null;

      const safeCurr = curriculum || INITIAL_STATE.weeklyCurriculums.default;
      const questions = safeCurr.questions || [];

      const handleFinalSubmit = () => {
        if (existingSubmission) return;
        for (let i = 0; i < questions.length; i++) {
          if (selectedAnswers[i] === undefined) {
            setErrorMsg(`يرجى الإجابة على السؤال رقم ${i + 1} قبل الاعتماد النهائي.`);
            return;
          }
        }
        let correctCount = 0;
        const answersArray = questions.map((q, idx) => {
          const ans = selectedAnswers[idx];
          if (ans === q.correctIndex) correctCount++;
          return ans;
        });

        onSubmitQuiz({
          score: correctCount,
          total: questions.length,
          answers: answersArray,
          submittedAt: new Date().toLocaleString("ar-EG")
        });
      };

      return (
        <ModalContainer
          isOpen={isOpen}
          onClose={onClose}
          badge={`المحاضرة الأسبوعية • الأسبوع ${weekNumber}`}
          title={safeCurr.lectureTitle}
          maxWidth="max-w-2xl"
        >
          <div className="space-y-5">
            {isPastWeek && !existingSubmission && (
              <div className="p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-900 font-bold">
                ⚠️ تنبيه: هذا الأسبوع قد انتهى بالفعل. يمكنك مشاهدة المحاضرة وحل الاختبار الآن، ولكن ستُسجل المهمة «مكتمل متأخر» بنصف النقاط (50%).
              </div>
            )}

            <p className="text-xs text-stone-500 leading-relaxed">{safeCurr.lectureDesc}</p>

            <div className="rounded-2xl overflow-hidden bg-stone-950 border border-stone-800 aspect-video relative">
              {safeCurr.videoType === "youtube" ? (
                <iframe
                  src={getYoutubeEmbedUrl(safeCurr.videoUrl)}
                  title={safeCurr.lectureTitle}
                  className="w-full h-full"
                  allowFullScreen
                />
              ) : (
                <video
                  src={safeCurr.videoUrl}
                  controls
                  className="w-full h-full object-contain"
                />
              )}
            </div>

            <div className="space-y-4 pt-2 border-t border-stone-100">
              <div className="flex items-center justify-between">
                <h4 className="text-sm font-black text-stone-900">
                  📝 اختبار استيعاب المحاضرة ({questions.length} أسئلة)
                </h4>
                {existingSubmission ? (
                  <span className="text-xs font-black px-3 py-1 rounded-full bg-emerald-100 text-emerald-800">
                    🔒 تم الاعتماد النهائي • النتيجة: {existingSubmission.score}/{existingSubmission.total}
                  </span>
                ) : (
                  <span className="text-[11px] font-bold text-stone-400">
                    تنبيه: لا يمكن تعديل الإجابات بعد الضغط على اعتماد
                  </span>
                )}
              </div>

              {questions.map((q, qIdx) => {
                const userChoice = selectedAnswers[qIdx];
                return (
                  <div key={q.id || qIdx} className="p-4 rounded-2xl bg-stone-50 border border-stone-200/80 space-y-2.5">
                    <div className="text-xs font-black text-stone-800">
                      {qIdx + 1}. {q.text}
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {(q.options || []).map((opt, optIdx) => {
                        const isSelected = userChoice === optIdx;
                        const isCorrect = q.correctIndex === optIdx;

                        let btnStyle = "bg-white border-stone-200 text-stone-700 hover:border-orange-400";
                        if (existingSubmission) {
                          if (isCorrect) {
                            btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-900 font-black";
                          } else if (isSelected && !isCorrect) {
                            btnStyle = "bg-rose-50 border-rose-400 text-rose-800 line-through";
                          } else {
                            btnStyle = "bg-white border-stone-200 text-stone-400 opacity-70";
                          }
                        } else if (isSelected) {
                          btnStyle = "bg-orange-50 border-orange-500 text-orange-900 font-black ring-2 ring-orange-200";
                        }

                        return (
                          <button
                            key={optIdx}
                            type="button"
                            disabled={Boolean(existingSubmission)}
                            onClick={() => setSelectedAnswers(prev => ({ ...prev, [qIdx]: optIdx }))}
                            className={`text-right text-xs p-3 rounded-xl border transition flex items-center justify-between gap-2 ${btnStyle}`}
                          >
                            <span>{opt}</span>
                            {existingSubmission && isCorrect && <span>✅</span>}
                            {existingSubmission && isSelected && !isCorrect && <span>❌</span>}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}

              {errorMsg && (
                <div className="text-xs font-bold text-rose-600 bg-rose-50 p-3 rounded-xl border border-rose-200">
                  {errorMsg}
                </div>
              )}

              <div className="flex justify-end gap-2 pt-2">
                <button
                  onClick={onClose}
                  className="px-5 py-2.5 rounded-2xl bg-stone-100 text-stone-700 text-xs font-bold"
                >
                  إغلاق
                </button>
                {!existingSubmission && (
                  <button
                    onClick={handleFinalSubmit}
                    className="px-6 py-2.5 rounded-2xl madyan-gradient text-white text-xs font-black shadow-md hover:opacity-95"
                  >
                    اعتماد الإجابات النهائي ورصد الدرجة ✓
                  </button>
                )}
              </div>
            </div>
          </div>
        </ModalContainer>
      );
    }

    // ============================================================================
    // 8. ONBOARDING MODAL
    // ============================================================================
    function OnboardingModal({ isOpen, onClose, currentUser, taskDefs, isUsernameTaken, onSaveOnboarding }) {
      const [step, setStep] = useState(1);
      const [name, setName] = useState(currentUser.name || "");
      const [jobTitle, setJobTitle] = useState(currentUser.jobTitle || "");
      const [unit, setUnit] = useState(currentUser.unit || "");
      const [username, setUsername] = useState(currentUser.username || "");
      const [password, setPassword] = useState(currentUser.password || "");
      const [meetDay, setMeetDay] = useState(currentUser.defaultSchedule?.meetDay ?? 2);
      const [meetTime, setMeetTime] = useState(currentUser.defaultSchedule?.meetTime || "19:00");
      const [meetDuration, setMeetDuration] = useState(currentUser.defaultSchedule?.meetDuration || 90);
      const [err, setErr] = useState("");

      if (!isOpen) return null;

      const previewSched = computeWeekSchedule({ meetDay, meetTime, meetDuration }, taskDefs);

      const handleNextStep1 = () => {
        if (!username.trim() || !password.trim()) {
          setErr("اسم المستخدم وكلمة المرور مطلوبان.");
          return;
        }
        if (isUsernameTaken(username, currentUser.id)) {
          setErr("اسم المستخدم هذا مستخدم بالفعل، اختر اسماً آخر.");
          return;
        }
        setErr("");
        setStep(2);
      };

      const handleFinish = () => {
        onSaveOnboarding({
          name: name.trim() || currentUser.name,
          jobTitle: jobTitle.trim() || currentUser.jobTitle,
          unit: unit.trim() || currentUser.unit,
          username: username.trim(),
          password: password.trim(),
          defaultSchedule: {
            meetDay: parseInt(meetDay, 10),
            meetTime,
            meetDuration: parseInt(meetDuration, 10)
          }
        });
      };

      return (
        <ModalContainer
          isOpen={isOpen}
          onClose={onClose}
          badge="تهيئة الحساب عند الدخول الأول"
          title="ضبط ملفك الإداري ومواعيدك الأسبوعية"
        >
          {step === 1 && (
            <div className="space-y-4">
              <p className="text-xs text-stone-500 leading-relaxed">
                مرحباً بك في <strong>Madyan</strong>. يمكنك مراجعة بياناتك الإدارية، كما يمكنك <strong>اختيارياً</strong> تعديل اسم المستخدم وكلمة المرور الخاصة بك:
              </p>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">الاسم الكامل</label>
                <input value={name} onChange={e => setName(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold" />
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">المسمى الوظيفي</label>
                  <input value={jobTitle} onChange={e => setJobTitle(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">الوحدة الإدارية</label>
                  <input value={unit} onChange={e => setUnit(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold" />
                </div>
              </div>

              <div className="p-3.5 rounded-2xl bg-orange-50/70 border border-orange-200/80 space-y-3">
                <div className="text-xs font-black text-orange-900">🔐 بيانات تسجيل الدخول (اختياري: يمكنك تغييرها الآن)</div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[11px] font-bold text-stone-700 mb-1">اسم المستخدم (Username)</label>
                    <input value={username} onChange={e => setUsername(e.target.value)} className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold" />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-stone-700 mb-1">كلمة المرور (Password)</label>
                    <input type="text" value={password} onChange={e => setPassword(e.target.value)} className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold" />
                  </div>
                </div>
              </div>

              {err && <div className="text-xs font-bold text-rose-600">{err}</div>}

              <div className="flex justify-end pt-2">
                <button onClick={handleNextStep1} className="px-7 py-3 rounded-2xl bg-stone-900 text-white text-xs font-bold">
                  التالي: تحديد موعد الاجتماع ←
                </button>
              </div>
            </div>
          )}

          {step === 2 && (
            <div className="space-y-4">
              <p className="text-xs text-stone-500">
                حدّد موعد اجتماعك الأسبوعي وعدد ساعاته ليقوم النظام بحساب موعد الأجندة (قبل 24 ساعة) والمحضر (بعد 24 ساعة):
              </p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">يوم الاجتماع الأسبوعي</label>
                  <select value={meetDay} onChange={e => setMeetDay(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold">
                    {DAYS_AR.map((d, i) => <option key={i} value={i}>{d}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">ساعة بدء الاجتماع</label>
                  <input type="time" value={meetTime} onChange={e => setMeetTime(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold" />
                </div>
              </div>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">مدة الاجتماع</label>
                <select value={meetDuration} onChange={e => setMeetDuration(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold">
                  <option value="60">ساعة واحدة (60 دقيقة)</option>
                  <option value="90">ساعة ونصف (90 دقيقة)</option>
                  <option value="120">ساعتان (120 دقيقة)</option>
                  <option value="180">3 ساعات (180 دقيقة)</option>
                </select>
              </div>

              <div className="bg-stone-50 p-3.5 rounded-2xl border border-stone-200 text-xs space-y-1.5">
                <div className="font-black text-stone-800 mb-1">المعاينة الذكية لمواعيدك:</div>
                <div>📋 <strong>إرسال الأجندة:</strong> يوم {previewSched.agenda.dayName} ({previewSched.agenda.timeLabel})</div>
                <div>🤝 <strong>حضور اللقاء:</strong> يوم {previewSched.attendance.dayName} ({previewSched.attendance.timeLabel})</div>
                <div>📝 <strong>توثيق المحضر:</strong> يوم {previewSched.minutes.dayName} ({previewSched.minutes.timeLabel})</div>
              </div>

              <div className="flex justify-between pt-2">
                <button onClick={() => setStep(1)} className="px-5 py-2.5 rounded-2xl bg-stone-100 text-stone-700 text-xs font-bold">السابق</button>
                <button onClick={handleFinish} className="px-7 py-3 rounded-2xl madyan-gradient text-white text-xs font-black shadow-md">
                  اعتماد والبدء الآن ✓
                </button>
              </div>
            </div>
          )}
        </ModalContainer>
      );
    }

    // ============================================================================
