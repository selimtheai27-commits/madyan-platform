    // لوحة حساب عضو (للموارد البشرية ومدير المنصة)
    function MXCadrePanel({ db, user, isNew, isUsernameTaken, onSave, onDelete, onResetPassword, onClose }) {
      const units = mxUnits(db);
      const depts = mxDepartments(db).filter(d => d.enabled !== false);
      const [d, setD] = useState(() => ({
        name: user?.name || "",
        username: user?.username || "",
        jobTitle: user?.jobTitle || "",
        unit: user?.unit || units[0]?.name || "",
        assignedDepartments: Array.isArray(user?.assignedDepartments) ? user.assignedDepartments : depts.map(x => x.id),
        password: isNew ? pa2TempPassword() : ""
      }));
      const [err, setErr] = useState("");
      const set = (k, v) => setD(p => ({ ...p, [k]: v }));
      const toggleDept = (id) => set("assignedDepartments", d.assignedDepartments.includes(id) ? d.assignedDepartments.filter(x => x !== id) : [...d.assignedDepartments, id]);
      const same = (a, b) => a.length === b.length && a.every(x => b.includes(x));
      const dirty = isNew ? (d.name.trim() && d.username.trim()) : (d.name !== user.name || d.username !== user.username || d.jobTitle !== (user.jobTitle || "") || d.unit !== (user.unit || "") || !same(d.assignedDepartments, user.assignedDepartments || []));
      const save = () => {
        setErr("");
        const uname = d.username.trim().toLowerCase();
        if (!d.name.trim() || !uname) { setErr("الاسم واسم المستخدم مطلوبان"); return; }
        if (!/^[a-z0-9._-]{3,}$/.test(uname)) { setErr("اسم المستخدم بالإنجليزية 3 أحرف على الأقل، بدون مسافات"); return; }
        if (isUsernameTaken(uname, user?.id)) { setErr("اسم المستخدم مستخدم بالفعل"); return; }
        onSave({ ...d, name: d.name.trim(), username: uname, jobTitle: d.jobTitle.trim() });
      };
      return (
        <PA2PanelShell eyebrow={isNew ? "عضو جديد" : (user.unit || "عضو")} title={d.name || "عضو جديد"} onClose={onClose}
          footer={<PA2SaveFooter dirty={Boolean(dirty)} onSave={save} saveLabel={isNew ? "إنشاء الحساب" : "حفظ التغييرات"} danger={!isNew && <PA2DangerAction label="حذف الحساب نهائياً" confirmLabel="تأكيد الحذف" onConfirm={onDelete} />} />}>
          <div><PA2Label>الاسم الكامل</PA2Label><input value={d.name} onChange={e => set("name", e.target.value)} className={pa2InputCls} /></div>
          <div className="grid grid-cols-2 gap-3">
            <div><PA2Label>اسم المستخدم</PA2Label><input dir="ltr" value={d.username} onChange={e => set("username", e.target.value)} className={pa2InputCls} /></div>
            <div><PA2Label hint="اختياري">المسمى</PA2Label><input value={d.jobTitle} onChange={e => set("jobTitle", e.target.value)} className={pa2InputCls} /></div>
          </div>
          <div>
            <PA2Label>الوحدة</PA2Label>
            <select value={d.unit} onChange={e => set("unit", e.target.value)} className={pa2InputCls}>
              {units.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}
            </select>
          </div>
          <div>
            <PA2Label hint="بدون إدارات = لا مهام">تصله مهام من</PA2Label>
            <div className="space-y-2">
              {depts.map((x, i) => (
                <div key={x.id} className="flex items-center justify-between rounded-2xl bg-[#F4F2EE] px-4 h-12">
                  <span className="text-[14px] text-stone-700">{x.name}</span>
                  <PA2Switch checked={d.assignedDepartments.includes(x.id)} onChange={() => toggleDept(x.id)} />
                </div>
              ))}
            </div>
          </div>
          {isNew ? (
            <div className="rounded-2xl bg-[#FFF3E2] px-4 py-3">
              <div className="text-[13px] text-orange-700">كلمة مرور مؤقتة (يُطلب تغييرها)</div>
              <div className="flex items-center justify-between mt-1"><span dir="ltr" className="text-[18px] font-semibold tracking-wider">{d.password}</span><button onClick={() => pa2Copy(d.password)} className="text-[13px] text-stone-600 inline-flex items-center gap-1"><PA2Icon name="copy" className="w-4 h-4" />نسخ</button></div>
            </div>
          ) : (
            <button onClick={onResetPassword} className="text-[13px] text-stone-600 hover:text-stone-900 inline-flex items-center gap-1.5"><PA2Icon name="key" className="w-4 h-4" />إصدار كلمة مرور مؤقتة جديدة</button>
          )}
          {err && <div className="rounded-2xl bg-rose-50 px-4 py-3 text-[14px] text-rose-700">{err}</div>}
        </PA2PanelShell>
      );
    }

    // دوال حفظ الحسابات (مشتركة بين الموارد البشرية ومدير المنصة)
    function mxSaveCadre(setDb, user, isNew, draft) {
      if (isNew) {
        const id = "u_" + Date.now().toString(36);
        setDb(prev => ({ ...prev, users: [...prev.users, {
          id, roleType: "cadre", name: draft.name, username: draft.username, password: draft.password, mustChangePassword: true,
          jobTitle: draft.jobTitle, unit: draft.unit, assignedDepartments: draft.assignedDepartments, joinedAt: Date.now(), tasksRecord: {}, profile: {}
        }] }));
        return id;
      }
      setDb(prev => ({ ...prev, users: prev.users.map(u => u.id === user.id ? { ...u, name: draft.name, username: draft.username, jobTitle: draft.jobTitle, unit: draft.unit, assignedDepartments: draft.assignedDepartments } : u) }));
      return user.id;
    }

    function OperationalPortalV3({ db, setDb, currentUser, isUsernameTaken, onLogout, showToast, modeSwitch }) {
      const me = db.users.find(u => u.id === currentUser.id) || currentUser;
      const deptId = me.departmentId;
      const dept = mxDeptById(db, deptId);
      const depts = mxDepartments(db);
      const deptIdx = Math.max(0, depts.findIndex(d => d.id === deptId));
      const tone = dept ? pa2DeptTone(dept, deptIdx) : PA2_PASTELS[0];
      const isHR = deptId === "dept_hr";
      const rules = mxRules(db);
      const [view, setView] = useState("follow");
      const [sel, setSel] = useState(null); // { kind, id }
      const [statusF, setStatusF] = useState("all");
      const [unitF, setUnitF] = useState("all");
      const [q, setQ] = useState("");
      const [descDraft, setDescDraft] = useState(dept?.description || "");

      if (!dept) {
        return (
          <MXShell areaLabel="إدارة تشغيلية" nav={[{ id: "follow", label: "المتابعة", icon: "chart" }]} active="follow" onNav={() => {}} user={me} roleLabel="مدير إدارة" onLogout={onLogout} modeSwitch={modeSwitch}>
            <MXHeader eyebrow="إدارة تشغيلية" title="لم تُربط بإدارة بعد" desc="اطلب من مدير المنصة ربط حسابك بإدارة لتظهر لك أدوات المتابعة." />
          </MXShell>
        );
      }

      const stats = mxDeptStats(db, deptId);
      const directives = (db.directives || []).filter(d => d.toUserId === me.id && !d.readAt).sort((a, b) => (b.createdAtTs || 0) - (a.createdAtTs || 0));
      const allDefs = mxDeptTaskDefs(db, deptId, true);
      const allowedTypes = (dept.allowedTaskTypes || []).filter(t => MX_TYPE_META[t]);
      const maxTasks = dept.maxTotalTasks || 6;
      const units = mxUnits(db);

      const go = (v, s = null) => { setView(v); setSel(s); window.scrollTo({ top: 0 }); };

      const approve = (p) => {
        mxPatchRecord(setDb, p.user.id, p.week, p.task.id, { status: p.rec.lateSubmit ? "late" : "on_time", completedAt: Date.now(), approvedBy: me.id });
        showToast("تم الاعتماد");
      };
      const reject = (p) => {
        mxPatchRecord(setDb, p.user.id, p.week, p.task.id, { status: "rejected", rejectedBy: me.id });
      };
      const patchDeptTasks = (fn) => setDb(prev => {
        const sc = prev.systemConfig || {};
        const all = { ...(sc.deptTasks || {}) };
        all[deptId] = fn([...(all[deptId] || [])]);
        return { ...prev, systemConfig: { ...sc, deptTasks: all } };
      });

      // ----- يحتاج انتباهك -----
      const attention = [];
      const pendByUser = {};
      stats.pending.forEach(p => { (pendByUser[p.user.id] = pendByUser[p.user.id] || []).push(p); });
      Object.values(pendByUser).forEach(list => attention.push({
        key: "ap_" + list[0].user.id,
        text: `${pa2Short(list[0].user.name)} — ${list.length === 1 ? list[0].task.title : `${list.length} مهام`} بانتظار اعتمادك`,
        go: () => { setView("follow"); setSel({ kind: "member", id: list[0].user.id }); setTimeout(() => { const el = document.getElementById("mx-members"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60); },
        cta: "اعتماد"
      }));
      if (stats.counts.not_started > 0) attention.push({ key: "ns", text: `${stats.counts.not_started} ${stats.counts.not_started === 1 ? "عضو لم يبدأ" : "أعضاء لم يبدؤوا"} مهام هذا الأسبوع`, go: () => { setStatusF("not_started"); setSel(null); }, cta: "عرض" });
      if (me.mustChangePassword) attention.push({ key: "pw", text: "ما زلت تستخدم كلمة مرور مؤقتة", go: () => modeSwitch ? modeSwitch.onChange("mine") : null, cta: "تغيير" });

      const nav = [
        { id: "follow", label: "المتابعة", icon: "chart", badge: (stats.pending.length + directives.length) || null },
        { id: "tasks", label: "المهمات", icon: "tasks" },
        { id: "members", label: isHR ? "الأعضاء والوحدات" : "الأعضاء", icon: "users" },
        { id: "settings", label: "الإعدادات", icon: "cog" }
      ];

      // ----- الشاشات -----
      let main = null, panel = null;

      if (view === "follow") {
        const rows = stats.rows
          .filter(r => statusF === "all" || r.status.key === statusF)
          .filter(r => unitF === "all" || r.user.unit === unitF)
          .sort((a, b) => a.pct - b.pct || pa2Short(a.user.name).localeCompare(pa2Short(b.user.name), "ar"));
        const selUser = sel?.kind === "member" ? db.users.find(u => u.id === sel.id) : null;
        if (selUser) panel = <MXMemberFollowPanel db={db} deptId={deptId} user={selUser} onApprove={approve} onReject={reject} onClose={() => setSel(null)} />;
        main = (
          <>
            <MXHeader eyebrow={dept.name} title="المتابعة" desc={`التزام ${stats.rows.length} عضواً بمهام الإدارة في أسبوعهم الحالي.`}
              actions={<MXPrimaryBtn onClick={() => go("tasks", { kind: "task", id: "__new" })}><PA2Icon name="plus" className="w-4 h-4" />مهمة جديدة</MXPrimaryBtn>} />
            <MXDirectiveStrip directives={directives} onRead={(id) => mxMarkDirectiveRead(setDb, id)} />
            <MXAttention title="يحتاج انتباهك" items={attention} emptyText="لا اعتمادات معلّقة، والجميع بدأ أسبوعه." primaryLabel={stats.pending.length ? "ابدأ الاعتماد" : "عرض"} />
            <MXScoreCard
              label="التزام الإدارة هذا الأسبوع"
              pct={stats.avg}
              caption={`${stats.defs.length} مهام · ${stats.rows.length} عضواً`}
              bars={stats.byUnit.map(b => ({ label: b.unit.name, value: `${b.pct}%`, pct: b.pct, tone: tone.dot }))}
              stats={[{ n: stats.counts.committed, l: "ملتزم" }, { n: stats.counts.behind, l: "متأخر" }, { n: stats.counts.not_started, l: "لم يبدأ" }]}
            />
            <div id="mx-members" className={`grid gap-6 items-start scroll-mt-6 ${panel ? "lg:grid-cols-[1fr_400px]" : ""}`}>
              <div className="min-w-0">
                <div className="flex items-center justify-between gap-3 mb-4 flex-wrap">
                  <h2 className="text-xl font-bold text-stone-900">الأعضاء</h2>
                  <div className="flex items-center gap-2 flex-wrap">
                    <select value={unitF} onChange={e => setUnitF(e.target.value)} className="h-9 rounded-full bg-[#ECE9E3] px-4 text-[13px] text-stone-700 focus:outline-none">
                      <option value="all">كل الوحدات</option>
                      {stats.byUnit.map(b => <option key={b.unit.id} value={b.unit.name}>{b.unit.name}</option>)}
                    </select>
                    <PA2Segmented size="sm" value={statusF} onChange={setStatusF} options={[{ value: "all", label: "الكل" }, { value: "committed", label: "ملتزم" }, { value: "behind", label: "متأخر" }, { value: "not_started", label: "لم يبدأ" }]} />
                  </div>
                </div>
                <div className="bg-white rounded-[28px] p-2">
                  {rows.length === 0 && <div className="px-5 py-8 text-center text-[14px] text-stone-400">لا يوجد أعضاء بهذا الفلتر.</div>}
                  {rows.map(r => {
                    const pend = (pendByUser[r.user.id] || []).length;
                    const active = selUser?.id === r.user.id;
                    return (
                      <button key={r.user.id} onClick={() => setSel(active ? null : { kind: "member", id: r.user.id })} className={`w-full text-right flex items-center gap-4 px-4 py-3 rounded-[20px] transition ${active ? "bg-[#F4F2EE]" : "hover:bg-[#FBFAF8]"}`}>
                        <PA2Avatar user={r.user} />
                        <span className="flex-1 min-w-0">
                          <span className="block text-[15px] font-medium text-stone-900 truncate">{pa2Short(r.user.name)}</span>
                          <span className="block text-[13px] text-stone-400 truncate">{r.user.unit}</span>
                        </span>
                        {pend > 0 && <span className="hidden sm:inline-flex h-7 px-2.5 rounded-full bg-[#ECE7FA] text-[#4F3E8F] text-[12px] items-center">{pend} للاعتماد</span>}
                        <span className="hidden md:block w-28"><MXProgress pct={r.pct} /></span>
                        <span className="w-12 text-left text-[14px] font-semibold tabular-nums text-stone-900">{r.pct}%</span>
                        <span className="hidden sm:block"><MXStatusPill status={r.status} /></span>
                      </button>
                    );
                  })}
                </div>
                <div className="mt-10">
                  <MXSectionTitle>إنجاز كل مهمة</MXSectionTitle>
                  <div className="bg-white rounded-[28px] p-6 grid sm:grid-cols-2 gap-x-10 gap-y-5">
                    {stats.byTask.map(b => {
                      const pct = b.total ? Math.round((b.done / b.total) * 100) : 0;
                      return (
                        <div key={b.task.id}>
                          <div className="flex items-center justify-between mb-2"><span className="text-[14px] text-stone-600 truncate">{b.task.title}</span><span className="text-[14px] font-semibold tabular-nums">{b.done} / {b.total}</span></div>
                          <MXProgress pct={pct} tone={tone.dot} />
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
              {panel && <div className="lg:sticky lg:top-6">{panel}</div>}
            </div>
          </>
        );
      }

      if (view === "tasks") {
        const selDef = sel?.kind === "task" ? (sel.id === "__new" ? "__new" : allDefs.find(t => t.id === sel.id)) : null;
        const atCap = allDefs.length >= maxTasks;
        if (selDef) {
          panel = (
            <MXTaskDefPanel key={sel.id} def={selDef === "__new" ? null : selDef} isNew={selDef === "__new"} allowedTypes={allowedTypes.length ? allowedTypes : ["practical"]}
              onClose={() => setSel(null)}
              onDelete={() => { patchDeptTasks(list => list.filter(t => t.id !== selDef.id)); setSel(null); showToast("حُذفت المهمة"); }}
              onSave={(draft) => {
                if (selDef === "__new") {
                  if (atCap) return;
                  const id = "t_" + Date.now().toString(36);
                  patchDeptTasks(list => [...list, { id, ...draft, subtitle: "", enabled: true }]);
                  setSel({ kind: "task", id });
                  showToast("أُضيفت المهمة لكل أعضاء الإدارة");
                } else {
                  patchDeptTasks(list => list.map(t => t.id === selDef.id ? { ...t, ...draft } : t));
                  showToast("تم حفظ المهمة");
                }
              }} />
          );
        }
        main = (
          <>
            <MXHeader eyebrow={dept.name} title="المهمات" desc={`تُسند أسبوعياً لكل أعضاء الإدارة (${stats.rows.length} عضواً) دفعة واحدة.`}
              actions={<MXPrimaryBtn disabled={atCap} onClick={() => setSel({ kind: "task", id: "__new" })}><PA2Icon name="plus" className="w-4 h-4" />مهمة جديدة</MXPrimaryBtn>} />
            <div className={`grid gap-6 items-start ${panel ? "lg:grid-cols-[1fr_420px]" : ""}`}>
              <div className="min-w-0">
                <div className="text-[13px] text-stone-500 mb-3">{allDefs.length} من {maxTasks} مهام مسموحة{atCap ? " · وصلت للسقف" : ""}</div>
                <div className="space-y-2">
                  {allDefs.length === 0 && <PA2EmptyPanel title="لا توجد مهام بعد" text="أضف أول مهمة لتظهر لكل أعضاء الإدارة." />}
                  {allDefs.map(t => {
                    const bt = stats.byTask.find(b => b.task.id === t.id);
                    const active = sel?.id === t.id;
                    const off = t.enabled === false;
                    return (
                      <div key={t.id} className={`flex items-center gap-4 px-5 py-4 rounded-[22px] bg-white transition ${active ? "ring-2 ring-stone-900" : ""}`}>
                        <button onClick={() => setSel(active ? null : { kind: "task", id: t.id })} className="flex-1 min-w-0 flex items-center gap-4 text-right">
                          <span className={`w-11 h-11 rounded-full ${tone.bg} inline-flex items-center justify-center text-[18px] shrink-0 ${off ? "opacity-40" : ""}`}>{MX_TYPE_META[t.type]?.icon}</span>
                          <span className="min-w-0">
                            <span className={`block text-[15px] font-medium truncate ${off ? "text-stone-400" : "text-stone-900"}`}>{t.title}</span>
                            <span className="block text-[13px] text-stone-400 truncate">{MX_TYPE_META[t.type]?.label} · {mxApproval(t) === "manager" && t.type !== "lecture_quiz" && t.type !== "daily_habit" ? "يعتمدها المدير" : "يؤكدها العضو"}{t.type === "daily_habit" ? ` · ${mxTargetDays(t, rules)} أيام` : ""}</span>
                          </span>
                        </button>
                        {!off && bt && <span className="hidden sm:block text-[13px] text-stone-500 tabular-nums whitespace-nowrap">{bt.done} / {bt.total} أنجزوها</span>}
                        <PA2Switch checked={!off} onChange={(v) => patchDeptTasks(list => list.map(x => x.id === t.id ? { ...x, enabled: v } : x))} />
                      </div>
                    );
                  })}
                </div>
              </div>
              {panel && <div className="lg:sticky lg:top-6">{panel}</div>}
            </div>
          </>
        );
      }

      if (view === "members") {
        const pool = isHR ? db.users.filter(u => u.roleType === "cadre") : stats.rows.map(r => r.user);
        const rowsAll = pool
          .filter(u => unitF === "all" || u.unit === unitF)
          .filter(u => !q.trim() || (u.name || "").includes(q.trim()) || (u.username || "").includes(q.trim().toLowerCase()))
          .sort((a, b) => (a.unit || "").localeCompare(b.unit || "", "ar") || pa2Short(a.name).localeCompare(pa2Short(b.name), "ar"));
        const selUser = sel?.kind === "cadre" ? (sel.id === "__new" ? "__new" : db.users.find(u => u.id === sel.id)) : null;
        if (isHR && selUser) {
          panel = (
            <MXCadrePanel key={sel.id} db={db} user={selUser === "__new" ? null : selUser} isNew={selUser === "__new"} isUsernameTaken={isUsernameTaken}
              onClose={() => setSel(null)}
              onSave={(draft) => { const id = mxSaveCadre(setDb, selUser === "__new" ? null : selUser, selUser === "__new", draft); setSel({ kind: "cadre", id }); showToast(selUser === "__new" ? "أُنشئ الحساب" : "تم الحفظ"); }}
              onDelete={() => { setDb(prev => ({ ...prev, users: prev.users.filter(u => u.id !== selUser.id) })); setSel(null); showToast("حُذف الحساب"); }}
              onResetPassword={() => { const temp = pa2TempPassword(); setDb(prev => ({ ...prev, users: prev.users.map(u => u.id === selUser.id ? { ...u, password: temp, mustChangePassword: true } : u) })); pa2Copy(temp); showToast(`كلمة المرور المؤقتة: ${temp} (نُسخت)`); }} />
          );
        }
        const unitCards = units.map(un => {
          const members = pool.filter(u => u.unit === un.name);
          const leader = un.leaderUserId ? db.users.find(u => u.id === un.leaderUserId) : null;
          const r = stats.rows.filter(x => x.user.unit === un.name);
          const pct = r.length ? Math.round(r.reduce((a, x) => a + x.pct, 0) / r.length) : 0;
          return { un, count: members.length, leader, pct, hasRows: r.length > 0 };
        });
        main = (
          <>
            <MXHeader eyebrow={dept.name} title={isHR ? "الأعضاء والوحدات" : "الأعضاء"} desc={isHR ? "إنشاء حسابات الأعضاء، وتسكينهم في الوحدات، وتحديد الإدارات التي تصلهم مهامها." : "أعضاء الإدارة موزعين على الوحدات. إدارة الحسابات من الموارد البشرية."}
              actions={isHR ? <MXPrimaryBtn onClick={() => setSel({ kind: "cadre", id: "__new" })}><PA2Icon name="plus" className="w-4 h-4" />عضو جديد</MXPrimaryBtn> : null} />
            <div className="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-3 mb-10">
              {unitCards.map(c => (
                <button key={c.un.id} onClick={() => setUnitF(unitF === c.un.name ? "all" : c.un.name)} className={`text-right rounded-[22px] p-5 transition ${unitF === c.un.name ? "bg-stone-900 text-white" : "bg-white hover:bg-[#FBFAF8]"}`}>
                  <div className={`text-[14px] font-semibold leading-snug ${unitF === c.un.name ? "text-white" : "text-stone-900"}`}>{c.un.name.replace(/^وحدة\s*/, "")}</div>
                  <div className={`text-[28px] font-bold tabular-nums mt-3 ${unitF === c.un.name ? "text-white" : "text-stone-900"}`}>{c.count}<span className={`text-[13px] font-normal mr-1 ${unitF === c.un.name ? "text-stone-400" : "text-stone-400"}`}>عضواً</span></div>
                  <div className={`text-[12px] mt-1 truncate ${unitF === c.un.name ? "text-stone-400" : "text-stone-400"}`}>{c.leader ? `القائد: ${pa2Short(c.leader.name)}` : "بلا قائد"}</div>
                </button>
              ))}
            </div>
            <div className={`grid gap-6 items-start ${panel ? "lg:grid-cols-[1fr_420px]" : ""}`}>
              <div className="min-w-0">
                <div className="flex items-center justify-between gap-3 mb-4 flex-wrap">
                  <h2 className="text-xl font-bold text-stone-900">{unitF === "all" ? "كل الأعضاء" : unitF} <span className="text-stone-400 font-normal text-[15px]">· {rowsAll.length}</span></h2>
                  <div className="relative">
                    <PA2Icon name="search" className="w-4 h-4 absolute right-3.5 top-1/2 -translate-y-1/2 text-stone-400" />
                    <input value={q} onChange={e => setQ(e.target.value)} placeholder="بحث بالاسم" className="h-10 w-56 rounded-full bg-white pr-10 pl-4 text-[14px] focus:outline-none focus:ring-2 focus:ring-stone-200" />
                  </div>
                </div>
                <div className="bg-white rounded-[28px] p-2">
                  {rowsAll.length === 0 && <div className="px-5 py-8 text-center text-[14px] text-stone-400">لا يوجد أعضاء.</div>}
                  {rowsAll.map(u => {
                    const active = sel?.id === u.id;
                    const ud = mxUserDeptIds(db, u);
                    const Tag = isHR ? "button" : "div";
                    return (
                      <Tag key={u.id} onClick={isHR ? () => setSel(active ? null : { kind: "cadre", id: u.id }) : undefined} className={`w-full text-right flex items-center gap-4 px-4 py-3 rounded-[20px] transition ${active ? "bg-[#F4F2EE]" : isHR ? "hover:bg-[#FBFAF8]" : ""}`}>
                        <PA2Avatar user={u} />
                        <span className="flex-1 min-w-0">
                          <span className="block text-[15px] font-medium text-stone-900 truncate">{pa2Short(u.name)}</span>
                          <span className="block text-[13px] text-stone-400 truncate">{u.unit}{u.jobTitle ? ` · ${u.jobTitle}` : ""}</span>
                        </span>
                        <span className="hidden sm:flex gap-1.5">{ud.length ? ud.map(id => <MXDeptChip key={id} dept={mxDeptById(db, id)} idx={depts.findIndex(x => x.id === id)} />) : <span className="text-[12px] text-stone-400">بلا مهام</span>}</span>
                        {isHR && <span dir="ltr" className="hidden md:block w-20 text-[13px] text-stone-400 text-left">{u.username}</span>}
                      </Tag>
                    );
                  })}
                </div>
              </div>
              {panel && <div className="lg:sticky lg:top-6">{panel}</div>}
            </div>
          </>
        );
      }

      if (view === "settings") {
        const dirty = descDraft !== (dept.description || "");
        const ruleRows = [
          ["سقف المهمات", `${maxTasks} مهام`],
          ["الأنواع المسموحة", allowedTypes.map(t => MX_TYPE_META[t]?.label).join("، ") || "—"],
          ["نقاط الإنجاز المتأخر", `${rules.latePointsPct}%`],
          ["نسبة النجاح في الاختبار", `${rules.quizPassThresholdPct}%`],
          ["الأسابيع السابقة المتاحة للعضو", rules.allowLateSubmissions ? `${rules.maxPastWeeksEditable} أسابيع` : "غير مسموح"]
        ];
        main = (
          <>
            <MXHeader eyebrow={dept.name} title="الإعدادات" desc="وصف الإدارة كما يراه الأعضاء، والقواعد المفعّلة من مدير المنصة." />
            <div className="grid lg:grid-cols-[1fr_380px] gap-6 items-start">
              <MXCard className="p-6 sm:p-8 space-y-5">
                <div>
                  <PA2Label>وصف الإدارة</PA2Label>
                  <textarea value={descDraft} onChange={e => setDescDraft(e.target.value)} rows={4} className={`${pa2InputCls} h-auto py-3 resize-none`} />
                </div>
                <PA2SaveFooter dirty={dirty} onSave={() => {
                  setDb(prev => ({ ...prev, systemConfig: { ...prev.systemConfig, departments: (prev.systemConfig?.departments || DEFAULT_DEPARTMENTS).map(d => d.id === deptId ? { ...d, description: descDraft } : d) } }));
                  showToast("تم حفظ الوصف");
                }} />
              </MXCard>
              <MXCard className="p-6">
                <div className="text-[15px] font-semibold text-stone-900 mb-1">القواعد المفعّلة</div>
                <div className="text-[13px] text-stone-400 mb-4">يعدّلها مدير المنصة</div>
                <div className="divide-y divide-stone-100">
                  {ruleRows.map(([l, v]) => (
                    <div key={l} className="py-3 flex items-start justify-between gap-4"><span className="text-[14px] text-stone-500">{l}</span><span className="text-[14px] text-stone-900 text-left">{v}</span></div>
                  ))}
                </div>
              </MXCard>
            </div>
          </>
        );
      }

      return (
        <MXShell areaLabel={dept.shortName || dept.name} chip="إدارة تشغيلية" modeSwitch={modeSwitch} nav={nav} active={view} onNav={(v) => go(v)} user={me} roleLabel={`مدير ${dept.shortName || dept.name}`} onLogout={onLogout}>
          {main}
        </MXShell>
      );
    }
    // ==== PART:OPS END ====

    // ==== PART:EXEC START ====
    // ---------- بوابة الإدارة التنفيذية ----------
    const MX_BULLETIN_CATEGORIES = ["تعميم إداري", "سياسة جديدة", "تذكير", "تعميم مشروع", "تهنئة"];

    function MXBulletinComposer({ db, onPublish, onClose }) {
      const depts = mxDepartments(db).filter(d => d.enabled !== false);
      const units = mxUnits(db);
      const [d, setD] = useState({ title: "", content: "", category: MX_BULLETIN_CATEGORIES[0], targetType: "all", targetDeptId: depts[0]?.id || "", targetUnit: units[0]?.name || "" });
      const set = (k, v) => setD(p => ({ ...p, [k]: v }));
      const reach = mxBulletinRecipients(db, { ...d, senderId: "__none" }).length;
      const ok = d.title.trim().length > 2 && d.content.trim().length > 4;
      return (
        <PA2PanelShell eyebrow="تعميم جديد" title={d.title || "بدون عنوان"} onClose={onClose}
          footer={
            <div className="flex items-center gap-3">
              <button disabled={!ok} onClick={() => ok && onPublish(d)} className={`h-11 px-6 rounded-full text-[14px] font-semibold inline-flex items-center gap-2 ${ok ? "bg-stone-900 text-white hover:bg-stone-800" : "bg-stone-100 text-stone-400 cursor-not-allowed"}`}><PA2Icon name="send" className="w-4 h-4" />نشر التعميم</button>
              <span className="mr-auto text-[13px] text-stone-500">يصل إلى <b className="text-stone-900 tabular-nums">{reach}</b> عضواً</span>
            </div>
          }>
          <div><PA2Label>العنوان</PA2Label><input value={d.title} onChange={e => set("title", e.target.value)} className={pa2InputCls} /></div>
          <div><PA2Label>النص</PA2Label><textarea value={d.content} onChange={e => set("content", e.target.value)} rows={5} className={`${pa2InputCls} h-auto py-3 resize-none`} /></div>
          <div>
            <PA2Label>التصنيف</PA2Label>
            <div className="flex flex-wrap gap-2">
              {MX_BULLETIN_CATEGORIES.map(c => <button key={c} onClick={() => set("category", c)} className={`h-9 px-4 rounded-full text-[13px] transition ${d.category === c ? "bg-stone-900 text-white" : "bg-[#F4F2EE] text-stone-600 hover:bg-stone-200"}`}>{c}</button>)}
            </div>
          </div>
          <div>
            <PA2Label>الجمهور</PA2Label>
            <PA2Segmented value={d.targetType} onChange={v => set("targetType", v)} options={[{ value: "all", label: "كل المنصة" }, { value: "dept", label: "إدارة" }, { value: "unit", label: "وحدة" }]} />
            {d.targetType === "dept" && (
              <select value={d.targetDeptId} onChange={e => set("targetDeptId", e.target.value)} className={`${pa2InputCls} mt-3`}>{depts.map(x => <option key={x.id} value={x.id}>{x.name}</option>)}</select>
            )}
            {d.targetType === "unit" && (
              <select value={d.targetUnit} onChange={e => set("targetUnit", e.target.value)} className={`${pa2InputCls} mt-3`}>{units.map(x => <option key={x.id} value={x.name}>{x.name}</option>)}</select>
            )}
          </div>
          <div className="text-[13px] text-stone-400">يُطلب من كل مستلم تأكيد «اطلعت واستوعبت».</div>
        </PA2PanelShell>
      );
    }

    function MXBulletinReachPanel({ db, b, onClose }) {
      const rec = mxBulletinRecipients(db, b);
      const acked = rec.filter(u => mxIsAcked(b, u.id));
      const pending = rec.filter(u => !mxIsAcked(b, u.id));
      const byUnit = mxUnits(db).map(un => {
        const r = rec.filter(u => u.unit === un.name);
        return { label: un.name, total: r.length, done: r.filter(u => mxIsAcked(b, u.id)).length };
      }).filter(x => x.total > 0);
      const byDept = mxDepartments(db).filter(d => d.enabled !== false).map(d => {
        const r = rec.filter(u => u.departmentId === d.id || mxUserDeptIds(db, u).includes(d.id));
        return { label: d.name, total: r.length, done: r.filter(u => mxIsAcked(b, u.id)).length };
      }).filter(x => x.total > 0);
      const Bars = ({ list }) => (
        <div className="space-y-3">
          {list.map(x => (
            <div key={x.label}>
              <div className="flex justify-between mb-1.5"><span className="text-[13px] text-stone-600 truncate">{x.label}</span><span className="text-[13px] font-semibold tabular-nums">{x.done} / {x.total}</span></div>
              <MXProgress pct={x.total ? Math.round((x.done / x.total) * 100) : 0} />
            </div>
          ))}
        </div>
      );
      return (
        <PA2PanelShell eyebrow={`${b.category || "تعميم"} · ${mxBulletinTargetLabel(db, b)}`} title={b.title} onClose={onClose}>
          <p className="text-[14px] text-stone-600 leading-relaxed whitespace-pre-line">{b.content}</p>
          <div className="rounded-2xl bg-[#F4F2EE] px-4 py-3 flex items-center justify-between">
            <span className="text-[13px] text-stone-500">اطلع وأكّد</span>
            <span className="text-[20px] font-bold tabular-nums">{acked.length}<span className="text-[14px] text-stone-400 font-normal"> / {rec.length}</span></span>
          </div>
          {byDept.length > 0 && <div><PA2Label>حسب الإدارة</PA2Label><Bars list={byDept} /></div>}
          {byUnit.length > 0 && <div><PA2Label>حسب الوحدة</PA2Label><Bars list={byUnit} /></div>}
          {pending.length > 0 && (
            <div>
              <PA2Label hint={`${pending.length}`}>لم يطّلعوا بعد</PA2Label>
              <div className="flex flex-wrap gap-1.5">{pending.map(u => <span key={u.id} className="h-7 px-3 rounded-full bg-[#F4F2EE] text-[12px] text-stone-600 inline-flex items-center">{pa2Short(u.name)}</span>)}</div>
            </div>
          )}
        </PA2PanelShell>
      );
    }

    function MXDirectiveComposer({ db, targets, onSend, onClose }) {
      const [to, setTo] = useState(targets[0]?.user.id || "");
      const [text, setText] = useState("");
      const ok = to && text.trim().length > 3;
      return (
        <PA2PanelShell eyebrow="توجيه جديد" title="توجيه مباشر" onClose={onClose}
          footer={<button disabled={!ok} onClick={() => ok && onSend(to, text.trim())} className={`h-11 px-6 rounded-full text-[14px] font-semibold inline-flex items-center gap-2 ${ok ? "bg-stone-900 text-white hover:bg-stone-800" : "bg-stone-100 text-stone-400 cursor-not-allowed"}`}><PA2Icon name="send" className="w-4 h-4" />إرسال</button>}>
          <div>
            <PA2Label>إلى</PA2Label>
            <div className="space-y-1.5 max-h-[300px] overflow-y-auto">
              {targets.map(t => (

    function ExecutivePortalV3({ db, setDb, currentUser, onPreviewUser, onLogout, showToast }) {

      const org = mxOrgStats(db);

      const units = mxUnits(db);
      const go = (v, s = null) => { setView(v); setSel(s); window.scrollTo({ top: 0 }); };

      const bulletins = [...(db.bulletins || [])].map((b, i) => ({ b, i })).sort((x, y) => (y.b.createdAtTs || 0) - (x.b.createdAtTs || 0) || y.i - x.i).map(x => x.b);
      const directives = [...(db.directives || [])].sort((a, b) => (b.createdAtTs || 0) - (a.createdAtTs || 0));

      const publish = (d) => {
        const b = {
          id: "bul_" + Date.now().toString(36), title: d.title.trim(), content: d.content.trim(), category: d.category,

          targetDeptId: d.targetType === "dept" ? d.targetDeptId : undefined, targetUnit: d.targetType === "unit" ? d.targetUnit : undefined,

        setDb(prev => ({ ...prev, bulletins: [b, ...(prev.bulletins || [])] }));

      const sendDirective = (toUserId, text) => {

      const unreadReach = bulletins.slice(0, 1).map(b => { const r = mxBulletinRecipients(db, b); return r.length - r.filter(u => mxIsAcked(b, u.id)).length; })[0] || 0;

        main = (

      if (view === "explore") {

          rows = s.rows.map(r => ({ user: r.user, pct: r.pct, status: r.status }));
          summary = { pct: s.avg, caption: `المدير: ${mgr ? pa2Short(mgr.name) : "غير معيّن"}`, bars: s.byTask.map(b => ({ label: b.task.title, value: `${b.done} / ${b.total}`, pct: b.total ? Math.round((b.done / b.total) * 100) : 0 })), stats: [{ n: s.counts.committed, l: "ملتزم" }, { n: s.counts.behind, l: "متأخر" }, { n: s.counts.not_started, l: "لم يبدأ" }] };
        } else if (curId) {
          const un = units.find(u => u.id === curId);
          const leader = un?.leaderUserId ? db.users.find(u => u.id === un.leaderUserId) : null;
          rows = org.memberRows.filter(r => r.user.unit === un?.name).map(r => ({ user: r.user, pct: r.pct, status: r.status }));
          const avg = rows.length ? Math.round(rows.reduce((a, r) => a + r.pct, 0) / rows.length) : 0;
          const c = { committed: 0, behind: 0, not_started: 0 }; rows.forEach(r => c[r.status.key]++);
          summary = { pct: avg, caption: `القائد: ${leader ? pa2Short(leader.name) : "غير معيّن"}`, bars: depts.map((d, i) => { const ds = org.deptStats.find(x => x.dept.id === d.id); const rr = (ds?.rows || []).filter(x => x.user.unit === un?.name); const p = rr.length ? Math.round(rr.reduce((a, x) => a + x.pct, 0) / rr.length) : 0; return { label: d.name, value: rr.length ? `${p}%` : "—", pct: p, tone: pa2DeptTone(d, allDepts.findIndex(x => x.id === d.id)).dot }; }), stats: [{ n: c.committed, l: "ملتزم" }, { n: c.behind, l: "متأخر" }, { n: c.not_started, l: "لم يبدأ" }] };
        }
        rows.sort((a, b) => b.pct - a.pct);
        main = (
          <>

            <div className="flex items-center gap-3 flex-wrap mb-6">

              <select value={curId || ""} onChange={e => setExId(e.target.value)} className="h-9 rounded-full bg-white px-4 text-[14px] text-stone-700 focus:outline-none">
                {list.map(x => <option key={x.id} value={x.id}>{x.label}</option>)}

    // ==== PART:CADRE START ====
    // ---------- مساحة العضو: مهماتي + أرشيف التعميمات + حسابي ----------
    const mxDeptToneById = (db, deptId) => {
      const list = mxDepartments(db);
      const idx = Math.max(0, list.findIndex(d => d.id === deptId));
      const d = list[idx];
      return d ? pa2DeptTone(d, idx) : PA2_PASTELS[4];
    };
    const mxFirstName = (name) => pa2Short(name).replace(/^(د\.|أ\.|م\.)\s*/, "").split(" ")[0] || "";

    function MXStateTag({ st }) {
      const map = {
        done: "bg-emerald-50 text-emerald-700",
        late: "bg-amber-50 text-amber-700",
        submitted: "bg-[#ECE7FA] text-[#4F3E8F]",
        rejected: "bg-rose-50 text-rose-700",
        partial: "bg-orange-50 text-orange-700",
        pending: "bg-stone-100 text-stone-500"
      };
      return <span className={`inline-flex items-center h-7 px-3 rounded-full text-[12px] whitespace-nowrap ${map[st.key] || map.pending}`}>{st.label}</span>;
    }

    // شريط التعميم غير المقروء
    function MXBulletinStrip({ bulletin, more, onAck, onOpenAll }) {
      return (
        <div className="rounded-[24px] bg-[#ECE7FA] px-6 py-5 mb-6">
          <div className="flex flex-col sm:flex-row sm:items-start gap-4">
            <span className="w-11 h-11 rounded-full bg-white text-[#4F3E8F] inline-flex items-center justify-center shrink-0"><PA2Icon name="megaphone" className="w-5 h-5" /></span>
            <div className="flex-1 min-w-0">
              <div className="text-[13px] font-medium text-[#4F3E8F]">تعميم جديد · {bulletin.senderName || "الإدارة"}</div>
              <div className="text-[17px] font-semibold text-stone-900 mt-0.5">{bulletin.title}</div>
              <p className="text-[14px] text-stone-600 mt-1.5 leading-relaxed">{bulletin.content}</p>
              {more > 0 && <button onClick={onOpenAll} className="text-[13px] text-[#4F3E8F] mt-2 hover:underline">{more === 1 ? "تعميم آخر بانتظار اطلاعك" : `${more} تعميمات أخرى بانتظار اطلاعك`}</button>}
            </div>
            <button onClick={onAck} className="h-10 px-5 rounded-full bg-stone-900 text-white text-[14px] font-semibold hover:bg-stone-800 shrink-0">اطلعت واستوعبت</button>
          </div>
        </div>
      );
    }

    // لوحة تنفيذ المهمة (تختلف حسب نوعها)
    function MXTaskPanel({ def, dept, deptIdx, rec, rules, week, isPast, curriculum, onPatch, onClose }) {
      const st = mxTaskState(def, rec, rules);
      const approval = def.type === "lecture_quiz" || def.type === "daily_habit" ? "self" : mxApproval(def);
      const doneStatus = isPast ? "late" : "on_time";
      const [note, setNote] = useState(rec.note || "");
      const [answers, setAnswers] = useState({});
      const [quizMsg, setQuizMsg] = useState(null);
      const meta = MX_TYPE_META[def.type] || { label: "مهمة" };
      const locked = st.done && approval === "manager";

      const complete = (extra = {}) => {
        if (approval === "manager") onPatch({ status: "submitted", submittedAt: Date.now(), lateSubmit: isPast, note, ...extra });
        else onPatch({ status: doneStatus, completedAt: Date.now(), note, ...extra });
      };

      let body = null;
      if (def.type === "daily_habit") {
        const target = mxTargetDays(def, rules);
        const days = Array.isArray(rec.daysCompleted) ? rec.daysCompleted : [];
        const toggle = (i) => {
          const next = days.includes(i) ? days.filter(x => x !== i) : [...days, i].sort((a, b) => a - b);
          const reached = next.length >= target;
          onPatch({ daysCompleted: next, status: reached ? doneStatus : "pending", completedAt: reached ? (rec.completedAt || Date.now()) : null });
        };
        body = (
          <div>
            <PA2Label hint={`الهدف ${target} أيام`}>الأيام التي أنجزتها هذا الأسبوع</PA2Label>
            <div className="grid grid-cols-4 sm:grid-cols-7 gap-2">
              {MX_DAYS.map((d, i) => (
                <button key={d} onClick={() => toggle(i)} className={`h-14 rounded-2xl text-[13px] transition flex flex-col items-center justify-center gap-0.5 ${days.includes(i) ? "bg-stone-900 text-white" : "bg-[#F4F2EE] text-stone-600 hover:bg-stone-200"}`}>
                  {days.includes(i) ? <PA2Icon name="check" className="w-4 h-4" /> : <span className="w-4 h-4" />}
                  {d}
                </button>
              ))}
            </div>
            <div className="mt-4"><MXProgress pct={Math.min(100, Math.round((days.length / target) * 100))} /></div>
            <div className="text-[13px] text-stone-500 mt-2">{days.length} من {target} أيام · يُحفظ تلقائياً</div>
          </div>
        );
      } else if (def.type === "lecture_quiz") {
        const qs = curriculum?.questions || [];
        const embed = curriculum?.videoUrl ? getYoutubeEmbedUrl(curriculum.videoUrl) : "";
        const submitQuiz = () => {
          if (qs.some(q => answers[q.id] === undefined)) { setQuizMsg({ ok: false, text: "أجب عن كل الأسئلة أولاً" }); return; }
          const score = qs.filter(q => answers[q.id] === q.correctIndex).length;
          const pct = qs.length ? Math.round((score / qs.length) * 100) : 100;
          const pass = pct >= (parseInt(rules.quizPassThresholdPct, 10) || 60);
          const quizSubmission = { score, total: qs.length, answers, pct, at: Date.now() };
          if (pass) { onPatch({ status: doneStatus, completedAt: Date.now(), quizSubmission }); setQuizMsg({ ok: true, text: `أحسنت، نتيجتك ${score} من ${qs.length}` }); }
          else { onPatch({ quizSubmission }); setQuizMsg({ ok: false, text: `نتيجتك ${score} من ${qs.length} — نسبة النجاح ${rules.quizPassThresholdPct}%، أعد المحاولة` }); }
        };
        body = (
          <div className="space-y-5">
            {curriculum?.lectureTitle && (
              <div>
                <div className="text-[16px] font-semibold text-stone-900">{curriculum.lectureTitle}</div>
                {curriculum.lectureDesc && <p className="text-[14px] text-stone-500 mt-1 leading-relaxed">{curriculum.lectureDesc}</p>}
              </div>
            )}
            {curriculum?.videoUrl && (
              <div className="rounded-2xl overflow-hidden bg-stone-900 aspect-video">
                {isIframeVideo(curriculum.videoType, curriculum.videoUrl)
                  ? <iframe src={embed} className="w-full h-full" sandbox="allow-scripts allow-same-origin allow-presentation" referrerPolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media" allowFullScreen title="lecture" />
                  : <video src={sanitizeMediaUrl(curriculum.videoUrl)} controls className="w-full h-full" />}
              </div>
            )}
            {st.done ? (
              <div className="rounded-2xl bg-emerald-50 px-4 py-3 text-[14px] text-emerald-800">اجتزت الاختبار{rec.quizSubmission ? ` بنتيجة ${rec.quizSubmission.score} من ${rec.quizSubmission.total}` : ""}.</div>
            ) : (
              <div className="space-y-4">
                {qs.map((q, qi) => (
                  <div key={q.id}>
                    <div className="text-[14px] font-medium text-stone-800 mb-2">{qi + 1}. {q.text}</div>
                    <div className="space-y-1.5">
                      {q.options.map((op, oi) => (
                        <button key={oi} onClick={() => { setAnswers(a => ({ ...a, [q.id]: oi })); setQuizMsg(null); }} className={`w-full text-right px-4 py-2.5 rounded-2xl text-[14px] transition ${answers[q.id] === oi ? "bg-stone-900 text-white" : "bg-[#F4F2EE] text-stone-700 hover:bg-stone-200"}`}>{op}</button>
                      ))}
                    </div>
                  </div>
                ))}
                {quizMsg && <div className={`rounded-2xl px-4 py-3 text-[14px] ${quizMsg.ok ? "bg-emerald-50 text-emerald-800" : "bg-rose-50 text-rose-700"}`}>{quizMsg.text}</div>}
              </div>
            )}
          </div>
        );
        if (!st.done) {
          return (
            <PA2PanelShell eyebrow={`${meta.label} · ${dept?.shortName || dept?.name || ""}`} title={def.title} onClose={onClose}
              footer={<button onClick={submitQuiz} className="h-11 px-6 rounded-full bg-stone-900 text-white text-[14px] font-semibold hover:bg-stone-800">تسليم الاختبار</button>}>
              {def.instructions && <p className="text-[14px] text-stone-500 leading-relaxed">{def.instructions}</p>}
              {body}
            </PA2PanelShell>
          );
        }
      } else {
        const needsNote = def.type === "agenda_minutes" || def.type === "reading";
        body = (
          <div>
            <PA2Label hint={needsNote ? "" : "اختياري"}>{def.type === "agenda_minutes" ? "النص أو الرابط" : def.type === "reading" ? "أهم فائدة خرجت بها" : "ملاحظة للمدير"}</PA2Label>
            <textarea value={note} onChange={e => setNote(e.target.value)} disabled={st.done || st.key === "submitted"} rows={4} className={`${pa2InputCls} h-auto py-3 resize-none disabled:opacity-70`} placeholder="اكتب هنا…" />
          </div>
        );
      }

      // تذييل عام
      let footer = null;
      if (def.type !== "daily_habit") {
        if (st.key === "submitted") {
          footer = (
            <div className="flex items-center gap-3">
              <span className="text-[14px] text-[#4F3E8F]">أُرسلت للاعتماد، بانتظار مدير الإدارة</span>
              <button onClick={() => onPatch({ status: "pending", submittedAt: null })} className="mr-auto text-[13px] text-stone-500 hover:text-stone-800">سحب الإرسال</button>
            </div>
          );
        } else if (st.done) {
          footer = (
            <div className="flex items-center gap-3">
              <span className="text-[14px] text-emerald-700 inline-flex items-center gap-1.5"><PA2Icon name="check" className="w-4 h-4" />{locked ? "اعتمدها المدير" : st.label}</span>
              {!locked && <span className="mr-auto"><PA2DangerAction label="التراجع عن الإنجاز" confirmLabel="تأكيد التراجع" onConfirm={() => onPatch({ status: "pending", completedAt: null, quizSubmission: def.type === "lecture_quiz" ? null : rec.quizSubmission })} /></span>}
            </div>
          );
        } else if (def.type !== "lecture_quiz") {
          const needsNote = def.type === "agenda_minutes" || def.type === "reading";
          const can = !needsNote || note.trim().length > 0;
          footer = (
            <div className="flex items-center gap-3">
              <button onClick={() => can && complete()} disabled={!can} className={`h-11 px-6 rounded-full text-[14px] font-semibold transition ${can ? "bg-stone-900 text-white hover:bg-stone-800" : "bg-stone-100 text-stone-400 cursor-not-allowed"}`}>
                {approval === "manager" ? "إرسال للاعتماد" : "تأكيد الإنجاز"}
              </button>
              <span className="mr-auto text-[12px] text-stone-400">{isPast ? `تُحتسب متأخرة (${rules.latePointsPct}%)` : approval === "manager" ? "يعتمدها مدير الإدارة" : ""}</span>
            </div>
          );
        }
      }

      return (
        <PA2PanelShell eyebrow={`${meta.label} · ${dept?.shortName || dept?.name || ""}`} title={def.title} onClose={onClose} footer={footer}>
          {def.instructions && <p className="text-[14px] text-stone-500 leading-relaxed">{def.instructions}</p>}
          {st.key === "rejected" && <div className="rounded-2xl bg-rose-50 px-4 py-3 text-[14px] text-rose-700">أعادها المدير للمراجعة{rec.rejectNote ? `: ${rec.rejectNote}` : ""}. عدّل وأعد الإرسال.</div>}
          {body}
        </PA2PanelShell>
      );
    }

    function MXAccountCard({ me, rules, db, isUsernameTaken, onSave }) {
      const [name, setName] = useState(me.name || "");
      const [pw, setPw] = useState({ cur: "", next: "", again: "" });
      const [err, setErr] = useState("");
      const nameDirty = rules.allowCadreNameEdit && name.trim() && name.trim() !== me.name;
      const pwDirty = rules.allowCadrePasswordChange && pw.next.length > 0;
      const save = () => {
        setErr("");
        const patch = {};
        if (nameDirty) patch.name = name.trim();
        if (pwDirty) {
          if (pw.cur !== me.password) { setErr("كلمة المرور الحالية غير صحيحة"); return; }
          if (pw.next.length < 4) { setErr("كلمة المرور الجديدة قصيرة (4 أحرف على الأقل)"); return; }
          if (pw.next !== pw.again) { setErr("كلمتا المرور غير متطابقتين"); return; }
          patch.password = pw.next; patch.mustChangePassword = false;
        }
        onSave(patch);
        setPw({ cur: "", next: "", again: "" });
      };
      const depts = mxUserDeptIds(db, me).map(id => mxDeptById(db, id)).filter(Boolean);
      return (
        <div className="grid lg:grid-cols-[1fr_340px] gap-6 items-start">
          <MXCard className="p-6 sm:p-8 space-y-6">
            <div>
              <PA2Label hint={rules.allowCadreNameEdit ? "" : "يعدّله مسؤول الموارد البشرية"}>الاسم</PA2Label>
              <input value={name} onChange={e => setName(e.target.value)} disabled={!rules.allowCadreNameEdit} className={`${pa2InputCls} disabled:opacity-60`} />
            </div>
            <div>
              <PA2Label>اسم المستخدم</PA2Label>
              <div className={`${pa2InputCls} flex items-center text-stone-500`} dir="ltr">{me.username}</div>
            </div>
            {rules.allowCadrePasswordChange ? (
              <div className="pt-2 border-t border-stone-100">
                <div className="text-[15px] font-semibold text-stone-900 mt-4 mb-4">تغيير كلمة المرور</div>
                <div className="grid sm:grid-cols-3 gap-3">
                  <input type="password" value={pw.cur} onChange={e => setPw(p => ({ ...p, cur: e.target.value }))} placeholder="الحالية" className={pa2InputCls} />
                  <input type="password" value={pw.next} onChange={e => setPw(p => ({ ...p, next: e.target.value }))} placeholder="الجديدة" className={pa2InputCls} />
                  <input type="password" value={pw.again} onChange={e => setPw(p => ({ ...p, again: e.target.value }))} placeholder="تأكيد الجديدة" className={pa2InputCls} />
                </div>
              </div>
            ) : <div className="text-[13px] text-stone-400">تغيير كلمة المرور يتم عبر مسؤول الموارد البشرية.</div>}
            {err && <div className="rounded-2xl bg-rose-50 px-4 py-3 text-[14px] text-rose-700">{err}</div>}
            <PA2SaveFooter dirty={Boolean(nameDirty || pwDirty)} onSave={save} />
          </MXCard>
          <MXCard className="p-6 space-y-4">
            <div className="flex items-center gap-3">
              <PA2Avatar user={me} size="w-12 h-12" />
              <div className="min-w-0">
                <div className="text-[16px] font-semibold text-stone-900 truncate">{pa2Short(me.name)}</div>
                <div className="text-[13px] text-stone-500 truncate">{me.jobTitle || pa2RoleLabel(me)}</div>
              </div>
            </div>
            <div className="text-[14px] text-stone-600 flex justify-between"><span className="text-stone-400">الوحدة</span><span>{me.unit || "—"}</span></div>
            <div className="text-[14px] text-stone-600 flex justify-between items-center gap-3"><span className="text-stone-400">مهام من</span><span className="flex gap-1.5 flex-wrap justify-end">{depts.length ? depts.map(d => <MXDeptChip key={d.id} dept={d} idx={mxDepartments(db).findIndex(x => x.id === d.id)} />) : "—"}</span></div>
            {me.joinedAt && <div className="text-[14px] text-stone-600 flex justify-between"><span className="text-stone-400">تاريخ الانضمام</span><span>{formatDateAr(me.joinedAt)}</span></div>}
          </MXCard>
        </div>
      );
    }

    function MXBulletinCard({ db, b, me, onAck }) {
      const acked = mxIsAcked(b, me.id);
      return (
        <MXCard className="p-6">
          <div className="flex items-center gap-2 flex-wrap text-[12px]">
            {b.category && <span className="h-6 px-2.5 rounded-full bg-[#ECE7FA] text-[#4F3E8F] inline-flex items-center">{b.category}</span>}
            <span className="text-stone-400">{b.senderName}{b.createdAt ? ` · ${b.createdAt}` : ""} · {mxBulletinTargetLabel(db, b)}</span>
          </div>
          <div className="text-[17px] font-semibold text-stone-900 mt-3">{b.title}</div>
          <p className="text-[14px] text-stone-600 mt-1.5 leading-relaxed whitespace-pre-line">{b.content}</p>
          <div className="mt-4 flex items-center">
            {acked
              ? <span className="text-[13px] text-emerald-700 inline-flex items-center gap-1.5"><PA2Icon name="check" className="w-4 h-4" />اطلعت · {b.acknowledgedBy[me.id]}</span>
              : <button onClick={onAck} className="h-10 px-5 rounded-full bg-stone-900 text-white text-[14px] font-semibold hover:bg-stone-800">اطلعت واستوعبت</button>}
          </div>
        </MXCard>
      );
    }

    function CadrePortalV3({ db, setDb, currentUser, isUsernameTaken, onAcknowledgeBulletin, onLogout, showToast, modeSwitch }) {
      const me = db.users.find(u => u.id === currentUser.id) || currentUser;
      const rules = mxRules(db);
      const depts = mxDepartments(db);
      const curWeek = mxCurrentWeek(me);
      const [view, setView] = useState("tasks");
      const [week, setWeek] = useState(curWeek);
      const [deptFilter, setDeptFilter] = useState("all");
      const [openKey, setOpenKey] = useState(null);
      const [bulFilter, setBulFilter] = useState("all");

      const myDeptIds = mxUserDeptIds(db, me);
      const bulletins = mxBulletinsForUser(db, me);
      const unread = bulletins.filter(b => !mxIsAcked(b, me.id));
      const sum = mxWeekSummary(db, me, week);
      const minWeek = rules.allowLateSubmissions ? Math.max(1, curWeek - (parseInt(rules.maxPastWeeksEditable, 10) || 0)) : curWeek;
      const isPast = week < curWeek;
      const curriculum = (db.weeklyCurriculums && (db.weeklyCurriculums[week] || db.weeklyCurriculums.default)) || INITIAL_STATE.weeklyCurriculums.default;

      const tasks = sum.tasks.filter(t => deptFilter === "all" || t.deptId === deptFilter).map(t => ({ def: t, rec: mxRec(me, week, t.id), st: mxTaskState(t, mxRec(me, week, t.id), rules) }));
      const open = tasks.find(t => `${t.def.deptId}:${t.def.id}` === openKey) || null;
      const remainingList = tasks.filter(t => !t.st.done);
      const doneList = tasks.filter(t => t.st.done);

      const ack = (b) => onAcknowledgeBulletin(b.id, me.id);
      const myDirectives = modeSwitch ? [] : (db.directives || []).filter(d => d.toUserId === me.id && !d.readAt).sort((a, b) => (b.createdAtTs || 0) - (a.createdAtTs || 0));
      const nav = [
        { id: "tasks", label: "مهماتي", icon: "tasks", badge: (sum.week === curWeek ? sum.remaining : mxWeekSummary(db, me, curWeek).remaining) || null },
        { id: "bulletins", label: "التعميمات", icon: "megaphone", badge: unread.length || null },
        { id: "account", label: "حسابي", icon: "user" }
      ];
      const roleLabel = modeSwitch ? pa2RoleLabel(me) : (me.jobTitle || "عضو");

      const renderRow = ({ def, st }) => {
        const key = `${def.deptId}:${def.id}`;
        const dept = mxDeptById(db, def.deptId);
        const tone = mxDeptToneById(db, def.deptId);
        const active = openKey === key;
        return (
          <button key={key} onClick={() => setOpenKey(active ? null : key)} className={`w-full text-right flex items-center gap-4 px-4 sm:px-5 py-4 rounded-[22px] transition ${active ? "bg-white ring-2 ring-stone-900" : "bg-white hover:bg-[#FBFAF8]"}`}>
            <span className={`w-11 h-11 rounded-full ${tone.bg} inline-flex items-center justify-center text-[18px] shrink-0 ${st.done ? "opacity-60" : ""}`}>{st.done ? <PA2Icon name="check" className={`w-5 h-5 ${tone.ink}`} /> : (MX_TYPE_META[def.type]?.icon || "•")}</span>
            <span className="flex-1 min-w-0">
              <span className={`block text-[15px] font-medium truncate ${st.done ? "text-stone-400" : "text-stone-900"}`}>{def.title}</span>
              <span className="flex items-center gap-2 mt-1 text-[13px] text-stone-400">
                {myDeptIds.length > 1 && <MXDeptChip dept={dept} idx={depts.findIndex(d => d.id === def.deptId)} />}
                <span className="whitespace-nowrap truncate">{MX_TYPE_META[def.type]?.label}</span>
                {mxApproval(def) === "manager" && def.type !== "lecture_quiz" && def.type !== "daily_habit" && <span className="hidden sm:inline whitespace-nowrap">· يعتمدها المدير</span>}
              </span>
            </span>
            <MXStateTag st={st} />
          </button>
        );
      };

      let content;
      if (view === "bulletins") {
        const list = bulFilter === "unread" ? unread : bulletins;
        content = (
          <>
            <MXHeader eyebrow="التعميمات" title="أرشيف التعميمات" desc="كل ما وصلك من الإدارة التنفيذية والإدارات، الأحدث أولاً." />
            <div className="mb-6"><PA2Segmented options={[{ value: "all", label: `الكل · ${bulletins.length}` }, { value: "unread", label: `بانتظار اطلاعك · ${unread.length}` }]} value={bulFilter} onChange={setBulFilter} /></div>
            <div className="space-y-4 max-w-3xl">
              {list.length === 0 ? <PA2EmptyPanel title="لا توجد تعميمات هنا" text="ستظهر هنا التعميمات فور نشرها." /> : list.map(b => <MXBulletinCard key={b.id} db={db} b={b} me={me} onAck={() => ack(b)} />)}
            </div>
          </>
        );
      } else if (view === "account") {
        content = (
          <>
            <MXHeader eyebrow="حسابي" title="بياناتي" desc="ما يمكنك تعديله يحدده مدير المنصة." />
            <MXAccountCard key={me.id + (me.password || "")} me={me} rules={rules} db={db} isUsernameTaken={isUsernameTaken}
              onSave={(patch) => { setDb(prev => ({ ...prev, users: prev.users.map(u => u.id === me.id ? { ...u, ...patch } : u) })); showToast("تم حفظ بياناتك"); }} />
          </>
        );
      } else {
        content = (
          <>
            <MXHeader
              eyebrow={`مساحتي · الأسبوع ${week}${isPast ? " (سابق)" : ""}`}
              title={`أهلاً، ${mxFirstName(me.name)}`}
              desc={myDeptIds.length ? "مهماتك من كل الإدارات في قائمة واحدة. افتح أي مهمة لتنجزها." : "لا توجد مهام مسندة لك حالياً."}
              actions={minWeek < curWeek ? (
                <div className="inline-flex items-center h-11 rounded-full bg-white p-1">
                  <button onClick={() => { setWeek(w => Math.min(curWeek, w + 1)); setOpenKey(null); }} disabled={week >= curWeek} className="w-9 h-9 rounded-full hover:bg-stone-100 disabled:opacity-30 inline-flex items-center justify-center rotate-180"><PA2Icon name="chevron" className="w-4 h-4" /></button>
                  <span className="px-3 text-[14px] text-stone-700 tabular-nums min-w-[110px] text-center">{week === curWeek ? "الأسبوع الحالي" : `الأسبوع ${week}`}</span>
                  <button onClick={() => { setWeek(w => Math.max(minWeek, w - 1)); setOpenKey(null); }} disabled={week <= minWeek} className="w-9 h-9 rounded-full hover:bg-stone-100 disabled:opacity-30 inline-flex items-center justify-center"><PA2Icon name="chevron" className="w-4 h-4" /></button>
                </div>
              ) : null}
            />

            {me.mustChangePassword && rules.allowCadrePasswordChange && (
              <MXAttention title="أمان الحساب" items={[{ key: "pw", text: "ما زلت تستخدم كلمة مرور مؤقتة، غيّرها من «حسابي».", go: () => setView("account"), cta: "تغيير" }]} primaryLabel="تغيير كلمة المرور" />
            )}
            <MXDirectiveStrip directives={myDirectives} onRead={(id) => mxMarkDirectiveRead(setDb, id)} />
            {unread.length > 0 && <MXBulletinStrip bulletin={unread[0]} more={unread.length - 1} onAck={() => ack(unread[0])} onOpenAll={() => setView("bulletins")} />}

            {myDeptIds.length > 0 && (
              <MXScoreCard
                label={isPast ? `أين وصلت في الأسبوع ${week}؟` : "أين وصلت هذا الأسبوع؟"}
                pct={sum.pct}
                caption={`${sum.done} من ${sum.total} مهام مكتملة`}
                bars={myDeptIds.map(id => {
                  const b = sum.byDept[id] || { done: 0, total: 0, pct: 0 };
                  return { label: mxDeptById(db, id)?.name || id, value: `${b.done} / ${b.total}`, pct: b.pct, tone: mxDeptToneById(db, id).dot };
                })}
                stats={[{ n: sum.done, l: "مكتملة" }, { n: sum.submitted, l: "بانتظار الاعتماد" }, { n: sum.remaining, l: "متبقية" }]}
              />
            )}

            {myDeptIds.length > 0 && (
              <div className={`grid gap-6 items-start ${open ? "lg:grid-cols-[1fr_420px]" : ""}`}>
                <div className="min-w-0">
                  <div className="flex items-center justify-between gap-3 mb-4 flex-wrap">
                    <h2 className="text-xl font-bold text-stone-900">المهام</h2>
                    {myDeptIds.length > 1 && (
                      <PA2Segmented size="sm" value={deptFilter} onChange={(v) => { setDeptFilter(v); setOpenKey(null); }}
                        options={[{ value: "all", label: "الكل" }, ...myDeptIds.map(id => ({ value: id, label: mxDeptById(db, id)?.shortName || mxDeptById(db, id)?.name }))]} />
                    )}
                  </div>
                  {remainingList.length > 0 ? <div className="space-y-2">{remainingList.map(renderRow)}</div>
                    : <div className="rounded-[22px] bg-[#E3F1E8] px-5 py-4 text-[15px] text-emerald-800">أنجزت كل مهام هذا الأسبوع. بارك الله فيك.</div>}
                  {doneList.length > 0 && (
                    <>
                      <div className="text-[13px] text-stone-400 mt-8 mb-3">المنجزة · {doneList.length}</div>
                      <div className="space-y-2">{doneList.map(renderRow)}</div>
                    </>
                  )}
                </div>
                {open && (
                  <div className="lg:sticky lg:top-6">
                    <MXTaskPanel
                      key={`${openKey}:${week}`}
                      def={open.def}
                      dept={mxDeptById(db, open.def.deptId)}
                      rec={open.rec}
                      rules={rules}
                      week={week}
                      isPast={isPast}
                      curriculum={curriculum}
                      onClose={() => setOpenKey(null)}
                      onPatch={(patch) => mxPatchRecord(setDb, me.id, week, open.def.id, patch)}
                    />
                  </div>
                )}
              </div>
            )}
          </>
        );
      }

      return (
        <MXShell areaLabel="مساحتي" modeSwitch={modeSwitch} nav={nav} active={view} onNav={(v) => { setView(v); setOpenKey(null); }} user={me} roleLabel={roleLabel} onLogout={onLogout}>
          {content}
        </MXShell>
      );
    }
    // ==== PART:CADRE END ====

    // ============================================================================
    // 10. EXECUTIVE OFFICE MEMBER PORTAL (بوابة عضو المكتب التنفيذي - النشرة الإدارية)
    // ============================================================================
    function ExecutivePortal({ db, setDb, currentUser, onLogout, showToast }) {
      const cadres = useMemo(() => db.users.filter(u => u.roleType === "cadre"), [db.users]);
      const units = useMemo(() => Array.from(new Set(cadres.map(c => c.unit).filter(Boolean))), [cadres]);

      const [title, setTitle] = useState("");
      const [content, setContent] = useState("");
      const [category, setCategory] = useState("سياسة جديدة");
      const [targetType, setTargetType] = useState("all"); // 'all' | 'custom'
      const [selectedIds, setSelectedIds] = useState([]);

      const toggleRecipient = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const selectByUnit = (unitName) => {
        const unitUserIds = cadres.filter(c => c.unit === unitName).map(c => c.id);
        setSelectedIds(prev => Array.from(new Set([...prev, ...unitUserIds])));
      };

      const handlePublishBulletin = (e) => {
        e.preventDefault();
        if (!title.trim() || !content.trim()) {
          showToast("يرجى كتابة عنوان ونص التعميم الإداري أولاً.");
          return;
        }
        if (targetType === "custom" && selectedIds.length === 0) {
          showToast("يرجى اختيار كادر واحد على الأقل لإرسال التعميم المخصص.");
          return;
        }

        const now = new Date();
        const timeStr = formatTimeAr(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);
        const newBulletin = {
          id: "bul_" + Date.now(),
          title: title.trim(),
          content: content.trim(),
          category,
          senderName: currentUser.name,
          senderRole: currentUser.jobTitle || "عضو المكتب التنفيذي",
          createdAt: `اليوم • ${timeStr}`,
          targetType,
          recipientIds: targetType === "all" ? [] : selectedIds,
          acknowledgedBy: {}
        };

        setDb(prev => ({
          ...prev,
          bulletins: [newBulletin, ...(prev.bulletins || [])]
        }));

        setTitle("");
        setContent("");
        showToast("تم نشر وإرسال التعميم في النشرة الإدارية بنجاح 📢");
      };

      const deleteBulletin = (id) => {
        setDb(prev => ({
          ...prev,
          bulletins: (prev.bulletins || []).filter(b => b.id !== id)
        }));
        showToast("تم حذف التعميم من النشرة الإدارية");
      };

      return (
        <div className="min-h-screen bg-[#F7F7F5]">
          <header className="bg-white border-b border-stone-200 sticky top-0 z-30">
            <div className="max-w-5xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <MadyanWordmark size="text-2xl sm:text-3xl" />
                <span className="text-xs font-black px-3 py-1 rounded-full madyan-gradient text-white shadow-sm">
                  🏛️ بوابة عضو المكتب التنفيذي • النشرة الإدارية
                </span>
              </div>
              <div className="flex items-center gap-3">
                <span className="text-xs font-bold text-stone-600 hidden sm:inline">
                  {currentUser.name} ({currentUser.jobTitle})
                </span>
                <button
                  onClick={onLogout}
                  className="px-4 py-2 rounded-2xl bg-rose-50 text-rose-700 hover:bg-rose-100 text-xs font-bold transition"
                >
                  تسجيل الخروج
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 pt-6 space-y-6">
            <BulletinPublisherPanel
              cadres={cadres}
              units={units}
              title={title}
              setTitle={setTitle}
              content={content}
              setContent={setContent}
              category={category}
              setCategory={setCategory}
              targetType={targetType}
              setTargetType={setTargetType}
              selectedIds={selectedIds}
              setSelectedIds={setSelectedIds}
              toggleRecipient={toggleRecipient}
              selectByUnit={selectByUnit}
              onSubmit={handlePublishBulletin}
              bulletins={db.bulletins || []}
              onDelete={deleteBulletin}
            />
          </main>
        </div>
      );
    }

                  <button

                  <button

                      targetType === "custom" ? "bg-stone-900 text-white border-stone-900" : "bg-white text-stone-600"

                {targetType === "custom" && (
                  <div className="space-y-2.5 pt-2 border-t border-stone-200/70">
                    <div className="flex flex-wrap items-center gap-1.5">
                      <span className="text-[10px] font-bold text-stone-500">تحديد سريع لوحدة:</span>
                      {units.map(uName => (

                          type="button"

                      <button

                      >
                        إلغاء الكل
                      </button>
                    </div>

                    <div className="max-h-40 overflow-y-auto space-y-1.5 pr-1">
                      {cadres.map(c => {

                        return (

                            key={c.id}

                            className={`flex items-center justify-between p-2 rounded-xl border cursor-pointer text-xs transition ${

                            <span className={`text-[10px] px-2 py-0.5 rounded-md ${checked ? "bg-emerald-600 text-white" : "bg-stone-100 text-stone-500"}`}>
                              {checked ? "تصل له ✓" : "مستثنى ✕"}
                            </span>

                      })}

              <button
                type="submit"
                className="w-full py-3.5 rounded-2xl madyan-gradient text-white text-xs font-black shadow-lg shadow-orange-500/20 hover:opacity-95"

          {/* سجل التعميمات الصادرة ومتابعة من استوعبها */}
          <div className="lg:col-span-7 bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
            <div className="flex items-center justify-between">

              </div>

            <div className="space-y-4">
              {bulletins.map(bul => {
                const targetCadres = bul.targetType === "all"
