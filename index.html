    function calculateWeeksSinceJoin(joinedAtTimestamp) {
      if (!joinedAtTimestamp) return 1;
      const diffMs = Math.max(0, Date.now() - joinedAtTimestamp);
      return Math.max(1, Math.ceil(diffMs / MS_PER_WEEK));
    }

    function formatDateAr(timestamp) {
      const d = new Date(timestamp);
      return `${d.getDate()} ${MONTHS_AR[d.getMonth()]} ${d.getFullYear()}`;
    }

    function getWeekDateRangeLabel(weekIndex, totalWeeks) {
      const today = new Date();
      const weeksAgo = totalWeeks - weekIndex;
      const endOfWeek = new Date(today);
      endOfWeek.setDate(today.getDate() - (weeksAgo * 7));
      const startOfWeek = new Date(endOfWeek);
      startOfWeek.setDate(endOfWeek.getDate() - 6);

      const sDay = startOfWeek.getDate();
      const eDay = endOfWeek.getDate();
      const sMonth = MONTHS_AR[startOfWeek.getMonth()];
      const eMonth = MONTHS_AR[endOfWeek.getMonth()];
      return sMonth === eMonth ? `${sDay} - ${eDay} ${sMonth}` : `${sDay} ${sMonth} - ${eDay} ${eMonth}`;
    }

    function formatTimeAr(timeStr = "19:00") {
      const [hStr, mStr] = timeStr.split(':');
      let h = parseInt(hStr, 10);
      const period = h >= 12 ? 'مساءً' : 'صباحاً';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return `${String(h12).padStart(2, '0')}:${mStr} ${period}`;
    }

    function computeWeekSchedule(sched, taskDefs) {
      const meetDay = parseInt(sched.meetDay, 10);
      const duration = parseInt(sched.meetDuration, 10);
      const [h, m] = (sched.meetTime || "19:00").split(':').map(Number);
      const agendaDay = (meetDay + 6) % 7;

      const totalMinutes = h * 60 + m + duration;
      const endDayOffset = Math.floor(totalMinutes / (24 * 60));
      const endH = Math.floor((totalMinutes % (24 * 60)) / 60);
      const endM = totalMinutes % 60;
      const endTimeStr = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
      const minutesDay = (meetDay + endDayOffset + 1) % 7;

      return {
        lecture: {
          dayName: 'طوال الأسبوع',
          timeLabel: 'مرن حسب وقتك',
          durationMinutes: taskDefs.lecture.durationMinutes,
          badge: taskDefs.lecture.badge
        },
        agenda: {
          dayName: DAYS_AR[agendaDay],
          timeLabel: `قبل ${formatTimeAr(sched.meetTime)}`,
          durationMinutes: taskDefs.agenda.durationMinutes,
          badge: taskDefs.agenda.badge
        },
        attendance: {
          dayName: DAYS_AR[meetDay],
          timeLabel: `${formatTimeAr(sched.meetTime)} - ${formatTimeAr(endTimeStr)}`,
          durationMinutes: duration || taskDefs.attendance.durationMinutes,
          badge: taskDefs.attendance.badge
        },
        minutes: {
          dayName: DAYS_AR[minutesDay],
          timeLabel: `حتى ${formatTimeAr(endTimeStr)}`,
          durationMinutes: taskDefs.minutes.durationMinutes,
          badge: taskDefs.minutes.badge
        }
      };
    }

    function isCadreDepartmentEnabled(user, deptId) {
      if (!user || user.roleType !== "cadre") return true;
      const assigned = Array.isArray(user.assignedDepartments) && user.assignedDepartments.length > 0
        ? user.assignedDepartments
        : ["dept_hr", "dept_tarbawi"];
      return assigned.includes(deptId);
    }

    // جلب المهمات التربوية المفعلة والموجهة لهذا الكادر تحديداً (عامة أو لوحدته أو مخصصة له)
    function getApplicableTarbawiTasks(user, systemConfig) {
      if (user && user.roleType === "cadre" && !isCadreDepartmentEnabled(user, "dept_tarbawi")) {
        return [];
      }
      const list = Array.isArray(systemConfig?.tarbawiTaskDefinitions)
        ? systemConfig.tarbawiTaskDefinitions
        : DEFAULT_TARBAWI_TASKS;
      return list.filter(t => {
        if (t.enabled === false) return false;
        if (!user || user.roleType !== "cadre") return true;
        if (!t.targetScope || t.targetScope === "all") return true;
        if (t.targetScope === "unit") return t.targetUnit === user.unit;
        if (t.targetScope === "custom") return Array.isArray(t.targetUserIds) && t.targetUserIds.includes(user.id);
        return true;
      });
    }

    function getTaskScorePoints(taskObj, governanceRules = DEFAULT_GOVERNANCE_RULES) {
      const targetDays = Math.max(1, parseInt(governanceRules?.dailyTaskTargetDays, 10) || 5);
      const latePct = Math.max(0, Math.min(100, parseInt(governanceRules?.latePointsPct, 10) ?? 50));
      if (!taskObj || taskObj.status === 'pending') {
        // لو مهمة تتبع يومي وفيها أيام منجزة جزئياً نعطي نقاطاً تناسبية
        if (Array.isArray(taskObj?.daysCompleted) && taskObj.daysCompleted.length > 0) {
          return Math.min(90, Math.round((taskObj.daysCompleted.length / targetDays) * 100));
        }
        return 0;
      }
      if (taskObj.status === 'on_time') return 100;
      if (taskObj.status === 'late') return latePct;
      return 0;
    }

    function computeCadreMetrics(user, systemConfig = INITIAL_STATE.systemConfig) {
      const rules = systemConfig?.governanceRules || DEFAULT_GOVERNANCE_RULES;
      const totalWeeks = calculateWeeksSinceJoin(user.joinedAt);
      const hrEnabled = isCadreDepartmentEnabled(user, "dept_hr");
      const tarbawiDefs = getApplicableTarbawiTasks(user, systemConfig);
      const adminKeys = hrEnabled ? ['lecture', 'agenda', 'attendance', 'minutes'] : [];

      let adminPossible = totalWeeks * adminKeys.length * 100;
      let adminEarned = 0;
      let tarbawiPossible = totalWeeks * tarbawiDefs.length * 100;
      let tarbawiEarned = 0;

      let onTimeCount = 0;
      let lateCount = 0;
      let pendingCount = 0;
      let quizScores = [];

      const byTaskKey = {
        lecture: { onTime: 0, late: 0, pending: 0 },
        agenda: { onTime: 0, late: 0, pending: 0 },
        attendance: { onTime: 0, late: 0, pending: 0 },
        minutes: { onTime: 0, late: 0, pending: 0 }
      };

      const byTarbawiKey = {};
      tarbawiDefs.forEach(td => {
        byTarbawiKey[td.id] = { onTime: 0, late: 0, pending: 0 };
      });

      for (let w = 1; w <= totalWeeks; w++) {
        const wRec = (user.tasksRecord && user.tasksRecord[w]) || {};

        adminKeys.forEach(k => {
          const t = wRec[k] || { status: 'pending' };
          adminEarned += getTaskScorePoints(t, rules);
          if (t.status === 'on_time') {
            onTimeCount++;
            byTaskKey[k].onTime++;
          } else if (t.status === 'late') {
            lateCount++;
            byTaskKey[k].late++;
          } else {
            pendingCount++;
            byTaskKey[k].pending++;
          }
          if (k === 'lecture' && t.quizSubmission) {
            const qPct = Math.round((t.quizSubmission.score / t.quizSubmission.total) * 100);
            quizScores.push(qPct);
          }
        });

        tarbawiDefs.forEach(td => {
          const t = wRec[td.id] || { status: 'pending' };
          tarbawiEarned += getTaskScorePoints(t, rules);
          if (t.status === 'on_time') {
            onTimeCount++;
            byTarbawiKey[td.id].onTime++;
          } else if (t.status === 'late') {
            lateCount++;
            byTarbawiKey[td.id].late++;
          } else {
            pendingCount++;
            byTarbawiKey[td.id].pending++;
          }
        });
      }

      const adminScorePct = adminPossible > 0 ? Math.round((adminEarned / adminPossible) * 100) : 0;
      const tarbawiScorePct = tarbawiDefs.length > 0 && tarbawiPossible > 0
        ? Math.round((tarbawiEarned / tarbawiPossible) * 100)
        : 0;

      const totalPossible = adminPossible + tarbawiPossible;
      const totalEarned = adminEarned + tarbawiEarned;
      const overallScorePct = totalPossible > 0 ? Math.round((totalEarned / totalPossible) * 100) : 0;
      const avgQuizPct = quizScores.length > 0 ? Math.round(quizScores.reduce((a, b) => a + b, 0) / quizScores.length) : null;

      return {
        totalWeeks,
        overallScorePct,
        adminScorePct,
        tarbawiScorePct,
        onTimeCount,
        lateCount,
        pendingCount,
        totalTasksCount: totalWeeks * (adminKeys.length + tarbawiDefs.length),
        avgQuizPct,
        byTaskKey,
        byTarbawiKey
      };
    }

    function getYoutubeEmbedUrl(url) {
      if (!url) return "";
      const driveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) {
        return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
      }
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11)
        ? `https://www.youtube.com/embed/${match[2]}?rel=0&modestbranding=1&playsinline=1`
        : url;
    }

    function isIframeVideo(videoType, url) {
      if (videoType === "youtube" || videoType === "gdrive") return true;
      if (!url) return false;
      return url.includes("youtube.com") || url.includes("youtu.be") || url.includes("drive.google.com");
    }

    function normalizeDb(raw) {
      if (!raw || typeof raw !== "object") return INITIAL_STATE;

      const rawTarbawiDefs = Array.isArray(raw.systemConfig?.tarbawiTaskDefinitions) && raw.systemConfig.tarbawiTaskDefinitions.length > 0
        ? raw.systemConfig.tarbawiTaskDefinitions
        : DEFAULT_TARBAWI_TASKS;

      const rawDepartments = (Array.isArray(raw.systemConfig?.departments) && raw.systemConfig.departments.length > 0
        ? raw.systemConfig.departments
        : DEFAULT_DEPARTMENTS).map(d => {
        const seedDept = DEFAULT_DEPARTMENTS.find(sd => sd.id === d.id);
        return {
          ...(seedDept || {}),
          ...d,
          allowedTaskTypes: Array.isArray(d.allowedTaskTypes) && d.allowedTaskTypes.length > 0
            ? d.allowedTaskTypes
            : (seedDept?.allowedTaskTypes || ["lecture_quiz", "meeting", "practical"]),
          maxTotalTasks: d.maxTotalTasks ?? (seedDept?.maxTotalTasks || 6),
          maxPerTypePerCadre: d.maxPerTypePerCadre ?? (seedDept?.maxPerTypePerCadre || 2)
        };
      });

      const rawUnits = (Array.isArray(raw.systemConfig?.organizationalUnits) && raw.systemConfig.organizationalUnits.length > 0
        ? raw.systemConfig.organizationalUnits
        : DEFAULT_UNITS).map(u => {
        const seedU = DEFAULT_UNITS.find(su => su.id === u.id);
        return {
          ...(seedU || {}),
          ...u,
          inviteCode: u.inviteCode || seedU?.inviteCode || ("MAYDAN-" + String(u.id || "UNIT").slice(-4).toUpperCase())
        };
      });

      const rawTeams = Array.isArray(raw.systemConfig?.crossFunctionalTeams) && raw.systemConfig.crossFunctionalTeams.length > 0
        ? raw.systemConfig.crossFunctionalTeams
        : DEFAULT_TEAMS;

      const safeGovernanceRules = {
        ...DEFAULT_GOVERNANCE_RULES,
        ...(raw.systemConfig?.governanceRules || {})
      };

      const safeSystemConfig = {
        ...INITIAL_STATE.systemConfig,
        ...(raw.systemConfig || {}),
        departments: rawDepartments,
        organizationalUnits: rawUnits,
        crossFunctionalTeams: rawTeams,
        governanceRules: safeGovernanceRules,
        availableCurriculumWeeks: Array.isArray(raw.systemConfig?.availableCurriculumWeeks)
          ? raw.systemConfig.availableCurriculumWeeks
          : INITIAL_STATE.systemConfig.availableCurriculumWeeks,
        tarbawiWeeklyFocus: {
          ...INITIAL_STATE.systemConfig.tarbawiWeeklyFocus,
          ...(raw.systemConfig?.tarbawiWeeklyFocus || {})
        },
        quotes: Array.isArray(raw.systemConfig?.quotes) && raw.systemConfig.quotes.length > 0
          ? raw.systemConfig.quotes
          : INITIAL_STATE.systemConfig.quotes,
        taskDefinitions: {
          ...INITIAL_STATE.systemConfig.taskDefinitions,
          ...(raw.systemConfig?.taskDefinitions || {})
        },
        tarbawiTaskDefinitions: rawTarbawiDefs
      };

      const safeBulletins = Array.isArray(raw.bulletins) ? raw.bulletins : INITIAL_STATE.bulletins;
      const safeCurriculums = {
        ...INITIAL_STATE.weeklyCurriculums,
        ...(raw.weeklyCurriculums || {})
      };

      const rawUsers = Array.isArray(raw.users) && raw.users.length > 0 ? raw.users : INITIAL_STATE.users;
      // التأكد من وجود الحسابات الأساسية للمستويات الأربعة (مدير المنصة، التنفيذي، الموارد البشرية، التربوية)
      let mergedUsers = [...rawUsers];
      ["u_platform", "u_exec", "u_admin", "u_tarbawi"].forEach(seedId => {
        if (!mergedUsers.some(u => u.id === seedId)) {
          const seedUser = INITIAL_STATE.users.find(su => su.id === seedId);
          if (seedUser) mergedUsers.unshift(seedUser);
        }
      });

      const safeUsers = mergedUsers.map(u => {
        // تحويل الحسابات القديمة ذات النوع admin إلى operational_admin مع ربطها بإدارة الموارد البشرية
        if (u.roleType === "admin") {
          return {
            ...u,
            roleType: "operational_admin",
            departmentId: u.departmentId || "dept_hr"
          };
        }
        if (u.roleType === "operational_admin") {
          return {
            ...u,
            departmentId: u.departmentId || "dept_hr"
          };
        }
        if (u.roleType !== "cadre") return u;

        const seedMatch = INITIAL_STATE.users.find(su => su.id === u.id);
        const rawRec = u.tasksRecord || {};
        const mergedRec = { ...rawRec };

        if (seedMatch && seedMatch.tasksRecord) {
          Object.keys(seedMatch.tasksRecord).forEach(wKey => {
            mergedRec[wKey] = {
              ...(seedMatch.tasksRecord[wKey] || {}),
              ...(rawRec[wKey] || {})
            };
          });
        }

        return {
          ...u,
          joinedAt: u.joinedAt || Date.now(),
          assignedDepartments: Array.isArray(u.assignedDepartments) && u.assignedDepartments.length > 0
            ? u.assignedDepartments
            : ["dept_hr", "dept_tarbawi"],
          crossTeams: Array.isArray(u.crossTeams) ? u.crossTeams : [],
          defaultSchedule: {
            meetDay: u.defaultSchedule?.meetDay ?? 2,
            meetTime: u.defaultSchedule?.meetTime || "19:00",
            meetDuration: u.defaultSchedule?.meetDuration || 90
          },
          weekOverrides: u.weekOverrides || {},
          tasksRecord: mergedRec
        };
      });

      return {
        systemConfig: safeSystemConfig,
        bulletins: safeBulletins,
        weeklyCurriculums: safeCurriculums,
        users: safeUsers
      };
    }

    function saveCloudConfigToStorage(url, key) {
      const cfg = {
        supabaseUrl: (url || "").trim().replace(/\/$/, ""),
        supabaseAnonKey: (key || "").trim()
      };
      localStorage.setItem(CLOUD_CONFIG_KEY, JSON.stringify(cfg));
      return cfg;
    }

    // ============================================================================
    // 4. MAIN APPLICATION COMPONENT
    // ============================================================================
    function App() {
      const [db, setDb] = useState(() => {
        try {
          const saved = localStorage.getItem("MADYAN_DB_V6_SAFE");
          if (saved) return normalizeDb(JSON.parse(saved));
        } catch (e) {}
        return normalizeDb(INITIAL_STATE);
      });

      const [currentUserId, setCurrentUserId] = useState(() => {
        try {
          const p = new URLSearchParams(window.location.search).get("user");
          if (p) {
            const match = INITIAL_STATE.users.find(u => u.id === p || u.username === p);
            if (match) return match.id;
          }
        } catch (e) {}
        return null;
      });
      const [supervisoryAdminId, setSupervisoryAdminId] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);
      const [cloudConfig, setCloudConfig] = useState(() => loadCloudConfig());
      const [cloudStatus, setCloudStatus] = useState("checking");
      const [cloudError, setCloudError] = useState("");
      const [lastSyncAt, setLastSyncAt] = useState(null);
      const [cloudModalOpen, setCloudModalOpen] = useState(false);
      const isRemoteUpdateRef = React.useRef(false);
      const supabaseClientRef = React.useRef(null);
      const initialPullDoneRef = React.useRef(false);

      useEffect(() => {
        let cancelled = false;
        async function discoverServerlessConfig() {
          try {
            const res = await fetch("/api/config", { method: "GET" });
            if (res.ok) {
              const data = await res.json();
              if (!cancelled && data && data.configured && data.supabaseUrl && data.supabaseAnonKey) {
                const merged = saveCloudConfigToStorage(data.supabaseUrl, data.supabaseAnonKey);
                setCloudConfig(merged);
              }
            }
          } catch (e) {}
        }
        discoverServerlessConfig();
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        if (!cloudConfig.supabaseUrl || !cloudConfig.supabaseAnonKey || !window.supabase) {
          setCloudStatus("local_only");
          return;
        }

        let channel = null;
        let active = true;
        setCloudStatus("checking");
        setCloudError("");

        try {
          const client = window.supabase.createClient(cloudConfig.supabaseUrl, cloudConfig.supabaseAnonKey);
          supabaseClientRef.current = client;

          async function initSync() {
            const { data, error } = await client
              .from("madyan_app_state")
              .select("*")
              .eq("id", "global")
              .maybeSingle();

            if (!active) return;

            if (error) {
              setCloudStatus("error");
              setCloudError(error.message || "تعذر القراءة من جدول madyan_app_state.");
              return;
            }

            if (data && data.state_data) {
              isRemoteUpdateRef.current = true;
              setDb(normalizeDb(data.state_data));
              setLastSyncAt(new Date().toLocaleTimeString("ar-EG"));
              initialPullDoneRef.current = true;
              setCloudStatus("connected");
            } else {
              const { error: upsertErr } = await client
                .from("madyan_app_state")
                .upsert({
                  id: "global",
                  state_data: db,
                  updated_at: new Date().toISOString(),
                  updated_by: "initial_seed"
                });
              if (upsertErr) {
                setCloudStatus("error");
                setCloudError(upsertErr.message);
                return;
              }
              initialPullDoneRef.current = true;
              setLastSyncAt(new Date().toLocaleTimeString("ar-EG"));
              setCloudStatus("connected");
            }
          }

          initSync();

          channel = client
            .channel("madyan_global_sync")
            .on(
              "postgres_changes",
              { event: "*", schema: "public", table: "madyan_app_state", filter: "id=eq.global" },
              (payload) => {
                if (payload.new && payload.new.state_data) {
                  isRemoteUpdateRef.current = true;
                  setDb(normalizeDb(payload.new.state_data));
                  setLastSyncAt(new Date().toLocaleTimeString("ar-EG"));
                }
              }
            )
            .subscribe();
        } catch (err) {
          setCloudStatus("error");
          setCloudError(String(err.message || err));
        }

        return () => {
          active = false;
          if (channel && supabaseClientRef.current) {
            supabaseClientRef.current.removeChannel(channel);
          }
        };
      }, [cloudConfig.supabaseUrl, cloudConfig.supabaseAnonKey]);

      useEffect(() => {
        try {
          localStorage.setItem("MADYAN_DB_V6_SAFE", JSON.stringify(db));
        } catch (e) {}

        if (isRemoteUpdateRef.current) {
          isRemoteUpdateRef.current = false;
          return;
        }

        if (cloudStatus === "connected" && supabaseClientRef.current && initialPullDoneRef.current) {
          const timer = setTimeout(async () => {
            try {
              const { error } = await supabaseClientRef.current
                .from("madyan_app_state")
                .upsert({
                  id: "global",
                  state_data: db,
                  updated_at: new Date().toISOString(),
                  updated_by: currentUserId || "anonymous"
                });
              if (!error) {
                setLastSyncAt(new Date().toLocaleTimeString("ar-EG"));
              }
            } catch (e) {}
          }, 250);
          return () => clearTimeout(timer);
        }
      }, [db, cloudStatus, currentUserId]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3200);
      };

      const currentUser = useMemo(() => {
        return db.users.find(u => u.id === currentUserId) || null;
      }, [db.users, currentUserId]);

      const updateUserRecord = (userId, updaterFn) => {
        setDb(prev => ({
          ...prev,
          users: prev.users.map(u => u.id === userId ? updaterFn(u) : u)
        }));
      };

      const isUsernameTaken = (newUsername, ignoreUserId) => {
        const clean = newUsername.trim().toLowerCase();
        return db.users.some(u => u.id !== ignoreUserId && u.username.toLowerCase() === clean);
      };

      const acknowledgeBulletin = (bulletinId, userId) => {
        const now = new Date();
        const stamp = `اليوم ${formatTimeAr(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`)}`;
        setDb(prev => ({
          ...prev,
          bulletins: (prev.bulletins || []).map(b => {
            if (b.id !== bulletinId) return b;
            return {
              ...b,
              acknowledgedBy: {
                ...(b.acknowledgedBy || {}),
                [userId]: stamp
              }
            };
          })
        }));
        showToast("تم تسجيل الاطلاع والاستيعاب للتعميم الإداري ✓");
      };

      const resetDemoData = () => {
        localStorage.removeItem("MADYAN_DB_V6_SAFE");
        setDb(normalizeDb(INITIAL_STATE));
        setCurrentUserId(null);
        showToast("تمت استعادة البيانات الافتراضية للنظام بنجاح");
      };

      return (
        <div className="min-h-screen pb-20">
          {toastMsg && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-[60] bg-stone-900 text-white text-xs font-bold px-5 py-3 rounded-2xl shadow-xl border border-stone-700 animate-bounce">
              {toastMsg}
            </div>
          )}

          {supervisoryAdminId && currentUser && currentUser.id !== supervisoryAdminId && (
            <div className="sticky top-0 z-50 bg-stone-900 text-white px-4 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-2 text-xs font-black shadow-lg border-b border-orange-500/40">
              <div className="flex items-center gap-2">
                <span className="px-2.5 py-0.5 rounded-full bg-orange-600 text-white text-[11px]">👁️ وضع الإشراف والمعاينة</span>
                <span>تستعرض الآن شاشة المستوى ببيانات: {currentUser.name} ({currentUser.unit})</span>
              </div>
              <button
                onClick={() => {
                  setCurrentUserId(supervisoryAdminId);
                  setSupervisoryAdminId(null);
                }}
                className="px-4 py-1.5 rounded-xl bg-white text-stone-900 hover:bg-orange-50 font-black transition"
              >
                العودة إلى بوابة إدارة المنصة ←
              </button>
            </div>
          )}

          {!currentUser ? (
            <LoginView
              users={db.users}
              onLoginSuccess={(user) => {
                setSupervisoryAdminId(null);
                setCurrentUserId(user.id);
              }}
              onResetDemo={resetDemoData}
            />
          ) : currentUser.roleType === "platform_admin" ? (
            <PlatformAdminPortal
              db={db}
              setDb={setDb}
              currentUser={currentUser}
              cloudStatus={cloudStatus}
              lastSyncAt={lastSyncAt}
              onOpenCloudSetup={() => setCloudModalOpen(true)}
              onPreviewUser={(targetUserId) => {
                setSupervisoryAdminId(currentUser.id);
                setCurrentUserId(targetUserId);
              }}
              onResetDemo={resetDemoData}
              onLogout={() => {
                setSupervisoryAdminId(null);
                setCurrentUserId(null);
              }}
              showToast={showToast}
            />
          ) : (currentUser.roleType === "admin" || currentUser.roleType === "operational_admin") ? (
            <AdminPortal
              db={db}
              setDb={setDb}
              currentUser={currentUser}
              onLogout={() => setCurrentUserId(null)}
              showToast={showToast}
            />
          ) : currentUser.roleType === "executive" ? (
            <ExecutivePortal
              db={db}
              setDb={setDb}
              currentUser={currentUser}
              onLogout={() => setCurrentUserId(null)}
              showToast={showToast}
            />
          ) : (
            <CadrePortal
              db={db}
              currentUser={currentUser}
              updateUserRecord={updateUserRecord}
              isUsernameTaken={isUsernameTaken}
              onAcknowledgeBulletin={acknowledgeBulletin}
              onLogout={() => setCurrentUserId(null)}
              showToast={showToast}
            />
          )}

          {/* مؤشر الاتصال السحابي العائم (يخفى في إدارة المنصة لوجوده أسفل العمود الجانبي) */}
          {currentUser?.roleType !== "platform_admin" && (
            <div className="fixed bottom-4 left-4 z-40">
              <button
                onClick={() => setCloudModalOpen(true)}
                className={`px-3 py-1.5 rounded-full text-[11px] font-bold shadow-md border flex items-center gap-1.5 transition backdrop-blur-md ${
                  cloudStatus === "connected"
                    ? "bg-white/90 text-emerald-800 border-emerald-200 hover:bg-emerald-50"
                    : cloudStatus === "error"
                    ? "bg-rose-950/95 text-rose-100 border-rose-700"
                    : "bg-white/90 text-stone-600 border-stone-200 hover:bg-stone-100"
                }`}
              >
                <span className={`w-2 h-2 rounded-full ${
                  cloudStatus === "connected"
                    ? "bg-emerald-500 animate-pulse"
                    : cloudStatus === "error"
                    ? "bg-rose-400"
                    : "bg-amber-400"
                }`} />
                <span>
                  {cloudStatus === "connected"
                    ? "متصل سحابياً"
                    : cloudStatus === "error"
                    ? "تنبيه اتصال سحابي"
                    : "الربط السحابي"}
                </span>
              </button>
            </div>
          )}

          <CloudSetupModal
            isOpen={cloudModalOpen}
            onClose={() => setCloudModalOpen(false)}
            cloudConfig={cloudConfig}
            cloudStatus={cloudStatus}
            cloudError={cloudError}
            lastSyncAt={lastSyncAt}
            onSaveConfig={(url, key) => {
              const saved = saveCloudConfigToStorage(url, key);
              initialPullDoneRef.current = false;
              setCloudConfig(saved);
              showToast("تم حفظ بيانات الاتصال السحابي وجاري المزامنة ☁️");
            }}
            onDisconnect={() => {
              localStorage.removeItem(CLOUD_CONFIG_KEY);
              supabaseClientRef.current = null;
              initialPullDoneRef.current = false;
              setCloudConfig({ supabaseUrl: "", supabaseAnonKey: "" });
              setCloudStatus("local_only");
              showToast("تم فصل الاتصال السحابي والعودة للوضع المحلي");
            }}
            showToast={showToast}
          />
        </div>
      );
    }

    // ============================================================================
    // 6. CADRE PORTAL COMPONENT (رحلة عين مرتبة + المحور الإداري والمحور التربوي)
    // ============================================================================
    function CadrePortal({ db, currentUser, updateUserRecord, isUsernameTaken, onAcknowledgeBulletin, onLogout, showToast }) {
      const totalWeeks = useMemo(() => calculateWeeksSinceJoin(currentUser.joinedAt), [currentUser.joinedAt]);
      const [selectedWeek, setSelectedWeek] = useState(totalWeeks);
      const [activePillar, setActivePillar] = useState("all"); // 'all' | 'admin' | 'tarbawi'
      const [expandedHelpKey, setExpandedHelpKey] = useState(null);
      const [showOnboarding, setShowOnboarding] = useState(!currentUser.onboarded);
      const [settingsModalScope, setSettingsModalScope] = useState(null);
      const [lectureModalOpen, setLectureModalOpen] = useState(false);
      const [noteModalTaskKey, setNoteModalTaskKey] = useState(null);
      const [bulletinArchiveOpen, setBulletinArchiveOpen] = useState(false);

      const tarbawiTasks = useMemo(
        () => getApplicableTarbawiTasks(currentUser, db.systemConfig),
        [currentUser, db.systemConfig]
      );

      useEffect(() => {
        let needsInit = false;
        const currentRec = currentUser.tasksRecord || {};
        const updatedRec = { ...currentRec };
        for (let w = 1; w <= totalWeeks; w++) {
          if (!updatedRec[w]) {
            needsInit = true;
            updatedRec[w] = {
              lecture: { status: "pending" },
              agenda: { status: "pending" },
              attendance: { status: "pending" },
              minutes: { status: "pending" }
            };
          }
        }
        if (needsInit) {
          updateUserRecord(currentUser.id, u => ({ ...u, tasksRecord: updatedRec }));
        }
      }, [totalWeeks, currentUser.id]);

      const myBulletins = useMemo(() => {
        const list = db.bulletins || [];
        return list.filter(b => b.targetType === "all" || (b.recipientIds || []).includes(currentUser.id));
      }, [db.bulletins, currentUser.id]);

      const unreadBulletins = useMemo(() => {
        return myBulletins.filter(b => !(b.acknowledgedBy && b.acknowledgedBy[currentUser.id]));
      }, [myBulletins, currentUser.id]);

      const isPastWeek = selectedWeek < totalWeeks;
      const activeSched = (currentUser.weekOverrides && currentUser.weekOverrides[selectedWeek]) || currentUser.defaultSchedule;
      const computedSched = computeWeekSchedule(activeSched, db.systemConfig.taskDefinitions);
      const weekRecord = (currentUser.tasksRecord && currentUser.tasksRecord[selectedWeek]) || {};

      const metrics = useMemo(() => computeCadreMetrics(currentUser, db.systemConfig), [currentUser, db.systemConfig]);
      const activeCurriculum = db.weeklyCurriculums[selectedWeek] || db.weeklyCurriculums.default;
      const randomQuote = db.systemConfig.quotes[selectedWeek % Math.max(1, db.systemConfig.quotes.length)] || db.systemConfig.quotes[0];
      const tarbawiFocus = db.systemConfig.tarbawiWeeklyFocus || INITIAL_STATE.systemConfig.tarbawiWeeklyFocus;

      // حساب إحصائيات الأسبوع المحدد للمحور الإداري والمحور التربوي
      const weekStats = useMemo(() => {
        const adminKeys = ['lecture', 'agenda', 'attendance', 'minutes'];
        let adminDone = 0;
        let adminPoints = 0;
        adminKeys.forEach(k => {
          const st = weekRecord[k]?.status || 'pending';
          if (st !== 'pending') adminDone++;
          adminPoints += getTaskScorePoints(weekRecord[k]);
        });

        let tarbawiDone = 0;
        let tarbawiPoints = 0;
        tarbawiTasks.forEach(t => {
          const rec = weekRecord[t.id] || { status: 'pending' };
          if (rec.status && rec.status !== 'pending') tarbawiDone++;
          tarbawiPoints += getTaskScorePoints(rec);
        });

        const adminPct = Math.round((adminPoints / (adminKeys.length * 100)) * 100);
        const tarbawiPct = tarbawiTasks.length > 0
          ? Math.round((tarbawiPoints / (tarbawiTasks.length * 100)) * 100)
          : 0;
        const totalCount = adminKeys.length + tarbawiTasks.length;
        const completedCount = adminDone + tarbawiDone;
        const totalPossible = totalCount * 100;
        const weekScorePct = totalPossible > 0 ? Math.round(((adminPoints + tarbawiPoints) / totalPossible) * 100) : 0;

        return {
          adminDone,
          adminTotal: adminKeys.length,
          adminPct,
          tarbawiDone,
          tarbawiTotal: tarbawiTasks.length,
          tarbawiPct,
          completedCount,
          totalCount,
          weekScorePct
        };
      }, [weekRecord, tarbawiTasks]);

      // تحديد «الخطوة التالية الآن» لتوجيه عين الكادر فوراً دون تشتت
      const nextStepInfo = useMemo(() => {
        const adminOrder = ['lecture', 'agenda', 'attendance', 'minutes'];
        for (const k of adminOrder) {
          const st = weekRecord[k]?.status || 'pending';
          if (st === 'pending') {
            if (isPastWeek && k !== 'lecture') continue;
            const def = db.systemConfig.taskDefinitions[k];
            const sc = computedSched[k];
            return {
              pillar: "admin",
              key: k,
              title: def.title,
              hint: `${sc.dayName} • ${sc.timeLabel}`,
              actionLabel: k === "lecture" ? "فتح المحاضرة والاختبار ▶" : "تسجيل الإنجاز الآن ✓"
            };
          }
        }
        if (!isPastWeek) {
          for (const t of tarbawiTasks) {
            const st = weekRecord[t.id]?.status || 'pending';
            if (st === 'pending') {
              return {
                pillar: "tarbawi",
                key: t.id,
                title: t.title,
                hint: t.subtitle,
                actionLabel: t.trackType === "daily_days" ? "تسجيل ورد اليوم 📖" : "تأكيد الإنجاز ✓"
              };
            }
          }
        }
        return null;
      }, [weekRecord, tarbawiTasks, isPastWeek, db.systemConfig.taskDefinitions, computedSched]);

      const handleAdminTaskAction = (taskKey) => {
        if (taskKey === "lecture") {
          setLectureModalOpen(true);
          return;
        }
        if (isPastWeek) {
          showToast("🔒 لا يمكن تعديل حالة هذه المهمة لأن الأسبوع قد انتهى بالفعل.");
          return;
        }

        const currentStatus = weekRecord[taskKey]?.status || "pending";
        const nextStatus = currentStatus === "pending" ? "on_time" : "pending";
        const now = new Date();
        const timeFormatted = formatTimeAr(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);

        updateUserRecord(currentUser.id, u => ({
          ...u,
          tasksRecord: {
            ...u.tasksRecord,
            [selectedWeek]: {
              ...(u.tasksRecord?.[selectedWeek] || {}),
              [taskKey]: {
                ...(u.tasksRecord?.[selectedWeek]?.[taskKey] || {}),
                status: nextStatus,
                completedAt: nextStatus === "on_time" ? `اليوم ${timeFormatted}` : null
              }
            }
          }
        }));
      };

      const handleTarbawiTaskToggle = (taskDef) => {
        if (isPastWeek) {
          showToast("🔒 الأسبوع منتهٍ ولا يمكن تعديل مهام الأسابيع السابقة.");
          return;
        }
        const currentRec = weekRecord[taskDef.id] || { status: "pending", daysCompleted: [] };
        const nextStatus = currentRec.status === "on_time" ? "pending" : "on_time";
        const now = new Date();
        const timeFormatted = formatTimeAr(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);

        updateUserRecord(currentUser.id, u => ({
          ...u,
          tasksRecord: {
            ...u.tasksRecord,
            [selectedWeek]: {
              ...(u.tasksRecord?.[selectedWeek] || {}),
              [taskDef.id]: {
                ...currentRec,
                status: nextStatus,
                completedAt: nextStatus === "on_time" ? `اليوم ${timeFormatted}` : null
              }
            }
          }
        }));

        if (nextStatus === "on_time") {
          showToast(`تم تسجيل إنجاز «${taskDef.title}» في المحور التربوي 🌱`);
        }
      };

      const handleTarbawiDayToggle = (taskDef, dayIdx) => {
        if (isPastWeek) {
          showToast("🔒 الأسبوع منتهٍ ولا يمكن تعديل سجل الأيام السابقة.");
          return;
        }
        const currentRec = weekRecord[taskDef.id] || { status: "pending", daysCompleted: [] };
        const prevDays = Array.isArray(currentRec.daysCompleted) ? currentRec.daysCompleted : [];
        const exists = prevDays.includes(dayIdx);
        const nextDays = exists ? prevDays.filter(d => d !== dayIdx) : [...prevDays, dayIdx].sort();
        const targetDays = Number(taskDef.targetDays) || 5;
        const reachedTarget = nextDays.length >= targetDays;
        const now = new Date();
        const timeFormatted = formatTimeAr(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);

        updateUserRecord(currentUser.id, u => ({
          ...u,
          tasksRecord: {
            ...u.tasksRecord,
            [selectedWeek]: {
              ...(u.tasksRecord?.[selectedWeek] || {}),
              [taskDef.id]: {
                ...currentRec,
                daysCompleted: nextDays,
                status: reachedTarget ? "on_time" : "pending",
                completedAt: reachedTarget ? `أتمّ ${nextDays.length} أيام (${timeFormatted})` : null
              }
            }
          }
        }));
      };

      const getCategoryBadgeStyle = (cat) => {
        switch (cat) {
          case "توجيه عاجل": return "bg-rose-100 text-rose-800 border-rose-200";
          case "سياسة جديدة": return "bg-orange-100 text-orange-800 border-orange-200";
          case "تعميم مشروع": return "bg-amber-100 text-amber-800 border-amber-200";
          default: return "bg-sky-100 text-sky-800 border-sky-200";
        }
      };

      return (
        <div>
          {/* ==================================================================== */}
          {/* هيدر نظيف وواضح */}
          {/* ==================================================================== */}
          <header className="bg-white/95 backdrop-blur-md border-b border-stone-200/80 sticky top-0 z-30">
            <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
              <div className="flex items-center gap-3">
                <MadyanWordmark size="text-2xl sm:text-3xl" />
                <div className="hidden sm:flex items-center gap-2 pr-3 border-r border-stone-200">
                  <div className="w-8 h-8 rounded-full madyan-gradient text-white font-black flex items-center justify-center text-xs">
                    {currentUser.name.slice(0, 2)}
                  </div>
                  <div>
                    <div className="text-xs font-black text-stone-800 leading-tight">{currentUser.name}</div>
                    <div className="text-[10px] text-stone-500">{currentUser.unit} • {currentUser.jobTitle}</div>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => setBulletinArchiveOpen(true)}
                  className={`relative px-3 py-2 rounded-2xl border transition flex items-center gap-1.5 text-xs font-bold ${
                    unreadBulletins.length > 0
                      ? "bg-orange-50 text-orange-900 border-orange-300 font-black"
                      : "bg-stone-100 text-stone-700 border-transparent hover:bg-stone-200"
                  }`}
                >
                  <span>📢</span>
                  <span className="hidden sm:inline">التعميمات</span>
                  {unreadBulletins.length > 0 && (
                    <span className="px-1.5 py-0.2 rounded-full bg-rose-600 text-white text-[10px] font-black animate-pulse">
                      {unreadBulletins.length}
                    </span>
                  )}
                </button>

                <button
                  onClick={() => setSettingsModalScope("global")}
                  className="px-3 py-2 rounded-2xl bg-stone-100 text-stone-700 hover:bg-stone-200 transition flex items-center gap-1.5 text-xs font-bold"
                >
                  <span>⚙️</span>
                  <span className="hidden sm:inline">الإعدادات</span>
                </button>

                <button
                  onClick={onLogout}
                  className="px-3 py-2 rounded-2xl bg-stone-100 text-stone-500 hover:bg-rose-50 hover:text-rose-600 transition text-xs font-bold"
                >
                  خروج
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 pt-5 space-y-5">

            {/* ==================================================================== */}
            {/* المحطة 1: شريط التعميمات الذكي (يبرز فقط عند وجود تعميم غير مقروء!) */}
            {/* ==================================================================== */}
            {unreadBulletins.length > 0 ? (
              <div className="rounded-3xl p-4 sm:p-5 bg-gradient-to-br from-orange-50 via-white to-amber-50 border-2 border-orange-300 shadow-sm space-y-3">
                <div className="flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <span className="px-2.5 py-0.5 rounded-full bg-rose-600 text-white text-[11px] font-black">
                      📢 {unreadBulletins.length} تعميم إداري جديد مطلوب استيعابه
                    </span>
                  </div>
                  <button
                    onClick={() => setBulletinArchiveOpen(true)}
                    className="text-[11px] font-bold text-stone-600 hover:text-stone-900 underline"
                  >
                    عرض الأرشيف ({myBulletins.length})
                  </button>
                </div>

                {unreadBulletins.map(bul => (
                  <div key={bul.id} className="p-4 rounded-2xl bg-white border border-orange-200 space-y-2">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div className="flex items-center gap-1.5">
                        <span className={`text-[10px] font-black px-2 py-0.5 rounded-full border ${getCategoryBadgeStyle(bul.category)}`}>
                          {bul.category}
                        </span>
                        <span className="text-[11px] font-bold text-stone-600">
                          {bul.senderName} ({bul.senderRole})
                        </span>
                      </div>
                      <span className="text-[11px] text-stone-400">{bul.createdAt}</span>
                    </div>
                    <h3 className="text-sm font-black text-stone-900">{bul.title}</h3>
                    <p className="text-xs text-stone-600 leading-relaxed">{bul.content}</p>
                    <div className="pt-2 flex justify-end">
                      <button
                        onClick={() => onAcknowledgeBulletin(bul.id, currentUser.id)}
                        className="px-4 py-2 rounded-xl madyan-gradient text-white text-xs font-black shadow-sm hover:opacity-95"
                      >
                        تم الاطلاع والاستيعاب ✓
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            ) : myBulletins.length > 0 && (
              <div className="px-4 py-2.5 rounded-2xl bg-white border border-stone-200/80 flex flex-wrap items-center justify-between gap-2 text-xs">
                <div className="flex items-center gap-2 truncate">
                  <span className="w-5 h-5 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-[11px] font-black">✓</span>
                  <span className="text-stone-500 font-semibold">النشرة الإدارية:</span>
                  <span className="font-bold text-stone-800 truncate">{myBulletins[0].title}</span>
                </div>
                <button
                  onClick={() => setBulletinArchiveOpen(true)}
                  className="text-orange-600 font-bold hover:underline text-[11px] flex-shrink-0"
                >
                  سجل التعميمات ({myBulletins.length}) ←
                </button>
              </div>
            )}

            {/* ==================================================================== */}
            {/* المحطة 2: لوحة القيادة الأسبوعية الموحدة (واضحة من أول نظرة في 3 ثوانٍ) */}
            {/* ==================================================================== */}
            <section className="bg-white rounded-[28px] p-5 sm:p-6 shadow-sm border border-stone-200/80 space-y-5">
              {/* السطر العلوي: الأسبوع الحالي + مبدل الأسابيع المدمج + موعد الاجتماع */}
              <div className="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-stone-100">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-black px-2.5 py-1 rounded-xl bg-stone-900 text-white">
                      {selectedWeek === totalWeeks ? `الأسبوع الحالي (${selectedWeek})` : `الأسبوع ${selectedWeek} (سابق)`}
                    </span>
                    <span className="text-xs font-bold text-stone-500">
                      📅 {getWeekDateRangeLabel(selectedWeek, totalWeeks)}
                    </span>
                    {currentUser.weekOverrides?.[selectedWeek] && (
                      <span className="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-amber-100 text-amber-800">
                        موعد مخصص
                      </span>
                    )}
                  </div>
                  <p className="text-xs text-stone-500 mt-1.5">
                    موعد لقاء الأسبوع: <strong className="text-stone-800">يوم {DAYS_AR[activeSched.meetDay]} الساعة {formatTimeAr(activeSched.meetTime)}</strong> ({activeSched.meetDuration} د)
                    {!isPastWeek && (
                      <button
                        onClick={() => setSettingsModalScope("week")}
                        className="mr-2 text-orange-600 font-bold hover:underline"
                      >
                        • تغيير الموعد
                      </button>
                    )}
                  </p>
                </div>

                {/* شريط تبديل الأسابيع المدمج */}
                <div className="flex items-center gap-1.5 bg-stone-100 p-1 rounded-2xl overflow-x-auto no-scrollbar">
                  {Array.from({ length: totalWeeks }, (_, idx) => {
                    const w = idx + 1;
                    const active = w === selectedWeek;
                    const isCurr = w === totalWeeks;
                    return (
                      <button
                        key={w}
                        onClick={() => setSelectedWeek(w)}
                        className={`px-3 py-1.5 rounded-xl text-xs font-black transition flex-shrink-0 ${
                          active
                            ? "bg-white text-stone-900 shadow-sm"
                            : "text-stone-500 hover:text-stone-800"
                        }`}
                      >
                        {isCurr ? `الحالي (${w})` : `أسبوع ${w}`}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* القلب البصري: 3 بطاقات متوازنة توضح الإنجاز الكلي + الإداري + التربوي */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
                {/* 1. السكور الكلي للأسبوع */}
                <div className="p-4 rounded-2xl bg-stone-50 border border-stone-200/80 flex items-center justify-between">
                  <div>
                    <div className="text-[11px] font-bold text-stone-500">إنجاز الأسبوع ({selectedWeek})</div>
                    <div className="text-3xl font-black text-stone-900 mt-0.5">{weekStats.weekScorePct}%</div>
                    <div className="text-[11px] text-stone-500 mt-1">
                      اكتمل <strong className="text-stone-800">{weekStats.completedCount}</strong> من <strong className="text-stone-800">{weekStats.totalCount}</strong> مهام
                    </div>
                  </div>
                  <div className="text-left">
                    <span className="inline-block text-[11px] font-black px-2.5 py-1 rounded-xl bg-white border border-stone-200 text-stone-700">
                      العام: {metrics.overallScorePct}%
                    </span>
                  </div>
                </div>

                {/* 2. مؤشر المحور الإداري */}
                <div
                  onClick={() => setActivePillar("admin")}
                  className="p-4 rounded-2xl bg-orange-50/50 border border-orange-200/80 cursor-pointer hover:bg-orange-50 transition space-y-2"
                >
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-black text-orange-950">🏛️ المحور الإداري</span>
                    <span className="text-xs font-black text-orange-700">{weekStats.adminDone}/{weekStats.adminTotal}</span>
                  </div>
                  <div className="w-full h-2 rounded-full bg-orange-200/70 overflow-hidden">
                    <div style={{ width: `${weekStats.adminPct}%` }} className="h-full madyan-gradient transition-all duration-300" />
                  </div>
                  <div className="text-[11px] text-stone-600 flex justify-between">
                    <span>اللقاء والمحاضرة</span>
                    <span className="font-bold text-orange-800">{weekStats.adminPct}%</span>
                  </div>
                </div>

                {/* 3. مؤشر المحور التربوي */}
                <div
                  onClick={() => setActivePillar("tarbawi")}
                  className="p-4 rounded-2xl bg-emerald-50/50 border border-emerald-200/80 cursor-pointer hover:bg-emerald-50 transition space-y-2"
                >
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-black text-emerald-950">🌱 المحور التربوي</span>
                    <span className="text-xs font-black text-emerald-700">{weekStats.tarbawiDone}/{weekStats.tarbawiTotal}</span>
                  </div>
                  <div className="w-full h-2 rounded-full bg-emerald-200/70 overflow-hidden">
                    <div style={{ width: `${weekStats.tarbawiPct}%` }} className="h-full tarbawi-gradient transition-all duration-300" />
                  </div>
                  <div className="text-[11px] text-stone-600 flex justify-between">
                    <span>الورد والبناء الذاتي</span>
                    <span className="font-bold text-emerald-800">{weekStats.tarbawiPct}%</span>
                  </div>
                </div>
              </div>

              {/* بوصلة الخطوة التالية الآن (Next Action Compass) */}
              {isPastWeek ? (
                <div className="rounded-2xl bg-amber-50 border border-amber-200 px-4 py-3 text-xs text-amber-900 flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <strong>🔒 أرشيف الأسبوع {selectedWeek}:</strong> هذا الأسبوع انتهى، ويمكنك فقط استدراك <strong>المحاضرة الأسبوعية</strong> إن لم تكن قد اختبرت فيها بعد.
                  </div>
                  <button
                    onClick={() => setSelectedWeek(totalWeeks)}
                    className="px-3 py-1.5 rounded-xl bg-amber-900 text-white font-bold text-[11px]"
                  >
                    العودة للأسبوع الحالي ({totalWeeks}) ↩
                  </button>
                </div>
              ) : nextStepInfo ? (
                <div className="rounded-2xl bg-stone-900 text-white p-4 flex flex-wrap items-center justify-between gap-3">
                  <div className="flex items-center gap-3">
                    <span className="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center text-base">
                      🎯
                    </span>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="text-[11px] font-bold text-orange-300">خطوتك التالية الآن:</span>
                        <span className="text-[10px] px-2 py-0.5 rounded-full bg-white/15 text-white font-bold">
                          {nextStepInfo.pillar === "admin" ? "🏛️ المحور الإداري" : "🌱 المحور التربوي"}
                        </span>
                      </div>
                      <div className="text-sm font-black mt-0.5">{nextStepInfo.title}</div>
                      <div className="text-[11px] text-stone-300">{nextStepInfo.hint}</div>
                    </div>
                  </div>
                  <button
                    onClick={() => {
                      if (nextStepInfo.pillar === "admin") {
                        handleAdminTaskAction(nextStepInfo.key);
                      } else {
                        setActivePillar("tarbawi");
                      }
                    }}
                    className="px-4 py-2 rounded-xl madyan-gradient text-white text-xs font-black shadow-sm hover:opacity-95 transition"
                  >
                    {nextStepInfo.actionLabel}
                  </button>
                </div>
              ) : (
                <div className="rounded-2xl bg-emerald-50 border border-emerald-200 p-4 text-xs text-emerald-900 font-bold flex items-center justify-between">
                  <span>🎉 بارك الله في جهودك! أتممت جميع مهمات المحور الإداري والمحور التربوي لهذا الأسبوع بالكامل.</span>
                  <span className="text-sm font-black text-emerald-700">100% ✓</span>
                </div>
              )}
            </section>

            {/* ==================================================================== */}
            {/* المحطة 3: مبدّل المحورين الواضح (الإداري | التربوي | العرض الشامل) */}
            {/* ==================================================================== */}
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div className="inline-flex p-1.5 rounded-2xl bg-white border border-stone-200/90 shadow-sm gap-1">
                <button
                  onClick={() => setActivePillar("all")}
                  className={`px-4 py-2 rounded-xl text-xs font-black transition ${
                    activePillar === "all"
                      ? "bg-stone-900 text-white shadow-sm"
                      : "text-stone-600 hover:bg-stone-100"
                  }`}
                >
                  ⊞ الخريطة الكاملة ({weekStats.completedCount}/{weekStats.totalCount})
                </button>
                <button
                  onClick={() => setActivePillar("admin")}
                  className={`px-4 py-2 rounded-xl text-xs font-black transition ${
                    activePillar === "admin"
                      ? "madyan-gradient text-white shadow-sm"
                      : "text-stone-600 hover:bg-orange-50"
                  }`}
                >
                  🏛️ المحور الإداري ({weekStats.adminDone}/{weekStats.adminTotal})
                </button>
                <button
                  onClick={() => setActivePillar("tarbawi")}
                  className={`px-4 py-2 rounded-xl text-xs font-black transition ${
                    activePillar === "tarbawi"
                      ? "tarbawi-gradient text-white shadow-sm"
                      : "text-stone-600 hover:bg-emerald-50"
                  }`}
                >
                  🌱 المحور التربوي ({weekStats.tarbawiDone}/{weekStats.tarbawiTotal})
                </button>
              </div>

              <span className="text-[11px] font-bold text-stone-400 hidden sm:inline">
                اضغط «إنجاز» أمام أي مهمة لرصدها فوراً
              </span>
            </div>

            <div className={activePillar === "all" ? "grid grid-cols-1 lg:grid-cols-2 gap-6 items-start" : "space-y-4"}>
            {/* ==================================================================== */}
            {/* قسم المحور الإداري (Administrative Pillar Tasks) */}
            {/* ==================================================================== */}
            {(activePillar === "all" || activePillar === "admin") && (
              <section className="space-y-3">
                <div className="flex items-center justify-between px-1">
                  <div className="flex items-center gap-2">
                    <span className="w-7 h-7 rounded-xl madyan-gradient text-white flex items-center justify-center text-xs font-black">🏛️</span>
                    <div>
                      <h2 className="text-base font-black text-stone-900">أولاً: مهمات المحور الإداري</h2>
                      <p className="text-[11px] text-stone-500">العادات المؤسسية الأربع المرتبطة باجتماعك الأسبوعي</p>
                    </div>
                  </div>
                  <span className="text-xs font-black text-orange-700 bg-orange-50 px-3 py-1 rounded-full border border-orange-200">
                    {weekStats.adminDone} من {weekStats.adminTotal} مكتمل
                  </span>
                </div>

                <div className="grid grid-cols-1 gap-3">
                  {['lecture', 'agenda', 'attendance', 'minutes'].map((taskKey, idx) => {
                    const def = db.systemConfig.taskDefinitions[taskKey];
                    const sched = computedSched[taskKey];
                    const rec = weekRecord[taskKey] || { status: "pending" };
                    const status = rec.status;
