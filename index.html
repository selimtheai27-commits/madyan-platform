    function calculateWeeksSinceJoin(joinedAtTimestamp) {
      if (!joinedAtTimestamp) return 1;
      const diffMs = Math.max(0, Date.now() - joinedAtTimestamp);
      return Math.max(1, Math.ceil(diffMs / MS_PER_WEEK));
    }

    function formatDateAr(timestamp) {
      const d = new Date(timestamp);
      return `${d.getDate()} ${MONTHS_AR[d.getMonth()]} ${d.getFullYear()}`;
    }

    function getWeekDateRangeLabel(weekIndex, totalWeeks) {
      const today = new Date();
      const weeksAgo = totalWeeks - weekIndex;
      const endOfWeek = new Date(today);
      endOfWeek.setDate(today.getDate() - (weeksAgo * 7));
      const startOfWeek = new Date(endOfWeek);
      startOfWeek.setDate(endOfWeek.getDate() - 6);

      const sDay = startOfWeek.getDate();
      const eDay = endOfWeek.getDate();
      const sMonth = MONTHS_AR[startOfWeek.getMonth()];
      const eMonth = MONTHS_AR[endOfWeek.getMonth()];
      return sMonth === eMonth ? `${sDay} - ${eDay} ${sMonth}` : `${sDay} ${sMonth} - ${eDay} ${eMonth}`;
    }

    function formatTimeAr(timeStr = "19:00") {
      const [hStr, mStr] = timeStr.split(':');
      let h = parseInt(hStr, 10);
      const period = h >= 12 ? 'مساءً' : 'صباحاً';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return `${String(h12).padStart(2, '0')}:${mStr} ${period}`;
    }

    function computeWeekSchedule(sched, taskDefs) {
      const meetDay = parseInt(sched.meetDay, 10);
      const duration = parseInt(sched.meetDuration, 10);
      const [h, m] = (sched.meetTime || "19:00").split(':').map(Number);
      const agendaDay = (meetDay + 6) % 7;

      const totalMinutes = h * 60 + m + duration;
      const endDayOffset = Math.floor(totalMinutes / (24 * 60));
      const endH = Math.floor((totalMinutes % (24 * 60)) / 60);
      const endM = totalMinutes % 60;
      const endTimeStr = `${String(endH).padStart(2, '0')}:${String(endM).padStart(2, '0')}`;
      const minutesDay = (meetDay + endDayOffset + 1) % 7;

      return {
        lecture: {
          dayName: 'طوال الأسبوع',
          timeLabel: 'مرن حسب وقتك',
          durationMinutes: taskDefs.lecture.durationMinutes,
          badge: taskDefs.lecture.badge
        },
        agenda: {
          dayName: DAYS_AR[agendaDay],
          timeLabel: `قبل ${formatTimeAr(sched.meetTime)}`,
          durationMinutes: taskDefs.agenda.durationMinutes,
          badge: taskDefs.agenda.badge
        },
        attendance: {
          dayName: DAYS_AR[meetDay],
          timeLabel: `${formatTimeAr(sched.meetTime)} - ${formatTimeAr(endTimeStr)}`,
          durationMinutes: duration || taskDefs.attendance.durationMinutes,
          badge: taskDefs.attendance.badge
        },
        minutes: {
          dayName: DAYS_AR[minutesDay],
          timeLabel: `حتى ${formatTimeAr(endTimeStr)}`,
          durationMinutes: taskDefs.minutes.durationMinutes,
          badge: taskDefs.minutes.badge
        }
      };
    }

    function isCadreDepartmentEnabled(user, deptId) {
      if (!user || user.roleType !== "cadre") return true;
      const assigned = Array.isArray(user.assignedDepartments) && user.assignedDepartments.length > 0
        ? user.assignedDepartments
        : ["dept_hr", "dept_tarbawi"];
      return assigned.includes(deptId);
    }

    // جلب المهمات التربوية المفعلة والموجهة لهذا الكادر تحديداً (عامة أو لوحدته أو مخصصة له)
    function getApplicableTarbawiTasks(user, systemConfig) {
      if (user && user.roleType === "cadre" && !isCadreDepartmentEnabled(user, "dept_tarbawi")) {
        return [];
      }
      const list = Array.isArray(systemConfig?.tarbawiTaskDefinitions)
        ? systemConfig.tarbawiTaskDefinitions
        : DEFAULT_TARBAWI_TASKS;
      return list.filter(t => {
        if (t.enabled === false) return false;
        if (!user || user.roleType !== "cadre") return true;
        if (!t.targetScope || t.targetScope === "all") return true;
        if (t.targetScope === "unit") return t.targetUnit === user.unit;
        if (t.targetScope === "custom") return Array.isArray(t.targetUserIds) && t.targetUserIds.includes(user.id);
        return true;
      });
    }

    function getTaskScorePoints(taskObj, governanceRules = DEFAULT_GOVERNANCE_RULES) {
      const targetDays = Math.max(1, parseInt(governanceRules?.dailyTaskTargetDays, 10) || 5);
      const latePct = Math.max(0, Math.min(100, parseInt(governanceRules?.latePointsPct, 10) ?? 50));
      if (!taskObj || taskObj.status === 'pending') {
        // لو مهمة تتبع يومي وفيها أيام منجزة جزئياً نعطي نقاطاً تناسبية
        if (Array.isArray(taskObj?.daysCompleted) && taskObj.daysCompleted.length > 0) {
          return Math.min(90, Math.round((taskObj.daysCompleted.length / targetDays) * 100));
        }
        return 0;
      }
      if (taskObj.status === 'on_time') return 100;
      if (taskObj.status === 'late') return latePct;
      return 0;
    }

    function computeCadreMetrics(user, systemConfig = INITIAL_STATE.systemConfig) {
      const rules = systemConfig?.governanceRules || DEFAULT_GOVERNANCE_RULES;
      const totalWeeks = calculateWeeksSinceJoin(user.joinedAt);
      const hrEnabled = isCadreDepartmentEnabled(user, "dept_hr");
      const tarbawiDefs = getApplicableTarbawiTasks(user, systemConfig);
      const adminKeys = hrEnabled ? ['lecture', 'agenda', 'attendance', 'minutes'] : [];

      let adminPossible = totalWeeks * adminKeys.length * 100;
      let adminEarned = 0;
      let tarbawiPossible = totalWeeks * tarbawiDefs.length * 100;
      let tarbawiEarned = 0;

      let onTimeCount = 0;
      let lateCount = 0;
      let pendingCount = 0;
      let quizScores = [];

      const byTaskKey = {
        lecture: { onTime: 0, late: 0, pending: 0 },
        agenda: { onTime: 0, late: 0, pending: 0 },
        attendance: { onTime: 0, late: 0, pending: 0 },
        minutes: { onTime: 0, late: 0, pending: 0 }
      };

      const byTarbawiKey = {};
      tarbawiDefs.forEach(td => {
        byTarbawiKey[td.id] = { onTime: 0, late: 0, pending: 0 };
      });

      for (let w = 1; w <= totalWeeks; w++) {
        const wRec = (user.tasksRecord && user.tasksRecord[w]) || {};

        adminKeys.forEach(k => {
          const t = wRec[k] || { status: 'pending' };
          adminEarned += getTaskScorePoints(t, rules);
          if (t.status === 'on_time') {
            onTimeCount++;
            byTaskKey[k].onTime++;
          } else if (t.status === 'late') {
            lateCount++;
            byTaskKey[k].late++;
          } else {
            pendingCount++;
            byTaskKey[k].pending++;
          }
          if (k === 'lecture' && t.quizSubmission) {
            const qPct = Math.round((t.quizSubmission.score / t.quizSubmission.total) * 100);
            quizScores.push(qPct);
          }
        });

        tarbawiDefs.forEach(td => {
          const t = wRec[td.id] || { status: 'pending' };
          tarbawiEarned += getTaskScorePoints(t, rules);
          if (t.status === 'on_time') {
            onTimeCount++;
            byTarbawiKey[td.id].onTime++;
          } else if (t.status === 'late') {
            lateCount++;
            byTarbawiKey[td.id].late++;
          } else {
            pendingCount++;
            byTarbawiKey[td.id].pending++;
          }
        });
      }

      const adminScorePct = adminPossible > 0 ? Math.round((adminEarned / adminPossible) * 100) : 0;
      const tarbawiScorePct = tarbawiDefs.length > 0 && tarbawiPossible > 0
        ? Math.round((tarbawiEarned / tarbawiPossible) * 100)
        : 0;

      const totalPossible = adminPossible + tarbawiPossible;
      const totalEarned = adminEarned + tarbawiEarned;
      const overallScorePct = totalPossible > 0 ? Math.round((totalEarned / totalPossible) * 100) : 0;
      const avgQuizPct = quizScores.length > 0 ? Math.round(quizScores.reduce((a, b) => a + b, 0) / quizScores.length) : null;

      return {
        totalWeeks,
        overallScorePct,
        adminScorePct,
        tarbawiScorePct,
        onTimeCount,
        lateCount,
        pendingCount,
        totalTasksCount: totalWeeks * (adminKeys.length + tarbawiDefs.length),
        avgQuizPct,
        byTaskKey,
        byTarbawiKey
      };
    }

    function safeJsonParse(str) {

    function isValidHttpsUrl(rawUrl) {
      try {
        const u = new URL(String(rawUrl || "").trim());
        return u.protocol === "https:";
      } catch (e) {
        return false;
      }
    }

    function sanitizeMediaUrl(rawUrl) {
      if (!rawUrl || typeof rawUrl !== "string") return "";
      try {
        const u = new URL(rawUrl.trim(), window.location.origin);
        return (u.protocol === "https:" || u.protocol === "http:") ? u.href : "";
      } catch (e) {
        return "";
      }
    }

    function getYoutubeEmbedUrl(url) {
      const safeUrl = sanitizeMediaUrl(url);
      if (!safeUrl) return "";
      const driveMatch = safeUrl.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) {
        return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
      }
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = safeUrl.match(regExp);
      return (match && match[2].length === 11)
        ? `https://www.youtube.com/embed/${match[2]}?rel=0&modestbranding=1&playsinline=1`
        : safeUrl;
    }

    function isIframeVideo(videoType, url) {
      if (videoType === "youtube" || videoType === "gdrive") return true;
      if (!url) return false;
      return url.includes("youtube.com") || url.includes("youtu.be") || url.includes("drive.google.com");

    function normalizeDb(raw) {
      if (!raw || typeof raw !== "object") return INITIAL_STATE;

        ? raw.systemConfig.tarbawiTaskDefinitions

      const rawDepartments = (Array.isArray(raw.systemConfig?.departments) && raw.systemConfig.departments.length > 0
        ? raw.systemConfig.departments

        const seedDept = DEFAULT_DEPARTMENTS.find(sd => sd.id === d.id);
        return {
          ...(seedDept || {}),
          ...d,
          allowedTaskTypes: Array.isArray(d.allowedTaskTypes) && d.allowedTaskTypes.length > 0
            ? d.allowedTaskTypes
            : (seedDept?.allowedTaskTypes || ["lecture_quiz", "meeting", "practical"]),
          maxTotalTasks: d.maxTotalTasks ?? (seedDept?.maxTotalTasks || 6),
          maxPerTypePerCadre: d.maxPerTypePerCadre ?? (seedDept?.maxPerTypePerCadre || 2)
        };
      });

      const rawUnits = (Array.isArray(raw.systemConfig?.organizationalUnits) && raw.systemConfig.organizationalUnits.length > 0
        ? raw.systemConfig.organizationalUnits
        : DEFAULT_UNITS).map(u => {
        const seedU = DEFAULT_UNITS.find(su => su.id === u.id);
        return {
          ...(seedU || {}),
          ...u,
          inviteCode: u.inviteCode || seedU?.inviteCode || ("MAYDAN-" + String(u.id || "UNIT").slice(-4).toUpperCase())
        };
      });

      const rawTeams = Array.isArray(raw.systemConfig?.crossFunctionalTeams) && raw.systemConfig.crossFunctionalTeams.length > 0
        ? raw.systemConfig.crossFunctionalTeams
        : DEFAULT_TEAMS;

      const safeGovernanceRules = {
        ...DEFAULT_GOVERNANCE_RULES,
        ...(raw.systemConfig?.governanceRules || {})
      };

      const safeSystemConfig = {
        ...INITIAL_STATE.systemConfig,
        ...(raw.systemConfig || {}),
        departments: rawDepartments,
        organizationalUnits: rawUnits,
        crossFunctionalTeams: rawTeams,
        governanceRules: safeGovernanceRules,
        availableCurriculumWeeks: Array.isArray(raw.systemConfig?.availableCurriculumWeeks)
          ? raw.systemConfig.availableCurriculumWeeks
          : INITIAL_STATE.systemConfig.availableCurriculumWeeks,
        tarbawiWeeklyFocus: {
          ...INITIAL_STATE.systemConfig.tarbawiWeeklyFocus,
          ...(raw.systemConfig?.tarbawiWeeklyFocus || {})
        },
        quotes: Array.isArray(raw.systemConfig?.quotes) && raw.systemConfig.quotes.length > 0
          ? raw.systemConfig.quotes
          : INITIAL_STATE.systemConfig.quotes,
        taskDefinitions: {
          ...INITIAL_STATE.systemConfig.taskDefinitions,
          ...(raw.systemConfig?.taskDefinitions || {})
        },
        tarbawiTaskDefinitions: rawTarbawiDefs,
        deptTasks: (() => {
          const base = (raw.systemConfig?.deptTasks && typeof raw.systemConfig.deptTasks === "object")
            ? { ...raw.systemConfig.deptTasks }
            : mxBuildDefaultDeptTasks(raw.systemConfig || {});
          rawDepartments.forEach(d => { if (!Array.isArray(base[d.id])) base[d.id] = []; });
          return base;
        })(),
        deptWeights: raw.systemConfig?.deptWeights || {}
      };

      const safeBulletins = Array.isArray(raw.bulletins) ? [...raw.bulletins] : [...INITIAL_STATE.bulletins];
      const safeCurriculums = {
        ...INITIAL_STATE.weeklyCurriculums,
        ...(raw.weeklyCurriculums || {})
      };

      const rawUsers = Array.isArray(raw.users) && raw.users.length > 0 ? raw.users : INITIAL_STATE.users;
      // التأكد من وجود الحسابات الأساسية للمستويات الأربعة (مدير المنصة، التنفيذي، الموارد البشرية، التربوية)
      let mergedUsers = [...rawUsers];
      // ترقية بيانات التجربة (الإصدار 3): إضافة الأعضاء التجريبيين الثلاثين واستكمال حقول الحسابات الأساسية
      const needsSeedV3 = (raw.seedVersion || 0) < 3;
      if (needsSeedV3) {
        mergedUsers = mergedUsers.map(u => {
          const seedUser = INITIAL_STATE.users.find(su => su.id === u.id);
          return seedUser ? { ...seedUser, ...u, assignedDepartments: u.assignedDepartments || seedUser.assignedDepartments, joinedAt: u.joinedAt || seedUser.joinedAt, tasksRecord: (u.tasksRecord && Object.keys(u.tasksRecord).length) ? u.tasksRecord : seedUser.tasksRecord } : u;
        });
        INITIAL_STATE.users.forEach(su => { if (!mergedUsers.some(u => u.id === su.id)) mergedUsers.push(su); });
      }
      ["u_platform", "u_exec", "u_admin", "u_tarbawi"].forEach(seedId => {
        if (!mergedUsers.some(u => u.id === seedId)) {
          const seedUser = INITIAL_STATE.users.find(su => su.id === seedId);
          if (seedUser) mergedUsers.unshift(seedUser);
        }
      });

      const ALLOWED_ROLES = ["platform_admin", "executive", "operational_admin", "admin", "cadre"];
      const safeUsers = mergedUsers.filter(u => u && typeof u === "object").map(u => {
        const cleanRole = ALLOWED_ROLES.includes(u.roleType) ? u.roleType : "cadre";
        const baseU = {
          ...u,
          id: String(u.id || ("u_" + Date.now())),
          username: String(u.username || ""),
          name: String(u.name || ""),
          roleType: cleanRole
        };
        // تحويل الحسابات القديمة ذات النوع admin إلى operational_admin مع ربطها بإدارة الموارد البشرية
        if (cleanRole === "admin") {
          return {
            ...baseU,
            roleType: "operational_admin",
            departmentId: baseU.departmentId || "dept_hr"
          };
        }
        if (cleanRole === "operational_admin") {
          return {
            ...baseU,
            departmentId: baseU.departmentId || "dept_hr"
          };
        }
        if (cleanRole !== "cadre") return baseU;

        const seedMatch = INITIAL_STATE.users.find(su => su.id === u.id);
        const rawRec = u.tasksRecord || {};
        const mergedRec = { ...rawRec };

        if (seedMatch && seedMatch.tasksRecord) {
          Object.keys(seedMatch.tasksRecord).forEach(wKey => {
            mergedRec[wKey] = {
              ...(seedMatch.tasksRecord[wKey] || {}),
              ...(rawRec[wKey] || {})
            };
          });
        }

        return {
          ...u,
          joinedAt: u.joinedAt || Date.now(),
          assignedDepartments: Array.isArray(u.assignedDepartments)
            ? u.assignedDepartments
            : ["dept_hr", "dept_tarbawi"],
          crossTeams: Array.isArray(u.crossTeams) ? u.crossTeams : [],
          defaultSchedule: {
            meetDay: u.defaultSchedule?.meetDay ?? 2,
            meetTime: u.defaultSchedule?.meetTime || "19:00",
            meetDuration: u.defaultSchedule?.meetDuration || 90
          },
          weekOverrides: u.weekOverrides || {},
          tasksRecord: mergedRec
        };
      });

      if (needsSeedV3) {
        // إضافة الوحدات التجريبية الجديدة وقادتها
        const unitsNow = [...safeSystemConfig.organizationalUnits];
        DEFAULT_UNITS.forEach(du => {
          const idx = unitsNow.findIndex(x => x.id === du.id);
          if (idx === -1) unitsNow.push(du);
          else if (!unitsNow[idx].leaderUserId && du.leaderUserId) unitsNow[idx] = { ...unitsNow[idx], leaderUserId: du.leaderUserId };
        });
        safeSystemConfig.organizationalUnits = unitsNow;
        INITIAL_STATE.bulletins.forEach(sb => { if (!safeBulletins.some(b => b.id === sb.id)) safeBulletins.push(sb); });
      }

      return {
        seedVersion: 3,
        directives: Array.isArray(raw.directives) ? raw.directives : [],
        systemConfig: safeSystemConfig,
        bulletins: safeBulletins,
        weeklyCurriculums: safeCurriculums,
        users: safeUsers
      };
    }

              initialPullDoneRef.current = true;
              setLastSyncAt(new Date().toLocaleTimeString("ar-EG"));

          initSync();

          channel = client

    // ============================================================================
    // 5. LOGIN SCREEN (بوابة الدخول للمستويات الأربعة في منصة ميدان)
    // ============================================================================
    // لوحة حسابات التجربة (منسدلة ومغلقة افتراضياً) — مكان واحد يسهل حذفه
    function DemoAccountsPanel({ db, users, onPick }) {
      const [open, setOpen] = useState(false);
      const cadres = users.filter(u => u.roleType === "cadre");
      let ranked = [];
      try {
        ranked = cadres.map(u => ({ u, pct: mxWeekSummary(db, u, mxCurrentWeek(u)).pct })).sort((a, b) => b.pct - a.pct);
      } catch (e) { ranked = cadres.map(u => ({ u, pct: null })); }
      const samples = ranked.length > 4 ? [...ranked.slice(0, 2), ...ranked.slice(-2)] : ranked;

      const Row = ({ title, sub, onClick, tag }) => (
        <button type="button" onClick={onClick} className="w-full flex items-center justify-between gap-3 px-4 py-3 rounded-2xl hover:bg-[#F4F2EE] text-right transition">
          <span className="min-w-0">
            <span className="block text-[14px] text-stone-900 truncate">{title}</span>
            {sub && <span className="block text-[12px] text-stone-400 truncate">{sub}</span>}
          </span>
          {tag ? <span className="text-[12px] text-stone-500 shrink-0">{tag}</span> : <PA2Icon name="chevron" className="w-4 h-4 text-stone-300 shrink-0" />}
        </button>
      );
      const Group = ({ label, children }) => (
        <div>
          <div className="text-[12px] text-stone-400 px-4 pt-3 pb-1">{label}</div>
          {children}
        </div>
      );
      return (
        <div className="mt-4 w-full max-w-[420px]">
          <button type="button" onClick={() => setOpen(v => !v)} className="w-full h-12 px-5 rounded-full bg-white/70 hover:bg-white text-[14px] text-stone-600 flex items-center justify-between transition">
            <span className="inline-flex items-center gap-2"><PA2Icon name="key" className="w-4 h-4" />حسابات التجربة</span>
            <PA2Icon name="chevron" className={`w-4 h-4 transition ${open ? "rotate-90" : "-rotate-90"}`} />
          </button>
          {open && (
            <div className="mt-2 bg-white rounded-[28px] p-2 pb-3">
              <Group label="إدارة المنصة">
                <div className="grid grid-cols-2 gap-2 px-2">
                  <button type="button" onClick={() => onPick("sysadmin", "v2")} className="h-11 rounded-2xl bg-stone-900 text-white text-[13px] font-semibold">نسخة كلاود</button>
                  <button type="button" onClick={() => onPick("sysadmin", "v1")} className="h-11 rounded-2xl bg-[#F4F2EE] text-stone-700 text-[13px]">نسخة جيميناي</button>
                </div>
              </Group>
              <Group label="القيادة والإدارات">
                <Row title="الإدارة التنفيذية" sub={pa2Short(byUser("exec")?.name)} onClick={() => onPick("exec")} />
                <Row title="الموارد البشرية" sub={`${pa2Short(byUser("admin")?.name)} · واجهة مزدوجة`} onClick={() => onPick("admin")} />
                <Row title="الإدارة التربوية" sub={pa2Short(byUser("tarbawi")?.name)} onClick={() => onPick("tarbawi")} />
              </Group>
              <Group label="أعضاء (الأعلى والأقل التزاماً)">
                {samples.map(({ u, pct }) => <Row key={u.id} title={pa2Short(u.name)} sub={u.unit} tag={pct === null ? null : `${pct}%`} onClick={() => onPick(u.username)} />)}
              </Group>
              <div className="px-2 pt-2">
                <select defaultValue="" onChange={e => e.target.value && onPick(e.target.value)} className={pa2InputCls}>
                  <option value="">كل الأعضاء ({cadres.length})…</option>
                  {cadres.map(u => <option key={u.id} value={u.username}>{pa2Short(u.name)} — {u.unit}</option>)}
                </select>
              </div>
            </div>
          )}
        </div>
      );
    }

    function LoginView({ db, users, onLoginSuccess }) {
      const [username, setUsername] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");

      const findMatchingUser = (uInput, pInput) => {
        const cleanU = uInput.trim().toLowerCase();
        const cleanP = pInput.trim();
        return users.find(u => {
          const uname = (u.username || "").toLowerCase();
          if ((cleanU === "madyan" || cleanU === "maydan") && (uname === "madyan" || uname === "maydan")) return u.password === cleanP;
          return uname === cleanU && u.password === cleanP;
        });
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const found = findMatchingUser(username, password);
        if (!found) { setError("اسم المستخدم أو كلمة المرور غير صحيحة"); return; }
        setError("");
        onLoginSuccess(found);
      };

      // دخول تجريبي مباشر (يتجاوز كلمة المرور حتى لو تغيّرت أثناء الاختبار)
      const quickFill = (u, variant) => {
        const cleanU = u.trim().toLowerCase();
        const found = users.find(x => {
          const uname = (x.username || "").toLowerCase();
          if (cleanU === "sysadmin") return uname === "sysadmin" || x.roleType === "platform_admin";
          return uname === cleanU;
        });
        if (found) onLoginSuccess(found, variant);
      };

      return (
        <div dir="rtl" className="min-h-screen flex flex-col items-center justify-center px-4 py-10 bg-[#F4F2EE]">
          <div className="bg-white rounded-[32px] w-full max-w-[420px] p-8 sm:p-10">
            <div className="text-[13px] font-medium text-orange-700">منصة المتابعة</div>
            <h1 className="text-[34px] font-bold text-stone-900 leading-tight mt-1">ميدان</h1>
            <p className="text-[15px] text-stone-500 mt-2 leading-relaxed">مهماتك، وتعميمات الإدارة، ونسبة إنجازك في مكان واحد.</p>

            <form onSubmit={handleSubmit} className="space-y-4 mt-8">
              <div>
                <PA2Label>اسم المستخدم</PA2Label>
                <input type="text" value={username} onChange={e => setUsername(e.target.value)} className={pa2InputCls} dir="ltr" autoComplete="username" required />
              </div>
              <div>
                <PA2Label>كلمة المرور</PA2Label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className={pa2InputCls} dir="ltr" autoComplete="current-password" required />
              </div>
              {error && <div className="rounded-2xl bg-rose-50 px-4 py-3 text-[14px] text-rose-700">{error}</div>}
              <button type="submit" className="w-full h-12 rounded-full bg-stone-900 text-white text-[15px] font-semibold hover:bg-stone-800 transition">تسجيل الدخول</button>
            </form>
            <p className="text-[13px] text-stone-400 mt-6 text-center">الحسابات تُنشأ من الموارد البشرية أو إدارة المنصة.</p>
          </div>

          {DEMO_MODE && <DemoAccountsPanel db={db} users={users} onPick={quickFill} />}
        </div>
      );
    }

    // ============================================================================
    // 6. CADRE PORTAL COMPONENT (رحلة عين مرتبة + المحور الإداري والمحور التربوي)
    // ============================================================================
    function CadrePortal({ db, currentUser, updateUserRecord, isUsernameTaken, onAcknowledgeBulletin, onLogout, showToast }) {
      const totalWeeks = useMemo(() => calculateWeeksSinceJoin(currentUser.joinedAt), [currentUser.joinedAt]);
      const [selectedWeek, setSelectedWeek] = useState(totalWeeks);
      const [activePillar, setActivePillar] = useState("all"); // 'all' | 'admin' | 'tarbawi'
      const [expandedHelpKey, setExpandedHelpKey] = useState(null);
      const [showOnboarding, setShowOnboarding] = useState(!currentUser.onboarded);
      const [settingsModalScope, setSettingsModalScope] = useState(null);
      const [lectureModalOpen, setLectureModalOpen] = useState(false);
      const [noteModalTaskKey, setNoteModalTaskKey] = useState(null);
      const [bulletinArchiveOpen, setBulletinArchiveOpen] = useState(false);

      const tarbawiTasks = useMemo(
        () => getApplicableTarbawiTasks(currentUser, db.systemConfig),
        [currentUser, db.systemConfig]
      );

      useEffect(() => {
        let needsInit = false;
        const currentRec = currentUser.tasksRecord || {};
        const updatedRec = { ...currentRec };
        for (let w = 1; w <= totalWeeks; w++) {
          if (!updatedRec[w]) {
            needsInit = true;
            updatedRec[w] = {
              lecture: { status: "pending" },
              agenda: { status: "pending" },
              attendance: { status: "pending" },
              minutes: { status: "pending" }
            };
          }
        }
        if (needsInit) {
          updateUserRecord(currentUser.id, u => ({ ...u, tasksRecord: updatedRec }));
        }
      }, [totalWeeks, currentUser.id]);

      const myBulletins = useMemo(() => {
        const list = db.bulletins || [];
        return list.filter(b => b.targetType === "all" || (b.recipientIds || []).includes(currentUser.id));
      }, [db.bulletins, currentUser.id]);

      const unreadBulletins = useMemo(() => {
        return myBulletins.filter(b => !(b.acknowledgedBy && b.acknowledgedBy[currentUser.id]));
      }, [myBulletins, currentUser.id]);

      const isPastWeek = selectedWeek < totalWeeks;
      const activeSched = (currentUser.weekOverrides && currentUser.weekOverrides[selectedWeek]) || currentUser.defaultSchedule;
      const computedSched = computeWeekSchedule(activeSched, db.systemConfig.taskDefinitions);
      const weekRecord = (currentUser.tasksRecord && currentUser.tasksRecord[selectedWeek]) || {};

      const metrics = useMemo(() => computeCadreMetrics(currentUser, db.systemConfig), [currentUser, db.systemConfig]);
      const activeCurriculum = db.weeklyCurriculums[selectedWeek] || db.weeklyCurriculums.default;
      const randomQuote = db.systemConfig.quotes[selectedWeek % Math.max(1, db.systemConfig.quotes.length)] || db.systemConfig.quotes[0];
      const tarbawiFocus = db.systemConfig.tarbawiWeeklyFocus || INITIAL_STATE.systemConfig.tarbawiWeeklyFocus;

      // حساب إحصائيات الأسبوع المحدد للمحور الإداري والمحور التربوي
      const weekStats = useMemo(() => {
        const adminKeys = ['lecture', 'agenda', 'attendance', 'minutes'];
        let adminDone = 0;
        let adminPoints = 0;
        adminKeys.forEach(k => {
          const st = weekRecord[k]?.status || 'pending';
          if (st !== 'pending') adminDone++;
          adminPoints += getTaskScorePoints(weekRecord[k]);
        });

        let tarbawiDone = 0;
        let tarbawiPoints = 0;
        tarbawiTasks.forEach(t => {
          const rec = weekRecord[t.id] || { status: 'pending' };
          if (rec.status && rec.status !== 'pending') tarbawiDone++;
          tarbawiPoints += getTaskScorePoints(rec);
        });

        const adminPct = Math.round((adminPoints / (adminKeys.length * 100)) * 100);
        const tarbawiPct = tarbawiTasks.length > 0
          ? Math.round((tarbawiPoints / (tarbawiTasks.length * 100)) * 100)
          : 0;
        const totalCount = adminKeys.length + tarbawiTasks.length;
        const completedCount = adminDone + tarbawiDone;
        const totalPossible = totalCount * 100;
        const weekScorePct = totalPossible > 0 ? Math.round(((adminPoints + tarbawiPoints) / totalPossible) * 100) : 0;

        return {
          adminDone,
          adminTotal: adminKeys.length,
          adminPct,
          tarbawiDone,
          tarbawiTotal: tarbawiTasks.length,
          tarbawiPct,
          completedCount,
          totalCount,
          weekScorePct
        };
      }, [weekRecord, tarbawiTasks]);

      // تحديد «الخطوة التالية الآن» لتوجيه عين الكادر فوراً دون تشتت
      const nextStepInfo = useMemo(() => {
        const adminOrder = ['lecture', 'agenda', 'attendance', 'minutes'];
        for (const k of adminOrder) {
          const st = weekRecord[k]?.status || 'pending';
          if (st === 'pending') {
            if (isPastWeek && k !== 'lecture') continue;
            const def = db.systemConfig.taskDefinitions[k];
            const sc = computedSched[k];
            return {
              pillar: "admin",
              key: k,
              title: def.title,
              hint: `${sc.dayName} • ${sc.timeLabel}`,
              actionLabel: k === "lecture" ? "فتح المحاضرة والاختبار ▶" : "تسجيل الإنجاز الآن ✓"
            };
          }
        }
        if (!isPastWeek) {
          for (const t of tarbawiTasks) {
            const st = weekRecord[t.id]?.status || 'pending';
            if (st === 'pending') {
              return {
                pillar: "tarbawi",
                key: t.id,
                title: t.title,
                hint: t.subtitle,
                actionLabel: t.trackType === "daily_days" ? "تسجيل ورد اليوم 📖" : "تأكيد الإنجاز ✓"
              };
            }
          }
        }
        return null;
      }, [weekRecord, tarbawiTasks, isPastWeek, db.systemConfig.taskDefinitions, computedSched]);

      const handleAdminTaskAction = (taskKey) => {
        if (taskKey === "lecture") {
          setLectureModalOpen(true);
          return;
        }
        if (isPastWeek) {
          showToast("🔒 لا يمكن تعديل حالة هذه المهمة لأن الأسبوع قد انتهى بالفعل.");
          return;
        }

        const currentStatus = weekRecord[taskKey]?.status || "pending";
        const nextStatus = currentStatus === "pending" ? "on_time" : "pending";
        const now = new Date();
        const timeFormatted = formatTimeAr(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);

        updateUserRecord(currentUser.id, u => ({
          ...u,
          tasksRecord: {
            ...u.tasksRecord,
            [selectedWeek]: {
              ...(u.tasksRecord?.[selectedWeek] || {}),
              [taskKey]: {
                ...(u.tasksRecord?.[selectedWeek]?.[taskKey] || {}),
                status: nextStatus,
                completedAt: nextStatus === "on_time" ? `اليوم ${timeFormatted}` : null
              }
            }
          }
        }));
      };

      const handleTarbawiTaskToggle = (taskDef) => {
        if (isPastWeek) {
          showToast("🔒 الأسبوع منتهٍ ولا يمكن تعديل مهام الأسابيع السابقة.");
          return;
        }
        const currentRec = weekRecord[taskDef.id] || { status: "pending", daysCompleted: [] };
        const nextStatus = currentRec.status === "on_time" ? "pending" : "on_time";
        const now = new Date();
        const timeFormatted = formatTimeAr(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);

        updateUserRecord(currentUser.id, u => ({
          ...u,
          tasksRecord: {
            ...u.tasksRecord,
            [selectedWeek]: {
              ...(u.tasksRecord?.[selectedWeek] || {}),
              [taskDef.id]: {
                ...currentRec,
                status: nextStatus,
                completedAt: nextStatus === "on_time" ? `اليوم ${timeFormatted}` : null
              }
            }
          }
        }));

        if (nextStatus === "on_time") {
          showToast(`تم تسجيل إنجاز «${taskDef.title}» في المحور التربوي 🌱`);
        }
      };

      const handleTarbawiDayToggle = (taskDef, dayIdx) => {
        if (isPastWeek) {
          showToast("🔒 الأسبوع منتهٍ ولا يمكن تعديل سجل الأيام السابقة.");
          return;
        }
        const currentRec = weekRecord[taskDef.id] || { status: "pending", daysCompleted: [] };
        const prevDays = Array.isArray(currentRec.daysCompleted) ? currentRec.daysCompleted : [];
        const exists = prevDays.includes(dayIdx);
        const nextDays = exists ? prevDays.filter(d => d !== dayIdx) : [...prevDays, dayIdx].sort();
        const targetDays = Number(taskDef.targetDays) || 5;
        const reachedTarget = nextDays.length >= targetDays;
        const now = new Date();
        const timeFormatted = formatTimeAr(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);

        updateUserRecord(currentUser.id, u => ({
          ...u,
          tasksRecord: {
            ...u.tasksRecord,
            [selectedWeek]: {
              ...(u.tasksRecord?.[selectedWeek] || {}),
              [taskDef.id]: {
                ...currentRec,
                daysCompleted: nextDays,
                status: reachedTarget ? "on_time" : "pending",
                completedAt: reachedTarget ? `أتمّ ${nextDays.length} أيام (${timeFormatted})` : null
              }
            }
          }
        }));
      };

      const getCategoryBadgeStyle = (cat) => {
        switch (cat) {
          case "توجيه عاجل": return "bg-rose-100 text-rose-800 border-rose-200";
          case "سياسة جديدة": return "bg-orange-100 text-orange-800 border-orange-200";
          case "تعميم مشروع": return "bg-amber-100 text-amber-800 border-amber-200";
          default: return "bg-sky-100 text-sky-800 border-sky-200";
        }
      };

      return (
        <div>
          {/* ==================================================================== */}
          {/* هيدر نظيف وواضح */}
          {/* ==================================================================== */}
          <header className="bg-white/95 backdrop-blur-md border-b border-stone-200/80 sticky top-0 z-30">
            <div className="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
              <div className="flex items-center gap-3">
                <MadyanWordmark size="text-2xl sm:text-3xl" />
                <div className="hidden sm:flex items-center gap-2 pr-3 border-r border-stone-200">
                  <div className="w-8 h-8 rounded-full madyan-gradient text-white font-black flex items-center justify-center text-xs">
                    {currentUser.name.slice(0, 2)}
                  </div>
                  <div>
                    <div className="text-xs font-black text-stone-800 leading-tight">{currentUser.name}</div>
                    <div className="text-[10px] text-stone-500">{currentUser.unit} • {currentUser.jobTitle}</div>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => setBulletinArchiveOpen(true)}
                  className={`relative px-3 py-2 rounded-2xl border transition flex items-center gap-1.5 text-xs font-bold ${
                    unreadBulletins.length > 0
                      ? "bg-orange-50 text-orange-900 border-orange-300 font-black"
                      : "bg-stone-100 text-stone-700 border-transparent hover:bg-stone-200"
                  }`}
                >
                  <span>📢</span>
                  <span className="hidden sm:inline">التعميمات</span>
                  {unreadBulletins.length > 0 && (
                    <span className="px-1.5 py-0.2 rounded-full bg-rose-600 text-white text-[10px] font-black animate-pulse">
                      {unreadBulletins.length}
                    </span>
                  )}
                </button>

                <button
                  onClick={() => setSettingsModalScope("global")}
                  className="px-3 py-2 rounded-2xl bg-stone-100 text-stone-700 hover:bg-stone-200 transition flex items-center gap-1.5 text-xs font-bold"
                >
                  <span>⚙️</span>
                  <span className="hidden sm:inline">الإعدادات</span>
                </button>

                <button
                  onClick={onLogout}
                  className="px-3 py-2 rounded-2xl bg-stone-100 text-stone-500 hover:bg-rose-50 hover:text-rose-600 transition text-xs font-bold"
                >
                  خروج
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 pt-5 space-y-5">

            {/* ==================================================================== */}
            {/* المحطة 1: شريط التعميمات الذكي (يبرز فقط عند وجود تعميم غير مقروء!) */}
            {/* ==================================================================== */}
            {unreadBulletins.length > 0 ? (
              <div className="rounded-3xl p-4 sm:p-5 bg-gradient-to-br from-orange-50 via-white to-amber-50 border-2 border-orange-300 shadow-sm space-y-3">
                <div className="flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2">
                    <span className="px-2.5 py-0.5 rounded-full bg-rose-600 text-white text-[11px] font-black">
                      📢 {unreadBulletins.length} تعميم إداري جديد مطلوب استيعابه
                    </span>
                  </div>
                  <button
                    onClick={() => setBulletinArchiveOpen(true)}
                    className="text-[11px] font-bold text-stone-600 hover:text-stone-900 underline"
                  >
                    عرض الأرشيف ({myBulletins.length})
                  </button>

    // ============================================================================
    // 7. LECTURE VIDEO & LOCKED QUIZ MODAL
    // ============================================================================
    function LectureQuizModal({ isOpen, onClose, weekNumber, isPastWeek, curriculum, lectureRecord, onSubmitQuiz }) {
      const existingSubmission = lectureRecord?.quizSubmission || null;
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [errorMsg, setErrorMsg] = useState("");

      useEffect(() => {
        if (existingSubmission && existingSubmission.answers) {
          const map = {};
          existingSubmission.answers.forEach((ans, i) => { map[i] = ans; });
          setSelectedAnswers(map);
        } else {
          setSelectedAnswers({});
        }
        setErrorMsg("");
      }, [isOpen, existingSubmission]);

      if (!isOpen) return null;

      const safeCurr = curriculum || INITIAL_STATE.weeklyCurriculums.default;
      const questions = safeCurr.questions || [];

      const handleFinalSubmit = () => {
        if (existingSubmission) return;
        for (let i = 0; i < questions.length; i++) {
          if (selectedAnswers[i] === undefined) {
            setErrorMsg(`يرجى الإجابة على السؤال رقم ${i + 1} قبل الاعتماد النهائي.`);
            return;
          }
        }
        let correctCount = 0;
        const answersArray = questions.map((q, idx) => {
          const ans = selectedAnswers[idx];
          if (ans === q.correctIndex) correctCount++;
          return ans;
        });

        onSubmitQuiz({
          score: correctCount,
          total: questions.length,
          answers: answersArray,
          submittedAt: new Date().toLocaleString("ar-EG")
        });
      };

      return (
        <ModalContainer
          isOpen={isOpen}
          onClose={onClose}
          badge={`المحاضرة الأسبوعية • الأسبوع ${weekNumber}`}
          title={safeCurr.lectureTitle}
          maxWidth="max-w-2xl"
        >
          <div className="space-y-5">
            {isPastWeek && !existingSubmission && (
              <div className="p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-900 font-bold">
                ⚠️ تنبيه: هذا الأسبوع قد انتهى بالفعل. يمكنك مشاهدة المحاضرة وحل الاختبار الآن، ولكن ستُسجل المهمة «مكتمل متأخر» بنصف النقاط (50%).
              </div>
            )}

            <p className="text-xs text-stone-500 leading-relaxed">{safeCurr.lectureDesc}</p>

            <div className="rounded-2xl overflow-hidden bg-stone-950 border border-stone-800 aspect-video relative">
              {isIframeVideo(safeCurr.videoType, safeCurr.videoUrl) ? (
                <iframe
                  src={getYoutubeEmbedUrl(safeCurr.videoUrl)}
                  title={safeCurr.lectureTitle}
                  className="w-full h-full"
                  sandbox="allow-scripts allow-same-origin allow-presentation"
                  referrerPolicy="strict-origin-when-cross-origin"
                  allowFullScreen
                />
              ) : (
                <video
                  src={sanitizeMediaUrl(safeCurr.videoUrl)}
                  controls
                  controlsList="nodownload"
                  onContextMenu={e => e.preventDefault()}
                  className="w-full h-full object-contain"
                />
              )}
            </div>

            <div className="space-y-4 pt-2 border-t border-stone-100">
              <div className="flex items-center justify-between">
                <h4 className="text-sm font-black text-stone-900">
                  📝 اختبار استيعاب المحاضرة ({questions.length} أسئلة)
                </h4>
                {existingSubmission ? (
                  <span className="text-xs font-black px-3 py-1 rounded-full bg-emerald-100 text-emerald-800">
                    🔒 تم الاعتماد النهائي • النتيجة: {existingSubmission.score}/{existingSubmission.total}
                  </span>
                ) : (
                  <span className="text-[11px] font-bold text-stone-400">
                    تنبيه: لا يمكن تعديل الإجابات بعد الضغط على اعتماد
                  </span>
                )}
              </div>

              {questions.map((q, qIdx) => {
                const userChoice = selectedAnswers[qIdx];
                return (
                  <div key={q.id || qIdx} className="p-4 rounded-2xl bg-stone-50 border border-stone-200/80 space-y-2.5">
                    <div className="text-xs font-black text-stone-800">
                      {qIdx + 1}. {q.text}
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {(q.options || []).map((opt, optIdx) => {
                        const isSelected = userChoice === optIdx;
                        const isCorrect = q.correctIndex === optIdx;

                        let btnStyle = "bg-white border-stone-200 text-stone-700 hover:border-orange-400";
                        if (existingSubmission) {
                          if (isCorrect) {
                            btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-900 font-black";
                          } else if (isSelected && !isCorrect) {
                            btnStyle = "bg-rose-50 border-rose-400 text-rose-800 line-through";
                          } else {
                            btnStyle = "bg-white border-stone-200 text-stone-400 opacity-70";
                          }
                        } else if (isSelected) {
                          btnStyle = "bg-orange-50 border-orange-500 text-orange-900 font-black ring-2 ring-orange-200";
                        }

                        return (
                          <button
                            key={optIdx}
                            type="button"
                            disabled={Boolean(existingSubmission)}
                            onClick={() => setSelectedAnswers(prev => ({ ...prev, [qIdx]: optIdx }))}
                            className={`text-right text-xs p-3 rounded-xl border transition flex items-center justify-between gap-2 ${btnStyle}`}
                          >
                            <span>{opt}</span>
                            {existingSubmission && isCorrect && <span>✅</span>}
                            {existingSubmission && isSelected && !isCorrect && <span>❌</span>}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}

              {errorMsg && (
                <div className="text-xs font-bold text-rose-600 bg-rose-50 p-3 rounded-xl border border-rose-200">
                  {errorMsg}
                </div>
              )}

              <div className="flex justify-end gap-2 pt-2">
                <button
                  onClick={onClose}
                  className="px-5 py-2.5 rounded-2xl bg-stone-100 text-stone-700 text-xs font-bold"
                >
                  إغلاق
                </button>
                {!existingSubmission && (
                  <button
                    onClick={handleFinalSubmit}
                    className="px-6 py-2.5 rounded-2xl madyan-gradient text-white text-xs font-black shadow-md hover:opacity-95"
                  >
                    اعتماد الإجابات النهائي ورصد الدرجة ✓
                  </button>
                )}
              </div>
            </div>
          </div>
        </ModalContainer>
      );
    }

    // ============================================================================
    // 8. ONBOARDING MODAL
    // ============================================================================
    function OnboardingModal({ isOpen, onClose, currentUser, taskDefs, isUsernameTaken, onSaveOnboarding }) {
      const [step, setStep] = useState(1);
      const [name, setName] = useState(currentUser.name || "");
      const [jobTitle, setJobTitle] = useState(currentUser.jobTitle || "");
      const [unit, setUnit] = useState(currentUser.unit || "");
      const [username, setUsername] = useState(currentUser.username || "");
      const [password, setPassword] = useState(currentUser.password || "");
      const [meetDay, setMeetDay] = useState(currentUser.defaultSchedule?.meetDay ?? 2);
      const [meetTime, setMeetTime] = useState(currentUser.defaultSchedule?.meetTime || "19:00");
      const [meetDuration, setMeetDuration] = useState(currentUser.defaultSchedule?.meetDuration || 90);
      const [err, setErr] = useState("");

      if (!isOpen) return null;

      const previewSched = computeWeekSchedule({ meetDay, meetTime, meetDuration }, taskDefs);

      const handleNextStep1 = () => {
        if (!username.trim() || !password.trim()) {
          setErr("اسم المستخدم وكلمة المرور مطلوبان.");
          return;
        }
        if (isUsernameTaken(username, currentUser.id)) {
          setErr("اسم المستخدم هذا مستخدم بالفعل، اختر اسماً آخر.");
          return;

    function CadreSettingsModal({ scope, onClose, currentUser, selectedWeek, isPastWeek, governanceRules = DEFAULT_GOVERNANCE_RULES, isUsernameTaken, onSaveSettings }) {
      const rules = { ...DEFAULT_GOVERNANCE_RULES, ...(governanceRules || {}) };
      const [activeTab, setActiveTab] = useState(scope || "global");
      const [meetDay, setMeetDay] = useState(currentUser.defaultSchedule?.meetDay ?? 2);
      const [meetTime, setMeetTime] = useState(currentUser.defaultSchedule?.meetTime || "19:00");
      const [meetDuration, setMeetDuration] = useState(currentUser.defaultSchedule?.meetDuration || 90);

      const [name, setName] = useState(currentUser.name || "");
      const [jobTitle, setJobTitle] = useState(currentUser.jobTitle || "");
      const [unit, setUnit] = useState(currentUser.unit || "");
      const [username, setUsername] = useState(currentUser.username || "");
      const [password, setPassword] = useState(currentUser.password || "");
      const [err, setErr] = useState("");

      useEffect(() => {
        if (!scope) return;
        const targetTab = (scope === "week" && isPastWeek) ? "global" : scope;
        setActiveTab(targetTab);
        const sched = targetTab === "week"
          ? (currentUser.weekOverrides?.[selectedWeek] || currentUser.defaultSchedule)
          : currentUser.defaultSchedule;
        setMeetDay(sched?.meetDay ?? 2);
        setMeetTime(sched?.meetTime || "19:00");
        setMeetDuration(sched?.meetDuration || 90);
        setName(currentUser.name || "");
        setJobTitle(currentUser.jobTitle || "");
        setUnit(currentUser.unit || "");
        setUsername(currentUser.username || "");
        setPassword(currentUser.password || "");
        setErr("");
      }, [scope, currentUser, selectedWeek, isPastWeek]);

      if (!scope) return null;

      const switchTab = (t) => {
        setActiveTab(t);
        const sched = t === "week"
          ? (currentUser.weekOverrides?.[selectedWeek] || currentUser.defaultSchedule)
          : currentUser.defaultSchedule;
        setMeetDay(sched?.meetDay ?? 2);
        setMeetTime(sched?.meetTime || "19:00");
        setMeetDuration(sched?.meetDuration || 90);
        setErr("");
      };

      const isScheduleLocked = activeTab === "week"
        ? (!rules.allowCadreScheduleChange || !rules.allowWeekSpecificOverride)
        : !rules.allowCadreScheduleChange;

      const handleSave = () => {
        if (activeTab === "account") {
          if (!username.trim() || !password.trim()) {
            setErr("اسم المستخدم وكلمة المرور لا يمكن أن يكونا فارغين.");
            return;
          }
          if (isUsernameTaken(username, currentUser.id)) {
            setErr("اسم المستخدم محجوز لكادر آخر.");
            return;
          }
          onSaveSettings(u => ({
            ...u,
            name: rules.allowCadreNameEdit ? (name.trim() || u.name) : u.name,
            jobTitle: rules.allowCadreJobTitleEdit ? (jobTitle.trim() || u.jobTitle) : u.jobTitle,
            unit: rules.allowCadreUnitEdit ? (unit.trim() || u.unit) : u.unit,
            username: rules.allowCadrePasswordChange ? username.trim() : u.username,
            password: rules.allowCadrePasswordChange ? password.trim() : u.password
          }));
        } else if (activeTab === "week") {
          if (isScheduleLocked) {
            setErr("تغيير مواعيد اللقاء الأسبوعي مقفل حالياً وفق ضوابط إدارة المنصة.");
            return;
          }
          onSaveSettings(u => ({
            ...u,
            weekOverrides: {
              ...(u.weekOverrides || {}),
              [selectedWeek]: {
                meetDay: parseInt(meetDay, 10),
                meetTime,
                meetDuration: parseInt(meetDuration, 10)
              }
            }
          }));
        } else {
          if (isScheduleLocked) {
            setErr("تغيير المواعيد العامة مقفل حالياً وفق ضوابط إدارة المنصة.");
            return;
          }
          onSaveSettings(u => ({
            ...u,
            defaultSchedule: {
              meetDay: parseInt(meetDay, 10),
              meetTime,
              meetDuration: parseInt(meetDuration, 10)
            }
          }));
        }
      };

      return (
        <ModalContainer
          isOpen={Boolean(scope)}
          onClose={onClose}
          badge="إعدادات الكادر (مؤطرة بضوابط إدارة المنصة)"
          title="تخصيص المواعيد وبيانات الحساب"
        >
          <div className="space-y-4">
            <div className="grid grid-cols-3 gap-1.5 p-1 bg-stone-100 rounded-2xl text-xs font-bold">
              <button
                disabled={isPastWeek}
                onClick={() => switchTab("week")}
                className={`py-2.5 px-2 rounded-xl transition ${
                  activeTab === "week" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500 disabled:opacity-40"
                }`}
              >
                الأسبوع الحالي ({selectedWeek})
              </button>
              <button
                onClick={() => switchTab("global")}
                className={`py-2.5 px-2 rounded-xl transition ${
                  activeTab === "global" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500"
                }`}
              >
                المواعيد العامة
              </button>
              <button
                onClick={() => switchTab("account")}
                className={`py-2.5 px-2 rounded-xl transition ${
                  activeTab === "account" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500"
                }`}
              >
                بياناتي والدخول
              </button>
            </div>

            {activeTab !== "account" ? (
              <div className="space-y-3.5">
                {isScheduleLocked && (
                  <div className="p-3 rounded-2xl bg-amber-50 border border-amber-200 text-xs font-bold text-amber-900">
                    🔒 تعديل مواعيد اللقاء الأسبوعي مقفل حالياً بقرار من إدارة المنصة التقنية.
                  </div>
                )}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">يوم الاجتماع</label>
                    <select disabled={isScheduleLocked} value={meetDay} onChange={e => setMeetDay(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50">
                      {DAYS_AR.map((d, i) => <option key={i} value={i}>{d}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">ساعة البدء</label>
                    <input disabled={isScheduleLocked} type="time" value={meetTime} onChange={e => setMeetTime(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50" />
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">مدة الاجتماع</label>
                  <select disabled={isScheduleLocked} value={meetDuration} onChange={e => setMeetDuration(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50">
                    <option value="60">ساعة واحدة (60 دقيقة)</option>
                    <option value="90">ساعة ونصف (90 دقيقة)</option>
                    <option value="120">ساعتان (120 دقيقة)</option>
                    <option value="180">3 ساعات (180 دقيقة)</option>
                  </select>
                </div>
                <div className="text-[11px] text-stone-500 bg-stone-50 px-3 py-2 rounded-xl">
                  ℹ️ الحد الأقصى لتغيير الموعد شهرياً حسب ضوابط المنصة: <strong>{rules.maxScheduleChangesPerMonth} مرات</strong>.
                </div>
              </div>
            ) : (
              <div className="space-y-3.5">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">
                    الاسم الكامل {!rules.allowCadreNameEdit && <span className="text-amber-700">(مقفل من إدارة المنصة)</span>}
                  </label>
                  <input disabled={!rules.allowCadreNameEdit} value={name} onChange={e => setName(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50" />
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">
                      المسمى الوظيفي {!rules.allowCadreJobTitleEdit && <span className="text-stone-400">(ثابت تنظيمياً)</span>}
                    </label>
                    <input disabled={!rules.allowCadreJobTitleEdit} value={jobTitle} onChange={e => setJobTitle(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">
                      الوحدة التنظيمية {!rules.allowCadreUnitEdit && <span className="text-stone-400">(ثابت تنظيمياً)</span>}
                    </label>
                    <input disabled={!rules.allowCadreUnitEdit} value={unit} onChange={e => setUnit(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50" />
                  </div>
                </div>

                <div className="p-3.5 rounded-2xl bg-stone-50 border border-stone-200 space-y-3">
                  <div className="text-xs font-black text-stone-800">
                    🔐 تعديل اسم المستخدم وكلمة المرور {!rules.allowCadrePasswordChange && <span className="text-amber-700">(مقفل من إدارة المنصة)</span>}
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-bold text-stone-600 mb-1">اسم المستخدم</label>
                      <input disabled={!rules.allowCadrePasswordChange} value={username} onChange={e => setUsername(e.target.value)} className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold disabled:opacity-50" dir="ltr" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-stone-600 mb-1">كلمة المرور الجديدة</label>
                      <input disabled={!rules.allowCadrePasswordChange} type="text" value={password} onChange={e => setPassword(e.target.value)} className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold disabled:opacity-50" dir="ltr" />
                    </div>
                  </div>
                </div>

                <div className="text-[11px] text-stone-400 bg-stone-50 px-3 py-2 rounded-xl">
                  📅 تاريخ تفعيل حسابك بالنظام مرصود تلقائياً: <strong>{formatDateAr(currentUser.joinedAt)}</strong>.
                </div>
              </div>
            )}

            {err && <div className="text-xs font-bold text-rose-600">{err}</div>}

            <div className="flex justify-end gap-2 pt-2">
              <button onClick={onClose} className="px-4 py-2.5 rounded-2xl bg-stone-100 text-stone-700 text-xs font-bold">إلغاء</button>
              <button onClick={handleSave} className="px-6 py-2.5 rounded-2xl bg-stone-900 text-white text-xs font-bold hover:bg-stone-800">
                حفظ التعديلات
              </button>
            </div>
          </div>
        </ModalContainer>
      );
    }

    // ============================================================================
    // 9.5 PLATFORM TECHNICAL ADMIN PORTAL (إدارة المنصة - تصميم مينيمال بكشف تدريجي)
    // ============================================================================
    function PlatformAdminPortal({
      db,
      setDb,
      currentUser,
      cloudStatus,
      lastSyncAt,
      onOpenCloudSetup,
      onPreviewUser,
      onResetDemo,
      onLogout,
      showToast
    }) {
      // الشاشات الثلاث الأساسية فقط في العمود الجانبي الأيمن
      const [activeScreen, setActiveScreen] = useState(() => {
        try {
          return new URLSearchParams(window.location.search).get("screen") || "overview";
        } catch (e) {
          return "overview";
        }
      }); // 'overview' | 'structure' | 'leaders_settings'
      const [structureViewMode, setStructureViewMode] = useState(() => {
        try {
          return new URLSearchParams(window.location.search).get("mode") || "list";
        } catch (e) {
          return "list";
        }
      }); // 'list' | 'map'

      // التحكم في الأكورديون الهادئ (بسيط على السطح، قوي في العمق)
      const [expandedDeptId, setExpandedDeptId] = useState(() => {
        try {
          return new URLSearchParams(window.location.search).get("expand_dept") || null;
        } catch (e) {
          return null;
        }
      });
      const [expandedUnitId, setExpandedUnitId] = useState(null);
      const [expandedLeaderId, setExpandedLeaderId] = useState(null);
      const [expandedSettingKey, setExpandedSettingKey] = useState(null); // 'scoring' | 'cadre_limits' | 'cloud'

      // نماذج الإضافة العلوية المدمجة بنظام الأكورديون
      const [createEntityMode, setCreateEntityMode] = useState(null); // null | 'dept' | 'unit'
      const [showCreateLeaderForm, setShowCreateLeaderForm] = useState(false);

      // بحث وفلترة جدول القادة
      const [leaderSearch, setLeaderSearch] = useState("");
      const [leaderRoleFilter, setLeaderRoleFilter] = useState("all"); // 'all' | 'executive' | 'operational_admin'

      const departments = db.systemConfig?.departments || DEFAULT_DEPARTMENTS;
      const units = db.systemConfig?.organizationalUnits || DEFAULT_UNITS;
      const rules = { ...DEFAULT_GOVERNANCE_RULES, ...(db.systemConfig?.governanceRules || {}) };

      // القادة والمديرون فقط (استبعاد الكوادر تماماً وتركهم للموارد البشرية)
      const leaderUsers = useMemo(
        () => db.users.filter(u => u.roleType !== "cadre"),
        [db.users]
      );
      const cadres = useMemo(
        () => db.users.filter(u => u.roleType === "cadre"),
        [db.users]
      );

      // حقول تأسيس إدارة جديدة
      const [deptName, setDeptName] = useState("");
      const [deptDesc, setDeptDesc] = useState("");
      const [deptMaxTotal, setDeptMaxTotal] = useState(6);
      const [deptMaxPerType, setDeptMaxPerType] = useState(2);
      const [deptAllowedTypes, setDeptAllowedTypes] = useState(["lecture_quiz", "meeting", "practical"]);
      const [deptManagerId, setDeptManagerId] = useState("");

      // حقول تأسيس وحدة تنظيمية جديدة
      const [unitName, setUnitName] = useState("");
      const [unitInviteCode, setUnitInviteCode] = useState("");
      const [unitLeaderId, setUnitLeaderId] = useState("");

      // حقول إضافة حساب قائد جديد
      const [newLeaderRole, setNewLeaderRole] = useState("operational_admin"); // 'executive' | 'operational_admin'
      const [newLeaderName, setNewLeaderName] = useState("");
      const [newLeaderTitle, setNewLeaderTitle] = useState("");
      const [newLeaderDeptId, setNewLeaderDeptId] = useState("dept_hr");
      const [newLeaderUnitName, setNewLeaderUnitName] = useState(units[0]?.name || "");
      const [newLeaderUsername, setNewLeaderUsername] = useState("");
      const [newLeaderPassword, setNewLeaderPassword] = useState("1234");

      const findDeptManager = (deptId) => {
        return leaderUsers.find(
          u => (u.roleType === "operational_admin" || u.roleType === "admin") && (u.departmentId || "dept_hr") === deptId
        ) || null;
      };

      const findUnitLeader = (uObj) => {
        if (uObj.leaderUserId) {
          const byId = leaderUsers.find(u => u.id === uObj.leaderUserId);
          if (byId) return byId;
        }
        return leaderUsers.find(u => u.unit === uObj.name && u.roleType !== "platform_admin") || null;
      };

      const deptsWithManagerCount = useMemo(
        () => departments.filter(d => Boolean(findDeptManager(d.id))).length,
        [departments, leaderUsers]

      else for (let i = 0; i < 6; i++) arr[i] = Math.floor(Math.random() * 1e9);

      for (let i = 0; i < 6; i++) out += chars[arr[i] % chars.length];

        <div className="inline-flex items-center h-11 rounded-2xl bg-[#F4F2EE] p-1">

    function PA2Segmented({ options, value, onChange, size = "md" }) {

    // ----- لوحة تفاصيل الإدارة (إنشاء/تعديل بنفس اللوحة، بمسودة وحفظ صريح) -----
    function PA2DeptPanel({ dept, isNew, managerId, managerOptions, cadreCount, onSave, onDelete, onPreview, onClose }) {
      const [draft, setDraft] = useState(() => ({
        name: dept?.name || "",
        description: dept?.description || "",
        managerId: managerId || "",
        maxTotalTasks: dept?.maxTotalTasks ?? 6,
        maxPerTypePerCadre: dept?.maxPerTypePerCadre ?? 2,
        allowedTaskTypes: dept?.allowedTaskTypes || ["lecture_quiz", "meeting", "practical"],
        enabled: dept ? dept.enabled !== false : true
      }));
      const initial = React.useRef(JSON.stringify(draft));
      const dirty = isNew ? draft.name.trim().length > 0 : JSON.stringify(draft) !== initial.current;
      const set = (k, v) => setDraft(d => ({ ...d, [k]: v }));
      const toggleType = (id) => set("allowedTaskTypes",
        draft.allowedTaskTypes.includes(id) ? draft.allowedTaskTypes.filter(t => t !== id) : [...draft.allowedTaskTypes, id]
      );
      const save = () => {
        if (!draft.name.trim()) return;
        onSave(draft);
        initial.current = JSON.stringify(draft);
      };
      const selectedMgr = managerOptions.find(m => m.id === draft.managerId);

      return (
        <PA2PanelShell
          eyebrow={isNew ? "إدارة جديدة" : (dept.isCore ? "إدارة تشغيلية أساسية" : "إدارة تشغيلية")}
          title={isNew ? (draft.name.trim() || "تأسيس إدارة") : dept.name}
          onClose={onClose}
          footer={
            <PA2SaveFooter
