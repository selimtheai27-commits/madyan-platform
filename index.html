    function AdminDashboardSection({ cadres, db, onInspectCadre, onOpenTracks }) {
      const tarbawiDefs = useMemo(
        () => (db.systemConfig?.tarbawiTaskDefinitions || DEFAULT_TARBAWI_TASKS).filter(t => t.enabled !== false),
        [db.systemConfig]
      );

      const analytics = useMemo(() => {
        const list = cadres.map(c => ({
          cadre: c,
          metrics: computeCadreMetrics(c, db.systemConfig)
        })).sort((a, b) => b.metrics.overallScorePct - a.metrics.overallScorePct);

        let totalOnTime = 0, totalLate = 0, totalPending = 0, totalAll = 0;
        let sumAdminPct = 0, sumTarbawiPct = 0;

        const taskTotals = {
          lecture: { onTime: 0, late: 0, total: 0 },
          agenda: { onTime: 0, late: 0, total: 0 },
          attendance: { onTime: 0, late: 0, total: 0 },
          minutes: { onTime: 0, late: 0, total: 0 }
        };

        const tarbawiTotals = {};
        tarbawiDefs.forEach(td => {
          tarbawiTotals[td.id] = { onTime: 0, total: 0, title: td.title, icon: td.icon };
        });

        list.forEach(({ cadre, metrics }) => {
          totalOnTime += metrics.onTimeCount;
          totalLate += metrics.lateCount;
          totalPending += metrics.pendingCount;
          totalAll += metrics.totalTasksCount;
          sumAdminPct += metrics.adminScorePct;
          sumTarbawiPct += metrics.tarbawiScorePct;

          ['lecture', 'agenda', 'attendance', 'minutes'].forEach(k => {
            taskTotals[k].onTime += metrics.byTaskKey[k].onTime;
            taskTotals[k].late += metrics.byTaskKey[k].late;
            taskTotals[k].total += metrics.totalWeeks;
          });

          tarbawiDefs.forEach(td => {
            if (metrics.byTarbawiKey?.[td.id]) {
              tarbawiTotals[td.id].onTime += metrics.byTarbawiKey[td.id].onTime;
              tarbawiTotals[td.id].total += metrics.totalWeeks;
            }
          });
        });

        return {
          list,
          avgAdminPct: list.length ? Math.round(sumAdminPct / list.length) : 0,
          avgTarbawiPct: list.length ? Math.round(sumTarbawiPct / list.length) : 0,
          onTimePct: totalAll ? Math.round((totalOnTime / totalAll) * 100) : 0,
          latePct: totalAll ? Math.round((totalLate / totalAll) * 100) : 0,
          pendingPct: totalAll ? Math.round((totalPending / totalAll) * 100) : 0,
          taskTotals,
          tarbawiTotals
        };
      }, [cadres, db.systemConfig, tarbawiDefs]);

      const taskNames = {
        lecture: "1. المحاضرة الأسبوعية والاختبار",
        agenda: "2. إرسال الأجندة (قبل 24 ساعة)",
        attendance: "3. الانضباط في حضور اللقاء",
        minutes: "4. توثيق المحضر (خلال 24 ساعة)"
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div className="bg-white p-5 rounded-3xl border border-stone-200/80 shadow-sm">
              <div className="text-xs font-bold text-stone-400">إجمالي الكوادر النشطة</div>
              <div className="text-3xl font-black text-stone-900 mt-2">{cadres.length} كوادر</div>
              <div className="text-[11px] text-stone-500 mt-1">يتابعون المحورين الإداري والتربوي</div>
            </div>
            <div className="bg-white p-5 rounded-3xl border border-orange-200 shadow-sm">
              <div className="text-xs font-bold text-orange-700">🏛️ متوسط المحور الإداري</div>
              <div className="text-3xl font-black text-orange-600 mt-2">{analytics.avgAdminPct}%</div>
              <div className="text-[11px] text-stone-500 mt-1">المحاضرة • الأجندة • الحضور • المحضر</div>
            </div>
            <div className="bg-white p-5 rounded-3xl border border-emerald-200 shadow-sm">
              <div className="text-xs font-bold text-emerald-700">🌱 متوسط المحور التربوي</div>
              <div className="text-3xl font-black text-emerald-600 mt-2">{analytics.avgTarbawiPct}%</div>
              <div className="text-[11px] text-stone-500 mt-1">{tarbawiDefs.length} مهمات تربوية مفعلة</div>
            </div>
            <div className="bg-white p-5 rounded-3xl border border-stone-200 shadow-sm">
              <div className="text-xs font-bold text-stone-600">معدل الإنجاز في الوقت</div>
              <div className="text-3xl font-black text-stone-900 mt-2">{analytics.onTimePct}%</div>
              <div className="text-[11px] text-stone-500 mt-1">متأخر: {analytics.latePct}% • قيد الإنجاز: {analytics.pendingPct}%</div>
            </div>
          </div>

          {/* تحليل المحورين جنباً إلى جنب */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
              <div>
                <span className="text-xs font-bold text-orange-600">🏛️ المحور الإداري</span>
                <h2 className="text-base font-black text-stone-900">نسب الالتزام بالعادات الإدارية الأربع</h2>
              </div>
              <div className="space-y-3">
                {['lecture', 'agenda', 'attendance', 'minutes'].map(k => {
                  const t = analytics.taskTotals[k];
                  const onTimeRate = t.total ? Math.round((t.onTime / t.total) * 100) : 0;
                  const lateRate = t.total ? Math.round((t.late / t.total) * 100) : 0;
                  const totalDoneRate = onTimeRate + lateRate;
                  return (
                    <div key={k} className="p-3.5 rounded-2xl bg-stone-50 border border-stone-200/70 space-y-1.5">
                      <div className="flex items-center justify-between text-xs font-black">
                        <span className="text-stone-800">{taskNames[k]}</span>
                        <span className="text-orange-700">{totalDoneRate}%</span>
                      </div>
                      <div className="w-full h-2.5 rounded-full bg-stone-200 overflow-hidden flex">
                        <div style={{ width: `${onTimeRate}%` }} className="bg-orange-600 h-full" />
                        <div style={{ width: `${lateRate}%` }} className="bg-amber-400 h-full" />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
              <div className="flex items-center justify-between">
                <div>
                  <span className="text-xs font-bold text-emerald-700">🌱 المحور التربوي</span>
                  <h2 className="text-base font-black text-stone-900">نسب الالتزام بالمهمات التربوية المقررة</h2>
                </div>
                <button
                  onClick={onOpenTracks}
                  className="px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs font-bold hover:bg-emerald-100"
                >
                  ⚙️ تخصيص المهمات التربوية
                </button>
              </div>
              <div className="space-y-3">
                {tarbawiDefs.map(td => {
                  const stat = analytics.tarbawiTotals[td.id] || { onTime: 0, total: 1 };
                  const rate = stat.total ? Math.round((stat.onTime / stat.total) * 100) : 0;
                  return (
                    <div key={td.id} className="p-3.5 rounded-2xl bg-stone-50 border border-stone-200/70 space-y-1.5">
                      <div className="flex items-center justify-between text-xs font-black">
                        <span className="text-stone-800">{td.icon} {td.title}</span>
                        <span className="text-emerald-700">{rate}%</span>
                      </div>
                      <div className="w-full h-2.5 rounded-full bg-stone-200 overflow-hidden">
                        <div style={{ width: `${rate}%` }} className="bg-emerald-600 h-full" />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          <div className="bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
            <div>
              <span className="text-xs font-bold text-orange-600">تقييم الكوادر التفصيلي</span>
              <h2 className="text-lg font-black text-stone-900">جدول التزام الكوادر في المحورين الإداري والتربوي</h2>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-right text-xs">
                <thead>
                  <tr className="border-b border-stone-200 text-stone-400 font-bold">
                    <th className="py-3 px-2">#</th>
                    <th className="py-3 px-2">الكادر الإداري</th>
                    <th className="py-3 px-2">بيانات الدخول</th>
                    <th className="py-3 px-2">🏛️ المحور الإداري</th>
                    <th className="py-3 px-2">🌱 المحور التربوي</th>
                    <th className="py-3 px-2">متوسط الاختبارات</th>
                    <th className="py-3 px-2">السكور العام</th>
                    <th className="py-3 px-2">التفاصيل</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-stone-100">
                  {analytics.list.map(({ cadre, metrics }, idx) => (
                    <tr key={cadre.id} className="hover:bg-stone-50/80">
                      <td className="py-3.5 px-2 font-black text-stone-500">{idx + 1}</td>
                      <td className="py-3.5 px-2">
                        <div className="font-black text-stone-900 text-sm">{cadre.name}</div>
                        <div className="text-[11px] text-stone-400">{cadre.unit} • {metrics.totalWeeks} أسابيع</div>
                      </td>
                      <td className="py-3.5 px-2">
                        <span className="font-mono bg-stone-100 px-2 py-1 rounded-lg text-stone-700 font-bold">
                          {cadre.username} / {cadre.password}
                        </span>
                      </td>
                      <td className="py-3.5 px-2">
                        <span className="px-2.5 py-1 rounded-full bg-orange-50 text-orange-800 font-black">
                          {metrics.adminScorePct}%
                        </span>
                      </td>
                      <td className="py-3.5 px-2">
                        <span className="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 font-black">
                          {metrics.tarbawiScorePct}%
                        </span>
                      </td>
                      <td className="py-3.5 px-2 font-bold">
                        {metrics.avgQuizPct !== null ? (
                          <span className="px-2.5 py-1 rounded-full bg-sky-50 text-sky-800">{metrics.avgQuizPct}%</span>
                        ) : (
                          <span className="text-stone-400">لم يختبر</span>
                        )}
                      </td>
                      <td className="py-3.5 px-2">
                        <span className={`text-sm font-black px-3 py-1 rounded-full ${
                          metrics.overallScorePct >= 80
                            ? 'bg-emerald-100 text-emerald-800'
                            : metrics.overallScorePct >= 50
                            ? 'bg-amber-100 text-amber-800'
                            : 'bg-rose-100 text-rose-800'
                        }`}>
                          {metrics.overallScorePct}%
                        </span>
                      </td>
                      <td className="py-3.5 px-2">
                        <button
                          onClick={() => onInspectCadre(cadre)}
                          className="px-3 py-1.5 rounded-xl bg-stone-900 text-white font-bold hover:bg-orange-600 transition"
                        >
                          🔍 فحص السجل
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 11.5 ADMIN TRACKS MANAGER (تخصيص مهمات المحور التربوي والمحور الإداري)
    // ============================================================================
    function AdminTracksManagerSection({ db, setDb, cadres, units, showToast }) {
      const tarbawiTasks = db.systemConfig?.tarbawiTaskDefinitions || DEFAULT_TARBAWI_TASKS;
      const tarbawiFocus = db.systemConfig?.tarbawiWeeklyFocus || INITIAL_STATE.systemConfig.tarbawiWeeklyFocus;

      const [focusTitle, setFocusTitle] = useState(tarbawiFocus.title || "");
      const [focusBook, setFocusBook] = useState(tarbawiFocus.bookTitle || "");
      const [focusHint, setFocusHint] = useState(tarbawiFocus.hint || "");

      // نموذج إضافة أو تعديل مهمة تربوية
      const [editingId, setEditingId] = useState(null);
      const [tTitle, setTTitle] = useState("");
      const [tSubtitle, setTSubtitle] = useState("");
      const [tInstructions, setTInstructions] = useState("");
      const [tBadge, setTBadge] = useState("بناء تربوي");
      const [tIcon, setTIcon] = useState("🌱");
      const [tDuration, setTDuration] = useState(30);
      const [tTrackType, setTTrackType] = useState("check"); // 'check' | 'daily_days'
      const [tTargetDays, setTTargetDays] = useState(5);
      const [tTargetScope, setTTargetScope] = useState("all"); // 'all' | 'unit' | 'custom'
      const [tTargetUnit, setTTargetUnit] = useState(units[0] || "");
      const [tTargetUserIds, setTTargetUserIds] = useState([]);

      const resetForm = () => {
        setEditingId(null);
        setTTitle("");
        setTSubtitle("");
        setTInstructions("");
        setTBadge("بناء تربوي");
        setTIcon("🌱");
        setTDuration(30);
        setTTrackType("check");
        setTTargetDays(5);
        setTTargetScope("all");
        setTTargetUnit(units[0] || "");
        setTTargetUserIds([]);
      };

      const startEditTask = (task) => {
        setEditingId(task.id);
        setTTitle(task.title || "");
        setTSubtitle(task.subtitle || "");
        setTInstructions(task.instructions || "");
        setTBadge(task.badge || "بناء تربوي");
        setTIcon(task.icon || "🌱");
        setTDuration(task.durationMinutes || 30);
        setTTrackType(task.trackType || "check");
        setTTargetDays(task.targetDays || 5);
        setTTargetScope(task.targetScope || "all");
        setTTargetUnit(task.targetUnit || units[0] || "");
        setTTargetUserIds(Array.isArray(task.targetUserIds) ? task.targetUserIds : []);
      };

      const handleSaveFocus = (e) => {
        e.preventDefault();
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            tarbawiWeeklyFocus: {
              title: focusTitle.trim(),
              bookTitle: focusBook.trim(),
              hint: focusHint.trim()
            }
          }
        }));
        showToast("تم حفظ بوصلة الأسبوع التربوية بنجاح 🌿");
      };

      const handleSaveTarbawiTask = (e) => {
        e.preventDefault();
        if (!tTitle.trim()) {
          showToast("يرجى كتابة عنوان المهمة التربوية.");
          return;
        }
        const taskPayload = {
          id: editingId || ("tarbawi_" + Date.now()),
          title: tTitle.trim(),
          subtitle: tSubtitle.trim() || "مهمة ضمن المحور التربوي الأسبوعي",
          instructions: tInstructions.trim() || "أتمّ المهمة وفق المقرر الأسبوعي ثم سجل إنجازك.",
          badge: tBadge.trim() || "بناء تربوي",
          icon: tIcon || "🌱",
          durationMinutes: parseInt(tDuration, 10) || 25,
          trackType: tTrackType,
          targetDays: parseInt(tTargetDays, 10) || 5,
          targetScope: tTargetScope,
          targetUnit: tTargetScope === "unit" ? tTargetUnit : "",
          targetUserIds: tTargetScope === "custom" ? tTargetUserIds : [],
          enabled: true
        };

        setDb(prev => {
          const currentList = prev.systemConfig?.tarbawiTaskDefinitions || DEFAULT_TARBAWI_TASKS;
          const nextList = editingId
            ? currentList.map(item => item.id === editingId ? taskPayload : item)
            : [...currentList, taskPayload];
          return {
            ...prev,
            systemConfig: {
              ...prev.systemConfig,
              tarbawiTaskDefinitions: nextList
            }
          };
        });

        resetForm();
        showToast(editingId ? "تم تحديث المهمة التربوية بنجاح ✓" : "تمت إضافة المهمة الجديدة للمحور التربوي 🌱");
      };

      const handleDeleteTarbawiTask = (id) => {
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            tarbawiTaskDefinitions: (prev.systemConfig?.tarbawiTaskDefinitions || []).filter(t => t.id !== id)
          }
        }));
        if (editingId === id) resetForm();
        showToast("تم حذف المهمة التربوية.");
      };

      const toggleCustomUser = (uid) => {
        setTTargetUserIds(prev => prev.includes(uid) ? prev.filter(x => x !== uid) : [...prev, uid]);
      };

      return (
        <div className="space-y-6">
          {/* بوصلة الأسبوع التربوية */}
          <form onSubmit={handleSaveFocus} className="bg-white rounded-3xl p-6 border border-emerald-200 shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div>
                <span className="text-xs font-bold text-emerald-700">🌿 التوجيه التربوي الأسبوعي</span>
                <h2 className="text-lg font-black text-stone-900">ضبط بوصلة الأسبوع التربوية والكتاب المقرر</h2>
              </div>
              <button
                type="submit"
                className="px-5 py-2.5 rounded-2xl tarbawi-gradient text-white text-xs font-black shadow-sm"
              >
                حفظ البوصلة التربوية ✓
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">قيمة / عنوان الأسبوع التربوي</label>
                <input
                  value={focusTitle}
                  onChange={e => setFocusTitle(e.target.value)}
                  placeholder="مثال: الإتقان والأمانة في العمل"
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-bold"
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">المقرر القرائي / الورد الأسبوعي</label>
                <input
                  value={focusBook}
                  onChange={e => setFocusBook(e.target.value)}
                  placeholder="مثال: فصل فقه الأولويات (ص 15 - 35)"
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-bold"
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">رسالة تذكيرية مختصرة</label>
                <input
                  value={focusHint}
                  onChange={e => setFocusHint(e.target.value)}
                  placeholder="توجيه قصير يظهر للكادر..."
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-bold"
                />
              </div>
            </div>
          </form>

          {/* تخصيص وإضافة مهمات المحور التربوي */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-5 bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4 h-fit">
              <div className="flex items-center justify-between">
                <div>
                  <span className="text-xs font-bold text-emerald-700">تخصيص المحور التربوي</span>
                  <h3 className="text-base font-black text-stone-900">
                    {editingId ? "✏️ تعديل المهمة التربوية" : "🌱 إضافة مهمة تربوية جديدة"}
                  </h3>
                </div>
                {editingId && (
                  <button
                    type="button"
                    onClick={resetForm}
                    className="text-xs font-bold text-stone-500 hover:text-stone-800 underline"
                  >
                    إلغاء التعديل
                  </button>
                )}
              </div>

              <form onSubmit={handleSaveTarbawiTask} className="space-y-3.5">
                <div className="grid grid-cols-4 gap-2">
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">الأيقونة</label>
                    <select
                      value={tIcon}
                      onChange={e => setTIcon(e.target.value)}
                      className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-2 py-2.5 text-base text-center"
                    >
                      {["📖", "📚", "🌿", "✨", "🕌", "🤲", "💡", "🎯", "🤝"].map(ic => (
                        <option key={ic} value={ic}>{ic}</option>
                      ))}
                    </select>
                  </div>
                  <div className="col-span-3">
                    <label className="block text-xs font-bold text-stone-700 mb-1">اسم المهمة التربوية</label>
                    <input
                      value={tTitle}
                      onChange={e => setTTitle(e.target.value)}
                      placeholder="مثال: الورد القرآني / قراءة الكتاب المقرر..."
                      className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-bold"
                      required
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">الوصف المختصر (يظهر تحت العنوان مباشرة)</label>
                  <input
                    value={tSubtitle}
                    onChange={e => setTSubtitle(e.target.value)}
                    placeholder="وصف واضح من سطر واحد..."
                    className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2 text-xs font-bold"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">إرشادات التنفيذ التفصيلية</label>
                  <textarea
                    rows="2"
                    value={tInstructions}
                    onChange={e => setTInstructions(e.target.value)}
                    placeholder="كيف ينجز الكادر هذه المهمة؟"
                    className="w-full rounded-2xl border border-stone-200 bg-stone-50 p-3 text-xs"
                  />
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">الشارة (Badge)</label>
                    <input
                      value={tBadge}
                      onChange={e => setTBadge(e.target.value)}
                      placeholder="زاد روحي / بناء فكري"
                      className="w-full rounded-xl border border-stone-200 bg-stone-50 px-3 py-2 text-xs font-bold"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">الوقت التقديري (دقيقة)</label>
                    <input
                      type="number"
                      min="5"
                      max="240"
                      value={tDuration}
                      onChange={e => setTDuration(e.target.value)}
                      className="w-full rounded-xl border border-stone-200 bg-stone-50 px-3 py-2 text-xs font-bold"
                    />
                  </div>
                </div>

                {/* طريقة تتبع الإنجاز */}
                <div className="p-3.5 rounded-2xl bg-emerald-50/60 border border-emerald-200 space-y-2.5">
                  <label className="block text-xs font-black text-emerald-950">طريقة قياس وإنجاز المهمة:</label>
                  <div className="grid grid-cols-2 gap-2 text-xs font-bold">
                    <button
                      type="button"
                      onClick={() => setTTrackType("check")}
                      className={`py-2 px-2.5 rounded-xl border transition ${
                        tTrackType === "check" ? "bg-emerald-700 text-white border-emerald-700" : "bg-white text-stone-600"
                      }`}
                    >
                      ✓ إنجاز أسبوعي مباشر
                    </button>
                    <button
                      type="button"
                      onClick={() => setTTrackType("daily_days")}
                      className={`py-2 px-2.5 rounded-xl border transition ${
                        tTrackType === "daily_days" ? "bg-emerald-700 text-white border-emerald-700" : "bg-white text-stone-600"
                      }`}
                    >
                      📅 متتبع يومي (7 أيام)
                    </button>
                  </div>

                  {tTrackType === "daily_days" && (
                    <div className="flex items-center justify-between pt-1 text-xs">
                      <span className="font-bold text-emerald-900">عدد الأيام المستهدفة أسبوعياً:</span>
                      <select
                        value={tTargetDays}
                        onChange={e => setTTargetDays(e.target.value)}
                        className="rounded-xl border border-emerald-300 bg-white px-3 py-1 font-black text-emerald-900"
                      >
                        {[3, 4, 5, 6, 7].map(n => <option key={n} value={n}>{n} أيام في الأسبوع</option>)}
                      </select>
                    </div>
                  )}
                </div>

                {/* لمن توجه هذه المهمة التربوية؟ */}
                <div className="p-3.5 rounded-2xl bg-stone-50 border border-stone-200 space-y-2.5">
                  <label className="block text-xs font-black text-stone-800">🎯 نطاق التخصيص (لمن تظهر هذه المهمة؟)</label>
                  <div className="grid grid-cols-3 gap-1.5 text-[11px] font-bold">
                    <button
                      type="button"
                      onClick={() => setTTargetScope("all")}
                      className={`py-2 rounded-xl border ${tTargetScope === "all" ? "bg-stone-900 text-white" : "bg-white text-stone-600"}`}
                    >
                      جميع الكوادر
                    </button>
                    <button
                      type="button"
                      onClick={() => setTTargetScope("unit")}
                      className={`py-2 rounded-xl border ${tTargetScope === "unit" ? "bg-stone-900 text-white" : "bg-white text-stone-600"}`}
                    >
                      وحدة محددة
                    </button>
                    <button
                      type="button"
                      onClick={() => setTTargetScope("custom")}
                      className={`py-2 rounded-xl border ${tTargetScope === "custom" ? "bg-stone-900 text-white" : "bg-white text-stone-600"}`}
                    >
                      كوادر محددين
                    </button>
                  </div>

                  {tTargetScope === "unit" && (
                    <select
                      value={tTargetUnit}
                      onChange={e => setTTargetUnit(e.target.value)}
                      className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold"
                    >
                      {units.map(u => <option key={u} value={u}>{u}</option>)}
                    </select>
                  )}

                  {tTargetScope === "custom" && (
                    <div className="max-h-32 overflow-y-auto space-y-1 pt-1">
                      {cadres.map(c => {
                        const checked = tTargetUserIds.includes(c.id);
                        return (
                          <div
                            key={c.id}
                            onClick={() => toggleCustomUser(c.id)}
                            className={`p-2 rounded-xl border text-xs cursor-pointer flex items-center justify-between ${
                              checked ? "bg-emerald-50 border-emerald-400 font-black" : "bg-white border-stone-200"
                            }`}
                          >
                            <span>{c.name} ({c.unit})</span>
                            <span>{checked ? "✓ مضاف" : "+"}</span>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>

                <button
                  type="submit"
                  className="w-full py-3.5 rounded-2xl tarbawi-gradient text-white text-xs font-black shadow-md hover:opacity-95"
                >
                  {editingId ? "💾 حفظ تعديلات المهمة التربوية" : "+ إضافة المهمة إلى المحور التربوي"}
                </button>
              </form>
            </div>

            {/* قائمة المهمات التربوية الحالية */}
            <div className="lg:col-span-7 bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
              <div>
                <span className="text-xs font-bold text-emerald-700">قائمة العادات والمهمات التربوية ({tarbawiTasks.length})</span>
                <h3 className="text-base font-black text-stone-900">المهمات المفعلة في المحور التربوي</h3>
                <p className="text-xs text-stone-500">يمكنك تعديل أي مهمة أو تخصيصها لوحدة معينة أو إضافة مهمات جديدة.</p>
              </div>

              <div className="space-y-3">

                      <div className="w-11 h-11 rounded-2xl bg-emerald-100 text-emerald-800 flex items-center justify-center text-lg flex-shrink-0">
                        {t.icon || "🌱"}
                      </div>
                      <div className="space-y-1">
                        <div className="flex flex-wrap items-center gap-1.5">
                          <span className="text-sm font-black text-stone-900">{i + 1}. {t.title}</span>
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800">
                            {t.badge}

                          <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-stone-200 text-stone-700">
                            {t.trackType === "daily_days" ? `متتبع يومي (${t.targetDays || 5} أيام)` : "إنجاز أسبوعي مباشر"}
                          </span>
                          {t.targetScope === "unit" && (
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-sky-100 text-sky-800">
                              لوحدة: {t.targetUnit}
                            </span>
                          )}
                          {t.targetScope === "custom" && (
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-purple-100 text-purple-800">
                              مخصص لـ {(t.targetUserIds || []).length} كادر
                            </span>
                          )}
                        </div>
                        <p className="text-xs text-stone-500">{t.subtitle}</p>
                        <p className="text-[11px] text-stone-400">💡 {t.instructions}</p>
                      </div>
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={() => startEditTask(t)}
                        className="px-3 py-1.5 rounded-xl bg-white border border-stone-200 text-stone-700 hover:bg-stone-100 text-xs font-bold"
                      >
                        تعديل
                      </button>
                      <button
                        type="button"
                        onClick={() => handleDeleteTarbawiTask(t.id)}
                        className="px-3 py-1.5 rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-100 text-xs font-bold"
                      >
                        حذف
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* تعديل عناوين وإرشادات مهمات المحور الإداري الأربع */}
          <div className="bg-white rounded-3xl p-6 border border-orange-200 shadow-sm space-y-4">
            <div>
              <span className="text-xs font-bold text-orange-600">🏛️ تخصيص المحور الإداري</span>
              <h3 className="text-base font-black text-stone-900">تعديل مسميات وإرشادات العادات الإدارية الأربع</h3>
              <p className="text-xs text-stone-500">يمكنك تعديل العنوان أو الوصف أو خطوات التنفيذ أو الوقت التقديري لأي مهمة إدارية:</p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {['lecture', 'agenda', 'attendance', 'minutes'].map((k, idx) => {
                const def = db.systemConfig?.taskDefinitions?.[k] || INITIAL_STATE.systemConfig.taskDefinitions[k];
                const updateAdminDef = (field, value) => {
                  setDb(prev => ({
                    ...prev,
                    systemConfig: {
                      ...prev.systemConfig,
                      taskDefinitions: {
                        ...(prev.systemConfig?.taskDefinitions || {}),
                        [k]: {
                          ...def,
                          [field]: value
                        }
                      }
                    }
                  }));
                };
                return (
                  <div key={k} className="p-4 rounded-2xl bg-stone-50 border border-stone-200 space-y-2.5">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-black text-orange-800">المهمة الإدارية #{idx + 1} ({k})</span>
                      <span className="text-[11px] font-bold text-stone-500">⏱ {def.durationMinutes} د</span>

                    <input

                    <input
                      value={def.subtitle}

                      placeholder="الوصف المختصر"

                      rows="2"
                      value={def.instructions}
                      onChange={e => updateAdminDef("instructions", e.target.value)}

                      placeholder="خطوات التنفيذ الإرشادية"

                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 12. ADMIN CURRICULUM & QUIZ BUILDER SECTION
    // ============================================================================
    function AdminCurriculumSection({ db, setDb, showToast }) {
      const availableWeeks = db.systemConfig?.availableCurriculumWeeks || [1, 2, 3, 4, 5, 6, 7, 8];
      const [selectedKey, setSelectedKey] = useState("default");

      const currentCurr = useMemo(() => {
        return db.weeklyCurriculums?.[selectedKey] || db.weeklyCurriculums?.default || INITIAL_STATE.weeklyCurriculums.default;
      }, [db.weeklyCurriculums, selectedKey]);

      const [lectureTitle, setLectureTitle] = useState(currentCurr.lectureTitle || "");
      const [lectureDesc, setLectureDesc] = useState(currentCurr.lectureDesc || "");
      const [videoType, setVideoType] = useState(currentCurr.videoType || "mp4");
      const [videoUrl, setVideoUrl] = useState(currentCurr.videoUrl || "");
      const [questions, setQuestions] = useState(currentCurr.questions || []);
      const [videoUploading, setVideoUploading] = useState(false);
      const [videoUploadNotice, setVideoUploadNotice] = useState("");

      useEffect(() => {
        setLectureTitle(currentCurr.lectureTitle || "");
        setLectureDesc(currentCurr.lectureDesc || "");
        setVideoType(currentCurr.videoType || "mp4");
        setVideoUrl(currentCurr.videoUrl || "");
        setVideoUploadNotice("");
        setQuestions(
          Array.isArray(currentCurr.questions)
            ? currentCurr.questions.map(q => ({ ...q, options: [...(q.options || ["", "", "", ""])] }))
            : []
        );
      }, [currentCurr, selectedKey]);

      const handleDirectVideoUpload = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const cfg = loadCloudConfig();
        if (cfg.supabaseUrl && cfg.supabaseAnonKey && window.supabase) {
          setVideoUploading(true);
          setVideoUploadNotice("جارٍ رفع الفيديو إلى سحابة سوبابيس...");
          try {
            const client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
            const ext = (file.name.split(".").pop() || "mp4").toLowerCase();
            const safePath = `lectures/week_${selectedKey}_${Date.now()}.${ext}`;
            const { error: uploadErr } = await client.storage
              .from("madyan-media")
              .upload(safePath, file, { cacheControl: "3600", upsert: true });

            if (uploadErr) {
              setVideoUploadNotice("تعذر الرفع السحابي: تأكد من تشغيل كود قاعدة البيانات لإنشاء حاوية الفيديوهات.");
              showToast("يرجى تشغيل كود قاعدة البيانات في سوبابيس لتفعيل رفع الفيديوهات.");
            } else {
              const { data: pubData } = client.storage.from("madyan-media").getPublicUrl(safePath);
              if (pubData && pubData.publicUrl) {
                setVideoType("mp4");
                setVideoUrl(pubData.publicUrl);
                setVideoUploadNotice("تم رفع الفيديو في سحابة سوبابيس بنجاح وربطه بالمحاضرة ✓");
                showToast("تم رفع الفيديو السحابي بنجاح ✓ اضغط حفظ واعتماد المحاضرة.");
              }
            }
          } catch (err) {
            setVideoUploadNotice("حدث خطأ أثناء الاتصال بسحابة سوبابيس.");
          } finally {
            setVideoUploading(false);
          }
          return;
        }

        // في حال عدم تفعيل الربط السحابي بعد، ننشئ رابط معاينة محلي مع تنبيه واضح
        const localPreviewUrl = URL.createObjectURL(file);
        setVideoType("mp4");
        setVideoUrl(localPreviewUrl);
        setVideoUploadNotice("تم تحميل الفيديو للمعاينة على هذا المتصفح فقط. لحفظ الفيديو لكل المستخدمين، اربط سحابة سوبابيس أو ضع رابط يوتيوب.");
        showToast("تم تجهيز الفيديو للمعاينة المحلية ✓");
      };

      const handleQuestionChange = (qIdx, field, val) => {
        setQuestions(prev => prev.map((q, idx) => idx === qIdx ? { ...q, [field]: val } : q));
      };

      const handleOptionChange = (qIdx, optIdx, val) => {
        setQuestions(prev => prev.map((q, idx) => {
          if (idx !== qIdx) return q;
          const nextOpts = [...(q.options || [])];
          nextOpts[optIdx] = val;
          return { ...q, options: nextOpts };
        }));
      };

      const addQuestion = () => {
        setQuestions(prev => [
          ...prev,
          {
            id: "q_" + Date.now(),
            text: "سؤال جديد حول المحاضرة الأسبوعية؟",
            options: ["الخيار الأول", "الخيار الثاني", "الخيار الثالث", "الخيار الرابع"],
            correctIndex: 0
          }
        ]);
      };

      const removeQuestion = (qIdx) => {
        if (questions.length <= 1) {
          showToast("يجب أن يحتوي الاختبار على سؤال واحد على الأقل.");
          return;
        }
        setQuestions(prev => prev.filter((_, idx) => idx !== qIdx));
      };

      const handleSaveCurriculum = (e) => {
        e.preventDefault();
        if (!lectureTitle.trim() || !videoUrl.trim()) {
          showToast("يرجى إدخال عنوان المحاضرة ورابط الفيديو.");
          return;
        }

        const updatedCurr = {
          lectureTitle: lectureTitle.trim(),
          lectureDesc: lectureDesc.trim(),
          videoType,
          videoUrl: videoUrl.trim(),
          questions
        };

        setDb(prev => ({
          ...prev,
          weeklyCurriculums: {
            ...(prev.weeklyCurriculums || {}),
            [selectedKey]: updatedCurr
          }
        }));

        showToast(
          selectedKey === "default"
            ? "تم حفظ المنهج الافتراضي لجميع الأسابيع بنجاح ✓"
            : `تم حفظ محاضرة واختبار الأسبوع ${selectedKey} بنجاح ✓`
        );
      };

      const addNewWeekSlot = () => {
        const nextWeekNum = availableWeeks.length > 0 ? Math.max(...availableWeeks) + 1 : 1;
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            availableCurriculumWeeks: [...availableWeeks, nextWeekNum]
          }
        }));
        setSelectedKey(String(nextWeekNum));
        showToast(`تمت إضافة الأسبوع ${nextWeekNum} إلى خطة المحاضرات ✓`);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <span className="text-xs font-bold text-orange-600">إدارة المحتوى المعرفي والاختبارات</span>
                <h2 className="text-lg font-black text-stone-900">تخصيص المحاضرات الأسبوعية وأسئلة الاستيعاب</h2>
                <p className="text-xs text-stone-500 mt-0.5">
                  اختر «المنهج الافتراضي» لتطبيقه تلقائياً، أو خصص محاضرة واختباراً مستقلاً لكل أسبوع.
                </p>
              </div>
              <button
                type="button"
                onClick={addNewWeekSlot}
                className="px-4 py-2.5 rounded-2xl bg-stone-900 text-white text-xs font-bold hover:bg-stone-800 transition"
              >
                + إضافة أسبوع جديد للخطة
              </button>
            </div>

            <div className="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
              <button
                type="button"
                onClick={() => setSelectedKey("default")}
                className={`px-4 py-2.5 rounded-2xl text-xs font-black border transition flex-shrink-0 ${
                  selectedKey === "default"
                    ? "madyan-gradient text-white border-transparent shadow-sm"
                    : "bg-stone-50 text-stone-700 border-stone-200 hover:bg-stone-100"
                }`}
              >
                🌟 المنهج الافتراضي العام
              </button>
              {availableWeeks.map(w => {
                const isCustom = Boolean(db.weeklyCurriculums?.[w]);
                return (
                  <button
                    key={w}
                    type="button"
                    onClick={() => setSelectedKey(String(w))}
                    className={`px-4 py-2.5 rounded-2xl text-xs font-black border transition flex-shrink-0 ${
                      String(selectedKey) === String(w)
                        ? "bg-stone-900 text-white border-stone-900 shadow-sm"
                        : "bg-stone-50 text-stone-700 border-stone-200 hover:bg-stone-100"
                    }`}
                  >
                    الأسبوع {w} {isCustom && <span className="text-orange-500 mr-1">• مخصص</span>}
                  </button>
                );
              })}
            </div>
          </div>

          <form onSubmit={handleSaveCurriculum} className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-5 bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4 h-fit">
              <h3 className="text-base font-black text-stone-900">
                🎬 بيانات الفيديو والمحاضرة ({selectedKey === "default" ? "الافتراضي" : `الأسبوع ${selectedKey}`})
              </h3>

              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">عنوان المحاضرة</label>
                <input
                  value={lectureTitle}
                  onChange={e => setLectureTitle(e.target.value)}
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-bold"
                  required
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">وصف المحاضرة</label>
                <textarea
                  rows="3"
                  value={lectureDesc}
                  onChange={e => setLectureDesc(e.target.value)}
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 p-3 text-xs leading-relaxed"
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">نوع الفيديو</label>
                  <select
                    value={videoType}
                    onChange={e => setVideoType(e.target.value)}
                    className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3 py-2.5 text-xs font-bold"
                  >
                    <option value="mp4">ملف فيديو مباشر</option>
                    <option value="youtube">رابط يوتيوب</option>
                    <option value="gdrive">رابط جوجل درايف</option>
                  </select>
                </div>
                <div className="sm:col-span-2">
                  <label className="block text-xs font-bold text-stone-700 mb-1">رابط الفيديو (يوتيوب أو جوجل درايف أو مباشر)</label>
                  <input
                    value={videoUrl}
                    onChange={e => setVideoUrl(e.target.value)}
                    placeholder="https://..."
                    className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-mono"
                    dir="ltr"
                    required
                  />
                </div>
              </div>

              <div className="rounded-2xl border border-dashed border-orange-300 bg-orange-50/50 p-3.5 space-y-2">
                <div className="flex items-center justify-between gap-2 flex-wrap">
                  <span className="text-xs font-black text-stone-800">
                    📤 أو ارفع ملف فيديو من جهازك إلى سحابة سوبابيس
                  </span>
                  <label className="cursor-pointer px-3.5 py-2 rounded-xl bg-stone-900 text-white text-xs font-bold hover:bg-stone-800 transition">
                    {videoUploading ? "جارٍ الرفع..." : "اختيار ملف فيديو"}
                    <input
                      type="file"
                      accept="video/mp4,video/webm,video/quicktime,video/*"
                      onChange={handleDirectVideoUpload}
                      disabled={videoUploading}
                      className="hidden"
                    />
                  </label>
                </div>
                {videoUploadNotice && (
                  <p className="text-[11px] font-bold text-orange-800 leading-relaxed">
                    {videoUploadNotice}
                  </p>
                )}
              </div>

              <div className="rounded-2xl overflow-hidden bg-stone-950 aspect-video border border-stone-800">
                {isIframeVideo(videoType, videoUrl) ? (
                  <iframe
                    src={getYoutubeEmbedUrl(videoUrl)}
                    title="معاينة المحاضرة"
                    className="w-full h-full"
                    allowFullScreen
                  />
                ) : (
                  <video src={videoUrl} controls className="w-full h-full object-contain" />
                )}
              </div>

              <button
                type="submit"
                className="w-full py-3.5 rounded-2xl madyan-gradient text-white text-xs font-black shadow-lg shadow-orange-500/20 hover:opacity-95 transition"
              >
                💾 حفظ واعتماد المحاضرة والاختبار
              </button>
            </div>

            <div className="lg:col-span-7 bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
              <div className="flex items-center justify-between">
                <div>
                  <h3 className="text-base font-black text-stone-900">📝 أسئلة الاختبار القصير ({questions.length})</h3>
                  <p className="text-xs text-stone-500">حدد السؤال والخيارات الأربعة والإجابة الصحيحة لكل سؤال</p>
                </div>
                <button
                  type="button"
                  onClick={addQuestion}
                  className="px-3.5 py-2 rounded-xl bg-orange-50 text-orange-700 border border-orange-200 text-xs font-black hover:bg-orange-100"
                >
                  + إضافة سؤال
                </button>
              </div>

              <div className="space-y-4">
                {questions.map((q, qIdx) => (
                  <div key={q.id || qIdx} className="p-4 rounded-2xl bg-stone-50 border border-stone-200 space-y-3">
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-xs font-black text-stone-800">السؤال #{qIdx + 1}</span>
                      <button
                        type="button"
                        onClick={() => removeQuestion(qIdx)}
                        className="text-[11px] font-bold text-rose-600 hover:underline"
                      >
                        حذف السؤال
                      </button>
                    </div>

                    <input
                      value={q.text}
                      onChange={e => handleQuestionChange(qIdx, "text", e.target.value)}
                      placeholder="نص السؤال..."
                      className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold"
                    />

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      {(q.options || []).map((opt, optIdx) => {
                        const isCorrect = Number(q.correctIndex) === optIdx;
                        return (
                          <div
                            key={optIdx}
                            className={`p-2 rounded-xl border flex items-center gap-2 ${
                              isCorrect ? "bg-emerald-50 border-emerald-400" : "bg-white border-stone-200"
                            }`}
                          >
                            <input
                              type="radio"
                              name={`correct_${qIdx}`}
                              checked={isCorrect}
                              onChange={() => handleQuestionChange(qIdx, "correctIndex", optIdx)}
                            />
                            <input
                              value={opt}
                              onChange={e => handleOptionChange(qIdx, optIdx, e.target.value)}
                              className="flex-1 bg-transparent text-xs font-semibold focus:outline-none"
                              placeholder={`خيار ${optIdx + 1}`}
                            />
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </form>
        </div>
      );
    }

    // ============================================================================
    // 13. ADMIN USERS & SYSTEM SETTINGS SECTION
    // ============================================================================
    function AdminSettingsAndUsersSection({ db, setDb, cadres, showToast }) {
      const [newName, setNewName] = useState("");
      const [newJobTitle, setNewJobTitle] = useState("");
      const [newUnit, setNewUnit] = useState("وحدة التخطيط الاستراتيجي");
      const [newUsername, setNewUsername] = useState("");
      const [newPassword, setNewPassword] = useState("1234");
      const [newRoleType, setNewRoleType] = useState("cadre");
      const [newWeeksAgo, setNewWeeksAgo] = useState(1);
      const [newMeetDay, setNewMeetDay] = useState(2);
      const [newMeetTime, setNewMeetTime] = useState("19:00");

      const [quoteText, setQuoteText] = useState("");
      const [quoteAuthor, setQuoteAuthor] = useState("منهجية Madyan");

      const handleCreateUser = (e) => {
        e.preventDefault();
        if (!newName.trim() || !newUsername.trim() || !newPassword.trim()) {
          showToast("يرجى إدخال الاسم واسم المستخدم وكلمة المرور.");
          return;
        }
        const cleanUser = newUsername.trim().toLowerCase();
        if (db.users.some(u => u.username.toLowerCase() === cleanUser)) {
          showToast("اسم المستخدم هذا مسجل بالفعل، اختر اسماً آخر.");
          return;
        }

        const weeksNum = Math.max(1, parseInt(newWeeksAgo, 10) || 1);
        const joinedTimestamp = Date.now() - ((weeksNum - 1) * MS_PER_WEEK) - (24 * 3600 * 1000);

        const initialTasks = {};
        if (newRoleType === "cadre") {
          for (let w = 1; w <= weeksNum; w++) {
            initialTasks[w] = {
              lecture: { status: "pending" },
              agenda: { status: "pending" },
              attendance: { status: "pending" },
              minutes: { status: "pending" }
            };
          }
        }

        const created = {
          id: "u_" + Date.now(),
          username: newUsername.trim(),
          password: newPassword.trim(),
          roleType: newRoleType,
          onboarded: false,
          joinedAt: joinedTimestamp,
          name: newName.trim(),
          jobTitle: newJobTitle.trim() || (newRoleType === "executive" ? "عضو المكتب التنفيذي" : "كادر إداري"),
          unit: newUnit.trim() || "الإدارة العامة",
          defaultSchedule: {
            meetDay: parseInt(newMeetDay, 10),
            meetTime: newMeetTime,
            meetDuration: 90
          },
          weekOverrides: {},
          tasksRecord: initialTasks
        };

        setDb(prev => ({
          ...prev,
          users: [...prev.users, created]
        }));

        setNewName("");
        setNewJobTitle("");
        setNewUsername("");
        showToast(`تم إنشاء الحساب (${created.name}) بنجاح ✓`);
      };

      const handleDeleteUser = (userId) => {
        const target = db.users.find(u => u.id === userId);
        if (!target) return;
        if (target.roleType === "admin" && db.users.filter(u => u.roleType === "admin").length <= 1) {
          showToast("لا يمكن حذف حساب المدير الوحيد في النظام.");
          return;
        }
        setDb(prev => ({
          ...prev,
          users: prev.users.filter(u => u.id !== userId)
        }));
        showToast("تم حذف الحساب من المنصة.");
      };

      const handleAddQuote = (e) => {
        e.preventDefault();
        if (!quoteText.trim()) return;
        const nextQuote = {
          id: Date.now(),
          text: quoteText.trim(),
          author: quoteAuthor.trim() || "منهجية Madyan"
        };
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            quotes: [nextQuote, ...(prev.systemConfig?.quotes || [])]
          }
        }));
        setQuoteText("");
        showToast("تمت إضافة الاقتباس التحفيزي بنجاح 🌱");
      };

      const handleDeleteQuote = (id) => {
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            quotes: (prev.systemConfig?.quotes || []).filter(q => q.id !== id)
          }
        }));
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div className="lg:col-span-5 bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4 h-fit">
            <div>
              <span className="text-xs font-bold text-orange-600">إدارة الحسابات والصلاحيات</span>
              <h2 className="text-lg font-black text-stone-900">توليد حساب جديد (كادر / تنفيذي / مدير)</h2>
            </div>

            <form onSubmit={handleCreateUser} className="space-y-3.5">
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">نوع الصلاحية (Role)</label>
                <select
                  value={newRoleType}
                  onChange={e => setNewRoleType(e.target.value)}
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-black"
                >
                  <option value="cadre">👤 كادر إداري (Cadre)</option>
                  <option value="executive">🏛️ عضو المكتب التنفيذي (Executive)</option>
                  <option value="admin">🛡️ مدير النظام والـ HR (Admin)</option>
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">الاسم الكامل</label>
                <input
                  value={newName}
                  onChange={e => setNewName(e.target.value)}
                  placeholder="مثال: خالد العتيبي"
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-bold"
                  required
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">المسمى الوظيفي</label>
                  <input
                    value={newJobTitle}
                    onChange={e => setNewJobTitle(e.target.value)}
                    placeholder="منسق مشاريع"
                    className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3 py-2 text-xs font-bold"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">الوحدة الإدارية</label>
                  <input
                    value={newUnit}
                    onChange={e => setNewUnit(e.target.value)}
                    placeholder="وحدة التخطيط"
                    className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3 py-2 text-xs font-bold"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3 p-3.5 rounded-2xl bg-orange-50/60 border border-orange-200/80">
                <div>
                  <label className="block text-[11px] font-bold text-stone-700 mb-1">اسم المستخدم (Username)</label>
                  <input
                    value={newUsername}
                    onChange={e => setNewUsername(e.target.value)}
                    placeholder="khalid"
                    className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-mono font-bold"
                    dir="ltr"
                    required
                  />
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-stone-700 mb-1">كلمة المرور الابتدائية</label>
                  <input
                    value={newPassword}
                    onChange={e => setNewPassword(e.target.value)}
                    className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-mono font-bold"
                    dir="ltr"
                    required
                  />
                </div>
              </div>

              {newRoleType === "cadre" && (
                <div className="grid grid-cols-3 gap-2">
                  <div>
                    <label className="block text-[11px] font-bold text-stone-700 mb-1">عدد الأسابيع</label>
                    <input
                      type="number"
                      min="1"
                      max="52"
                      value={newWeeksAgo}
                      onChange={e => setNewWeeksAgo(e.target.value)}
                      className="w-full rounded-xl border border-stone-200 bg-stone-50 px-3 py-2 text-xs font-bold"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-stone-700 mb-1">يوم الاجتماع</label>
                    <select
                      value={newMeetDay}
                      onChange={e => setNewMeetDay(e.target.value)}
                      className="w-full rounded-xl border border-stone-200 bg-stone-50 px-2 py-2 text-xs font-bold"
                    >
                      {DAYS_AR.map((d, i) => <option key={i} value={i}>{d}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-stone-700 mb-1">الوقت</label>
                    <input
                      type="time"
                      value={newMeetTime}
                      onChange={e => setNewMeetTime(e.target.value)}
                      className="w-full rounded-xl border border-stone-200 bg-stone-50 px-2 py-2 text-xs font-bold"
                    />
                  </div>
                </div>
              )}

              <button
                type="submit"
                className="w-full py-3.5 rounded-2xl madyan-gradient text-white text-xs font-black shadow-lg shadow-orange-500/20 hover:opacity-95"
              >
                + توليد الحساب وتفعيله فوراً
              </button>
            </form>
          </div>

          <div className="lg:col-span-7 space-y-6">
            <div className="bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
              <h3 className="text-base font-black text-stone-900">👥 الحسابات المسجلة بالنظام ({db.users.length})</h3>
              <div className="space-y-2.5 max-h-96 overflow-y-auto pr-1">
                {db.users.map(u => (
                  <div key={u.id} className="p-3.5 rounded-2xl bg-stone-50 border border-stone-200/80 flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="text-sm font-black text-stone-900">{u.name}</span>
                        <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${
                          u.roleType === "admin"
                            ? "bg-stone-900 text-white"
                            : u.roleType === "executive"
                            ? "bg-orange-100 text-orange-800"
                            : "bg-emerald-100 text-emerald-800"
                        }`}>
                          {u.roleType === "admin" ? "مدير النظام" : u.roleType === "executive" ? "المكتب التنفيذي" : "كادر"}
                        </span>
                      </div>
                      <div className="text-[11px] text-stone-500 mt-0.5">
                        {u.unit} • {u.jobTitle}
                      </div>
                    </div>

                    <div className="flex items-center gap-2">
                      <span className="font-mono text-xs bg-white px-2.5 py-1 rounded-xl border border-stone-200 font-bold text-stone-700">
                        {u.username} / {u.password}
                      </span>
                      <button
                        type="button"
                        onClick={() => handleDeleteUser(u.id)}
                        className="px-2.5 py-1 rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-100 text-[11px] font-bold"
                      >
                        حذف
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
              <h3 className="text-base font-black text-stone-900">🌱 الاقتباسات والرسائل التحفيزية ({db.systemConfig?.quotes?.length || 0})</h3>
              <form onSubmit={handleAddQuote} className="flex flex-wrap gap-2">
                <input
                  value={quoteText}
                  onChange={e => setQuoteText(e.target.value)}
                  placeholder="أضف حكمة أو رسالة تحفيزية أسبوعية..."
                  className="flex-1 min-w-[200px] rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2 text-xs font-bold"
                />
                <input
                  value={quoteAuthor}
                  onChange={e => setQuoteAuthor(e.target.value)}
                  placeholder="المصدر"
                  className="w-36 rounded-2xl border border-stone-200 bg-stone-50 px-3 py-2 text-xs font-bold"
                />
                <button type="submit" className="px-4 py-2 rounded-2xl bg-stone-900 text-white text-xs font-bold">
                  إضافة
                </button>
              </form>
              <div className="space-y-2">
                {(db.systemConfig?.quotes || []).map(q => (
                  <div key={q.id} className="p-3 rounded-2xl bg-stone-50 border border-stone-200 flex items-center justify-between gap-2 text-xs">
                    <div>
                      <span className="font-bold text-stone-800">“{q.text}”</span>
                      <span className="text-stone-400 mr-2">— {q.author}</span>
                    </div>
                    <button onClick={() => handleDeleteQuote(q.id)} className="text-rose-600 font-bold text-[11px]">حذف</button>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 14. CADRE INSPECTOR MODAL (يعرض تفاصيل المحور الإداري + التربوي + الاختبار)
    // ============================================================================
    function CadreInspectorModal({ cadre, db, onClose }) {
      if (!cadre) return null;
      const totalWeeks = calculateWeeksSinceJoin(cadre.joinedAt);
      const metrics = computeCadreMetrics(cadre, db.systemConfig);
      const tarbawiTasks = getApplicableTarbawiTasks(cadre, db.systemConfig);

      return (
        <ModalContainer
          isOpen={Boolean(cadre)}
          onClose={onClose}
          badge={`فحص السجل التفصيلي • ${cadre.unit}`}
          title={`${cadre.name} (@${cadre.username})`}
          maxWidth="max-w-3xl"
        >
          <div className="space-y-4">
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-center">
              <div className="p-3 rounded-2xl bg-stone-50 border border-stone-200">
                <div className="text-[11px] text-stone-400 font-bold">السكور العام</div>
                <div className="text-xl font-black text-stone-900 mt-0.5">{metrics.overallScorePct}%</div>
              </div>
              <div className="p-3 rounded-2xl bg-orange-50 border border-orange-200">
                <div className="text-[11px] text-orange-800 font-bold">🏛️ المحور الإداري</div>
                <div className="text-xl font-black text-orange-700 mt-0.5">{metrics.adminScorePct}%</div>
              </div>
              <div className="p-3 rounded-2xl bg-emerald-50 border border-emerald-200">
                <div className="text-[11px] text-emerald-800 font-bold">🌱 المحور التربوي</div>
                <div className="text-xl font-black text-emerald-700 mt-0.5">{metrics.tarbawiScorePct}%</div>
              </div>
              <div className="p-3 rounded-2xl bg-sky-50 border border-sky-200">
                <div className="text-[11px] text-sky-800 font-bold">متوسط الاختبارات</div>
                <div className="text-xl font-black text-sky-700 mt-0.5">
                  {metrics.avgQuizPct !== null ? `${metrics.avgQuizPct}%` : "—"}
                </div>
              </div>
            </div>

            <div className="space-y-3 max-h-[58vh] overflow-y-auto pr-1">
              {Array.from({ length: totalWeeks }, (_, idx) => {
                const w = totalWeeks - idx;
                const wRec = cadre.tasksRecord?.[w] || {};
                const curr = db.weeklyCurriculums?.[w] || db.weeklyCurriculums?.default || INITIAL_STATE.weeklyCurriculums.default;
                const quizSub = wRec.lecture?.quizSubmission;

                return (
                  <div key={w} className="p-4 rounded-2xl bg-stone-50 border border-stone-200 space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-black text-stone-900">
                        📅 الأسبوع {w} ({getWeekDateRangeLabel(w, totalWeeks)})
                      </span>
                      {quizSub && (
                        <span className="text-xs font-black px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800">
                          درجة الاختبار: {quizSub.score}/{quizSub.total}
                        </span>
                      )}
                    </div>

                    {/* مهام المحور الإداري */}
                    <div>
                      <div className="text-[11px] font-black text-orange-800 mb-1.5">🏛️ المحور الإداري:</div>
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                        {['lecture', 'agenda', 'attendance', 'minutes'].map(k => {
                          const t = wRec[k] || { status: "pending" };
                          const labels = { lecture: "المحاضرة", agenda: "الأجندة", attendance: "الحضور", minutes: "المحضر" };
                          return (
                            <div key={k} className="p-2.5 rounded-xl bg-white border border-stone-200/80 space-y-1">
                              <div className="font-black text-stone-700">{labels[k]}</div>
                              <div className={`text-[11px] font-bold ${
                                t.status === "on_time" ? "text-emerald-600" : t.status === "late" ? "text-amber-600" : "text-rose-500"
                              }`}>
                                {t.status === "on_time" ? "✓ في الموعد" : t.status === "late" ? "⚠️ متأخر" : "• غير منجز"}
                              </div>
                              {t.completedAt && <div className="text-[10px] text-stone-400">{t.completedAt}</div>}
                              {t.note && <div className="text-[10px] text-amber-800 bg-amber-50 p-1 rounded">📌 {t.note}</div>}
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {/* مهام المحور التربوي */}
                    <div>
                      <div className="text-[11px] font-black text-emerald-800 mb-1.5">🌱 المحور التربوي:</div>
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                        {tarbawiTasks.map(td => {
                          const t = wRec[td.id] || { status: "pending", daysCompleted: [] };
                          const dCount = Array.isArray(t.daysCompleted) ? t.daysCompleted.length : 0;
                          return (
                            <div key={td.id} className="p-2.5 rounded-xl bg-white border border-emerald-200/60 space-y-1">
                              <div className="font-black text-stone-700">{td.icon} {td.title}</div>
                              <div className={`text-[11px] font-bold ${
                                t.status === "on_time" ? "text-emerald-600" : "text-stone-400"
                              }`}>
                                {t.status === "on_time"
                                  ? "✓ مكتمل"
                                  : td.trackType === "daily_days" && dCount > 0
                                  ? `⏳ ${dCount}/${td.targetDays || 5} أيام`
                                  : "• قيد الإنجاز"}
                              </div>
                              {t.note && <div className="text-[10px] text-emerald-800 bg-emerald-50 p-1 rounded">✍️ {t.note}</div>}
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {quizSub && Array.isArray(curr.questions) && (
                      <div className="pt-2 border-t border-stone-200/70 space-y-1.5">
                        <div className="text-[11px] font-black text-stone-600">إجابات الكادر في اختبار المحاضرة:</div>
                        {curr.questions.map((q, qIdx) => {
                          const picked = quizSub.answers?.[qIdx];
                          const isRight = picked === q.correctIndex;
                          return (
                            <div key={qIdx} className="text-[11px] flex flex-wrap items-center justify-between gap-2 bg-white px-3 py-1.5 rounded-xl border border-stone-200/60">
                              <span className="font-bold text-stone-700">{qIdx + 1}. {q.text}</span>
                              <span className={isRight ? "text-emerald-700 font-black" : "text-rose-600 font-black"}>
                                {isRight ? "✅ " : "❌ "}
                                {q.options?.[picked] ?? "لم يجب"}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </ModalContainer>
      );
    }

    // ============================================================================
    // 15. CLOUD DATABASE SETUP MODAL
    // ============================================================================
    function CloudSetupModal({
      isOpen, onClose, cloudConfig, cloudStatus, cloudError, lastSyncAt, onSaveConfig, onDisconnect, showToast
    }) {
      const [url, setUrl] = useState(cloudConfig?.supabaseUrl || "");
      const [anonKey, setAnonKey] = useState(cloudConfig?.supabaseAnonKey || "");

      useEffect(() => {
        if (isOpen) {
          setUrl(cloudConfig?.supabaseUrl || "");
          setAnonKey(cloudConfig?.supabaseAnonKey || "");
        }
      }, [isOpen, cloudConfig]);

      if (!isOpen) return null;

      const copySql = () => {
        navigator.clipboard.writeText(SQL_SCHEMA_SNIPPET);
        showToast("تم نسخ كود إنشاء جدول SQL! الصقه في Supabase SQL Editor واضغط Run ✓");
      };

      return (
        <ModalContainer
          isOpen={isOpen}
          onClose={onClose}
          badge="Full-Stack Cloud Architecture (Supabase + GitHub + Netlify)"
          title="☁️ إعداد ومزامنة قاعدة البيانات الحقيقية (Supabase PostgreSQL)"
          maxWidth="max-w-2xl"
        >
          <div className="space-y-4">
            <div className={`p-4 rounded-2xl border text-xs space-y-1 ${
              cloudStatus === "connected"
                ? "bg-emerald-50 border-emerald-300 text-emerald-900"
                : cloudStatus === "error"
                ? "bg-rose-50 border-rose-300 text-rose-900"
                : "bg-stone-50 border-stone-200 text-stone-700"
            }`}>
              <div className="font-black text-sm">
                {cloudStatus === "connected"
                  ? `✅ متصل فعلياً بقاعدة بيانات Supabase (آخر مزامنة: ${lastSyncAt || "الآن"})`
                  : cloudStatus === "error"
                  ? "⚠️ تعذر إتمام المزامنة مع Supabase"
                  : "ℹ️ يعمل التطبيق حالياً بالذاكرة المحلية أو عبر متغيرات البيئة في Netlify"}
              </div>
              {cloudError && <p className="text-xs font-bold text-rose-700 mt-1">{cloudError}</p>}
            </div>

            <div className="p-4 rounded-2xl bg-stone-50 border border-stone-200 space-y-2.5">
              <div className="flex items-center justify-between">
                <span className="text-xs font-black text-stone-900">1️⃣ الخطوة الأولى: تهيئة الجدول في Supabase SQL Editor</span>
                <button
                  type="button"
                  onClick={copySql}
                  className="px-3 py-1.5 rounded-xl bg-stone-900 text-white text-[11px] font-bold hover:bg-orange-600 transition"
                >
                  📋 نسخ كود الـ SQL
                </button>
              </div>
              <pre className="text-[11px] bg-stone-900 text-emerald-300 p-3 rounded-xl overflow-x-auto font-mono" dir="ltr">
                {SQL_SCHEMA_SNIPPET}
              </pre>
            </div>

            <div className="space-y-3">
              <div className="text-xs font-black text-stone-900">
                2️⃣ الخطوة الثانية: أدخل بيانات مشروعك من (Supabase Project Settings → API)
              </div>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">رابط المشروع (Supabase Project URL)</label>
                <input
                  value={url}
                  onChange={e => setUrl(e.target.value)}
                  placeholder="https://xxxxxxxxxxxx.supabase.co"
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-mono font-bold"
                  dir="ltr"
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">المفتاح العام (Supabase anon / public Key)</label>
                <input
                  value={anonKey}
                  onChange={e => setAnonKey(e.target.value)}
                  placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-mono font-bold"
                  dir="ltr"
                />
              </div>
            </div>

            <div className="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-stone-100">
              {cloudConfig?.supabaseUrl ? (
                <button
                  type="button"
                  onClick={onDisconnect}
                  className="px-4 py-2.5 rounded-2xl bg-rose-50 text-rose-700 text-xs font-bold"
                >
                  فصل الاتصال السحابي
                </button>
              ) : <div />}

              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2.5 rounded-2xl bg-stone-100 text-stone-700 text-xs font-bold"
                >
                  إغلاق
                </button>
                <button
                  type="button"
                  onClick={() => {
                    if (!url.trim() || !anonKey.trim()) {
                      showToast("يرجى إدخال Project URL و Anon Key أولاً.");
                      return;
                    }
                    onSaveConfig(url, anonKey);
                    onClose();
                  }}
                  className="px-6 py-2.5 rounded-2xl madyan-gradient text-white text-xs font-black shadow-md"
                >
                  ☁️ حفظ الاتصال ومزامنة البيانات الآن
                </button>
              </div>
            </div>
          </div>
        </ModalContainer>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
