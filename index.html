                          </span>
                          <span className="text-[11px] font-bold text-stone-700">
                            🏛️ {bul.senderName} ({bul.senderRole})
                          </span>
                          {bul.targetType === "custom" ? (
                            <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-purple-50 text-purple-700 border border-purple-200">
                              🎯 تعميم مخصص
                            </span>
                          ) : (
                            <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-stone-200/70 text-stone-600">
                              🌐 تعميم عام
                            </span>
                          )}
                        </div>
                        <span className="text-[11px] font-semibold text-stone-400">{bul.createdAt}</span>
                      </div>

                      <h4 className="text-sm font-black text-stone-900">{bul.title}</h4>
                      <p className="text-xs text-stone-600 leading-relaxed whitespace-pre-line">{bul.content}</p>

                      <div className="pt-2 border-t border-stone-200/60 flex items-center justify-between">
                        {ackTime ? (
                          <span className="text-[11px] font-bold text-emerald-700 flex items-center gap-1">
                            <span>✓ تم الاطلاع والاستيعاب</span>
                            <span className="text-stone-400 font-normal">({ackTime})</span>
                          </span>
                        ) : (
                          <span className="text-[11px] font-bold text-rose-600">
                            ⏳ لم يتم تأكيد الاستيعاب بعد
                          </span>
                        )}

                        {!ackTime && (
                          <button
                            onClick={() => onAcknowledge(bul.id, currentUserId)}
                            className="px-4 py-1.5 rounded-xl madyan-gradient text-white text-xs font-black shadow-sm"
                          >
                            تأكيد الاستيعاب الآن ✓
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })
              )}
            </div>

            <div className="flex justify-end pt-2 border-t border-stone-100">
              <button
                onClick={onClose}
                className="px-6 py-2.5 rounded-2xl bg-stone-900 text-white text-xs font-bold"
              >
                إغلاق السجل
              </button>
            </div>
          </div>
        </ModalContainer>
      );
    }

    // ============================================================================
    // 7. LECTURE VIDEO & LOCKED QUIZ MODAL
    // ============================================================================
    function LectureQuizModal({ isOpen, onClose, weekNumber, isPastWeek, curriculum, lectureRecord, onSubmitQuiz }) {
      const existingSubmission = lectureRecord?.quizSubmission || null;
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [errorMsg, setErrorMsg] = useState("");

      useEffect(() => {
        if (existingSubmission && existingSubmission.answers) {
          const map = {};
          existingSubmission.answers.forEach((ans, i) => { map[i] = ans; });
          setSelectedAnswers(map);
        } else {
          setSelectedAnswers({});
        }
        setErrorMsg("");
      }, [isOpen, existingSubmission]);

      if (!isOpen) return null;

      const safeCurr = curriculum || INITIAL_STATE.weeklyCurriculums.default;
      const questions = safeCurr.questions || [];

      const handleFinalSubmit = () => {
        if (existingSubmission) return;
        for (let i = 0; i < questions.length; i++) {
          if (selectedAnswers[i] === undefined) {
            setErrorMsg(`يرجى الإجابة على السؤال رقم ${i + 1} قبل الاعتماد النهائي.`);
            return;
          }
        }
        let correctCount = 0;
        const answersArray = questions.map((q, idx) => {
          const ans = selectedAnswers[idx];
          if (ans === q.correctIndex) correctCount++;
          return ans;
        });

        onSubmitQuiz({
          score: correctCount,
          total: questions.length,
          answers: answersArray,
          submittedAt: new Date().toLocaleString("ar-EG")
        });
      };

      return (
        <ModalContainer
          isOpen={isOpen}
          onClose={onClose}
          badge={`المحاضرة الأسبوعية • الأسبوع ${weekNumber}`}
          title={safeCurr.lectureTitle}
          maxWidth="max-w-2xl"
        >
          <div className="space-y-5">
            {isPastWeek && !existingSubmission && (
              <div className="p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-900 font-bold">
                ⚠️ تنبيه: هذا الأسبوع قد انتهى بالفعل. يمكنك مشاهدة المحاضرة وحل الاختبار الآن، ولكن ستُسجل المهمة «مكتمل متأخر» بنصف النقاط (50%).
              </div>
            )}

            <p className="text-xs text-stone-500 leading-relaxed">{safeCurr.lectureDesc}</p>

            <div className="rounded-2xl overflow-hidden bg-stone-950 border border-stone-800 aspect-video relative">
              {isIframeVideo(safeCurr.videoType, safeCurr.videoUrl) ? (
                <iframe
                  src={getYoutubeEmbedUrl(safeCurr.videoUrl)}
                  title={safeCurr.lectureTitle}
                  className="w-full h-full"
                  sandbox="allow-scripts allow-same-origin allow-presentation"
                  allowFullScreen
                />
              ) : (
                <video
                  src={safeCurr.videoUrl}
                  controls
                  controlsList="nodownload"
                  onContextMenu={e => e.preventDefault()}
                  className="w-full h-full object-contain"
                />
              )}
            </div>

            <div className="space-y-4 pt-2 border-t border-stone-100">
              <div className="flex items-center justify-between">
                <h4 className="text-sm font-black text-stone-900">
                  📝 اختبار استيعاب المحاضرة ({questions.length} أسئلة)
                </h4>
                {existingSubmission ? (
                  <span className="text-xs font-black px-3 py-1 rounded-full bg-emerald-100 text-emerald-800">
                    🔒 تم الاعتماد النهائي • النتيجة: {existingSubmission.score}/{existingSubmission.total}
                  </span>
                ) : (
                  <span className="text-[11px] font-bold text-stone-400">
                    تنبيه: لا يمكن تعديل الإجابات بعد الضغط على اعتماد
                  </span>
                )}
              </div>

              {questions.map((q, qIdx) => {
                const userChoice = selectedAnswers[qIdx];
                return (
                  <div key={q.id || qIdx} className="p-4 rounded-2xl bg-stone-50 border border-stone-200/80 space-y-2.5">
                    <div className="text-xs font-black text-stone-800">
                      {qIdx + 1}. {q.text}
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {(q.options || []).map((opt, optIdx) => {
                        const isSelected = userChoice === optIdx;
                        const isCorrect = q.correctIndex === optIdx;

                        let btnStyle = "bg-white border-stone-200 text-stone-700 hover:border-orange-400";
                        if (existingSubmission) {
                          if (isCorrect) {
                            btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-900 font-black";
                          } else if (isSelected && !isCorrect) {
                            btnStyle = "bg-rose-50 border-rose-400 text-rose-800 line-through";
                          } else {
                            btnStyle = "bg-white border-stone-200 text-stone-400 opacity-70";
                          }
                        } else if (isSelected) {
                          btnStyle = "bg-orange-50 border-orange-500 text-orange-900 font-black ring-2 ring-orange-200";
                        }

                        return (
                          <button
                            key={optIdx}
                            type="button"
                            disabled={Boolean(existingSubmission)}
                            onClick={() => setSelectedAnswers(prev => ({ ...prev, [qIdx]: optIdx }))}
                            className={`text-right text-xs p-3 rounded-xl border transition flex items-center justify-between gap-2 ${btnStyle}`}
                          >
                            <span>{opt}</span>
                            {existingSubmission && isCorrect && <span>✅</span>}
                            {existingSubmission && isSelected && !isCorrect && <span>❌</span>}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}

              {errorMsg && (
                <div className="text-xs font-bold text-rose-600 bg-rose-50 p-3 rounded-xl border border-rose-200">
                  {errorMsg}
                </div>
              )}

              <div className="flex justify-end gap-2 pt-2">
                <button
                  onClick={onClose}
                  className="px-5 py-2.5 rounded-2xl bg-stone-100 text-stone-700 text-xs font-bold"
                >
                  إغلاق
                </button>
                {!existingSubmission && (
                  <button
                    onClick={handleFinalSubmit}
                    className="px-6 py-2.5 rounded-2xl madyan-gradient text-white text-xs font-black shadow-md hover:opacity-95"
                  >
                    اعتماد الإجابات النهائي ورصد الدرجة ✓
                  </button>
                )}
              </div>
            </div>
          </div>
        </ModalContainer>
      );
    }

    // ============================================================================
    // 8. ONBOARDING MODAL
    // ============================================================================
    function OnboardingModal({ isOpen, onClose, currentUser, taskDefs, isUsernameTaken, onSaveOnboarding }) {
      const [step, setStep] = useState(1);
      const [name, setName] = useState(currentUser.name || "");
      const [jobTitle, setJobTitle] = useState(currentUser.jobTitle || "");
      const [unit, setUnit] = useState(currentUser.unit || "");
      const [username, setUsername] = useState(currentUser.username || "");
      const [password, setPassword] = useState(currentUser.password || "");
      const [meetDay, setMeetDay] = useState(currentUser.defaultSchedule?.meetDay ?? 2);
      const [meetTime, setMeetTime] = useState(currentUser.defaultSchedule?.meetTime || "19:00");
      const [meetDuration, setMeetDuration] = useState(currentUser.defaultSchedule?.meetDuration || 90);
      const [err, setErr] = useState("");

      if (!isOpen) return null;

      const previewSched = computeWeekSchedule({ meetDay, meetTime, meetDuration }, taskDefs);

      const handleNextStep1 = () => {
        if (!username.trim() || !password.trim()) {
          setErr("اسم المستخدم وكلمة المرور مطلوبان.");
          return;
        }
        if (isUsernameTaken(username, currentUser.id)) {
          setErr("اسم المستخدم هذا مستخدم بالفعل، اختر اسماً آخر.");
          return;
        }
        setErr("");
        setStep(2);
      };

      const handleFinish = () => {
        onSaveOnboarding({
          name: name.trim() || currentUser.name,
          jobTitle: jobTitle.trim() || currentUser.jobTitle,
          unit: unit.trim() || currentUser.unit,
          username: username.trim(),
          password: password.trim(),
          defaultSchedule: {
            meetDay: parseInt(meetDay, 10),
            meetTime,
            meetDuration: parseInt(meetDuration, 10)
          }
        });
      };

      return (
        <ModalContainer
          isOpen={isOpen}
          onClose={onClose}
          badge="تهيئة الحساب عند الدخول الأول"
          title="ضبط ملفك الإداري ومواعيدك الأسبوعية"
        >
          {step === 1 && (
            <div className="space-y-4">
              <p className="text-xs text-stone-500 leading-relaxed">
                مرحباً بك في <strong>Madyan</strong>. يمكنك مراجعة بياناتك الإدارية، كما يمكنك <strong>اختيارياً</strong> تعديل اسم المستخدم وكلمة المرور الخاصة بك:
              </p>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">الاسم الكامل</label>
                <input value={name} onChange={e => setName(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold" />
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">المسمى الوظيفي</label>
                  <input value={jobTitle} onChange={e => setJobTitle(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">الوحدة الإدارية</label>
                  <input value={unit} onChange={e => setUnit(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold" />
                </div>
              </div>

              <div className="p-3.5 rounded-2xl bg-orange-50/70 border border-orange-200/80 space-y-3">
                <div className="text-xs font-black text-orange-900">🔐 بيانات تسجيل الدخول (اختياري: يمكنك تغييرها الآن)</div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[11px] font-bold text-stone-700 mb-1">اسم المستخدم (Username)</label>
                    <input value={username} onChange={e => setUsername(e.target.value)} className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold" />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-stone-700 mb-1">كلمة المرور (Password)</label>
                    <input type="text" value={password} onChange={e => setPassword(e.target.value)} className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold" />
                  </div>
                </div>
              </div>

              {err && <div className="text-xs font-bold text-rose-600">{err}</div>}

              <div className="flex justify-end pt-2">
                <button onClick={handleNextStep1} className="px-7 py-3 rounded-2xl bg-stone-900 text-white text-xs font-bold">
                  التالي: تحديد موعد الاجتماع ←
                </button>
              </div>
            </div>
          )}

          {step === 2 && (
            <div className="space-y-4">
              <p className="text-xs text-stone-500">
                حدّد موعد اجتماعك الأسبوعي وعدد ساعاته ليقوم النظام بحساب موعد الأجندة (قبل 24 ساعة) والمحضر (بعد 24 ساعة):
              </p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">يوم الاجتماع الأسبوعي</label>
                  <select value={meetDay} onChange={e => setMeetDay(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold">
                    {DAYS_AR.map((d, i) => <option key={i} value={i}>{d}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">ساعة بدء الاجتماع</label>
                  <input type="time" value={meetTime} onChange={e => setMeetTime(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold" />
                </div>
              </div>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">مدة الاجتماع</label>
                <select value={meetDuration} onChange={e => setMeetDuration(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold">
                  <option value="60">ساعة واحدة (60 دقيقة)</option>
                  <option value="90">ساعة ونصف (90 دقيقة)</option>
                  <option value="120">ساعتان (120 دقيقة)</option>
                  <option value="180">3 ساعات (180 دقيقة)</option>
                </select>
              </div>

              <div className="bg-stone-50 p-3.5 rounded-2xl border border-stone-200 text-xs space-y-1.5">
                <div className="font-black text-stone-800 mb-1">المعاينة الذكية لمواعيدك:</div>
                <div>📋 <strong>إرسال الأجندة:</strong> يوم {previewSched.agenda.dayName} ({previewSched.agenda.timeLabel})</div>
                <div>🤝 <strong>حضور اللقاء:</strong> يوم {previewSched.attendance.dayName} ({previewSched.attendance.timeLabel})</div>
                <div>📝 <strong>توثيق المحضر:</strong> يوم {previewSched.minutes.dayName} ({previewSched.minutes.timeLabel})</div>
              </div>

              <div className="flex justify-between pt-2">
                <button onClick={() => setStep(1)} className="px-5 py-2.5 rounded-2xl bg-stone-100 text-stone-700 text-xs font-bold">السابق</button>
                <button onClick={handleFinish} className="px-7 py-3 rounded-2xl madyan-gradient text-white text-xs font-black shadow-md">
                  اعتماد والبدء الآن ✓
                </button>
              </div>
            </div>
          )}
        </ModalContainer>
      );
    }

    // ============================================================================
    // 9. CADRE SETTINGS MODAL & NOTE MODAL
    // ============================================================================
    function CadreSettingsModal({ scope, onClose, currentUser, selectedWeek, isPastWeek, governanceRules = DEFAULT_GOVERNANCE_RULES, isUsernameTaken, onSaveSettings }) {
      const rules = { ...DEFAULT_GOVERNANCE_RULES, ...(governanceRules || {}) };
      const [activeTab, setActiveTab] = useState(scope || "global");
      const [meetDay, setMeetDay] = useState(currentUser.defaultSchedule?.meetDay ?? 2);
      const [meetTime, setMeetTime] = useState(currentUser.defaultSchedule?.meetTime || "19:00");
      const [meetDuration, setMeetDuration] = useState(currentUser.defaultSchedule?.meetDuration || 90);

      const [name, setName] = useState(currentUser.name || "");
      const [jobTitle, setJobTitle] = useState(currentUser.jobTitle || "");
      const [unit, setUnit] = useState(currentUser.unit || "");
      const [username, setUsername] = useState(currentUser.username || "");
      const [password, setPassword] = useState(currentUser.password || "");
      const [err, setErr] = useState("");

      useEffect(() => {
        if (!scope) return;
        const targetTab = (scope === "week" && isPastWeek) ? "global" : scope;
        setActiveTab(targetTab);
        const sched = targetTab === "week"
          ? (currentUser.weekOverrides?.[selectedWeek] || currentUser.defaultSchedule)
          : currentUser.defaultSchedule;
        setMeetDay(sched?.meetDay ?? 2);
        setMeetTime(sched?.meetTime || "19:00");
        setMeetDuration(sched?.meetDuration || 90);
        setName(currentUser.name || "");
        setJobTitle(currentUser.jobTitle || "");
        setUnit(currentUser.unit || "");
        setUsername(currentUser.username || "");
        setPassword(currentUser.password || "");
        setErr("");
      }, [scope, currentUser, selectedWeek, isPastWeek]);

      if (!scope) return null;

      const switchTab = (t) => {
        setActiveTab(t);
        const sched = t === "week"
          ? (currentUser.weekOverrides?.[selectedWeek] || currentUser.defaultSchedule)
          : currentUser.defaultSchedule;
        setMeetDay(sched?.meetDay ?? 2);
        setMeetTime(sched?.meetTime || "19:00");
        setMeetDuration(sched?.meetDuration || 90);
        setErr("");
      };

      const isScheduleLocked = activeTab === "week"
        ? (!rules.allowCadreScheduleChange || !rules.allowWeekSpecificOverride)
        : !rules.allowCadreScheduleChange;

      const handleSave = () => {
        if (activeTab === "account") {
          if (!username.trim() || !password.trim()) {
            setErr("اسم المستخدم وكلمة المرور لا يمكن أن يكونا فارغين.");
            return;
          }
          if (isUsernameTaken(username, currentUser.id)) {
            setErr("اسم المستخدم محجوز لكادر آخر.");
            return;
          }
          onSaveSettings(u => ({
            ...u,
            name: rules.allowCadreNameEdit ? (name.trim() || u.name) : u.name,
            jobTitle: rules.allowCadreJobTitleEdit ? (jobTitle.trim() || u.jobTitle) : u.jobTitle,
            unit: rules.allowCadreUnitEdit ? (unit.trim() || u.unit) : u.unit,
            username: rules.allowCadrePasswordChange ? username.trim() : u.username,
            password: rules.allowCadrePasswordChange ? password.trim() : u.password
          }));
        } else if (activeTab === "week") {
          if (isScheduleLocked) {
            setErr("تغيير مواعيد اللقاء الأسبوعي مقفل حالياً وفق ضوابط إدارة المنصة.");
            return;
          }
          onSaveSettings(u => ({
            ...u,
            weekOverrides: {
              ...(u.weekOverrides || {}),
              [selectedWeek]: {
                meetDay: parseInt(meetDay, 10),
                meetTime,
                meetDuration: parseInt(meetDuration, 10)
              }
            }
          }));
        } else {
          if (isScheduleLocked) {
            setErr("تغيير المواعيد العامة مقفل حالياً وفق ضوابط إدارة المنصة.");
            return;
          }
          onSaveSettings(u => ({
            ...u,
            defaultSchedule: {
              meetDay: parseInt(meetDay, 10),
              meetTime,
              meetDuration: parseInt(meetDuration, 10)
            }
          }));
        }
      };

      return (
        <ModalContainer
          isOpen={Boolean(scope)}
          onClose={onClose}
          badge="إعدادات الكادر (مؤطرة بضوابط إدارة المنصة)"
          title="تخصيص المواعيد وبيانات الحساب"
        >
          <div className="space-y-4">
            <div className="grid grid-cols-3 gap-1.5 p-1 bg-stone-100 rounded-2xl text-xs font-bold">
              <button
                disabled={isPastWeek}
                onClick={() => switchTab("week")}
                className={`py-2.5 px-2 rounded-xl transition ${
                  activeTab === "week" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500 disabled:opacity-40"
                }`}
              >
                الأسبوع الحالي ({selectedWeek})
              </button>
              <button
                onClick={() => switchTab("global")}
                className={`py-2.5 px-2 rounded-xl transition ${
                  activeTab === "global" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500"
                }`}
              >
                المواعيد العامة
              </button>
              <button
                onClick={() => switchTab("account")}
                className={`py-2.5 px-2 rounded-xl transition ${
                  activeTab === "account" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500"
                }`}
              >
                بياناتي والدخول
              </button>
            </div>

            {activeTab !== "account" ? (
              <div className="space-y-3.5">
                {isScheduleLocked && (
                  <div className="p-3 rounded-2xl bg-amber-50 border border-amber-200 text-xs font-bold text-amber-900">
                    🔒 تعديل مواعيد اللقاء الأسبوعي مقفل حالياً بقرار من إدارة المنصة التقنية.
                  </div>
                )}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">يوم الاجتماع</label>
                    <select disabled={isScheduleLocked} value={meetDay} onChange={e => setMeetDay(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50">
                      {DAYS_AR.map((d, i) => <option key={i} value={i}>{d}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">ساعة البدء</label>
                    <input disabled={isScheduleLocked} type="time" value={meetTime} onChange={e => setMeetTime(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50" />
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">مدة الاجتماع</label>
                  <select disabled={isScheduleLocked} value={meetDuration} onChange={e => setMeetDuration(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50">
                    <option value="60">ساعة واحدة (60 دقيقة)</option>
                    <option value="90">ساعة ونصف (90 دقيقة)</option>
                    <option value="120">ساعتان (120 دقيقة)</option>
                    <option value="180">3 ساعات (180 دقيقة)</option>
                  </select>
                </div>
                <div className="text-[11px] text-stone-500 bg-stone-50 px-3 py-2 rounded-xl">
                  ℹ️ الحد الأقصى لتغيير الموعد شهرياً حسب ضوابط المنصة: <strong>{rules.maxScheduleChangesPerMonth} مرات</strong>.
                </div>
              </div>
            ) : (
              <div className="space-y-3.5">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">
                    الاسم الكامل {!rules.allowCadreNameEdit && <span className="text-amber-700">(مقفل من إدارة المنصة)</span>}
                  </label>
                  <input disabled={!rules.allowCadreNameEdit} value={name} onChange={e => setName(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50" />
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">
                      المسمى الوظيفي {!rules.allowCadreJobTitleEdit && <span className="text-stone-400">(ثابت تنظيمياً)</span>}
                    </label>
                    <input disabled={!rules.allowCadreJobTitleEdit} value={jobTitle} onChange={e => setJobTitle(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">
                      الوحدة التنظيمية {!rules.allowCadreUnitEdit && <span className="text-stone-400">(ثابت تنظيمياً)</span>}
                    </label>
                    <input disabled={!rules.allowCadreUnitEdit} value={unit} onChange={e => setUnit(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50" />
                  </div>
                </div>

                <div className="p-3.5 rounded-2xl bg-stone-50 border border-stone-200 space-y-3">
                  <div className="text-xs font-black text-stone-800">
                    🔐 تعديل اسم المستخدم وكلمة المرور {!rules.allowCadrePasswordChange && <span className="text-amber-700">(مقفل من إدارة المنصة)</span>}
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-bold text-stone-600 mb-1">اسم المستخدم</label>
                      <input disabled={!rules.allowCadrePasswordChange} value={username} onChange={e => setUsername(e.target.value)} className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold disabled:opacity-50" dir="ltr" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-stone-600 mb-1">كلمة المرور الجديدة</label>
                      <input disabled={!rules.allowCadrePasswordChange} type="text" value={password} onChange={e => setPassword(e.target.value)} className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold disabled:opacity-50" dir="ltr" />
                    </div>
                  </div>
                </div>

                <div className="text-[11px] text-stone-400 bg-stone-50 px-3 py-2 rounded-xl">
                  📅 تاريخ تفعيل حسابك بالنظام مرصود تلقائياً: <strong>{formatDateAr(currentUser.joinedAt)}</strong>.
                </div>
              </div>
            )}

            {err && <div className="text-xs font-bold text-rose-600">{err}</div>}

            <div className="flex justify-end gap-2 pt-2">
              <button onClick={onClose} className="px-4 py-2.5 rounded-2xl bg-stone-100 text-stone-700 text-xs font-bold">إلغاء</button>
              <button onClick={handleSave} className="px-6 py-2.5 rounded-2xl bg-stone-900 text-white text-xs font-bold hover:bg-stone-800">
                حفظ التعديلات
              </button>
            </div>
          </div>
        </ModalContainer>
      );
    }

    function TaskNoteModal({ isOpen, onClose, initialNote, onSaveNote }) {
      const [val, setVal] = useState(initialNote);
      useEffect(() => { setVal(initialNote); }, [initialNote, isOpen]);
      return (
        <ModalContainer isOpen={isOpen} onClose={onClose} badge="مسودة شخصية" title="ملاحظاتك على المهمة">
          <div className="space-y-4">
            <textarea
              rows="4"
              value={val}
              onChange={e => setVal(e.target.value)}
              placeholder="اكتب مسودتك أو نقاطك الخاصة هنا..."
              className="w-full rounded-2xl border border-stone-200 bg-stone-50 p-3.5 text-sm"
            />
            <div className="flex justify-end gap-2">
              <button onClick={onClose} className="px-4 py-2 rounded-xl bg-stone-100 text-xs font-bold">إغلاق</button>
              <button onClick={() => onSaveNote(val.trim())} className="px-6 py-2 rounded-xl bg-stone-900 text-white text-xs font-bold">حفظ</button>
            </div>
          </div>
        </ModalContainer>
      );
    }

    // ============================================================================
    // 9.5 PLATFORM TECHNICAL ADMIN PORTAL (إدارة المنصة - تصميم مينيمال بكشف تدريجي)
    // ============================================================================
    function PlatformAdminPortal({
      db,
      setDb,
      currentUser,
      cloudStatus,
      lastSyncAt,
      onOpenCloudSetup,
      onPreviewUser,
      onResetDemo,
      onLogout,
      showToast
    }) {
      // الشاشات الثلاث الأساسية فقط في العمود الجانبي الأيمن
      const [activeScreen, setActiveScreen] = useState(() => {
        try {
          return new URLSearchParams(window.location.search).get("screen") || "overview";
        } catch (e) {
          return "overview";
        }
      }); // 'overview' | 'structure' | 'leaders_settings'
      const [structureViewMode, setStructureViewMode] = useState(() => {
        try {
          return new URLSearchParams(window.location.search).get("mode") || "list";
        } catch (e) {
          return "list";
        }
      }); // 'list' | 'map'

      // التحكم في الأكورديون الهادئ (بسيط على السطح، قوي في العمق)
      const [expandedDeptId, setExpandedDeptId] = useState(() => {
        try {
          return new URLSearchParams(window.location.search).get("expand_dept") || null;
        } catch (e) {
          return null;
        }
      });
      const [expandedUnitId, setExpandedUnitId] = useState(null);
      const [expandedLeaderId, setExpandedLeaderId] = useState(null);
      const [expandedSettingKey, setExpandedSettingKey] = useState(null); // 'scoring' | 'cadre_limits' | 'cloud'

      // نماذج الإضافة العلوية المدمجة بنظام الأكورديون
      const [createEntityMode, setCreateEntityMode] = useState(null); // null | 'dept' | 'unit'
      const [showCreateLeaderForm, setShowCreateLeaderForm] = useState(false);

      // بحث وفلترة جدول القادة
      const [leaderSearch, setLeaderSearch] = useState("");
      const [leaderRoleFilter, setLeaderRoleFilter] = useState("all"); // 'all' | 'executive' | 'operational_admin'

      const departments = db.systemConfig?.departments || DEFAULT_DEPARTMENTS;
      const units = db.systemConfig?.organizationalUnits || DEFAULT_UNITS;
      const rules = { ...DEFAULT_GOVERNANCE_RULES, ...(db.systemConfig?.governanceRules || {}) };

      // القادة والمديرون فقط (استبعاد الكوادر تماماً وتركهم للموارد البشرية)
      const leaderUsers = useMemo(
        () => db.users.filter(u => u.roleType !== "cadre"),
        [db.users]
      );
      const cadres = useMemo(
        () => db.users.filter(u => u.roleType === "cadre"),
        [db.users]
      );

      // حقول تأسيس إدارة جديدة
      const [deptName, setDeptName] = useState("");
      const [deptDesc, setDeptDesc] = useState("");
      const [deptMaxTotal, setDeptMaxTotal] = useState(6);
      const [deptMaxPerType, setDeptMaxPerType] = useState(2);
      const [deptAllowedTypes, setDeptAllowedTypes] = useState(["lecture_quiz", "meeting", "practical"]);
      const [deptManagerId, setDeptManagerId] = useState("");

      // حقول تأسيس وحدة تنظيمية جديدة
      const [unitName, setUnitName] = useState("");
      const [unitInviteCode, setUnitInviteCode] = useState("");
      const [unitLeaderId, setUnitLeaderId] = useState("");

      // حقول إضافة حساب قائد جديد
      const [newLeaderRole, setNewLeaderRole] = useState("operational_admin"); // 'executive' | 'operational_admin'
      const [newLeaderName, setNewLeaderName] = useState("");
      const [newLeaderTitle, setNewLeaderTitle] = useState("");
      const [newLeaderDeptId, setNewLeaderDeptId] = useState("dept_hr");
      const [newLeaderUnitName, setNewLeaderUnitName] = useState(units[0]?.name || "");
      const [newLeaderUsername, setNewLeaderUsername] = useState("");
      const [newLeaderPassword, setNewLeaderPassword] = useState("1234");

      const findDeptManager = (deptId) => {
        return leaderUsers.find(
          u => (u.roleType === "operational_admin" || u.roleType === "admin") && (u.departmentId || "dept_hr") === deptId
        ) || null;
      };

      const findUnitLeader = (uObj) => {
        if (uObj.leaderUserId) {
          const byId = leaderUsers.find(u => u.id === uObj.leaderUserId);
          if (byId) return byId;
        }
        return leaderUsers.find(u => u.unit === uObj.name && u.roleType !== "platform_admin") || null;
      };

      const deptsWithManagerCount = useMemo(
        () => departments.filter(d => Boolean(findDeptManager(d.id))).length,
        [departments, leaderUsers]
      );
      const deptManagerPct = departments.length > 0
        ? Math.round((deptsWithManagerCount / departments.length) * 100)
        : 100;

      // دوال التحديث
      const updateDepartment = (deptId, updater) => {
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            departments: (prev.systemConfig?.departments || DEFAULT_DEPARTMENTS).map(d =>
              d.id === deptId ? updater(d) : d
            )
          }
        }));
      };

      const assignManagerToDepartment = (deptId, userId) => {
        setDb(prev => ({
          ...prev,
          users: prev.users.map(u => {
            if (u.id === userId) {
              const deptObj = (prev.systemConfig?.departments || DEFAULT_DEPARTMENTS).find(d => d.id === deptId);
              return {
                ...u,
                roleType: "operational_admin",
                departmentId: deptId,
                jobTitle: deptObj ? `مدير ${deptObj.name}` : u.jobTitle
              };
            }
            return u;
          })
        }));
        showToast("تم تحديث مدير الإدارة ✓");
      };

      const handleCreateDepartment = (e) => {
        e.preventDefault();
        if (!deptName.trim()) return;
        const newId = "dept_" + Date.now();
        const newDept = {
          id: newId,
          name: deptName.trim(),
          shortName: deptName.trim(),
          icon: "🏛️",
          color: "stone",
          description: deptDesc.trim() || "إدارة تشغيلية مستقلة بمعايير ومهمات معزولة",
          enabled: true,
          isCore: false,
          allowedTaskTypes: deptAllowedTypes.length > 0 ? deptAllowedTypes : ["practical"],
          maxTotalTasks: Number(deptMaxTotal) || 6,
          maxPerTypePerCadre: Number(deptMaxPerType) || 2
        };

        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            departments: [...(prev.systemConfig?.departments || DEFAULT_DEPARTMENTS), newDept]
          },
          users: deptManagerId
            ? prev.users.map(u =>
                u.id === deptManagerId
                  ? { ...u, roleType: "operational_admin", departmentId: newId, jobTitle: `مدير ${newDept.name}` }
                  : u
              )
            : prev.users
        }));

        setDeptName("");
        setDeptDesc("");
        setDeptManagerId("");
        setCreateEntityMode(null);
        setExpandedDeptId(newId);
        showToast("تم تأسيس الإدارة الجديدة بنجاح ✓");
      };

      const handleDeleteDepartment = (deptId) => {
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            departments: (prev.systemConfig?.departments || DEFAULT_DEPARTMENTS).filter(d => d.id !== deptId)
          }
        }));
        if (expandedDeptId === deptId) setExpandedDeptId(null);
        showToast("تم حذف الإدارة من الهيكل التنظيمي");
      };

      const handleCreateUnit = (e) => {
        e.preventDefault();
        if (!unitName.trim()) return;
        const cleanName = unitName.trim();
        if (units.some(u => u.name === cleanName)) {
          showToast("هذه الوحدة موجودة بالفعل");
          return;
        }
        const code = unitInviteCode.trim().toUpperCase() || ("MAYDAN-U" + (units.length + 1));
        const newUnitObj = {
          id: "unit_" + Date.now(),
          name: cleanName,
          inviteCode: code,
          leaderUserId: unitLeaderId || null
        };
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            organizationalUnits: [...(prev.systemConfig?.organizationalUnits || DEFAULT_UNITS), newUnitObj]
          }
        }));
        setUnitName("");
        setUnitInviteCode("");
        setUnitLeaderId("");
        setCreateEntityMode(null);
        showToast("تم تأسيس الوحدة التنظيمية بنجاح ✓");
      };

      const updateUnit = (unitId, updater) => {
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            organizationalUnits: (prev.systemConfig?.organizationalUnits || DEFAULT_UNITS).map(u =>
              u.id === unitId ? updater(u) : u
            )
          }
        }));
      };

      const handleDeleteUnit = (unitId) => {
        if (units.length <= 1) {
          showToast("يجب الإبقاء على وحدة تنظيمية واحدة على الأقل");
          return;
        }
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            organizationalUnits: (prev.systemConfig?.organizationalUnits || DEFAULT_UNITS).filter(u => u.id !== unitId)
          }
        }));
        if (expandedUnitId === unitId) setExpandedUnitId(null);
        showToast("تم حذف الوحدة التنظيمية");
      };

      const handleCreateLeader = (e) => {
        e.preventDefault();
        const cleanU = newLeaderUsername.trim().toLowerCase();
        if (!newLeaderName.trim() || !cleanU || !newLeaderPassword.trim()) {
          showToast("يرجى استكمال الاسم واسم المستخدم وكلمة المرور");
          return;
        }
        if (db.users.some(u => u.username.toLowerCase() === cleanU)) {
          showToast("اسم المستخدم مستخدم بالفعل");
          return;
        }
        const selectedDeptObj = departments.find(d => d.id === newLeaderDeptId);
        const defaultTitle = newLeaderRole === "executive"
          ? "عضو الإدارة التنفيذية العليا"
          : `مدير ${selectedDeptObj?.name || "إدارة تشغيلية"}`;

        const created = {
          id: "u_leader_" + Date.now(),
          username: cleanU,
          password: newLeaderPassword.trim(),
          mustChangePassword: false,
          roleType: newLeaderRole,
          departmentId: newLeaderRole === "operational_admin" ? newLeaderDeptId : undefined,
          name: newLeaderName.trim(),
          jobTitle: newLeaderTitle.trim() || defaultTitle,
          unit: newLeaderUnitName || "المكتب المركزي",
          joinedAt: new Date().toISOString().slice(0, 10),
          onboarded: true,
          tasksRecord: {}
        };

        setDb(prev => ({
          ...prev,
          users: [...prev.users, created]
        }));
        setNewLeaderName("");
        setNewLeaderTitle("");
        setNewLeaderUsername("");
        setNewLeaderPassword("1234");
        setShowCreateLeaderForm(false);
        showToast(`تم إنشاء حساب القائد (${created.name}) بنجاح ✓`);
      };

      const updateLeaderUser = (userId, updater) => {
        setDb(prev => ({
          ...prev,
          users: prev.users.map(u => (u.id === userId ? updater(u) : u))
        }));
      };

      const handleDeleteLeader = (userId) => {
        if (userId === currentUser.id) {
          showToast("لا يمكنك حذف حسابك الحالي");
          return;
        }
        setDb(prev => ({
          ...prev,
          users: prev.users.filter(u => u.id !== userId)
        }));
        if (expandedLeaderId === userId) setExpandedLeaderId(null);
        showToast("تم حذف الحساب القيادي");
      };

      const updateGovernanceRules = (patch) => {
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            governanceRules: {
              ...DEFAULT_GOVERNANCE_RULES,
              ...(prev.systemConfig?.governanceRules || {}),
              ...patch
            }
          }
        }));
        showToast("تم حفظ إعدادات النظام ✓");
      };

      const filteredLeaders = useMemo(() => {
        return leaderUsers.filter(u => {
          if (leaderRoleFilter === "executive" && u.roleType !== "executive") return false;
          if (
            leaderRoleFilter === "operational_admin" &&
            u.roleType !== "operational_admin" &&
            u.roleType !== "admin"
          ) {
            return false;
          }
          if (leaderSearch.trim()) {
            const q = leaderSearch.trim().toLowerCase();
            const matchName = (u.name || "").toLowerCase().includes(q);
            const matchUser = (u.username || "").toLowerCase().includes(q);
            const matchTitle = (u.jobTitle || "").toLowerCase().includes(q);
            if (!matchName && !matchUser && !matchTitle) return false;
          }
          return true;
        });
      }, [leaderUsers, leaderRoleFilter, leaderSearch]);

      const navItems = [
        { id: "overview", label: "لوحة المتابعة", badge: null },
        { id: "structure", label: "الهيكل التنظيمي", badge: departments.length + units.length },
        { id: "leaders_settings", label: "القادة والإعدادات", badge: leaderUsers.length }
      ];

      return (
        <div className="min-h-screen bg-[#F6F5F2] text-stone-900 flex flex-col lg:flex-row">
          {/* العمود الجانبي الأيمن الداكن والموحد (بنفس روح وتوزيع تطبيق المهمات مع هوية ميدان الدافئة) */}
          <aside className="w-full lg:w-72 bg-[#1C1917] text-stone-100 shrink-0 lg:min-h-screen lg:sticky lg:top-0 flex flex-col justify-between p-6 select-none">
            <div className="space-y-8">
              {/* الهوية العلوية في العمود الجانبي */}
              <div className="flex items-center justify-between pt-1">
                <div>
                  <div className="text-2xl font-extrabold text-white tracking-tight">ميدان</div>
                  <div className="text-xs font-normal text-stone-400 mt-0.5">إدارة المنصة والهيكل</div>
                </div>
                <div className="w-10 h-10 rounded-xl bg-white/10 border border-white/15 flex items-center justify-center text-lg font-bold text-[#F5EFE6]">
                  م
                </div>
              </div>

              {/* عناصر التنقل الثلاثة الأساسية فقط */}
              <div className="space-y-2">
                <div className="text-xs font-normal text-stone-400 px-3 mb-2">التنقل</div>
                {navItems.map(item => {
                  const isActive = activeScreen === item.id;
                  return (
                    <button
                      key={item.id}
                      type="button"
                      onClick={() => setActiveScreen(item.id)}
                      className={`w-full flex items-center justify-between px-4 py-3.5 rounded-2xl text-base transition ${
                        isActive
                          ? "bg-[#EFECE6] text-stone-900 font-bold shadow-sm"
                          : "text-stone-300 hover:bg-white/5 hover:text-white font-medium"
                      }`}
                    >
                      <span>{item.label}</span>
                      {item.badge !== null && (
                        <span
                          className={`text-xs px-2.5 py-0.5 rounded-full ${
                            isActive
                              ? "bg-stone-900/10 text-stone-900 font-bold"
                              : "bg-white/10 text-stone-300 font-normal"
                          }`}
                        >
                          {item.badge}
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>

            {/* أسفل العمود الجانبي: حالة الاتصال بالخادم + تسجيل الخروج */}
            <div className="space-y-3 pt-8 border-t border-white/10 mt-8">
              <button
                type="button"
                onClick={onOpenCloudSetup}
                className="w-full px-4 py-3 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-between text-sm text-stone-200 transition"
              >
                <span className="font-normal">
                  {cloudStatus === "connected" ? "متصل بالخادم" : "الذاكرة المحلية"}
                </span>
                <span
                  className={`w-2.5 h-2.5 rounded-full ${
                    cloudStatus === "connected" ? "bg-emerald-400" : "bg-amber-400"
                  }`}
                />
              </button>

              <div className="flex items-center justify-between px-2 pt-1 text-xs text-stone-400">
                <span>{currentUser.name}</span>
                <button
                  type="button"
                  onClick={onLogout}
                  className="text-stone-300 hover:text-white underline font-normal"
                >
                  تسجيل الخروج
                </button>
              </div>
            </div>
          </aside>

          {/* مساحة العمل الرئيسية الواسعة والهادئة */}
          <main className="flex-1 min-w-0 px-6 py-8 sm:px-10 sm:py-10 max-w-6xl mx-auto w-full">
            {/* =========================================================
                الشاشة الأولى: لوحة المتابعة
            ========================================================= */}
            {activeScreen === "overview" && (
              <div className="space-y-8 animate-fadeIn">
                {/* رأس الشاشة: العنوان الكبير على اليمين، وزر الإجراء الرئيسي الواحد على اليسار */}
                <header className="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                  <div>
                    <div className="text-sm font-medium text-orange-700">نظرة عامة</div>
                    <h1 className="text-3xl sm:text-4xl font-extrabold text-stone-900 tracking-tight mt-1">
                      لوحة المتابعة
                    </h1>
                    <p className="text-sm sm:text-base font-normal text-stone-500 mt-2">
                      جاهزية البنية التنظيمية أولاً، ثم الوصول المباشر لمعاينة الإدارات والمستويات
                    </p>
                  </div>

                  <div className="flex items-center gap-2.5 self-start sm:self-auto">
                    <button
                      type="button"
                      onClick={() => {
                        setActiveScreen("structure");
                        setCreateEntityMode("dept");
                      }}
                      className="px-5 py-3 rounded-full bg-stone-900 hover:bg-stone-800 text-white text-sm font-bold transition shadow-sm"
                    >
                      + تأسيس إدارة أو وحدة
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setActiveScreen("leaders_settings");

    // ============================================================================
    // 10. EXECUTIVE OFFICE MEMBER PORTAL (بوابة عضو المكتب التنفيذي - النشرة الإدارية)
    // ============================================================================
    function ExecutivePortal({ db, setDb, currentUser, onLogout, showToast }) {
      const cadres = useMemo(() => db.users.filter(u => u.roleType === "cadre"), [db.users]);
      const units = useMemo(() => Array.from(new Set(cadres.map(c => c.unit).filter(Boolean))), [cadres]);

      const [title, setTitle] = useState("");
      const [content, setContent] = useState("");
      const [category, setCategory] = useState("سياسة جديدة");
      const [targetType, setTargetType] = useState("all"); // 'all' | 'custom'
      const [selectedIds, setSelectedIds] = useState([]);

      const toggleRecipient = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const selectByUnit = (unitName) => {
        const unitUserIds = cadres.filter(c => c.unit === unitName).map(c => c.id);
        setSelectedIds(prev => Array.from(new Set([...prev, ...unitUserIds])));
      };

      const handlePublishBulletin = (e) => {
        e.preventDefault();
        if (!title.trim() || !content.trim()) {
          showToast("يرجى كتابة عنوان ونص التعميم الإداري أولاً.");
          return;
        }
        if (targetType === "custom" && selectedIds.length === 0) {
          showToast("يرجى اختيار كادر واحد على الأقل لإرسال التعميم المخصص.");
          return;
        }

        const now = new Date();
        const timeStr = formatTimeAr(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);
        const newBulletin = {
          id: "bul_" + Date.now(),
          title: title.trim(),
          content: content.trim(),
          category,
          senderName: currentUser.name,
          senderRole: currentUser.jobTitle || "عضو المكتب التنفيذي",
          createdAt: `اليوم • ${timeStr}`,
          targetType,
          recipientIds: targetType === "all" ? [] : selectedIds,
          acknowledgedBy: {}
        };

        setDb(prev => ({
          ...prev,
          bulletins: [newBulletin, ...(prev.bulletins || [])]
        }));

        setTitle("");
        setContent("");
        showToast("تم نشر وإرسال التعميم في النشرة الإدارية بنجاح 📢");
      };

      const deleteBulletin = (id) => {
        setDb(prev => ({
          ...prev,
          bulletins: (prev.bulletins || []).filter(b => b.id !== id)
        }));
        showToast("تم حذف التعميم من النشرة الإدارية");
      };

      return (
        <div className="min-h-screen bg-[#F7F7F5]">
          <header className="bg-white border-b border-stone-200 sticky top-0 z-30">
            <div className="max-w-5xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <MadyanWordmark size="text-2xl sm:text-3xl" />
                <span className="text-xs font-black px-3 py-1 rounded-full madyan-gradient text-white shadow-sm">
                  🏛️ بوابة عضو المكتب التنفيذي • النشرة الإدارية
                </span>
              </div>
              <div className="flex items-center gap-3">
                <span className="text-xs font-bold text-stone-600 hidden sm:inline">
                  {currentUser.name} ({currentUser.jobTitle})
                </span>
                <button
                  onClick={onLogout}
                  className="px-4 py-2 rounded-2xl bg-rose-50 text-rose-700 hover:bg-rose-100 text-xs font-bold transition"
                >
                  تسجيل الخروج
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 pt-6 space-y-6">
            <BulletinPublisherPanel
              cadres={cadres}
              units={units}
              title={title}
              setTitle={setTitle}
              content={content}
              setContent={setContent}
              category={category}
              setCategory={setCategory}
              targetType={targetType}
              setTargetType={setTargetType}
              selectedIds={selectedIds}
              setSelectedIds={setSelectedIds}
              toggleRecipient={toggleRecipient}
              selectByUnit={selectByUnit}
              onSubmit={handlePublishBulletin}
              bulletins={db.bulletins || []}
              onDelete={deleteBulletin}
            />
          </main>
        </div>
      );
    }
