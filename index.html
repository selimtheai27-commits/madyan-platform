    // ============================================================================
    // 7. LECTURE VIDEO & LOCKED QUIZ MODAL
    // ============================================================================
    function LectureQuizModal({ isOpen, onClose, weekNumber, isPastWeek, curriculum, lectureRecord, onSubmitQuiz }) {
      const existingSubmission = lectureRecord?.quizSubmission || null;
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [errorMsg, setErrorMsg] = useState("");

      useEffect(() => {
        if (existingSubmission && existingSubmission.answers) {
          const map = {};
          existingSubmission.answers.forEach((ans, i) => { map[i] = ans; });
          setSelectedAnswers(map);
        } else {
          setSelectedAnswers({});
        }
        setErrorMsg("");
      }, [isOpen, existingSubmission]);

      if (!isOpen) return null;

      const safeCurr = curriculum || INITIAL_STATE.weeklyCurriculums.default;
      const questions = safeCurr.questions || [];

      const handleFinalSubmit = () => {
        if (existingSubmission) return;
        for (let i = 0; i < questions.length; i++) {
          if (selectedAnswers[i] === undefined) {
            setErrorMsg(`يرجى الإجابة على السؤال رقم ${i + 1} قبل الاعتماد النهائي.`);
            return;
          }
        }
        let correctCount = 0;
        const answersArray = questions.map((q, idx) => {
          const ans = selectedAnswers[idx];
          if (ans === q.correctIndex) correctCount++;
          return ans;
        });

        onSubmitQuiz({
          score: correctCount,
          total: questions.length,
          answers: answersArray,
          submittedAt: new Date().toLocaleString("ar-EG")
        });
      };

      return (
        <ModalContainer
          isOpen={isOpen}
          onClose={onClose}
          badge={`المحاضرة الأسبوعية • الأسبوع ${weekNumber}`}
          title={safeCurr.lectureTitle}
          maxWidth="max-w-2xl"
        >
          <div className="space-y-5">
            {isPastWeek && !existingSubmission && (
              <div className="p-3.5 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-900 font-bold">
                ⚠️ تنبيه: هذا الأسبوع قد انتهى بالفعل. يمكنك مشاهدة المحاضرة وحل الاختبار الآن، ولكن ستُسجل المهمة «مكتمل متأخر» بنصف النقاط (50%).
              </div>
            )}

            <p className="text-xs text-stone-500 leading-relaxed">{safeCurr.lectureDesc}</p>

            <div className="rounded-2xl overflow-hidden bg-stone-950 border border-stone-800 aspect-video relative">
              {isIframeVideo(safeCurr.videoType, safeCurr.videoUrl) ? (
                <iframe
                  src={getYoutubeEmbedUrl(safeCurr.videoUrl)}
                  title={safeCurr.lectureTitle}
                  className="w-full h-full"
                  sandbox="allow-scripts allow-same-origin allow-presentation"
                  allowFullScreen
                />
              ) : (
                <video
                  src={safeCurr.videoUrl}
                  controls
                  controlsList="nodownload"
                  onContextMenu={e => e.preventDefault()}
                  className="w-full h-full object-contain"
                />
              )}
            </div>

            <div className="space-y-4 pt-2 border-t border-stone-100">
              <div className="flex items-center justify-between">
                <h4 className="text-sm font-black text-stone-900">
                  📝 اختبار استيعاب المحاضرة ({questions.length} أسئلة)
                </h4>
                {existingSubmission ? (
                  <span className="text-xs font-black px-3 py-1 rounded-full bg-emerald-100 text-emerald-800">
                    🔒 تم الاعتماد النهائي • النتيجة: {existingSubmission.score}/{existingSubmission.total}
                  </span>
                ) : (
                  <span className="text-[11px] font-bold text-stone-400">
                    تنبيه: لا يمكن تعديل الإجابات بعد الضغط على اعتماد
                  </span>
                )}
              </div>

              {questions.map((q, qIdx) => {
                const userChoice = selectedAnswers[qIdx];
                return (
                  <div key={q.id || qIdx} className="p-4 rounded-2xl bg-stone-50 border border-stone-200/80 space-y-2.5">
                    <div className="text-xs font-black text-stone-800">
                      {qIdx + 1}. {q.text}
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {(q.options || []).map((opt, optIdx) => {
                        const isSelected = userChoice === optIdx;
                        const isCorrect = q.correctIndex === optIdx;

                        let btnStyle = "bg-white border-stone-200 text-stone-700 hover:border-orange-400";
                        if (existingSubmission) {
                          if (isCorrect) {
                            btnStyle = "bg-emerald-50 border-emerald-500 text-emerald-900 font-black";
                          } else if (isSelected && !isCorrect) {
                            btnStyle = "bg-rose-50 border-rose-400 text-rose-800 line-through";
                          } else {
                            btnStyle = "bg-white border-stone-200 text-stone-400 opacity-70";
                          }
                        } else if (isSelected) {
                          btnStyle = "bg-orange-50 border-orange-500 text-orange-900 font-black ring-2 ring-orange-200";
                        }

                        return (
                          <button
                            key={optIdx}
                            type="button"
                            disabled={Boolean(existingSubmission)}
                            onClick={() => setSelectedAnswers(prev => ({ ...prev, [qIdx]: optIdx }))}
                            className={`text-right text-xs p-3 rounded-xl border transition flex items-center justify-between gap-2 ${btnStyle}`}
                          >
                            <span>{opt}</span>
                            {existingSubmission && isCorrect && <span>✅</span>}
                            {existingSubmission && isSelected && !isCorrect && <span>❌</span>}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}

              {errorMsg && (
                <div className="text-xs font-bold text-rose-600 bg-rose-50 p-3 rounded-xl border border-rose-200">
                  {errorMsg}
                </div>
              )}

              <div className="flex justify-end gap-2 pt-2">
                <button
                  onClick={onClose}
                  className="px-5 py-2.5 rounded-2xl bg-stone-100 text-stone-700 text-xs font-bold"
                >
                  إغلاق
                </button>
                {!existingSubmission && (
                  <button
                    onClick={handleFinalSubmit}
                    className="px-6 py-2.5 rounded-2xl madyan-gradient text-white text-xs font-black shadow-md hover:opacity-95"
                  >
                    اعتماد الإجابات النهائي ورصد الدرجة ✓
                  </button>
                )}
              </div>
            </div>
          </div>
        </ModalContainer>
      );
    }

    // ============================================================================
    // 8. ONBOARDING MODAL
    // ============================================================================
    function OnboardingModal({ isOpen, onClose, currentUser, taskDefs, isUsernameTaken, onSaveOnboarding }) {
      const [step, setStep] = useState(1);
      const [name, setName] = useState(currentUser.name || "");
      const [jobTitle, setJobTitle] = useState(currentUser.jobTitle || "");
      const [unit, setUnit] = useState(currentUser.unit || "");
      const [username, setUsername] = useState(currentUser.username || "");
      const [password, setPassword] = useState(currentUser.password || "");
      const [meetDay, setMeetDay] = useState(currentUser.defaultSchedule?.meetDay ?? 2);
      const [meetTime, setMeetTime] = useState(currentUser.defaultSchedule?.meetTime || "19:00");
      const [meetDuration, setMeetDuration] = useState(currentUser.defaultSchedule?.meetDuration || 90);
      const [err, setErr] = useState("");

      if (!isOpen) return null;

      const previewSched = computeWeekSchedule({ meetDay, meetTime, meetDuration }, taskDefs);

      const handleNextStep1 = () => {
        if (!username.trim() || !password.trim()) {
          setErr("اسم المستخدم وكلمة المرور مطلوبان.");
          return;
        }
        if (isUsernameTaken(username, currentUser.id)) {
          setErr("اسم المستخدم هذا مستخدم بالفعل، اختر اسماً آخر.");
          return;
        }
        setErr("");
        setStep(2);
      };

      const handleFinish = () => {
        onSaveOnboarding({
          name: name.trim() || currentUser.name,
          jobTitle: jobTitle.trim() || currentUser.jobTitle,
          unit: unit.trim() || currentUser.unit,
          username: username.trim(),
          password: password.trim(),
          defaultSchedule: {
            meetDay: parseInt(meetDay, 10),
            meetTime,
            meetDuration: parseInt(meetDuration, 10)
          }
        });
      };

      return (
        <ModalContainer
          isOpen={isOpen}
          onClose={onClose}
          badge="تهيئة الحساب عند الدخول الأول"
          title="ضبط ملفك الإداري ومواعيدك الأسبوعية"
        >
          {step === 1 && (
            <div className="space-y-4">
              <p className="text-xs text-stone-500 leading-relaxed">
                مرحباً بك في <strong>Madyan</strong>. يمكنك مراجعة بياناتك الإدارية، كما يمكنك <strong>اختيارياً</strong> تعديل اسم المستخدم وكلمة المرور الخاصة بك:
              </p>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">الاسم الكامل</label>
                <input value={name} onChange={e => setName(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold" />
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">المسمى الوظيفي</label>
                  <input value={jobTitle} onChange={e => setJobTitle(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">الوحدة الإدارية</label>
                  <input value={unit} onChange={e => setUnit(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold" />
                </div>
              </div>

              <div className="p-3.5 rounded-2xl bg-orange-50/70 border border-orange-200/80 space-y-3">
                <div className="text-xs font-black text-orange-900">🔐 بيانات تسجيل الدخول (اختياري: يمكنك تغييرها الآن)</div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-[11px] font-bold text-stone-700 mb-1">اسم المستخدم (Username)</label>
                    <input value={username} onChange={e => setUsername(e.target.value)} className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold" />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-stone-700 mb-1">كلمة المرور (Password)</label>
                    <input type="text" value={password} onChange={e => setPassword(e.target.value)} className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold" />
                  </div>
                </div>
              </div>

              {err && <div className="text-xs font-bold text-rose-600">{err}</div>}

              <div className="flex justify-end pt-2">
                <button onClick={handleNextStep1} className="px-7 py-3 rounded-2xl bg-stone-900 text-white text-xs font-bold">
                  التالي: تحديد موعد الاجتماع ←
                </button>
              </div>
            </div>
          )}

          {step === 2 && (
            <div className="space-y-4">
              <p className="text-xs text-stone-500">
                حدّد موعد اجتماعك الأسبوعي وعدد ساعاته ليقوم النظام بحساب موعد الأجندة (قبل 24 ساعة) والمحضر (بعد 24 ساعة):
              </p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">يوم الاجتماع الأسبوعي</label>
                  <select value={meetDay} onChange={e => setMeetDay(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold">
                    {DAYS_AR.map((d, i) => <option key={i} value={i}>{d}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">ساعة بدء الاجتماع</label>
                  <input type="time" value={meetTime} onChange={e => setMeetTime(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold" />
                </div>
              </div>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">مدة الاجتماع</label>
                <select value={meetDuration} onChange={e => setMeetDuration(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold">
                  <option value="60">ساعة واحدة (60 دقيقة)</option>
                  <option value="90">ساعة ونصف (90 دقيقة)</option>
                  <option value="120">ساعتان (120 دقيقة)</option>
                  <option value="180">3 ساعات (180 دقيقة)</option>
                </select>
              </div>

              <div className="bg-stone-50 p-3.5 rounded-2xl border border-stone-200 text-xs space-y-1.5">
                <div className="font-black text-stone-800 mb-1">المعاينة الذكية لمواعيدك:</div>
                <div>📋 <strong>إرسال الأجندة:</strong> يوم {previewSched.agenda.dayName} ({previewSched.agenda.timeLabel})</div>
                <div>🤝 <strong>حضور اللقاء:</strong> يوم {previewSched.attendance.dayName} ({previewSched.attendance.timeLabel})</div>
                <div>📝 <strong>توثيق المحضر:</strong> يوم {previewSched.minutes.dayName} ({previewSched.minutes.timeLabel})</div>
              </div>

              <div className="flex justify-between pt-2">
                <button onClick={() => setStep(1)} className="px-5 py-2.5 rounded-2xl bg-stone-100 text-stone-700 text-xs font-bold">السابق</button>
                <button onClick={handleFinish} className="px-7 py-3 rounded-2xl madyan-gradient text-white text-xs font-black shadow-md">
                  اعتماد والبدء الآن ✓
                </button>
              </div>
            </div>
          )}
        </ModalContainer>
      );
    }

    // ============================================================================
    // 9. CADRE SETTINGS MODAL & NOTE MODAL
    // ============================================================================
    function CadreSettingsModal({ scope, onClose, currentUser, selectedWeek, isPastWeek, governanceRules = DEFAULT_GOVERNANCE_RULES, isUsernameTaken, onSaveSettings }) {
      const rules = { ...DEFAULT_GOVERNANCE_RULES, ...(governanceRules || {}) };
      const [activeTab, setActiveTab] = useState(scope || "global");
      const [meetDay, setMeetDay] = useState(currentUser.defaultSchedule?.meetDay ?? 2);
      const [meetTime, setMeetTime] = useState(currentUser.defaultSchedule?.meetTime || "19:00");
      const [meetDuration, setMeetDuration] = useState(currentUser.defaultSchedule?.meetDuration || 90);

      const [name, setName] = useState(currentUser.name || "");
      const [jobTitle, setJobTitle] = useState(currentUser.jobTitle || "");
      const [unit, setUnit] = useState(currentUser.unit || "");
      const [username, setUsername] = useState(currentUser.username || "");
      const [password, setPassword] = useState(currentUser.password || "");
      const [err, setErr] = useState("");

      useEffect(() => {
        if (!scope) return;
        const targetTab = (scope === "week" && isPastWeek) ? "global" : scope;
        setActiveTab(targetTab);
        const sched = targetTab === "week"
          ? (currentUser.weekOverrides?.[selectedWeek] || currentUser.defaultSchedule)
          : currentUser.defaultSchedule;
        setMeetDay(sched?.meetDay ?? 2);
        setMeetTime(sched?.meetTime || "19:00");
        setMeetDuration(sched?.meetDuration || 90);
        setName(currentUser.name || "");
        setJobTitle(currentUser.jobTitle || "");
        setUnit(currentUser.unit || "");
        setUsername(currentUser.username || "");
        setPassword(currentUser.password || "");
        setErr("");
      }, [scope, currentUser, selectedWeek, isPastWeek]);

      if (!scope) return null;

      const switchTab = (t) => {
        setActiveTab(t);
        const sched = t === "week"
          ? (currentUser.weekOverrides?.[selectedWeek] || currentUser.defaultSchedule)
          : currentUser.defaultSchedule;
        setMeetDay(sched?.meetDay ?? 2);
        setMeetTime(sched?.meetTime || "19:00");
        setMeetDuration(sched?.meetDuration || 90);
        setErr("");
      };

      const isScheduleLocked = activeTab === "week"
        ? (!rules.allowCadreScheduleChange || !rules.allowWeekSpecificOverride)
        : !rules.allowCadreScheduleChange;

      const handleSave = () => {
        if (activeTab === "account") {
          if (!username.trim() || !password.trim()) {
            setErr("اسم المستخدم وكلمة المرور لا يمكن أن يكونا فارغين.");
            return;
          }
          if (isUsernameTaken(username, currentUser.id)) {
            setErr("اسم المستخدم محجوز لكادر آخر.");
            return;
          }
          onSaveSettings(u => ({
            ...u,
            name: rules.allowCadreNameEdit ? (name.trim() || u.name) : u.name,
            jobTitle: rules.allowCadreJobTitleEdit ? (jobTitle.trim() || u.jobTitle) : u.jobTitle,
            unit: rules.allowCadreUnitEdit ? (unit.trim() || u.unit) : u.unit,
            username: rules.allowCadrePasswordChange ? username.trim() : u.username,
            password: rules.allowCadrePasswordChange ? password.trim() : u.password
          }));
        } else if (activeTab === "week") {
          if (isScheduleLocked) {
            setErr("تغيير مواعيد اللقاء الأسبوعي مقفل حالياً وفق ضوابط إدارة المنصة.");
            return;
          }
          onSaveSettings(u => ({
            ...u,
            weekOverrides: {
              ...(u.weekOverrides || {}),
              [selectedWeek]: {
                meetDay: parseInt(meetDay, 10),
                meetTime,
                meetDuration: parseInt(meetDuration, 10)
              }
            }
          }));
        } else {
          if (isScheduleLocked) {
            setErr("تغيير المواعيد العامة مقفل حالياً وفق ضوابط إدارة المنصة.");
            return;
          }
          onSaveSettings(u => ({
            ...u,
            defaultSchedule: {
              meetDay: parseInt(meetDay, 10),
              meetTime,
              meetDuration: parseInt(meetDuration, 10)
            }
          }));
        }
      };

      return (
        <ModalContainer
          isOpen={Boolean(scope)}
          onClose={onClose}
          badge="إعدادات الكادر (مؤطرة بضوابط إدارة المنصة)"
          title="تخصيص المواعيد وبيانات الحساب"
        >
          <div className="space-y-4">
            <div className="grid grid-cols-3 gap-1.5 p-1 bg-stone-100 rounded-2xl text-xs font-bold">
              <button
                disabled={isPastWeek}
                onClick={() => switchTab("week")}
                className={`py-2.5 px-2 rounded-xl transition ${
                  activeTab === "week" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500 disabled:opacity-40"
                }`}
              >
                الأسبوع الحالي ({selectedWeek})
              </button>
              <button
                onClick={() => switchTab("global")}
                className={`py-2.5 px-2 rounded-xl transition ${
                  activeTab === "global" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500"
                }`}
              >
                المواعيد العامة
              </button>
              <button
                onClick={() => switchTab("account")}
                className={`py-2.5 px-2 rounded-xl transition ${
                  activeTab === "account" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500"
                }`}
              >
                بياناتي والدخول
              </button>
            </div>

            {activeTab !== "account" ? (
              <div className="space-y-3.5">
                {isScheduleLocked && (
                  <div className="p-3 rounded-2xl bg-amber-50 border border-amber-200 text-xs font-bold text-amber-900">
                    🔒 تعديل مواعيد اللقاء الأسبوعي مقفل حالياً بقرار من إدارة المنصة التقنية.
                  </div>
                )}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">يوم الاجتماع</label>
                    <select disabled={isScheduleLocked} value={meetDay} onChange={e => setMeetDay(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50">
                      {DAYS_AR.map((d, i) => <option key={i} value={i}>{d}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">ساعة البدء</label>
                    <input disabled={isScheduleLocked} type="time" value={meetTime} onChange={e => setMeetTime(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50" />
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">مدة الاجتماع</label>
                  <select disabled={isScheduleLocked} value={meetDuration} onChange={e => setMeetDuration(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50">
                    <option value="60">ساعة واحدة (60 دقيقة)</option>
                    <option value="90">ساعة ونصف (90 دقيقة)</option>
                    <option value="120">ساعتان (120 دقيقة)</option>
                    <option value="180">3 ساعات (180 دقيقة)</option>
                  </select>
                </div>
                <div className="text-[11px] text-stone-500 bg-stone-50 px-3 py-2 rounded-xl">
                  ℹ️ الحد الأقصى لتغيير الموعد شهرياً حسب ضوابط المنصة: <strong>{rules.maxScheduleChangesPerMonth} مرات</strong>.
                </div>
              </div>
            ) : (
              <div className="space-y-3.5">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">
                    الاسم الكامل {!rules.allowCadreNameEdit && <span className="text-amber-700">(مقفل من إدارة المنصة)</span>}
                  </label>
                  <input disabled={!rules.allowCadreNameEdit} value={name} onChange={e => setName(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50" />
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">
                      المسمى الوظيفي {!rules.allowCadreJobTitleEdit && <span className="text-stone-400">(ثابت تنظيمياً)</span>}
                    </label>
                    <input disabled={!rules.allowCadreJobTitleEdit} value={jobTitle} onChange={e => setJobTitle(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">
                      الوحدة التنظيمية {!rules.allowCadreUnitEdit && <span className="text-stone-400">(ثابت تنظيمياً)</span>}
                    </label>
                    <input disabled={!rules.allowCadreUnitEdit} value={unit} onChange={e => setUnit(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold disabled:opacity-50" />
                  </div>
                </div>

                <div className="p-3.5 rounded-2xl bg-stone-50 border border-stone-200 space-y-3">
                  <div className="text-xs font-black text-stone-800">
                    🔐 تعديل اسم المستخدم وكلمة المرور {!rules.allowCadrePasswordChange && <span className="text-amber-700">(مقفل من إدارة المنصة)</span>}
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-bold text-stone-600 mb-1">اسم المستخدم</label>
                      <input disabled={!rules.allowCadrePasswordChange} value={username} onChange={e => setUsername(e.target.value)} className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold disabled:opacity-50" dir="ltr" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-stone-600 mb-1">كلمة المرور الجديدة</label>
                      <input disabled={!rules.allowCadrePasswordChange} type="text" value={password} onChange={e => setPassword(e.target.value)} className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold disabled:opacity-50" dir="ltr" />
                    </div>
                  </div>
                </div>

                <div className="text-[11px] text-stone-400 bg-stone-50 px-3 py-2 rounded-xl">
                  📅 تاريخ تفعيل حسابك بالنظام مرصود تلقائياً: <strong>{formatDateAr(currentUser.joinedAt)}</strong>.
                </div>
              </div>
            )}

            {err && <div className="text-xs font-bold text-rose-600">{err}</div>}

            <div className="flex justify-end gap-2 pt-2">
              <button onClick={onClose} className="px-4 py-2.5 rounded-2xl bg-stone-100 text-stone-700 text-xs font-bold">إلغاء</button>
              <button onClick={handleSave} className="px-6 py-2.5 rounded-2xl bg-stone-900 text-white text-xs font-bold hover:bg-stone-800">
                حفظ التعديلات
              </button>
            </div>
          </div>
        </ModalContainer>
      );
    }

    function TaskNoteModal({ isOpen, onClose, initialNote, onSaveNote }) {
      const [val, setVal] = useState(initialNote);
      useEffect(() => { setVal(initialNote); }, [initialNote, isOpen]);
      return (
        <ModalContainer isOpen={isOpen} onClose={onClose} badge="مسودة شخصية" title="ملاحظاتك على المهمة">
          <div className="space-y-4">
            <textarea
              rows="4"
              value={val}
              onChange={e => setVal(e.target.value)}
              placeholder="اكتب مسودتك أو نقاطك الخاصة هنا..."
              className="w-full rounded-2xl border border-stone-200 bg-stone-50 p-3.5 text-sm"
            />
            <div className="flex justify-end gap-2">
              <button onClick={onClose} className="px-4 py-2 rounded-xl bg-stone-100 text-xs font-bold">إغلاق</button>
              <button onClick={() => onSaveNote(val.trim())} className="px-6 py-2 rounded-xl bg-stone-900 text-white text-xs font-bold">حفظ</button>
            </div>
          </div>
        </ModalContainer>
      );
    }

    // ============================================================================
    // 9.5 PLATFORM TECHNICAL ADMIN PORTAL (المحطة الأولى: مستوى إدارة المنصة التقنية)
    // ============================================================================
    function PlatformAdminPortal({
      db,
      setDb,
      currentUser,
      cloudStatus,
      lastSyncAt,
      onOpenCloudSetup,
      onResetDemo,
      onLogout,
      showToast
    }) {
      const [activeTab, setActiveTab] = useState("governance"); // 'governance' | 'structure' | 'accounts' | 'cloud'

      const departments = db.systemConfig?.departments || DEFAULT_DEPARTMENTS;
      const units = db.systemConfig?.organizationalUnits || DEFAULT_UNITS;
      const rules = { ...DEFAULT_GOVERNANCE_RULES, ...(db.systemConfig?.governanceRules || {}) };

      // حالات إضافة إدارة تشغيلية جديدة
      const [deptName, setDeptName] = useState("");
      const [deptShortName, setDeptShortName] = useState("");
      const [deptIcon, setDeptIcon] = useState("🧭");
      const [deptTheme, setDeptTheme] = useState("blue");
      const [deptDesc, setDeptDesc] = useState("");

      // حالات إضافة وحدة تنظيمية جديدة
      const [unitName, setUnitName] = useState("");
      const [unitDefaultDepts, setUnitDefaultDepts] = useState(["dept_hr", "dept_tarbawi"]);

      // حالات إنشاء حساب جديد بأي مستوى من المستويات الأربعة
      const [newRoleType, setNewRoleType] = useState("cadre");
      const [newName, setNewName] = useState("");
      const [newJobTitle, setNewJobTitle] = useState("");
      const [newUnit, setNewUnit] = useState(units[0]?.name || "وحدة التخطيط الاستراتيجي");
      const [newDepartmentId, setNewDepartmentId] = useState("dept_hr");
      const [newAssignedDepts, setNewAssignedDepts] = useState(["dept_hr", "dept_tarbawi"]);
      const [newUsername, setNewUsername] = useState("");
      const [newPassword, setNewPassword] = useState("1234");
      const [newWeeksAgo, setNewWeeksAgo] = useState(1);

      const updateRule = (key, value) => {
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            governanceRules: {
              ...(prev.systemConfig?.governanceRules || DEFAULT_GOVERNANCE_RULES),
              [key]: value
            }
          }
        }));
      };

      const handleAddDepartment = (e) => {
        e.preventDefault();
        if (!deptName.trim()) {
          showToast("يرجى إدخال اسم الإدارة التشغيلية الجديدة.");
          return;
        }
        const createdDept = {
          id: "dept_" + Date.now(),
          name: deptName.trim(),
          shortName: deptShortName.trim() || deptName.trim(),
          icon: deptIcon || "🏢",
          theme: deptTheme || "blue",
          description: deptDesc.trim() || "إدارة تشغيلية مستقلة معزولة البيانات والصلاحيات.",
          isCore: false,
          enabled: true
        };
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            departments: [...(prev.systemConfig?.departments || DEFAULT_DEPARTMENTS), createdDept]
          }
        }));
        setDeptName("");
        setDeptShortName("");
        setDeptDesc("");
        showToast(`تم تأسيس (${createdDept.name}) كإدارة تشغيلية معزولة بنجاح ✓`);
      };

      const toggleDepartmentEnabled = (deptId) => {
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            departments: (prev.systemConfig?.departments || DEFAULT_DEPARTMENTS).map(d =>
              d.id === deptId ? { ...d, enabled: !d.enabled } : d
            )
          }
        }));
        showToast("تم تحديث حالة تفعيل الإدارة التشغيلية ✓");
      };

      const handleAddUnit = (e) => {
        e.preventDefault();
        if (!unitName.trim()) return;
        const createdUnit = {
          id: "unit_" + Date.now(),
          name: unitName.trim(),
          defaultDepartments: unitDefaultDepts.length > 0 ? unitDefaultDepts : ["dept_hr"]
        };
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            organizationalUnits: [...(prev.systemConfig?.organizationalUnits || DEFAULT_UNITS), createdUnit]
          }
        }));
        setUnitName("");
        showToast(`تمت إضافة الوحدة التنظيمية (${createdUnit.name}) بنجاح ✓`);
      };

      const handleCreateAccount = (e) => {
        e.preventDefault();
        if (!newName.trim() || !newUsername.trim() || !newPassword.trim()) {
          showToast("يرجى إدخال الاسم واسم المستخدم وكلمة المرور.");
          return;
        }
        const cleanUser = newUsername.trim().toLowerCase();
        if (db.users.some(u => u.username.toLowerCase() === cleanUser)) {
          showToast("اسم المستخدم هذا مسجل بالفعل، اختر اسماً آخر.");
          return;
        }

        const weeksNum = Math.max(1, parseInt(newWeeksAgo, 10) || 1);
        const joinedTimestamp = Date.now() - ((weeksNum - 1) * MS_PER_WEEK) - (24 * 3600 * 1000);

        const initialTasks = {};
        if (newRoleType === "cadre") {
          for (let w = 1; w <= weeksNum; w++) {
            initialTasks[w] = {
              lecture: { status: "pending" },
              agenda: { status: "pending" },
              attendance: { status: "pending" },
              minutes: { status: "pending" }
            };
          }
        }

        const deptObj = departments.find(d => d.id === newDepartmentId);
        const defaultTitle =
          newRoleType === "platform_admin"
            ? "مدير المنصة التقني"
            : newRoleType === "executive"
            ? "عضو القيادة التنفيذية"
            : newRoleType === "operational_admin"
            ? `مدير ${deptObj ? deptObj.name : "إدارة تشغيلية"}`
            : "كادر تنظيمي";

        const defaultUnitName =
          newRoleType === "platform_admin"
            ? "إدارة المنصة التقنية"
            : newRoleType === "executive"
            ? "القيادة التنفيذية"
            : newRoleType === "operational_admin"
            ? (deptObj ? deptObj.name : "الإدارة التشغيلية")
            : newUnit;

        const created = {
          id: "u_" + Date.now(),
          username: newUsername.trim(),
          password: newPassword.trim(),
          roleType: newRoleType,
          departmentId: newRoleType === "operational_admin" ? newDepartmentId : undefined,
          assignedDepartments: newRoleType === "cadre"
            ? (newAssignedDepts.length > 0 ? newAssignedDepts : ["dept_hr"])
            : undefined,
          onboarded: false,
          joinedAt: joinedTimestamp,
          name: newName.trim(),
          jobTitle: newJobTitle.trim() || defaultTitle,
          unit: defaultUnitName,
          defaultSchedule: { meetDay: 2, meetTime: "19:00", meetDuration: 90 },
          weekOverrides: {},
          tasksRecord: initialTasks
        };

        setDb(prev => ({
          ...prev,
          users: [...prev.users, created]
        }));

        setNewName("");
        setNewJobTitle("");
        setNewUsername("");
        showToast(`تم إنشاء حساب (${created.name}) وتخصيص صلاحياته بنجاح ✓`);
      };

      const toggleCadreAssignedDept = (userId, deptId) => {
        setDb(prev => ({
          ...prev,
          users: prev.users.map(u => {
            if (u.id !== userId) return u;
            const currentList = Array.isArray(u.assignedDepartments) && u.assignedDepartments.length > 0
              ? u.assignedDepartments
              : ["dept_hr", "dept_tarbawi"];
            const exists = currentList.includes(deptId);
            if (exists && currentList.length <= 1) {
              showToast("يجب أن يكون للكادر مسار تشغيلي واحد مفعّل على الأقل.");
              return u;
            }
            const nextList = exists
              ? currentList.filter(id => id !== deptId)
              : [...currentList, deptId];
            return { ...u, assignedDepartments: nextList };
          })
        }));
      };

      const handleDeleteUser = (userId) => {
        const target = db.users.find(u => u.id === userId);
        if (!target) return;
        if (target.roleType === "platform_admin" && db.users.filter(u => u.roleType === "platform_admin").length <= 1) {
          showToast("لا يمكن حذف حساب مدير المنصة التقني الوحيد.");
          return;
        }
        setDb(prev => ({
          ...prev,
          users: prev.users.filter(u => u.id !== userId)
        }));
        showToast("تم حذف الحساب من المنصة.");
      };

      const handleExportBackup = () => {
        const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `maydan_backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("تم تصدير النسخة الاحتياطية الكاملة للمنصة ✓");
      };

      const cadresCount = db.users.filter(u => u.roleType === "cadre").length;
      const opAdminsCount = db.users.filter(u => u.roleType === "operational_admin" || u.roleType === "admin").length;
      const execCount = db.users.filter(u => u.roleType === "executive").length;

      return (
        <div className="min-h-screen bg-[#F6F5F2]">
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-stone-200/80">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <MadyanWordmark size="text-2xl sm:text-3xl" />
                <span className="text-xs font-black px-3 py-1 rounded-full bg-stone-900 text-white">
                  🛠️ إدارة المنصة التقنية (المستوى الحاكم)
                </span>
              </div>

              <div className="flex items-center gap-2 overflow-x-auto no-scrollbar">
                <button
                  onClick={() => setActiveTab("governance")}
                  className={`px-3.5 py-2 rounded-xl text-xs font-black transition flex-shrink-0 ${
                    activeTab === "governance" ? "bg-stone-900 text-white shadow-sm" : "bg-stone-100 text-stone-600 hover:bg-stone-200"
                  }`}
                >
                  ⚙️ الضوابط والقواعد الحاكمة
                </button>
                <button
                  onClick={() => setActiveTab("structure")}
                  className={`px-3.5 py-2 rounded-xl text-xs font-black transition flex-shrink-0 ${
                    activeTab === "structure" ? "bg-stone-900 text-white shadow-sm" : "bg-stone-100 text-stone-600 hover:bg-stone-200"
                  }`}
                >
                  🏢 هيكل الإدارات والوحدات ({departments.length})
                </button>
                <button
                  onClick={() => setActiveTab("accounts")}
                  className={`px-3.5 py-2 rounded-xl text-xs font-black transition flex-shrink-0 ${
                    activeTab === "accounts" ? "bg-stone-900 text-white shadow-sm" : "bg-stone-100 text-stone-600 hover:bg-stone-200"
                  }`}
                >
                  👥 الحسابات والمسارات ({db.users.length})
                </button>
                <button
                  onClick={() => setActiveTab("cloud")}
                  className={`px-3.5 py-2 rounded-xl text-xs font-black transition flex-shrink-0 ${
                    activeTab === "cloud" ? "bg-stone-900 text-white shadow-sm" : "bg-stone-100 text-stone-600 hover:bg-stone-200"
                  }`}
                >
                  ☁️ البنية السحابية والنسخ الاحتياطي
                </button>
                <button
                  onClick={onLogout}
                  className="px-3.5 py-2 rounded-xl bg-rose-50 text-rose-700 hover:bg-rose-100 text-xs font-bold flex-shrink-0"
                >
                  تسجيل الخروج
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">
            {/* شريط الملخص التنظيمي للمستويات الأربعة */}
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
              <div className="bg-white rounded-3xl p-4 border border-stone-200/80 shadow-sm">
                <div className="text-[11px] font-bold text-stone-400">الإدارات التشغيلية المعزولة</div>
                <div className="text-2xl font-black text-stone-900 mt-1">{departments.length} إدارات</div>
                <div className="text-[11px] text-stone-500 mt-0.5">عزل تام للبيانات والصلاحيات</div>
              </div>
              <div className="bg-white rounded-3xl p-4 border border-stone-200/80 shadow-sm">
                <div className="text-[11px] font-bold text-stone-400">الوحدات التنظيمية الفرعية</div>
                <div className="text-2xl font-black text-orange-600 mt-1">{units.length} وحدات</div>
                <div className="text-[11px] text-stone-500 mt-0.5">يتوزع عليها {cadresCount} كوادر</div>
              </div>
              <div className="bg-white rounded-3xl p-4 border border-stone-200/80 shadow-sm">
                <div className="text-[11px] font-bold text-stone-400">مديرو الإدارات والقيادة</div>
                <div className="text-2xl font-black text-emerald-700 mt-1">{opAdminsCount + execCount} حسابات</div>
                <div className="text-[11px] text-stone-500 mt-0.5">{execCount} تنفيذي • {opAdminsCount} مدير إدارة</div>
              </div>
              <div className="bg-white rounded-3xl p-4 border border-stone-200/80 shadow-sm">
                <div className="text-[11px] font-bold text-stone-400">حالة قاعدة بيانات سوبابيس</div>
                <div className="text-base font-black text-stone-900 mt-1.5 flex items-center gap-1.5">
                  <span className={`w-2.5 h-2.5 rounded-full ${cloudStatus === "connected" ? "bg-emerald-500" : "bg-amber-500"}`} />
                  <span>{cloudStatus === "connected" ? "متصلة ومزامنة لحظياً" : "وضع محلي"}</span>
                </div>
                <div className="text-[11px] text-stone-500 mt-1">
                  {lastSyncAt ? `آخر مزامنة: ${lastSyncAt}` : "تزامن تلقائي عند أي تعديل"}
                </div>
              </div>
            </div>

            {/* القسم الأول: الضوابط والقواعد الحاكمة */}
            {activeTab === "governance" && (
              <div className="space-y-6">
                <div className="bg-stone-900 text-white rounded-3xl p-6 shadow-md flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <span className="text-xs font-bold text-orange-400">الإطار التنظيمي الحاكم لمنصة ميدان</span>
                    <h2 className="text-lg font-black mt-0.5">مصفوفة الضوابط التقنية وحدود صلاحيات الكادر</h2>
                    <p className="text-xs text-stone-300 mt-1">
                      أي تغيير تضبطه هنا يُطبق فوراً على جميع واجهات الكوادر ومعادلات التقييم دون تدخل في البيانات التشغيلية اليومية.
                    </p>
                  </div>
                  <span className="px-3.5 py-1.5 rounded-2xl bg-white/10 text-xs font-bold text-emerald-300 border border-white/10">
                    ✓ الحفظ السحابي فوري وتلقائي
                  </span>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* 1. ضوابط مواعيد اللقاء الأسبوعي */}
                  <div className="bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
                    <div className="flex items-center justify-between">
                      <div>
                        <span className="text-xs font-bold text-orange-600">الركن الأول</span>
                        <h3 className="text-base font-black text-stone-900">📅 ضوابط تغيير مواعيد اللقاء الأسبوعي</h3>
                      </div>
                    </div>

                    <div className="space-y-3">
                      <label className="flex items-center justify-between p-3.5 rounded-2xl bg-stone-50 border border-stone-200/80 cursor-pointer">
                        <div>
                          <div className="text-xs font-black text-stone-900">السماح للكادر بتغيير موعد لقائه الأسبوعي</div>
                          <div className="text-[11px] text-stone-500">عند إيقافه، يُقفل جدول اللقاء الأسبوعي ولا يغيره إلا مدير الإدارة</div>
                        </div>
                        <input
                          type="checkbox"
                          checked={Boolean(rules.allowCadreScheduleChange)}
                          onChange={e => updateRule("allowCadreScheduleChange", e.target.checked)}
                          className="w-5 h-5 accent-orange-600"
                        />
                      </label>

                      <label className="flex items-center justify-between p-3.5 rounded-2xl bg-stone-50 border border-stone-200/80 cursor-pointer">
                        <div>
                          <div className="text-xs font-black text-stone-900">السماح بالاستثناء المؤقت لأسبوع واحد</div>
                          <div className="text-[11px] text-stone-500">يسمح للكادر بتغيير موعد الأسبوع الحالي فقط دون تغيير موعده الثابت</div>
                        </div>
                        <input
                          type="checkbox"
                          checked={Boolean(rules.allowWeekSpecificOverride)}
                          onChange={e => updateRule("allowWeekSpecificOverride", e.target.checked)}
                          className="w-5 h-5 accent-orange-600"
                        />
                      </label>

                      <div className="p-3.5 rounded-2xl bg-stone-50 border border-stone-200/80 flex items-center justify-between gap-3">
                        <div>
                          <div className="text-xs font-black text-stone-900">الحد الأقصى لعدد مرات تغيير الموعد شهرياً</div>
                          <div className="text-[11px] text-stone-500">يضبط انضباط المواعيد ويمنع التغيير المتكرر</div>
                        </div>
                        <input
                          type="number"
                          min="0"
                          max="10"
                          value={rules.maxScheduleChangesPerMonth}
                          onChange={e => updateRule("maxScheduleChangesPerMonth", parseInt(e.target.value, 10) || 0)}
                          className="w-20 rounded-xl border border-stone-300 bg-white px-3 py-1.5 text-center text-xs font-black"
                        />
                      </div>
                    </div>
                  </div>

                  {/* 2. ضوابط الأسابيع السابقة والمهام المتأخرة */}
                  <div className="bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
                    <div>
                      <span className="text-xs font-bold text-orange-600">الركن الثاني</span>
                      <h3 className="text-base font-black text-stone-900">⏳ ضوابط الأسابيع السابقة ورصد المتأخرات</h3>
                    </div>

                    <div className="space-y-3">
                      <label className="flex items-center justify-between p-3.5 rounded-2xl bg-stone-50 border border-stone-200/80 cursor-pointer">
                        <div>
                          <div className="text-xs font-black text-stone-900">السماح للكادر برصد المهام المتأخرة للأسابيع السابقة</div>
                          <div className="text-[11px] text-stone-500">عند إيقافه، تُقفل الأسابيع المنتهية تماماً للقراءة فقط</div>
                        </div>
                        <input
                          type="checkbox"
                          checked={Boolean(rules.allowLateSubmissions)}
                          onChange={e => updateRule("allowLateSubmissions", e.target.checked)}
                          className="w-5 h-5 accent-orange-600"
                        />
                      </label>

                      <div className="p-3.5 rounded-2xl bg-stone-50 border border-stone-200/80 flex items-center justify-between gap-3">
                        <div>
                          <div className="text-xs font-black text-stone-900">عدد الأسابيع السابقة المسموح باستدراكها</div>
                          <div className="text-[11px] text-stone-500">تُقفل الأسابيع الأقدم من هذا العدد تلقائياً</div>
                        </div>
                        <input
                          type="number"
                          min="1"
                          max="52"
                          value={rules.maxPastWeeksEditable}
                          onChange={e => updateRule("maxPastWeeksEditable", parseInt(e.target.value, 10) || 1)}
                          className="w-20 rounded-xl border border-stone-300 bg-white px-3 py-1.5 text-center text-xs font-black"
                        />
                      </div>
                    </div>
                  </div>

                  {/* 3. حدود تعديل الكادر لبياناته الشخصية */}
                  <div className="bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
                    <div>
                      <span className="text-xs font-bold text-emerald-700">الركن الثالث</span>
                      <h3 className="text-base font-black text-stone-900">🔐 حدود تعديل الكادر لملفه الشخصي</h3>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <label className="flex items-center justify-between p-3.5 rounded-2xl bg-stone-50 border border-stone-200/80 cursor-pointer">
                        <span className="text-xs font-black text-stone-800">تعديل الاسم الكامل</span>
                        <input
                          type="checkbox"
                          checked={Boolean(rules.allowCadreNameEdit)}
                          onChange={e => updateRule("allowCadreNameEdit", e.target.checked)}
                          className="w-4 h-4 accent-emerald-600"
                        />
                      </label>

                      <label className="flex items-center justify-between p-3.5 rounded-2xl bg-stone-50 border border-stone-200/80 cursor-pointer">
                        <span className="text-xs font-black text-stone-800">تغيير كلمة المرور والدخول</span>
                        <input
                          type="checkbox"
                          checked={Boolean(rules.allowCadrePasswordChange)}
                          onChange={e => updateRule("allowCadrePasswordChange", e.target.checked)}
                          className="w-4 h-4 accent-emerald-600"
                        />
                      </label>

                      <label className="flex items-center justify-between p-3.5 rounded-2xl bg-stone-50 border border-stone-200/80 cursor-pointer">
                        <span className="text-xs font-black text-stone-800">تعديل المسمى الوظيفي</span>
                        <input
                          type="checkbox"
                          checked={Boolean(rules.allowCadreJobTitleEdit)}
                          onChange={e => updateRule("allowCadreJobTitleEdit", e.target.checked)}
                          className="w-4 h-4 accent-emerald-600"
                        />
                      </label>

                      <label className="flex items-center justify-between p-3.5 rounded-2xl bg-stone-50 border border-stone-200/80 cursor-pointer">
                        <span className="text-xs font-black text-stone-800">تعديل الوحدة التنظيمية</span>
                        <input
                          type="checkbox"
                          checked={Boolean(rules.allowCadreUnitEdit)}
                          onChange={e => updateRule("allowCadreUnitEdit", e.target.checked)}
                          className="w-4 h-4 accent-emerald-600"
                        />
                      </label>
                    </div>
                  </div>

                  {/* 4. معادلة احتساب النقاط والاختبارات */}
                  <div className="bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
                    <div>
                      <span className="text-xs font-bold text-emerald-700">الركن الرابع</span>
                      <h3 className="text-base font-black text-stone-900">⚖️ معادلة احتساب النقاط واجتياز الاختبار</h3>
                    </div>

                    <div className="space-y-3">
                      <div className="p-3.5 rounded-2xl bg-stone-50 border border-stone-200/80 flex items-center justify-between gap-3">
                        <div>
                          <div className="text-xs font-black text-stone-900">نسبة النقاط المحتسبة للمهمة المتأخرة (%)</div>
                          <div className="text-[11px] text-stone-500">المهمة المنجزة في وقتها تأخذ 100%، والمتأخرة تأخذ هذه النسبة</div>

    // ============================================================================
    // 10. EXECUTIVE OFFICE MEMBER PORTAL (بوابة عضو المكتب التنفيذي - النشرة الإدارية)

    function ExecutivePortal({ db, setDb, currentUser, onLogout, showToast }) {
      const cadres = useMemo(() => db.users.filter(u => u.roleType === "cadre"), [db.users]);
      const units = useMemo(() => Array.from(new Set(cadres.map(c => c.unit).filter(Boolean))), [cadres]);

      const [title, setTitle] = useState("");
      const [content, setContent] = useState("");
      const [category, setCategory] = useState("سياسة جديدة");
      const [targetType, setTargetType] = useState("all"); // 'all' | 'custom'
      const [selectedIds, setSelectedIds] = useState([]);

      const toggleRecipient = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const selectByUnit = (unitName) => {
        const unitUserIds = cadres.filter(c => c.unit === unitName).map(c => c.id);
        setSelectedIds(prev => Array.from(new Set([...prev, ...unitUserIds])));
      };

      const handlePublishBulletin = (e) => {
        e.preventDefault();
        if (!title.trim() || !content.trim()) {
          showToast("يرجى كتابة عنوان ونص التعميم الإداري أولاً.");
          return;
        }
        if (targetType === "custom" && selectedIds.length === 0) {
          showToast("يرجى اختيار كادر واحد على الأقل لإرسال التعميم المخصص.");
          return;
        }

        const now = new Date();
        const timeStr = formatTimeAr(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);
        const newBulletin = {
          id: "bul_" + Date.now(),
          title: title.trim(),

    function AdminPortal({ db, setDb, currentUser, onLogout, showToast }) {
      const [activeSection, setActiveSection] = useState("dashboard");

      const cadres = useMemo(() => db.users.filter(u => u.roleType === "cadre"), [db.users]);

      const handleAdminPublishBulletin = (e) => {

          showToast("يرجى كتابة عنوان ونص التعميم الإداري أولاً.");
          return;
        }

          showToast("يرجى اختيار كادر واحد على الأقل.");
          return;
        }
        const now = new Date();

        const newBul = {
          id: "bul_" + Date.now(),

          content: bContent.trim(),

          recipientIds: bTargetType === "all" ? [] : bSelectedIds,
