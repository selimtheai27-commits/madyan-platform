      const [unit, setUnit] = useState(currentUser.unit || "");
      const [username, setUsername] = useState(currentUser.username || "");
      const [password, setPassword] = useState(currentUser.password || "");
      const [err, setErr] = useState("");

      useEffect(() => {
        if (!scope) return;
        const targetTab = (scope === "week" && isPastWeek) ? "global" : scope;
        setActiveTab(targetTab);
        const sched = targetTab === "week"
          ? (currentUser.weekOverrides?.[selectedWeek] || currentUser.defaultSchedule)
          : currentUser.defaultSchedule;
        setMeetDay(sched?.meetDay ?? 2);
        setMeetTime(sched?.meetTime || "19:00");
        setMeetDuration(sched?.meetDuration || 90);
        setName(currentUser.name || "");
        setJobTitle(currentUser.jobTitle || "");
        setUnit(currentUser.unit || "");
        setUsername(currentUser.username || "");
        setPassword(currentUser.password || "");
        setErr("");
      }, [scope, currentUser, selectedWeek, isPastWeek]);

      if (!scope) return null;

      const switchTab = (t) => {
        setActiveTab(t);
        const sched = t === "week"
          ? (currentUser.weekOverrides?.[selectedWeek] || currentUser.defaultSchedule)
          : currentUser.defaultSchedule;
        setMeetDay(sched?.meetDay ?? 2);
        setMeetTime(sched?.meetTime || "19:00");
        setMeetDuration(sched?.meetDuration || 90);
        setErr("");
      };

      const handleSave = () => {
        if (activeTab === "account") {
          if (!username.trim() || !password.trim()) {
            setErr("اسم المستخدم وكلمة المرور لا يمكن أن يكونا فارغين.");
            return;
          }
          if (isUsernameTaken(username, currentUser.id)) {
            setErr("اسم المستخدم محجوز لكادر آخر.");
            return;
          }
          onSaveSettings(u => ({
            ...u,
            name: name.trim() || u.name,
            jobTitle: jobTitle.trim() || u.jobTitle,
            unit: unit.trim() || u.unit,
            username: username.trim(),
            password: password.trim()
          }));
        } else if (activeTab === "week") {
          onSaveSettings(u => ({
            ...u,
            weekOverrides: {
              ...(u.weekOverrides || {}),
              [selectedWeek]: {
                meetDay: parseInt(meetDay, 10),
                meetTime,
                meetDuration: parseInt(meetDuration, 10)
              }
            }
          }));
        } else {
          onSaveSettings(u => ({
            ...u,
            defaultSchedule: {
              meetDay: parseInt(meetDay, 10),
              meetTime,
              meetDuration: parseInt(meetDuration, 10)
            }
          }));
        }
      };

      return (
        <ModalContainer
          isOpen={Boolean(scope)}
          onClose={onClose}
          badge="إعدادات الكادر الإداري"
          title="تخصيص المواعيد وبيانات الحساب"
        >
          <div className="space-y-4">
            <div className="grid grid-cols-3 gap-1.5 p-1 bg-stone-100 rounded-2xl text-xs font-bold">
              <button
                disabled={isPastWeek}
                onClick={() => switchTab("week")}
                className={`py-2.5 px-2 rounded-xl transition ${
                  activeTab === "week" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500 disabled:opacity-40"
                }`}
              >
                الأسبوع الحالي ({selectedWeek})
              </button>
              <button
                onClick={() => switchTab("global")}
                className={`py-2.5 px-2 rounded-xl transition ${
                  activeTab === "global" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500"
                }`}
              >
                المواعيد العامة
              </button>
              <button
                onClick={() => switchTab("account")}
                className={`py-2.5 px-2 rounded-xl transition ${
                  activeTab === "account" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500"
                }`}
              >
                بياناتي والدخول
              </button>
            </div>

            {activeTab !== "account" ? (
              <div className="space-y-3.5">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">يوم الاجتماع</label>
                    <select value={meetDay} onChange={e => setMeetDay(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold">
                      {DAYS_AR.map((d, i) => <option key={i} value={i}>{d}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">ساعة البدء</label>
                    <input type="time" value={meetTime} onChange={e => setMeetTime(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold" />
                  </div>
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">مدة الاجتماع</label>
                  <select value={meetDuration} onChange={e => setMeetDuration(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold">
                    <option value="60">ساعة واحدة (60 دقيقة)</option>
                    <option value="90">ساعة ونصف (90 دقيقة)</option>
                    <option value="120">ساعتان (120 دقيقة)</option>
                    <option value="180">3 ساعات (180 دقيقة)</option>
                  </select>
                </div>
              </div>
            ) : (
              <div className="space-y-3.5">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">الاسم الكامل</label>
                  <input value={name} onChange={e => setName(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold" />
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">المسمى الوظيفي</label>
                    <input value={jobTitle} onChange={e => setJobTitle(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-stone-700 mb-1">الوحدة الإدارية</label>
                    <input value={unit} onChange={e => setUnit(e.target.value)} className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-sm font-bold" />
                  </div>
                </div>

                <div className="p-3.5 rounded-2xl bg-stone-50 border border-stone-200 space-y-3">
                  <div className="text-xs font-black text-stone-800">🔐 تعديل اسم المستخدم وكلمة المرور</div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-bold text-stone-600 mb-1">اسم المستخدم (Username)</label>
                      <input value={username} onChange={e => setUsername(e.target.value)} className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-stone-600 mb-1">كلمة المرور الجديدة</label>
                      <input type="text" value={password} onChange={e => setPassword(e.target.value)} className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold" />
                    </div>
                  </div>
                </div>

                <div className="text-[11px] text-stone-400 bg-stone-50 px-3 py-2 rounded-xl">
                  📅 تاريخ تفعيل حسابك بالنظام مرصود تلقائياً: <strong>{formatDateAr(currentUser.joinedAt)}</strong>.
                </div>
              </div>
            )}

            {err && <div className="text-xs font-bold text-rose-600">{err}</div>}

            <div className="flex justify-end gap-2 pt-2">
              <button onClick={onClose} className="px-4 py-2.5 rounded-2xl bg-stone-100 text-stone-700 text-xs font-bold">إلغاء</button>
              <button onClick={handleSave} className="px-6 py-2.5 rounded-2xl bg-stone-900 text-white text-xs font-bold hover:bg-stone-800">
                حفظ التعديلات
              </button>
            </div>
          </div>
        </ModalContainer>
      );
    }

    function TaskNoteModal({ isOpen, onClose, initialNote, onSaveNote }) {
      const [val, setVal] = useState(initialNote);
      useEffect(() => { setVal(initialNote); }, [initialNote, isOpen]);
      return (
        <ModalContainer isOpen={isOpen} onClose={onClose} badge="مسودة شخصية" title="ملاحظاتك على المهمة">
          <div className="space-y-4">
            <textarea
              rows="4"
              value={val}
              onChange={e => setVal(e.target.value)}
              placeholder="اكتب مسودتك أو نقاطك الخاصة هنا..."
              className="w-full rounded-2xl border border-stone-200 bg-stone-50 p-3.5 text-sm"
            />
            <div className="flex justify-end gap-2">
              <button onClick={onClose} className="px-4 py-2 rounded-xl bg-stone-100 text-xs font-bold">إغلاق</button>
              <button onClick={() => onSaveNote(val.trim())} className="px-6 py-2 rounded-xl bg-stone-900 text-white text-xs font-bold">حفظ</button>
            </div>
          </div>
        </ModalContainer>
      );
    }

    // ============================================================================
    // 10. EXECUTIVE OFFICE MEMBER PORTAL (بوابة عضو المكتب التنفيذي - النشرة الإدارية)
    // ============================================================================
    function ExecutivePortal({ db, setDb, currentUser, onLogout, showToast }) {
      const cadres = useMemo(() => db.users.filter(u => u.roleType === "cadre"), [db.users]);
      const units = useMemo(() => Array.from(new Set(cadres.map(c => c.unit).filter(Boolean))), [cadres]);

      const [title, setTitle] = useState("");
      const [content, setContent] = useState("");
      const [category, setCategory] = useState("سياسة جديدة");
      const [targetType, setTargetType] = useState("all"); // 'all' | 'custom'
      const [selectedIds, setSelectedIds] = useState([]);

      const toggleRecipient = (id) => {
        setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const selectByUnit = (unitName) => {
        const unitUserIds = cadres.filter(c => c.unit === unitName).map(c => c.id);
        setSelectedIds(prev => Array.from(new Set([...prev, ...unitUserIds])));
      };

      const handlePublishBulletin = (e) => {
        e.preventDefault();
        if (!title.trim() || !content.trim()) {
          showToast("يرجى كتابة عنوان ونص التعميم الإداري أولاً.");
          return;
        }
        if (targetType === "custom" && selectedIds.length === 0) {
          showToast("يرجى اختيار كادر واحد على الأقل لإرسال التعميم المخصص.");
          return;
        }

        const now = new Date();
        const timeStr = formatTimeAr(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);
        const newBulletin = {
          id: "bul_" + Date.now(),
          title: title.trim(),
          content: content.trim(),
          category,
          senderName: currentUser.name,
          senderRole: currentUser.jobTitle || "عضو المكتب التنفيذي",
          createdAt: `اليوم • ${timeStr}`,
          targetType,
          recipientIds: targetType === "all" ? [] : selectedIds,
          acknowledgedBy: {}
        };

        setDb(prev => ({
          ...prev,
          bulletins: [newBulletin, ...(prev.bulletins || [])]
        }));

        setTitle("");
        setContent("");
        showToast("تم نشر وإرسال التعميم في النشرة الإدارية بنجاح 📢");
      };

      const deleteBulletin = (id) => {
        setDb(prev => ({
          ...prev,
          bulletins: (prev.bulletins || []).filter(b => b.id !== id)
        }));
        showToast("تم حذف التعميم من النشرة الإدارية");
      };

      return (
        <div className="min-h-screen bg-[#F7F7F5]">
          <header className="bg-white border-b border-stone-200 sticky top-0 z-30">
            <div className="max-w-5xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <MadyanWordmark size="text-2xl sm:text-3xl" />
                <span className="text-xs font-black px-3 py-1 rounded-full madyan-gradient text-white shadow-sm">
                  🏛️ بوابة عضو المكتب التنفيذي • النشرة الإدارية
                </span>
              </div>
              <div className="flex items-center gap-3">
                <span className="text-xs font-bold text-stone-600 hidden sm:inline">
                  {currentUser.name} ({currentUser.jobTitle})
                </span>
                <button
                  onClick={onLogout}
                  className="px-4 py-2 rounded-2xl bg-rose-50 text-rose-700 hover:bg-rose-100 text-xs font-bold transition"
                >
                  تسجيل الخروج
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 pt-6 space-y-6">
            <BulletinPublisherPanel
              cadres={cadres}
              units={units}
              title={title}
              setTitle={setTitle}
              content={content}
              setContent={setContent}
              category={category}
              setCategory={setCategory}
              targetType={targetType}
              setTargetType={setTargetType}
              selectedIds={selectedIds}
              setSelectedIds={setSelectedIds}
              toggleRecipient={toggleRecipient}
              selectByUnit={selectByUnit}
              onSubmit={handlePublishBulletin}
              bulletins={db.bulletins || []}
              onDelete={deleteBulletin}
            />
          </main>
        </div>
      );
    }

    // مكون مشترك لإصدار النشرة الإدارية وتحديد المستلمين ومتابعة الاستيعاب
    function BulletinPublisherPanel({
      cadres, units, title, setTitle, content, setContent, category, setCategory,
      targetType, setTargetType, selectedIds, setSelectedIds, toggleRecipient, selectByUnit,
      onSubmit, bulletins, onDelete
    }) {
      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          {/* نموذج إرسال تعميم إداري جديد (One-Way Message) */}
          <div className="lg:col-span-5 bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4 h-fit">
            <div>
              <span className="text-xs font-bold text-orange-600">إصدار تعميم لحظي (One-Way)</span>
              <h2 className="text-lg font-black text-stone-900">إرسال نشرة إدارية أو سياسة جديدة</h2>
              <p className="text-xs text-stone-500 mt-0.5">
                حدد محتوى الرسالة واختر بدقة من تصل إليه ومن لا تصل إليه من الكوادر.
              </p>
            </div>

            <form onSubmit={onSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">تصنيف النشرة</label>
                <select
                  value={category}
                  onChange={e => setCategory(e.target.value)}
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-black"
                >
                  <option value="سياسة جديدة">📜 سياسة جديدة</option>
                  <option value="تعميم مشروع">🚀 تعميم مشروع</option>
                  <option value="توجيه عاجل">⚡ توجيه عاجل</option>
                  <option value="معلومة إدارية">💡 معلومة إدارية</option>
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">عنوان التعميم / السياسة</label>
                <input
                  value={title}
                  onChange={e => setTitle(e.target.value)}
                  placeholder="مثال: اعتماد لائحة الاجتماعات الأسبوعية الجديدة..."
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-bold"
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">تفاصيل التعميم المطلوب استيعابه</label>
                <textarea
                  rows="4"
                  value={content}
                  onChange={e => setContent(e.target.value)}
                  placeholder="اكتب النص الكامل للتعميم أو القرار الإداري ليظهر في الصفحة الرئيسية للمستلمين..."
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 p-3.5 text-xs leading-relaxed"
                />
              </div>

              {/* التحكم الدقيق في المستلمين (توصل لمين ومتوصلش لمين) */}
              <div className="p-4 rounded-2xl bg-stone-50 border border-stone-200 space-y-3">
                <div className="text-xs font-black text-stone-800">🎯 تحديد المستلمين (توصل لمين ومتوصلش لمين)</div>
                <div className="grid grid-cols-2 gap-2 text-xs font-bold">
                  <button
                    type="button"
                    onClick={() => setTargetType("all")}
                    className={`py-2 px-3 rounded-xl border transition ${
                      targetType === "all" ? "bg-stone-900 text-white border-stone-900" : "bg-white text-stone-600"
                    }`}
                  >
                    🌐 جميع الكوادر ({cadres.length})
                  </button>
                  <button
                    type="button"
                    onClick={() => setTargetType("custom")}
                    className={`py-2 px-3 rounded-xl border transition ${
                      targetType === "custom" ? "bg-stone-900 text-white border-stone-900" : "bg-white text-stone-600"
                    }`}
                  >
                    🎯 تحديد مخصص ({selectedIds.length})
                  </button>
                </div>

                {targetType === "custom" && (
                  <div className="space-y-2.5 pt-2 border-t border-stone-200/70">
                    <div className="flex flex-wrap items-center gap-1.5">
                      <span className="text-[10px] font-bold text-stone-500">تحديد سريع لوحدة:</span>
                      {units.map(uName => (
                        <button
                          key={uName}
                          type="button"
                          onClick={() => selectByUnit(uName)}
                          className="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-orange-100 text-orange-800 hover:bg-orange-200"
                        >
                          + {uName}
                        </button>
                      ))}
                      <button
                        type="button"
                        onClick={() => setSelectedIds([])}
                        className="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-stone-200 text-stone-600"
                      >
                        إلغاء الكل
                      </button>
                    </div>

                    <div className="max-h-40 overflow-y-auto space-y-1.5 pr-1">
                      {cadres.map(c => {
                        const checked = selectedIds.includes(c.id);
                        return (
                          <label
                            key={c.id}
                            onClick={() => toggleRecipient(c.id)}
                            className={`flex items-center justify-between p-2 rounded-xl border cursor-pointer text-xs transition ${
                              checked ? "bg-orange-50 border-orange-400 font-black" : "bg-white border-stone-200 text-stone-500"
                            }`}
                          >
                            <div>
                              <span className="text-stone-800">{c.name}</span>
                              <span className="text-[10px] text-stone-400 mr-1.5">({c.unit})</span>
                            </div>
                            <span className={`text-[10px] px-2 py-0.5 rounded-md ${checked ? "bg-emerald-600 text-white" : "bg-stone-100 text-stone-500"}`}>
                              {checked ? "تصل له ✓" : "مستثنى ✕"}
                            </span>
                          </label>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>

              <button
                type="submit"
                className="w-full py-3.5 rounded-2xl madyan-gradient text-white text-xs font-black shadow-lg shadow-orange-500/20 hover:opacity-95"
              >
                📢 إرسال ونشر التعميم اللحظي الآن
              </button>
            </form>
          </div>

          {/* سجل التعميمات الصادرة ومتابعة من استوعبها */}
          <div className="lg:col-span-7 bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
            <div className="flex items-center justify-between">
              <div>
                <span className="text-xs font-bold text-orange-600">متابعة الاستيعاب اللحظي</span>
                <h2 className="text-lg font-black text-stone-900">سجل النشرات والتعميمات الصادرة ({bulletins.length})</h2>
              </div>
            </div>

            <div className="space-y-4">
              {bulletins.map(bul => {
                const targetCadres = bul.targetType === "all"
                  ? cadres
                  : cadres.filter(c => (bul.recipientIds || []).includes(c.id));
                const ackCount = targetCadres.filter(c => bul.acknowledgedBy?.[c.id]).length;
                const ackPct = targetCadres.length > 0 ? Math.round((ackCount / targetCadres.length) * 100) : 0;

                return (
                  <div key={bul.id} className="p-4 rounded-2xl bg-stone-50 border border-stone-200 space-y-3">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div className="flex items-center gap-2">
                        <span className="text-[11px] font-black px-2.5 py-0.5 rounded-full bg-orange-100 text-orange-800">
                          {bul.category}
                        </span>
                        <span className="text-xs font-bold text-stone-500">{bul.createdAt}</span>
                        <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-stone-200 text-stone-700">
                          {bul.targetType === "all" ? "🌐 موجه للجميع" : `🎯 مخصص لـ ${targetCadres.length} كوادر`}
                        </span>
                      </div>
                      <button
                        onClick={() => onDelete(bul.id)}
                        className="text-[11px] font-bold text-rose-600 hover:underline"
                      >
                        حذف التعميم
                      </button>
                    </div>

                    <h3 className="text-sm font-black text-stone-900">{bul.title}</h3>
                    <p className="text-xs text-stone-600 leading-relaxed whitespace-pre-line">{bul.content}</p>

                    <div className="pt-2 border-t border-stone-200/70 space-y-2">
                      <div className="flex items-center justify-between text-xs font-bold">
                        <span className="text-stone-700">نسبة الاطلاع والاستيعاب:</span>
                        <span className="text-emerald-700">{ackCount} من {targetCadres.length} ({ackPct}%)</span>
                      </div>
                      <div className="w-full h-2 rounded-full bg-stone-200 overflow-hidden">
                        <div style={{ width: `${ackPct}%` }} className="h-full bg-emerald-600 transition-all" />
                      </div>
                      <div className="flex flex-wrap gap-1.5 pt-1">
                        {targetCadres.map(c => {
                          const isAck = Boolean(bul.acknowledgedBy?.[c.id]);
                          return (
                            <span
                              key={c.id}
                              className={`text-[10px] font-bold px-2 py-0.5 rounded-lg border ${
                                isAck
                                  ? "bg-emerald-50 text-emerald-800 border-emerald-200"
                                  : "bg-white text-stone-400 border-stone-200"
                              }`}
                            >
                              {c.name}: {isAck ? "استوعب ✓" : "لم يطلع بعد"}
                            </span>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 11. MANAGER / HR PORTAL
    // ============================================================================
    function AdminPortal({ db, setDb, currentUser, onLogout, showToast }) {
      const [activeSection, setActiveSection] = useState("dashboard");
      const [inspectedCadre, setInspectedCadre] = useState(null);

      const cadres = useMemo(() => db.users.filter(u => u.roleType === "cadre"), [db.users]);
      const units = useMemo(() => Array.from(new Set(cadres.map(c => c.unit).filter(Boolean))), [cadres]);

      // state for Admin Bulletin tab
      const [bTitle, setBTitle] = useState("");
      const [bContent, setBContent] = useState("");
      const [bCategory, setBCategory] = useState("سياسة جديدة");
      const [bTargetType, setBTargetType] = useState("all");
      const [bSelectedIds, setBSelectedIds] = useState([]);

      const toggleBRecipient = (id) => {
        setBSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
      };

      const selectBByUnit = (unitName) => {
        const unitUserIds = cadres.filter(c => c.unit === unitName).map(c => c.id);
        setBSelectedIds(prev => Array.from(new Set([...prev, ...unitUserIds])));
      };

      const handleAdminPublishBulletin = (e) => {
        e.preventDefault();
        if (!bTitle.trim() || !bContent.trim()) {
          showToast("يرجى كتابة عنوان ونص التعميم الإداري أولاً.");
          return;
        }
        if (bTargetType === "custom" && bSelectedIds.length === 0) {
          showToast("يرجى اختيار كادر واحد على الأقل.");
          return;
        }
        const now = new Date();
        const timeStr = formatTimeAr(`${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`);
        const newBul = {
          id: "bul_" + Date.now(),
          title: bTitle.trim(),
          content: bContent.trim(),
          category: bCategory,
          senderName: currentUser.name,
          senderRole: "الإدارة العليا",
          createdAt: `اليوم • ${timeStr}`,
          targetType: bTargetType,
          recipientIds: bTargetType === "all" ? [] : bSelectedIds,
          acknowledgedBy: {}
        };
        setDb(prev => ({ ...prev, bulletins: [newBul, ...(prev.bulletins || [])] }));
        setBTitle("");
        setBContent("");
        showToast("تم نشر التعميم الإداري بنجاح 📢");
      };

      return (
        <div className="min-h-screen bg-[#F7F7F5]">
          <header className="bg-white border-b border-stone-200 sticky top-0 z-30">
            <div className="max-w-6xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <MadyanWordmark size="text-2xl sm:text-3xl" />
                <span className="text-xs font-black px-3 py-1 rounded-full bg-stone-900 text-white">
                  بوابة المدير والـ HR
                </span>
              </div>

              <div className="flex flex-wrap items-center gap-1.5 bg-stone-100 p-1.5 rounded-2xl text-xs font-black">
                <button
                  onClick={() => setActiveSection("dashboard")}
                  className={`px-3.5 py-2 rounded-xl transition ${
                    activeSection === "dashboard" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500 hover:text-stone-800"
                  }`}
                >
                  📊 الداشبورد والتحليلات
                </button>
                <button
                  onClick={() => setActiveSection("curriculum")}
                  className={`px-3.5 py-2 rounded-xl transition ${
                    activeSection === "curriculum" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500 hover:text-stone-800"
                  }`}
                >
                  🎬 المحاضرات والاختبارات
                </button>
                <button
                  onClick={() => setActiveSection("bulletins")}
                  className={`px-3.5 py-2 rounded-xl transition ${
                    activeSection === "bulletins" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500 hover:text-stone-800"
                  }`}
                >
                  📢 النشرة الإدارية
                </button>
                <button
                  onClick={() => setActiveSection("settings")}
                  className={`px-3.5 py-2 rounded-xl transition ${
                    activeSection === "settings" ? "bg-white text-stone-900 shadow-sm" : "text-stone-500 hover:text-stone-800"
                  }`}
                >
                  ⚙️ الإعدادات والحسابات
                </button>
              </div>

              <button
                onClick={onLogout}
                className="px-4 py-2 rounded-2xl bg-rose-50 text-rose-700 hover:bg-rose-100 text-xs font-bold transition"
              >
                تسجيل الخروج
              </button>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 pt-6">
            {activeSection === "dashboard" && (
              <AdminDashboardSection
                cadres={cadres}
                db={db}
                onInspectCadre={(c) => setInspectedCadre(c)}
              />
            )}

            {activeSection === "curriculum" && (
              <AdminCurriculumSection
                db={db}
                setDb={setDb}
                showToast={showToast}
              />
            )}

            {activeSection === "bulletins" && (
              <BulletinPublisherPanel
                cadres={cadres}
                units={units}
                title={bTitle}
                setTitle={setBTitle}
                content={bContent}
                setContent={setBContent}
                category={bCategory}
                setCategory={setBCategory}
                targetType={bTargetType}
                setTargetType={setBTargetType}
                selectedIds={bSelectedIds}
                setSelectedIds={setBSelectedIds}
                toggleRecipient={toggleBRecipient}
                selectByUnit={selectBByUnit}
                onSubmit={handleAdminPublishBulletin}
                bulletins={db.bulletins || []}
                onDelete={(id) => {
                  setDb(prev => ({ ...prev, bulletins: (prev.bulletins || []).filter(b => b.id !== id) }));
                  showToast("تم حذف التعميم");
                }}
              />
            )}

            {activeSection === "settings" && (
              <AdminSettingsAndUsersSection
                db={db}
                setDb={setDb}
                cadres={cadres}
                showToast={showToast}
              />
            )}
          </main>

          <CadreInspectorModal
            cadre={inspectedCadre}
            db={db}
            onClose={() => setInspectedCadre(null)}
          />
        </div>
      );
    }

    function AdminDashboardSection({ cadres, db, onInspectCadre }) {
      const analytics = useMemo(() => {
        const list = cadres.map(c => ({
          cadre: c,
          metrics: computeCadreMetrics(c)
        })).sort((a, b) => b.metrics.overallScorePct - a.metrics.overallScorePct);

        let totalOnTime = 0, totalLate = 0, totalPending = 0, totalAll = 0;
        const taskTotals = {
          lecture: { onTime: 0, late: 0, total: 0 },
          agenda: { onTime: 0, late: 0, total: 0 },
          attendance: { onTime: 0, late: 0, total: 0 },
          minutes: { onTime: 0, late: 0, total: 0 }
        };

        list.forEach(({ metrics }) => {
          totalOnTime += metrics.onTimeCount;
          totalLate += metrics.lateCount;
          totalPending += metrics.pendingCount;
          totalAll += metrics.totalTasksCount;

          ['lecture', 'agenda', 'attendance', 'minutes'].forEach(k => {
            taskTotals[k].onTime += metrics.byTaskKey[k].onTime;
            taskTotals[k].late += metrics.byTaskKey[k].late;
            taskTotals[k].total += metrics.totalWeeks;
          });
        });

        return {
          list,
          onTimePct: totalAll ? Math.round((totalOnTime / totalAll) * 100) : 0,
          latePct: totalAll ? Math.round((totalLate / totalAll) * 100) : 0,
          pendingPct: totalAll ? Math.round((totalPending / totalAll) * 100) : 0,
          taskTotals
        };
      }, [cadres]);

      const taskNames = {
        lecture: "1. المحاضرة الأسبوعية والاختبار",
        agenda: "2. إرسال الأجندة (قبل 24 ساعة)",
        attendance: "3. الانضباط في حضور اللقاء",
        minutes: "4. توثيق المحضر (خلال 24 ساعة)"
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div className="bg-white p-5 rounded-3xl border border-stone-200/80 shadow-sm">
              <div className="text-xs font-bold text-stone-400">إجمالي الكوادر النشطة</div>
              <div className="text-3xl font-black text-stone-900 mt-2">{cadres.length} كوادر</div>
              <div className="text-[11px] text-stone-500 mt-1">مسجلين بحسابات حصرية</div>
            </div>
            <div className="bg-white p-5 rounded-3xl border border-emerald-200 shadow-sm">
              <div className="text-xs font-bold text-emerald-700">الإنجاز في الموعد (On-Time)</div>
              <div className="text-3xl font-black text-emerald-600 mt-2">{analytics.onTimePct}%</div>
              <div className="text-[11px] text-stone-500 mt-1">التزام كامل بالوقت المحدد (100% سكور)</div>
            </div>
            <div className="bg-white p-5 rounded-3xl border border-amber-200 shadow-sm">
              <div className="text-xs font-bold text-amber-700">إنجاز متأخر (محاضرات فائتة)</div>
              <div className="text-3xl font-black text-amber-500 mt-2">{analytics.latePct}%</div>
              <div className="text-[11px] text-stone-500 mt-1">أُنجزت بعد انتهاء أسبوعها (50% سكور)</div>
            </div>
            <div className="bg-white p-5 rounded-3xl border border-rose-200 shadow-sm">
              <div className="text-xs font-bold text-rose-700">غير منجز / قيد الانتظار</div>
              <div className="text-3xl font-black text-rose-600 mt-2">{analytics.pendingPct}%</div>
              <div className="text-[11px] text-stone-500 mt-1">مهمات لم تُستكمل بعد (0% سكور)</div>
            </div>
          </div>

          <div className="bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
            <div>
              <span className="text-xs font-bold text-orange-600">تحليل العادات الأربع</span>
              <h2 className="text-lg font-black text-stone-900">مدى إنجاز كل مهمة على حدة عبر جميع الكوادر</h2>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {['lecture', 'agenda', 'attendance', 'minutes'].map(k => {
                const t = analytics.taskTotals[k];
                const onTimeRate = t.total ? Math.round((t.onTime / t.total) * 100) : 0;
                const lateRate = t.total ? Math.round((t.late / t.total) * 100) : 0;
                const totalDoneRate = onTimeRate + lateRate;

                return (
                  <div key={k} className="p-4 rounded-2xl bg-stone-50 border border-stone-200/70 space-y-2">
                    <div className="flex items-center justify-between text-xs font-black">
                      <span className="text-stone-800">{taskNames[k]}</span>
                      <span className="text-stone-900">{totalDoneRate}% إجمالي الإنجاز</span>
                    </div>
                    <div className="w-full h-3 rounded-full bg-stone-200 overflow-hidden flex">
                      <div style={{ width: `${onTimeRate}%` }} className="bg-emerald-600 h-full" title="في الموعد" />
                      <div style={{ width: `${lateRate}%` }} className="bg-amber-500 h-full" title="متأخر" />
                    </div>
                    <div className="flex items-center justify-between text-[11px] text-stone-500 font-semibold">
                      <span>✅ في الموعد: {onTimeRate}% ({t.onTime})</span>
                      {k === "lecture" && <span>⚠️ متأخر: {lateRate}% ({t.late})</span>}
                      <span>⏳ غير منجز: {100 - totalDoneRate}%</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div>
                <span className="text-xs font-bold text-orange-600">تقييم الكوادر التفصيلي</span>
                <h2 className="text-lg font-black text-stone-900">جدول التزام الكوادر والـ Score التراكمي وإجابات الاختبارات</h2>
              </div>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-right text-xs">
                <thead>
                  <tr className="border-b border-stone-200 text-stone-400 font-bold">
                    <th className="py-3 px-2">#</th>
                    <th className="py-3 px-2">الكادر الإداري</th>
                    <th className="py-3 px-2">بيانات الدخول الحالية</th>
                    <th className="py-3 px-2">تاريخ الانضمام (الأسابيع)</th>
                    <th className="py-3 px-2">حالة الأسبوع الحالي</th>
                    <th className="py-3 px-2">متوسط الاختبارات</th>
                    <th className="py-3 px-2">السكور العام</th>
                    <th className="py-3 px-2">التفاصيل وإجابات الاختبار</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-stone-100">
                  {analytics.list.map(({ cadre, metrics }, idx) => {
                    const currWeekRec = cadre.tasksRecord?.[metrics.totalWeeks] || {};
                    return (
                      <tr key={cadre.id} className="hover:bg-stone-50/80">
                        <td className="py-3.5 px-2 font-black text-stone-500">{idx + 1}</td>
                        <td className="py-3.5 px-2">
                          <div className="font-black text-stone-900 text-sm">{cadre.name}</div>
                          <div className="text-[11px] text-stone-400">{cadre.unit} • {cadre.jobTitle}</div>
                        </td>
                        <td className="py-3.5 px-2">
                          <span className="font-mono bg-stone-100 px-2 py-1 rounded-lg text-stone-700 font-bold">
                            {cadre.username} / {cadre.password}
                          </span>
                        </td>
                        <td className="py-3.5 px-2 font-semibold text-stone-600">
                          {formatDateAr(cadre.joinedAt)} ({metrics.totalWeeks} أسبوع)
                        </td>
                        <td className="py-3.5 px-2">
                          <div className="flex items-center gap-1.5">
                            {['lecture', 'agenda', 'attendance', 'minutes'].map(k => {
                              const st = currWeekRec[k]?.status || 'pending';
                              return (
                                <span
                                  key={k}
                                  title={k}
                                  className={`w-6 h-6 rounded-lg flex items-center justify-center text-[11px] font-bold ${
                                    st === 'on_time'
                                      ? 'bg-emerald-100 text-emerald-700'
                                      : st === 'late'
                                      ? 'bg-amber-100 text-amber-800'
                                      : 'bg-rose-50 text-rose-500'
                                  }`}
                                >
                                  {st === 'on_time' ? '✓' : st === 'late' ? '!' : '•'}
                                </span>
                              );
                            })}
                          </div>
                        </td>
                        <td className="py-3.5 px-2 font-bold">
                          {metrics.avgQuizPct !== null ? (
                            <span className="px-2.5 py-1 rounded-full bg-sky-50 text-sky-800">{metrics.avgQuizPct}%</span>
                          ) : (
                            <span className="text-stone-400">لم يختبر بعد</span>
                          )}
                        </td>
                        <td className="py-3.5 px-2">
                          <span className={`text-sm font-black px-3 py-1 rounded-full ${
                            metrics.overallScorePct >= 80
                              ? 'bg-emerald-100 text-emerald-800'
                              : metrics.overallScorePct >= 50
                              ? 'bg-amber-100 text-amber-800'
                              : 'bg-rose-100 text-rose-800'
                          }`}>
                            {metrics.overallScorePct}%
                          </span>
                        </td>
                        <td className="py-3.5 px-2">
                          <button
                            onClick={() => onInspectCadre(cadre)}
                            className="px-3 py-1.5 rounded-xl bg-stone-900 text-white font-bold hover:bg-orange-600 transition"
                          >
                            🔍 فحص الإجابات والسجل
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================================
    // 12. ADMIN CURRICULUM & QUIZ BUILDER SECTION (إدارة المحاضرات والاختبارات)
    // ============================================================================
    function AdminCurriculumSection({ db, setDb, showToast }) {
      const availableWeeks = db.systemConfig?.availableCurriculumWeeks || [1, 2, 3, 4, 5, 6, 7, 8];
      const [selectedKey, setSelectedKey] = useState("default");

      const currentCurr = useMemo(() => {
        return db.weeklyCurriculums?.[selectedKey] || db.weeklyCurriculums?.default || INITIAL_STATE.weeklyCurriculums.default;
      }, [db.weeklyCurriculums, selectedKey]);

      const [lectureTitle, setLectureTitle] = useState(currentCurr.lectureTitle || "");
      const [lectureDesc, setLectureDesc] = useState(currentCurr.lectureDesc || "");
      const [videoType, setVideoType] = useState(currentCurr.videoType || "mp4");
      const [videoUrl, setVideoUrl] = useState(currentCurr.videoUrl || "");
      const [questions, setQuestions] = useState(currentCurr.questions || []);

      useEffect(() => {
        setLectureTitle(currentCurr.lectureTitle || "");
        setLectureDesc(currentCurr.lectureDesc || "");
        setVideoType(currentCurr.videoType || "mp4");
        setVideoUrl(currentCurr.videoUrl || "");
        setQuestions(
          Array.isArray(currentCurr.questions)
            ? currentCurr.questions.map(q => ({ ...q, options: [...(q.options || ["", "", "", ""])] }))
            : []
        );
      }, [currentCurr, selectedKey]);

      const handleQuestionChange = (qIdx, field, val) => {
        setQuestions(prev => prev.map((q, idx) => idx === qIdx ? { ...q, [field]: val } : q));
      };

      const handleOptionChange = (qIdx, optIdx, val) => {
        setQuestions(prev => prev.map((q, idx) => {
          if (idx !== qIdx) return q;
          const nextOpts = [...(q.options || [])];
          nextOpts[optIdx] = val;
          return { ...q, options: nextOpts };
        }));
      };

      const addQuestion = () => {
        setQuestions(prev => [
          ...prev,
          {
            id: "q_" + Date.now(),
            text: "سؤال جديد حول المحاضرة الأسبوعية؟",
            options: ["الخيار الأول", "الخيار الثاني", "الخيار الثالث", "الخيار الرابع"],
            correctIndex: 0
          }
        ]);
      };

      const removeQuestion = (qIdx) => {
        if (questions.length <= 1) {
          showToast("يجب أن يحتوي الاختبار على سؤال واحد على الأقل.");
          return;
        }
        setQuestions(prev => prev.filter((_, idx) => idx !== qIdx));
      };

      const handleSaveCurriculum = (e) => {
        e.preventDefault();
        if (!lectureTitle.trim() || !videoUrl.trim()) {
          showToast("يرجى إدخال عنوان المحاضرة ورابط الفيديو.");
          return;
        }

        const updatedCurr = {
          lectureTitle: lectureTitle.trim(),
          lectureDesc: lectureDesc.trim(),
          videoType,
          videoUrl: videoUrl.trim(),
          questions
        };

        setDb(prev => ({
          ...prev,
          weeklyCurriculums: {
            ...(prev.weeklyCurriculums || {}),
            [selectedKey]: updatedCurr
          }
        }));

        showToast(
          selectedKey === "default"
            ? "تم حفظ المنهج الافتراضي لجميع الأسابيع بنجاح ✓"
            : `تم حفظ محاضرة واختبار الأسبوع ${selectedKey} بنجاح ✓`
        );
      };

      const addNewWeekSlot = () => {
        const nextWeekNum = availableWeeks.length > 0 ? Math.max(...availableWeeks) + 1 : 1;
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            availableCurriculumWeeks: [...availableWeeks, nextWeekNum]
          }
        }));
        setSelectedKey(String(nextWeekNum));
        showToast(`تمت إضافة الأسبوع ${nextWeekNum} إلى خطة المحاضرات ✓`);
      };

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <span className="text-xs font-bold text-orange-600">إدارة المحتوى المعرفي والاختبارات</span>
                <h2 className="text-lg font-black text-stone-900">تخصيص المحاضرات الأسبوعية وأسئلة الاستيعاب</h2>
                <p className="text-xs text-stone-500 mt-0.5">
                  اختر «المنهج الافتراضي» لتطبيقه تلقائياً، أو خصص محاضرة واختباراً مستقلاً لكل أسبوع.
                </p>
              </div>
              <button
                type="button"
                onClick={addNewWeekSlot}
                className="px-4 py-2.5 rounded-2xl bg-stone-900 text-white text-xs font-bold hover:bg-stone-800 transition"
              >
                + إضافة أسبوع جديد للخطة
              </button>
            </div>

            <div className="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
              <button
                type="button"
                onClick={() => setSelectedKey("default")}
                className={`px-4 py-2.5 rounded-2xl text-xs font-black border transition flex-shrink-0 ${
                  selectedKey === "default"
                    ? "madyan-gradient text-white border-transparent shadow-sm"
                    : "bg-stone-50 text-stone-700 border-stone-200 hover:bg-stone-100"
                }`}
              >
                🌟 المنهج الافتراضي العام
              </button>
              {availableWeeks.map(w => {
                const isCustom = Boolean(db.weeklyCurriculums?.[w]);
                return (
                  <button
                    key={w}
                    type="button"
                    onClick={() => setSelectedKey(String(w))}
                    className={`px-4 py-2.5 rounded-2xl text-xs font-black border transition flex-shrink-0 ${
                      String(selectedKey) === String(w)
                        ? "bg-stone-900 text-white border-stone-900 shadow-sm"
                        : "bg-stone-50 text-stone-700 border-stone-200 hover:bg-stone-100"
                    }`}
                  >
                    الأسبوع {w} {isCustom && <span className="text-orange-500 mr-1">• مخصص</span>}
                  </button>
                );
              })}
            </div>
          </div>

          <form onSubmit={handleSaveCurriculum} className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div className="lg:col-span-5 bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4 h-fit">
              <h3 className="text-base font-black text-stone-900">
                🎬 بيانات الفيديو والمحاضرة ({selectedKey === "default" ? "الافتراضي" : `الأسبوع ${selectedKey}`})
              </h3>

              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">عنوان المحاضرة</label>
                <input
                  value={lectureTitle}
                  onChange={e => setLectureTitle(e.target.value)}
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-bold"
                  required
                />
              </div>

              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">وصف المحاضرة</label>
                <textarea
                  rows="3"
                  value={lectureDesc}
                  onChange={e => setLectureDesc(e.target.value)}

                      >
                        حذف السؤال

                      value={q.text}

                      className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-bold"
                    />

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      {(q.options || []).map((opt, optIdx) => {
                        const isCorrect = Number(q.correctIndex) === optIdx;
                        return (
                          <div
                            key={optIdx}
                            className={`p-2 rounded-xl border flex items-center gap-2 ${
                              isCorrect ? "bg-emerald-50 border-emerald-400" : "bg-white border-stone-200"
                            }`}
                          >
                            <input
                              type="radio"
                              name={`correct_${qIdx}`}
                              checked={isCorrect}
                              onChange={() => handleQuestionChange(qIdx, "correctIndex", optIdx)}
                              title="تحديد كإجابة صحيحة"
                            />
                            <input
                              value={opt}
                              onChange={e => handleOptionChange(qIdx, optIdx, e.target.value)}
                              className="flex-1 bg-transparent text-xs font-semibold focus:outline-none"
                              placeholder={`خيار ${optIdx + 1}`}
                            />
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}

          </form>

    // ============================================================================
    // 13. ADMIN USERS & SYSTEM SETTINGS SECTION (إدارة الحسابات وإعدادات النظام)
    // ============================================================================
    function AdminSettingsAndUsersSection({ db, setDb, cadres, showToast }) {
      const [newName, setNewName] = useState("");
      const [newJobTitle, setNewJobTitle] = useState("");
      const [newUnit, setNewUnit] = useState("وحدة التخطيط الاستراتيجي");
      const [newUsername, setNewUsername] = useState("");
      const [newPassword, setNewPassword] = useState("1234");
      const [newRoleType, setNewRoleType] = useState("cadre");
      const [newWeeksAgo, setNewWeeksAgo] = useState(1);
      const [newMeetDay, setNewMeetDay] = useState(2);
      const [newMeetTime, setNewMeetTime] = useState("19:00");

      const [quoteText, setQuoteText] = useState("");
      const [quoteAuthor, setQuoteAuthor] = useState("منهجية Madyan");

      const handleCreateUser = (e) => {
        e.preventDefault();
        if (!newName.trim() || !newUsername.trim() || !newPassword.trim()) {
          showToast("يرجى إدخال الاسم واسم المستخدم وكلمة المرور.");
          return;
        }
        const cleanUser = newUsername.trim().toLowerCase();
        if (db.users.some(u => u.username.toLowerCase() === cleanUser)) {
          showToast("اسم المستخدم هذا مسجل بالفعل، اختر اسماً آخر.");
          return;
        }

        const weeksNum = Math.max(1, parseInt(newWeeksAgo, 10) || 1);
        const joinedTimestamp = Date.now() - ((weeksNum - 1) * MS_PER_WEEK) - (24 * 3600 * 1000);

        const initialTasks = {};
        if (newRoleType === "cadre") {
          for (let w = 1; w <= weeksNum; w++) {
            initialTasks[w] = {
              lecture: { status: "pending" },
              agenda: { status: "pending" },
              attendance: { status: "pending" },
              minutes: { status: "pending" }
            };
          }
        }

        const created = {
          id: "u_" + Date.now(),
          username: newUsername.trim(),
          password: newPassword.trim(),
          roleType: newRoleType,
          onboarded: false,
          joinedAt: joinedTimestamp,
          name: newName.trim(),
          jobTitle: newJobTitle.trim() || (newRoleType === "executive" ? "عضو المكتب التنفيذي" : "كادر إداري"),
          unit: newUnit.trim() || "الإدارة العامة",
          defaultSchedule: {
            meetDay: parseInt(newMeetDay, 10),
            meetTime: newMeetTime,
            meetDuration: 90
          },
          weekOverrides: {},
          tasksRecord: initialTasks
        };

        setDb(prev => ({
          ...prev,
          users: [...prev.users, created]
        }));

        setNewName("");
        setNewJobTitle("");
        setNewUsername("");
        showToast(`تم إنشاء الحساب (${created.name}) بنجاح ✓`);
      };

      const handleDeleteUser = (userId) => {
        const target = db.users.find(u => u.id === userId);
        if (!target) return;
        if (target.roleType === "admin" && db.users.filter(u => u.roleType === "admin").length <= 1) {
          showToast("لا يمكن حذف حساب المدير الوحيد في النظام.");
          return;
        }
        setDb(prev => ({
          ...prev,
          users: prev.users.filter(u => u.id !== userId)
        }));
        showToast("تم حذف الحساب من المنصة.");
      };

      const handleAddQuote = (e) => {
        e.preventDefault();
        if (!quoteText.trim()) return;
        const nextQuote = {
          id: Date.now(),
          text: quoteText.trim(),
          author: quoteAuthor.trim() || "منهجية Madyan"
        };
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            quotes: [nextQuote, ...(prev.systemConfig?.quotes || [])]
          }
        }));
        setQuoteText("");
        showToast("تمت إضافة الاقتباس التحفيزي بنجاح 🌱");
      };

      const handleDeleteQuote = (id) => {
        setDb(prev => ({
          ...prev,
          systemConfig: {
            ...prev.systemConfig,
            quotes: (prev.systemConfig?.quotes || []).filter(q => q.id !== id)

        }));

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          {/* توليد حساب جديد */}
          <div className="lg:col-span-5 bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4 h-fit">
            <div>
              <span className="text-xs font-bold text-orange-600">إدارة الحسابات والصلاحيات</span>
              <h2 className="text-lg font-black text-stone-900">توليد حساب جديد (كادر / تنفيذي / مدير)</h2>
              <p className="text-xs text-stone-500 mt-0.5">
                الحسابات تُمنح حصرياً من الإدارة، ويمكن للكادر تعديل بياناته عند أول دخول.
              </p>
            </div>

            <form onSubmit={handleCreateUser} className="space-y-3.5">
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">نوع الصلاحية (Role)</label>
                <select
                  value={newRoleType}
                  onChange={e => setNewRoleType(e.target.value)}
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-black"
                >
                  <option value="cadre">👤 كادر إداري (Cadre)</option>
                  <option value="executive">🏛️ عضو المكتب التنفيذي (Executive)</option>
                  <option value="admin">🛡️ مدير النظام والـ HR (Admin)</option>
                </select>
              </div>

              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">الاسم الكامل</label>
                <input
                  value={newName}
                  onChange={e => setNewName(e.target.value)}
                  placeholder="مثال: خالد العتيبي"
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-bold"
                  required
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">المسمى الوظيفي</label>
                  <input
                    value={newJobTitle}
                    onChange={e => setNewJobTitle(e.target.value)}
                    placeholder="منسق مشاريع"
                    className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3 py-2 text-xs font-bold"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-stone-700 mb-1">الوحدة الإدارية</label>
                  <input
                    value={newUnit}
                    onChange={e => setNewUnit(e.target.value)}
                    placeholder="وحدة التخطيط"
                    className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3 py-2 text-xs font-bold"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3 p-3.5 rounded-2xl bg-orange-50/60 border border-orange-200/80">
                <div>
                  <label className="block text-[11px] font-bold text-stone-700 mb-1">اسم المستخدم (Username)</label>
                  <input
                    value={newUsername}
                    onChange={e => setNewUsername(e.target.value)}
                    placeholder="khalid"
                    className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-mono font-bold"
                    dir="ltr"
                    required
                  />
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-stone-700 mb-1">كلمة المرور الابتدائية</label>
                  <input
                    value={newPassword}
                    onChange={e => setNewPassword(e.target.value)}
                    className="w-full rounded-xl border border-stone-200 bg-white px-3 py-2 text-xs font-mono font-bold"
                    dir="ltr"
                    required
                  />
                </div>
              </div>

              {newRoleType === "cadre" && (
                <div className="grid grid-cols-3 gap-2">
                  <div>
                    <label className="block text-[11px] font-bold text-stone-700 mb-1">عدد الأسابيع</label>
                    <input
                      type="number"
                      min="1"
                      max="52"
                      value={newWeeksAgo}
                      onChange={e => setNewWeeksAgo(e.target.value)}
                      className="w-full rounded-xl border border-stone-200 bg-stone-50 px-3 py-2 text-xs font-bold"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-stone-700 mb-1">يوم الاجتماع</label>
                    <select
                      value={newMeetDay}
                      onChange={e => setNewMeetDay(e.target.value)}
                      className="w-full rounded-xl border border-stone-200 bg-stone-50 px-2 py-2 text-xs font-bold"
                    >
                      {DAYS_AR.map((d, i) => <option key={i} value={i}>{d}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block text-[11px] font-bold text-stone-700 mb-1">الوقت</label>
                    <input
                      type="time"
                      value={newMeetTime}
                      onChange={e => setNewMeetTime(e.target.value)}
                      className="w-full rounded-xl border border-stone-200 bg-stone-50 px-2 py-2 text-xs font-bold"
                    />
                  </div>
                </div>
              )}

              <button
                type="submit"
                className="w-full py-3.5 rounded-2xl madyan-gradient text-white text-xs font-black shadow-lg shadow-orange-500/20 hover:opacity-95"
              >
                + توليد الحساب وتفعيله فوراً
              </button>
            </form>
          </div>

          {/* قائمة جميع الحسابات + الاقتباسات */}
          <div className="lg:col-span-7 space-y-6">
            <div className="bg-white rounded-3xl p-6 border border-stone-200/80 shadow-sm space-y-4">
              <h3 className="text-base font-black text-stone-900">👥 الحسابات المسجلة بالنظام ({db.users.length})</h3>
              <div className="space-y-2.5 max-h-96 overflow-y-auto pr-1">
                {db.users.map(u => (
                  <div key={u.id} className="p-3.5 rounded-2xl bg-stone-50 border border-stone-200/80 flex flex-wrap items-center justify-between gap-3">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="text-sm font-black text-stone-900">{u.name}</span>
                        <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${
                          u.roleType === "admin"
                            ? "bg-stone-900 text-white"
                            : u.roleType === "executive"
                            ? "bg-orange-100 text-orange-800"
                            : "bg-emerald-100 text-emerald-800"
                        }`}>

    // ============================================================================
    // 14. CADRE INSPECTOR MODAL (فحص سجل الكادر وإجابات الاختبارات بالتفصيل)
    // ============================================================================
    function CadreInspectorModal({ cadre, db, onClose }) {
      if (!cadre) return null;
      const totalWeeks = calculateWeeksSinceJoin(cadre.joinedAt);
      const metrics = computeCadreMetrics(cadre);

      return (
        <ModalContainer
          isOpen={Boolean(cadre)}
          onClose={onClose}
          badge={`فحص السجل التفصيلي • ${cadre.unit}`}
          title={`${cadre.name} (@${cadre.username})`}
          maxWidth="max-w-3xl"
        >
          <div className="space-y-4">
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-center">
              <div className="p-3 rounded-2xl bg-stone-50 border border-stone-200">
                <div className="text-[11px] text-stone-400 font-bold">السكور التراكمي</div>
                <div className="text-xl font-black text-stone-900 mt-0.5">{metrics.overallScorePct}%</div>
              </div>
              <div className="p-3 rounded-2xl bg-emerald-50 border border-emerald-200">
                <div className="text-[11px] text-emerald-700 font-bold">منجز في الوقت</div>
                <div className="text-xl font-black text-emerald-700 mt-0.5">{metrics.onTimeCount}</div>
              </div>
              <div className="p-3 rounded-2xl bg-amber-50 border border-amber-200">
                <div className="text-[11px] text-amber-800 font-bold">منجز متأخراً</div>
                <div className="text-xl font-black text-amber-600 mt-0.5">{metrics.lateCount}</div>
              </div>
              <div className="p-3 rounded-2xl bg-sky-50 border border-sky-200">
                <div className="text-[11px] text-sky-800 font-bold">متوسط الاختبارات</div>
                <div className="text-xl font-black text-sky-700 mt-0.5">
                  {metrics.avgQuizPct !== null ? `${metrics.avgQuizPct}%` : "—"}
                </div>
              </div>
            </div>

            <div className="space-y-3 max-h-[58vh] overflow-y-auto pr-1">
              {Array.from({ length: totalWeeks }, (_, idx) => {
                const w = totalWeeks - idx;
                const wRec = cadre.tasksRecord?.[w] || {};
                const curr = db.weeklyCurriculums?.[w] || db.weeklyCurriculums?.default || INITIAL_STATE.weeklyCurriculums.default;
                const quizSub = wRec.lecture?.quizSubmission;

                return (
                  <div key={w} className="p-4 rounded-2xl bg-stone-50 border border-stone-200 space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-black text-stone-900">
                        📅 الأسبوع {w} ({getWeekDateRangeLabel(w, totalWeeks)})
                      </span>
                      {quizSub && (
                        <span className="text-xs font-black px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800">
                          درجة الاختبار: {quizSub.score}/{quizSub.total}
                        </span>
                      )}
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
                      {['lecture', 'agenda', 'attendance', 'minutes'].map(k => {
                        const t = wRec[k] || { status: "pending" };
                        const labels = { lecture: "المحاضرة", agenda: "الأجندة", attendance: "الحضور", minutes: "المحضر" };
                        return (
                          <div key={k} className="p-2.5 rounded-xl bg-white border border-stone-200/80 space-y-1">
                            <div className="font-black text-stone-700">{labels[k]}</div>
                            <div className={`text-[11px] font-bold ${
                              t.status === "on_time" ? "text-emerald-600" : t.status === "late" ? "text-amber-600" : "text-rose-500"
                            }`}>
                              {t.status === "on_time" ? "✓ في الموعد" : t.status === "late" ? "⚠️ متأخر" : "• غير منجز"}
                            </div>
                            {t.completedAt && <div className="text-[10px] text-stone-400">{t.completedAt}</div>}
                            {t.note && <div className="text-[10px] text-amber-800 bg-amber-50 p-1 rounded">📌 {t.note}</div>}
                          </div>
                        );
                      })}
                    </div>

                    {quizSub && Array.isArray(curr.questions) && (
                      <div className="pt-2 border-t border-stone-200/70 space-y-1.5">
                        <div className="text-[11px] font-black text-stone-600">إجابات الكادر في اختبار المحاضرة:</div>
                        {curr.questions.map((q, qIdx) => {
                          const picked = quizSub.answers?.[qIdx];
                          const isRight = picked === q.correctIndex;
                          return (
                            <div key={qIdx} className="text-[11px] flex flex-wrap items-center justify-between gap-2 bg-white px-3 py-1.5 rounded-xl border border-stone-200/60">
                              <span className="font-bold text-stone-700">{qIdx + 1}. {q.text}</span>
                              <span className={isRight ? "text-emerald-700 font-black" : "text-rose-600 font-black"}>
                                {isRight ? "✅ " : "❌ "}
                                {q.options?.[picked] ?? "لم يجب"}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </ModalContainer>
      );
    }

    // ============================================================================
    // 15. CLOUD DATABASE SETUP MODAL (إعداد الربط السحابي المباشر بـ Supabase & Netlify)
    // ============================================================================
    function CloudSetupModal({
      isOpen, onClose, cloudConfig, cloudStatus, cloudError, lastSyncAt, onSaveConfig, onDisconnect, showToast
    }) {
      const [url, setUrl] = useState(cloudConfig?.supabaseUrl || "");
      const [anonKey, setAnonKey] = useState(cloudConfig?.supabaseAnonKey || "");

      useEffect(() => {
        if (isOpen) {
          setUrl(cloudConfig?.supabaseUrl || "");
          setAnonKey(cloudConfig?.supabaseAnonKey || "");
        }
      }, [isOpen, cloudConfig]);

      if (!isOpen) return null;

      const copySql = () => {
        navigator.clipboard.writeText(SQL_SCHEMA_SNIPPET);
        showToast("تم نسخ كود إنشاء جدول SQL! الصقه في Supabase SQL Editor واضغط Run ✓");
      };

      return (
        <ModalContainer
          isOpen={isOpen}
          onClose={onClose}
          badge="Full-Stack Cloud Architecture (Supabase + GitHub + Netlify)"
          title="☁️ إعداد ومزامنة قاعدة البيانات الحقيقية (Supabase PostgreSQL)"
          maxWidth="max-w-2xl"
        >
          <div className="space-y-4">
            <div className={`p-4 rounded-2xl border text-xs space-y-1 ${
              cloudStatus === "connected"
                ? "bg-emerald-50 border-emerald-300 text-emerald-900"
                : cloudStatus === "error"
                ? "bg-rose-50 border-rose-300 text-rose-900"
                : "bg-stone-50 border-stone-200 text-stone-700"
            }`}>
              <div className="font-black text-sm">
                {cloudStatus === "connected"
                  ? `✅ متصل فعلياً بقاعدة بيانات Supabase (آخر مزامنة: ${lastSyncAt || "الآن"})`
                  : cloudStatus === "error"
                  ? "⚠️ تعذر إتمام المزامنة مع Supabase"
                  : "ℹ️ يعمل التطبيق حالياً بالذاكرة المحلية إلى حين إدخال مفاتيح مشروعك في Supabase"}
              </div>
              {cloudError && <p className="text-xs font-bold text-rose-700 mt-1">{cloudError}</p>}
            </div>

            <div className="p-4 rounded-2xl bg-stone-50 border border-stone-200 space-y-2.5">
              <div className="flex items-center justify-between">
                <span className="text-xs font-black text-stone-900">1️⃣ الخطوة الأولى: تهيئة الجدول في Supabase SQL Editor</span>
                <button
                  type="button"
                  onClick={copySql}
                  className="px-3 py-1.5 rounded-xl bg-stone-900 text-white text-[11px] font-bold hover:bg-orange-600 transition"
                >
                  📋 نسخ كود الـ SQL
                </button>
              </div>
              <pre className="text-[11px] bg-stone-900 text-emerald-300 p-3 rounded-xl overflow-x-auto font-mono" dir="ltr">
                {SQL_SCHEMA_SNIPPET}
              </pre>
            </div>

            <div className="space-y-3">
              <div className="text-xs font-black text-stone-900">
                2️⃣ الخطوة الثانية: أدخل بيانات مشروعك من (Supabase Project Settings → API)
              </div>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">رابط المشروع (Supabase Project URL)</label>
                <input
                  value={url}
                  onChange={e => setUrl(e.target.value)}
                  placeholder="https://xxxxxxxxxxxx.supabase.co"
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-mono font-bold"
                  dir="ltr"
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-stone-700 mb-1">المفتاح العام (Supabase anon / public Key)</label>
                <input
                  value={anonKey}
                  onChange={e => setAnonKey(e.target.value)}
                  placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  className="w-full rounded-2xl border border-stone-200 bg-stone-50 px-3.5 py-2.5 text-xs font-mono font-bold"
                  dir="ltr"
                />
              </div>
            </div>

            <div className="flex flex-wrap items-center justify-between gap-2 pt-3 border-t border-stone-100">
              {cloudConfig?.supabaseUrl ? (
                <button
                  type="button"
                  onClick={onDisconnect}
                  className="px-4 py-2.5 rounded-2xl bg-rose-50 text-rose-700 text-xs font-bold"
                >
                  فصل الاتصال السحابي
                </button>
              ) : <div />}

              <div className="flex items-center gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2.5 rounded-2xl bg-stone-100 text-stone-700 text-xs font-bold"
                >
                  إغلاق
                </button>
                <button
                  type="button"
                  onClick={() => {
                    if (!url.trim() || !anonKey.trim()) {
                      showToast("يرجى إدخال Project URL و Anon Key أولاً.");
                      return;
                    }
                    onSaveConfig(url, anonKey);
                    onClose();
                  }}
                  className="px-6 py-2.5 rounded-2xl madyan-gradient text-white text-xs font-black shadow-md"
                >
                  ☁️ حفظ الاتصال ومزامنة البيانات الآن
                </button>
              </div>
            </div>
          </div>
        </ModalContainer>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
