    // ============================================================================
    // ----- بطاقة حماية البيانات: نسخة احتياطية + استيراد + استعادة بعبارة تأكيد -----
    const PA2_RESET_PHRASE = "إعادة الضبط";
    function PA2DataCard({ db, setDb, onResetDemo, showToast }) {
      const [phrase, setPhrase] = useState("");
      const [resetOpen, setResetOpen] = useState(false);
      const [pending, setPending] = useState(null); // نسخة مستوردة بانتظار التأكيد
      const fileRef = useRef(null);
      const exportBackup = () => {
        try {
          const d = new Date();
          const name = `maydan-backup-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}.json`;
          const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast("نُزّلت النسخة الاحتياطية");
        } catch (e) { showToast("تعذّر إنشاء النسخة"); }
      };
      const onFile = (e) => {
        const f = e.target.files && e.target.files[0];
        e.target.value = "";
        if (!f) return;
        if (f.size > 5 * 1024 * 1024) { showToast("الملف غير صالح"); return; }
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const raw = safeJsonParse(String(reader.result || ""));
            if (!raw || !Array.isArray(raw.users)) throw new Error("bad");
            setPending({ name: f.name, data: normalizeDb(raw) });
          } catch (err) { showToast("الملف غير صالح"); }
        };
        reader.readAsText(f);
      };
      const ok = phrase.trim() === PA2_RESET_PHRASE;
      return (
        <div className="bg-white rounded-[28px] px-6 pt-5 pb-5">
          <h2 className="text-[17px] font-bold text-stone-900">حماية البيانات</h2>
          <p className="text-[13px] text-stone-500 mt-1">احتفظ بنسخة دورية قبل أي تعديل كبير.</p>
          <div className="flex flex-wrap gap-2 mt-4">
            <button onClick={exportBackup} className="h-10 px-4 rounded-full bg-stone-900 text-white text-[13px] font-semibold inline-flex items-center gap-1.5"><PA2Icon name="download" className="w-4 h-4" />تنزيل نسخة احتياطية</button>
            <button onClick={() => fileRef.current && fileRef.current.click()} className="h-10 px-4 rounded-full bg-white border border-stone-200 text-[13px] text-stone-700 hover:bg-stone-50 inline-flex items-center gap-1.5"><PA2Icon name="upload" className="w-4 h-4" />استيراد نسخة</button>
            <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={onFile} />
          </div>
          {pending && (
            <div className="mt-4 rounded-2xl bg-[#FFF3E2] px-4 py-3">
              <div className="text-[14px] text-stone-800">استبدال كل البيانات الحالية بالنسخة «{pending.name}» ({pending.data.users.length} حساباً)؟</div>
              <div className="flex items-center gap-2 mt-3">
                <button onClick={() => { setDb(pending.data); setPending(null); showToast("استُعيدت النسخة"); }} className="h-9 px-4 rounded-full bg-stone-900 text-white text-[13px] font-semibold">تأكيد الاستيراد</button>
                <button onClick={() => setPending(null)} className="h-9 px-3 text-[13px] text-stone-500">إلغاء</button>
              </div>
            </div>
          )}
          <div className="mt-5 pt-4 border-t border-stone-100">
            {!resetOpen ? (
              <button onClick={() => setResetOpen(true)} className="text-[13px] text-rose-600 hover:text-rose-700">استعادة البيانات التجريبية…</button>
            ) : (
              <div>
                <div className="text-[14px] text-stone-800">يمسح كل الحسابات والسجلات ويعيد النظام لحالته الأولى. للتأكيد اكتب «{PA2_RESET_PHRASE}».</div>
                <div className="flex flex-col sm:flex-row gap-2 mt-3">
                  <input value={phrase} onChange={e => setPhrase(e.target.value)} placeholder={PA2_RESET_PHRASE} className={`${pa2InputCls} sm:max-w-[220px]`} />
                  <button disabled={!ok} onClick={() => { if (ok) { setPhrase(""); setResetOpen(false); onResetDemo(); } }} className={`h-11 px-5 rounded-full text-[13px] font-semibold ${ok ? "bg-rose-600 text-white" : "bg-stone-100 text-stone-400 cursor-not-allowed"}`}>استعادة نهائية</button>
                  <button onClick={() => { setResetOpen(false); setPhrase(""); }} className="h-11 px-3 text-[13px] text-stone-500">تراجع</button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function PlatformAdminPortalV2({
      db,
      setDb,
      currentUser,
      cloudStatus,
      lastSyncAt,
      onOpenCloudSetup,
      onPreviewUser,
      onResetDemo,
      onLogout,
      onSwitchVariant,
      showToast
    }) {
      const qp = (k, d) => {
        try { return new URLSearchParams(window.location.search).get(k) || d; } catch (e) { return d; }
      };
      const initialSelect = qp("select", null);
      const [screen, setScreen] = useState(() => {
        const s = qp("screen", "overview");
        return ["overview", "structure", "leaders", "rules"].includes(s) ? s : "overview";
      });
      const [mapMode, setMapMode] = useState(() => qp("mode", "map"));
      // التحديد في الهيكل: { kind: 'dept'|'unit', id } أو { kind: 'new_dept' | 'new_unit' }
      const [structSel, setStructSel] = useState(() => {
        if (!initialSelect) return null;
        if (initialSelect.startsWith("dept_")) return { kind: "dept", id: initialSelect };
        if (initialSelect.startsWith("unit_")) return { kind: "unit", id: initialSelect };
        if (initialSelect === "new_dept" || initialSelect === "new_unit") return { kind: initialSelect };
        return null;
      });
      const [leaderSel, setLeaderSel] = useState(() => (initialSelect && (initialSelect.startsWith("u_") || initialSelect === "new_leader")) ? initialSelect : null);
      const [leaderFilter, setLeaderFilter] = useState("all");
      const [leaderSearch, setLeaderSearch] = useState("");
      const [showAllGaps, setShowAllGaps] = useState(false);
      const [savedPulse, setSavedPulse] = useState(false);
      const [resetArmed, setResetArmed] = useState(false);

      const departments = db.systemConfig?.departments || DEFAULT_DEPARTMENTS;
      const units = db.systemConfig?.organizationalUnits || DEFAULT_UNITS;
      const rules = { ...DEFAULT_GOVERNANCE_RULES, ...(db.systemConfig?.governanceRules || {}) };
      const leaders = useMemo(() => db.users.filter(u => u.roleType !== "cadre"), [db.users]);
      const cadres = useMemo(() => db.users.filter(u => u.roleType === "cadre"), [db.users]);
      const executives = leaders.filter(u => u.roleType === "executive");

      const isOperational = (u) => u.roleType === "operational_admin" || u.roleType === "admin";
      const findDeptManager = (deptId) =>
        leaders.find(u => isOperational(u) && (u.departmentId || (u.roleType === "admin" ? "dept_hr" : null)) === deptId) || null;
      const findUnitLeader = (unit) => (unit.leaderUserId ? db.users.find(u => u.id === unit.leaderUserId) : null) || null;
      const unitCadreCount = (unit) => cadres.filter(c => c.unit === unit.name).length;
      const deptCadreCount = (dept) => cadres.filter(c => Array.isArray(c.assignedDepartments) ? c.assignedDepartments.includes(dept.id) : dept.isCore).length;

      // ---------- فحوصات الجاهزية (حقيقية بالكامل) ----------
      const gaps = [];
      if (executives.length === 0) gaps.push({ key: "exec", text: "لا يوجد حساب في الإدارة التنفيذية", go: () => { setScreen("leaders"); setLeaderSel("new_leader"); } });
      departments.forEach(d => {
        if (!findDeptManager(d.id)) gaps.push({ key: "m_" + d.id, text: `${d.name} بدون مدير`, go: () => { setScreen("structure"); setStructSel({ kind: "dept", id: d.id }); } });
        if (d.enabled !== false && (!d.allowedTaskTypes || d.allowedTaskTypes.length === 0)) gaps.push({ key: "t_" + d.id, text: `${d.name} بلا أنواع مهام مسموحة`, go: () => { setScreen("structure"); setStructSel({ kind: "dept", id: d.id }); } });
      });
      units.forEach(u => {
        if (!findUnitLeader(u)) gaps.push({ key: "l_" + u.id, text: `${u.name} بدون قائد`, go: () => { setScreen("structure"); setStructSel({ kind: "unit", id: u.id }); } });
      });
      const deptsWithMgr = departments.filter(d => findDeptManager(d.id)).length;
      const unitsWithLeader = units.filter(u => findUnitLeader(u)).length;
      const deptsWithTypes = departments.filter(d => (d.allowedTaskTypes || []).length > 0).length;
      const totalChecks = departments.length * 2 + units.length + 1;
      const passedChecks = deptsWithMgr + deptsWithTypes + unitsWithLeader + (executives.length > 0 ? 1 : 0);
      const readiness = totalChecks ? Math.round((passedChecks / totalChecks) * 100) : 100;

      // ---------- عمليات التعديل ----------
      const patchConfig = (patch) => setDb(prev => ({ ...prev, systemConfig: { ...prev.systemConfig, ...patch(prev.systemConfig || {}) } }));
      const pulseSaved = () => { setSavedPulse(true); clearTimeout(window.__pa2SavedT); window.__pa2SavedT = setTimeout(() => setSavedPulse(false), 1600); };

      const managerOptions = leaders
        .filter(u => u.roleType !== "platform_admin")
        .map(u => {
          const d = isOperational(u) ? departments.find(x => x.id === u.departmentId) : null;
          return { id: u.id, name: pa2Short(u.name), hint: d ? `يدير ${d.shortName || d.name}` : pa2RoleLabel(u), willMove: true };
        });
      const unitLeaderOptions = db.users
        .filter(u => u.roleType !== "platform_admin")
        .map(u => ({ id: u.id, name: pa2Short(u.name), hint: u.roleType === "cadre" ? (u.unit || "كادر") : pa2RoleLabel(u) }));

      const applyManager = (users, deptId, deptName, newMgrId) =>
        users.map(u => {
          if (u.id === newMgrId) return { ...u, roleType: "operational_admin", departmentId: deptId, jobTitle: `مدير ${deptName}` };
          if (isOperational(u) && u.departmentId === deptId && u.id !== newMgrId) return { ...u, departmentId: null };
          return u;
        });

      const saveDept = (deptId, draft) => {
        const isNew = !deptId;
        const id = deptId || ("dept_" + Date.now());
        const name = draft.name.trim();
        setDb(prev => {
          const list = prev.systemConfig?.departments || DEFAULT_DEPARTMENTS;
          const fields = {
            name,
            shortName: name.replace(/^(إدارة|الإدارة)\s+/, "") || name,
            description: draft.description.trim(),
            maxTotalTasks: draft.maxTotalTasks,
            maxPerTypePerCadre: draft.maxPerTypePerCadre,
            allowedTaskTypes: draft.allowedTaskTypes,
            enabled: draft.enabled
          };
          const nextList = isNew
            ? [...list, { id, icon: "🏛️", isCore: false, ...fields }]
            : list.map(d => d.id === id ? { ...d, ...fields } : d);
          const currentMgr = prev.users.find(u => isOperational(u) && u.departmentId === id);
          let users = prev.users;
          if ((draft.managerId || "") !== (currentMgr?.id || "")) {
            users = draft.managerId
              ? applyManager(prev.users, id, name, draft.managerId)
              : prev.users.map(u => (currentMgr && u.id === currentMgr.id) ? { ...u, departmentId: null } : u);
          }
          return { ...prev, users, systemConfig: { ...prev.systemConfig, departments: nextList } };
        });
        if (isNew) setStructSel({ kind: "dept", id });
        showToast(isNew ? "تم تأسيس الإدارة ✓" : "تم حفظ التغييرات ✓");
      };

      const deleteDept = (deptId) => {
        setDb(prev => ({
          ...prev,
          users: prev.users.map(u => (isOperational(u) && u.departmentId === deptId) ? { ...u, departmentId: null } : u),
          systemConfig: { ...prev.systemConfig, departments: (prev.systemConfig?.departments || DEFAULT_DEPARTMENTS).filter(d => d.id !== deptId) }
        }));
        setStructSel(null);
        showToast("تم حذف الإدارة");
      };

      const saveUnit = (unitId, draft) => {
        const isNew = !unitId;
        const id = unitId || ("unit_" + Date.now());
        const name = draft.name.trim();
        if (units.some(u => u.name === name && u.id !== unitId)) { showToast("يوجد وحدة بنفس الاسم"); return; }
        const code = (draft.inviteCode || "").trim().toUpperCase() || ("MAYDAN-U" + (units.length + 1));
        setDb(prev => {
          const list = prev.systemConfig?.organizationalUnits || DEFAULT_UNITS;
          const old = list.find(u => u.id === id);
          const nextList = isNew
            ? [...list, { id, name, inviteCode: code, leaderUserId: draft.leaderUserId || null, defaultDepartments: ["dept_hr", "dept_tarbawi"] }]
            : list.map(u => u.id === id ? { ...u, name, inviteCode: code, leaderUserId: draft.leaderUserId || null } : u);
          // إعادة تسمية الوحدة تنعكس على كوادرها
          const users = (old && old.name !== name) ? prev.users.map(u => u.unit === old.name ? { ...u, unit: name } : u) : prev.users;
          return { ...prev, users, systemConfig: { ...prev.systemConfig, organizationalUnits: nextList } };
        });
        if (isNew) setStructSel({ kind: "unit", id });
        showToast(isNew ? "تم تأسيس الوحدة ✓" : "تم حفظ التغييرات ✓");
      };

      const deleteUnit = (unitId) => {
        if (units.length <= 1) { showToast("يجب الإبقاء على وحدة واحدة على الأقل"); return; }
        patchConfig(cfg => ({ organizationalUnits: (cfg.organizationalUnits || DEFAULT_UNITS).filter(u => u.id !== unitId) }));
        setStructSel(null);
        showToast("تم حذف الوحدة");
      };

      const isUsernameTaken = (name, ignoreId) => {
        const clean = name.trim().toLowerCase();
        return db.users.some(u => u.id !== ignoreId && (u.username || "").toLowerCase() === clean);
      };

      const saveLeader = (userId, draft) => {
        const isNew = !userId;
        const id = userId || ("u_" + Date.now());
        setDb(prev => {
          let users = prev.users;
          const role = draft.roleType;
          const deptId = role === "operational_admin" ? draft.departmentId : null;
          // مدير واحد لكل إدارة: يُفك ارتباط المدير السابق
          if (deptId) users = users.map(u => (u.id !== id && isOperational(u) && u.departmentId === deptId) ? { ...u, departmentId: null } : u);
          const deptObj = (prev.systemConfig?.departments || DEFAULT_DEPARTMENTS).find(d => d.id === deptId);
          const base = {
            name: draft.name.trim(),
            jobTitle: draft.jobTitle.trim() || (deptObj ? `مدير ${deptObj.name}` : pa2RoleLabel({ roleType: role })),
            roleType: role,
            departmentId: deptId,
            username: draft.username.trim(),
            unit: role === "executive" ? "القيادة التنفيذية" : role === "platform_admin" ? "إدارة المنصة التقنية" : (deptObj?.name || "")
          };
          if (isNew) return { ...prev, users: [...users, { id, ...base, password: draft.password || pa2TempPassword(), mustChangePassword: true }] };
          return { ...prev, users: users.map(u => u.id === id ? { ...u, ...base } : u) };
        });
        if (isNew) setLeaderSel(id);
        showToast(isNew ? "تم إنشاء الحساب ✓" : "تم حفظ التغييرات ✓");
      };

      const deleteLeader = (userId) => {
        if (userId === currentUser.id) return;
        setDb(prev => ({
          ...prev,
          users: prev.users.filter(u => u.id !== userId),
          systemConfig: {
            ...prev.systemConfig,
            organizationalUnits: (prev.systemConfig?.organizationalUnits || DEFAULT_UNITS).map(un => un.leaderUserId === userId ? { ...un, leaderUserId: null } : un)
          }
        }));
        setLeaderSel(null);
        showToast("تم حذف الحساب");
      };

      const resetPassword = (userId) => {
        const temp = pa2TempPassword();
        setDb(prev => ({ ...prev, users: prev.users.map(u => u.id === userId ? { ...u, password: temp, mustChangePassword: true } : u) }));
        return temp;
      };

      const setRule = (key, value) => {
        patchConfig(cfg => ({ governanceRules: { ...DEFAULT_GOVERNANCE_RULES, ...(cfg.governanceRules || {}), [key]: value } }));
        pulseSaved();
      };

      const go = (s) => { setScreen(s); window.scrollTo({ top: 0 }); };

      // ---------- الهيكل العام ----------
      const NAV = [
        { id: "overview", label: "نظرة عامة", icon: "home", badge: gaps.length || null },
        { id: "structure", label: "الهيكل التنظيمي", icon: "tree" },
        { id: "leaders", label: "الحسابات والصلاحيات", icon: "users" },
        { id: "rules", label: "ضوابط النظام", icon: "sliders" }
      ];
      const cloudOk = cloudStatus === "connected";
      const firstName = pa2Short(currentUser.name);

      const Header = ({ eyebrow, title, desc, actions }) => (
        <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-5 mb-8">
          <div className="min-w-0">
            <div className="text-[13px] font-medium text-orange-700">{eyebrow}</div>
            <h1 className="text-[30px] sm:text-[34px] font-bold text-stone-900 leading-tight mt-1.5">{title}</h1>
            {desc && <p className="text-[15px] text-stone-500 mt-2 leading-relaxed max-w-xl">{desc}</p>}
          </div>
          {actions && <div className="flex items-center gap-2 shrink-0">{actions}</div>}
        </div>
      );

      const PrimaryBtn = ({ onClick, children }) => (
        <button onClick={onClick} className="h-11 px-5 rounded-full bg-stone-900 text-white text-[14px] font-semibold hover:bg-stone-800 inline-flex items-center gap-2 transition">
          {children}
        </button>
      );

      // ---------- شاشة: نظرة عامة ----------
      const renderOverview = () => {
        const bars = [
          { label: "إدارات لها مدير", done: deptsWithMgr, total: departments.length },
          { label: "وحدات لها قائد", done: unitsWithLeader, total: units.length },
          { label: "إدارات حُددت مهامها", done: deptsWithTypes, total: departments.length }
        ];
        const visibleGaps = showAllGaps ? gaps : gaps.slice(0, 1);
        return (
          <>
            <Header
              eyebrow="إدارة المنصة"
              title={`أهلاً، ${firstName}`}
              desc="هذا هيكل ميدان كما هو الآن، وما يحتاج انتباهك قبل أن يبدأ الكوادر."
              actions={<PrimaryBtn onClick={() => { go("structure"); setStructSel({ kind: "new_dept" }); }}><PA2Icon name="plus" className="w-4 h-4" /> إدارة جديدة</PrimaryBtn>}
            />

            {/* مساعد الإعداد */}
            {gaps.length > 0 ? (
              <div className="rounded-[24px] bg-[#FFF3E2] px-6 py-5 mb-6">
                <div className="flex flex-col sm:flex-row sm:items-center gap-4">
                  <span className="w-11 h-11 rounded-full bg-white text-orange-600 inline-flex items-center justify-center shrink-0">
                    <PA2Icon name="spark" className="w-5 h-5" />
                  </span>
                  <div className="flex-1 min-w-0">
                    <div className="text-[13px] font-medium text-orange-700">مساعد الإعداد</div>
                    <div className="text-[17px] font-semibold text-stone-900 mt-0.5">{gaps.length} {gaps.length === 1 ? "نقطة تحتاج" : "نقاط تحتاج"} انتباهك</div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={gaps[0].go} className="h-10 px-5 rounded-full bg-stone-900 text-white text-[14px] font-semibold hover:bg-stone-800">معالجة الآن</button>
                    {gaps.length > 1 && (
                      <button onClick={() => setShowAllGaps(v => !v)} className="h-10 px-4 rounded-full text-[14px] text-stone-700 hover:bg-white/70">
                        {showAllGaps ? "إخفاء" : "عرض الكل"}
                      </button>
                    )}
                  </div>
                </div>
                <div className="mt-4 sm:mr-[60px] divide-y divide-orange-200/60">
                  {visibleGaps.map(g => (
                    <button key={g.key} onClick={g.go} className="w-full flex items-center justify-between py-2.5 text-right group">
                      <span className="flex items-center gap-2.5 text-[14px] text-stone-700">
                        <span className="w-1.5 h-1.5 rounded-full bg-orange-500" />{g.text}
                      </span>
                      <span className="text-[13px] text-orange-700 opacity-70 group-hover:opacity-100 inline-flex items-center gap-1">معالجة <PA2Icon name="chevron" className="w-3.5 h-3.5" /></span>
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              <div className="rounded-[24px] bg-[#E3F1E8] px-6 py-5 mb-6 flex items-center gap-4">
                <span className="w-11 h-11 rounded-full bg-white text-emerald-600 inline-flex items-center justify-center"><PA2Icon name="check" className="w-5 h-5" /></span>
                <div>
                  <div className="text-[13px] font-medium text-emerald-700">مساعد الإعداد</div>
                  <div className="text-[17px] font-semibold text-stone-900 mt-0.5">الهيكل مكتمل وجاهز للتشغيل</div>
                </div>
              </div>
            )}

            {/* بطاقة الجاهزية */}
            <div className="bg-white rounded-[28px] p-3 mb-10 flex flex-col md:flex-row gap-3">
              <div className="md:w-[300px] rounded-[22px] bg-[#1C1917] text-white p-6 flex flex-col justify-between min-h-[200px]">
                <div className="text-[14px] text-stone-400">جاهزية الهيكل</div>
                <div>
                  <div className="text-[56px] font-bold leading-none tabular-nums">{readiness}<span className="text-[28px] text-stone-500">%</span></div>
                  <div className="text-[13px] text-stone-400 mt-3">{passedChecks} من {totalChecks} فحوصات مكتملة</div>
                </div>
              </div>
              <div className="flex-1 px-4 py-4 md:px-6 flex flex-col justify-between gap-6">
                <div className="space-y-4">
                  {bars.map(b => {
                    const pct = b.total ? Math.round((b.done / b.total) * 100) : 100;
                    return (
                      <div key={b.label}>
                        <div className="flex items-center justify-between mb-2">
                          <span className="text-[14px] text-stone-600">{b.label}</span>
                          <span className="text-[14px] font-semibold text-stone-900 tabular-nums">{b.done} من {b.total}</span>
                        </div>
                        <div className="h-2 rounded-full bg-[#F1EEE9] overflow-hidden">
                          <div className={`h-full rounded-full ${pct === 100 ? "bg-emerald-500" : "bg-orange-500"}`} style={{ width: `${pct}%` }} />
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div className="grid grid-cols-3 divide-x divide-x-reverse divide-stone-200 border-t border-stone-100 pt-4">
                  {[
                    { n: departments.length, l: "إدارات" },
                    { n: units.length, l: "وحدات" },
                    { n: cadres.length, l: "كوادر" }
                  ].map(s => (
                    <div key={s.l} className="px-3 first:pr-0 text-right">
                      <div className="text-[24px] font-bold text-stone-900 tabular-nums">{s.n}</div>
                      <div className="text-[13px] text-stone-500">{s.l}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* مستويات المنصة */}
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-xl font-bold text-stone-900">مستويات المنصة</h2>
              <button onClick={() => go("structure")} className="text-[14px] text-stone-500 hover:text-stone-900">عرض الهيكل</button>
            </div>
            <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">
              <div className={`${PA2_PASTELS[2].bg} rounded-[24px] p-6 flex flex-col min-h-[180px]`}>
                <div className={`text-[13px] font-medium ${PA2_PASTELS[2].ink}`}>المستوى الأعلى</div>
                <div className="text-[19px] font-bold text-stone-900 mt-1">الإدارة التنفيذية</div>
                <div className="text-[14px] text-stone-600 mt-1.5">{executives.length ? pa2Short(executives[0].name) + (executives.length > 1 ? ` و${executives.length - 1} آخرون` : "") : "لا يوجد حساب بعد"}</div>
                <div className="mt-auto pt-5 flex items-center justify-between">
                  <span className="text-[13px] text-stone-500">المكتب التنفيذي</span>
                  {executives[0] && (
                    <button onClick={() => onPreviewUser(executives[0].id)} className="h-8 px-3.5 rounded-full bg-white text-[13px] text-stone-800 hover:bg-white/80">معاينة الواجهة</button>
                  )}
                </div>
              </div>
              {departments.map((d, i) => {
                const tone = pa2DeptTone(d, i);
                const mgr = findDeptManager(d.id);
                return (
                  <div key={d.id} className={`${tone.bg} rounded-[24px] p-6 flex flex-col min-h-[180px] ${d.enabled === false ? "opacity-60" : ""}`}>
                    <div className={`text-[13px] font-medium ${tone.ink}`}>{d.enabled === false ? "إدارة موقوفة" : "إدارة تشغيلية"}</div>
                    <button onClick={() => { go("structure"); setStructSel({ kind: "dept", id: d.id }); }} className="text-[19px] font-bold text-stone-900 mt-1 text-right hover:underline underline-offset-4 decoration-stone-300">{d.name}</button>
                    <div className={`text-[14px] mt-1.5 ${mgr ? "text-stone-600" : "text-orange-800"}`}>{mgr ? pa2Short(mgr.name) : "بدون مدير"}</div>
                    <div className="mt-auto pt-5 flex items-center justify-between">
                      <span className="text-[13px] text-stone-500">{(d.allowedTaskTypes || []).length} أنواع مهام · {deptCadreCount(d)} كادر</span>
                      {mgr && <button onClick={() => onPreviewUser(mgr.id)} className="h-8 px-3.5 rounded-full bg-white text-[13px] text-stone-800 hover:bg-white/80">معاينة الواجهة</button>}
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        );
      };

      // ---------- شاشة: الهيكل التنظيمي ----------
      const renderStructurePanel = () => {
        if (!structSel) return <PA2EmptyPanel title="اختر عنصراً من الهيكل" text="تظهر تفاصيل الإدارة أو الوحدة هنا لتعديلها، دون مغادرة الصفحة." />;
        if (structSel.kind === "new_dept") {
          return <PA2DeptPanel key="new_dept" isNew managerOptions={managerOptions} onSave={d => saveDept(null, d)} onClose={() => setStructSel(null)} onPreview={onPreviewUser} />;
        }
        if (structSel.kind === "new_unit") {
          return <PA2UnitPanel key="new_unit" isNew leaderOptions={unitLeaderOptions} onSave={d => saveUnit(null, d)} onClose={() => setStructSel(null)} showToast={showToast} />;
        }
        if (structSel.kind === "dept") {
          const d = departments.find(x => x.id === structSel.id);
          if (!d) return null;
          const mgr = findDeptManager(d.id);
          return (
            <PA2DeptPanel
              key={d.id + (mgr?.id || "")}
              dept={d}
              managerId={mgr?.id || ""}
              managerOptions={managerOptions}
              cadreCount={deptCadreCount(d)}
              onSave={draft => saveDept(d.id, draft)}
              onDelete={() => deleteDept(d.id)}
              onPreview={onPreviewUser}
              onClose={() => setStructSel(null)}
            />
          );
        }
        const u = units.find(x => x.id === structSel.id);
        if (!u) return null;
        return (
          <PA2UnitPanel
            key={u.id}
            unit={u}
            leaderOptions={unitLeaderOptions}
            cadreCount={unitCadreCount(u)}
            canDelete={units.length > 1}
            onSave={draft => saveUnit(u.id, draft)}
            onDelete={() => deleteUnit(u.id)}
            onClose={() => setStructSel(null)}
            showToast={showToast}
          />
        );
      };

      const isSel = (kind, id) => structSel && structSel.kind === kind && structSel.id === id;

      const TreeNode = ({ selected, onClick, tone, title, sub, subWarn, meta, dashed }) => (
        <div className="relative">
          <span className="absolute top-1/2 -right-7 w-7 h-[2px] bg-stone-200" />
          <button
            onClick={onClick}
            className={`w-full text-right rounded-[20px] px-4 py-3.5 flex items-center gap-3.5 transition ${
              dashed ? "border-2 border-dashed border-stone-300 text-stone-500 hover:border-stone-400 hover:text-stone-800 bg-transparent"
                : selected ? "bg-white ring-2 ring-stone-900 shadow-sm" : "bg-white hover:shadow-[0_6px_20px_-10px_rgba(28,25,23,0.25)]"
            }`}
          >
            {dashed ? (
              <span className="w-10 h-10 rounded-full bg-white inline-flex items-center justify-center shrink-0"><PA2Icon name="plus" className="w-4 h-4" /></span>
            ) : (
              <span className={`w-10 h-10 rounded-full ${tone.bg} inline-flex items-center justify-center shrink-0`}><span className={`w-2.5 h-2.5 rounded-full ${tone.dot}`} /></span>
            )}
            <span className="flex-1 min-w-0">
              <span className={`block text-[15px] ${dashed ? "" : "font-semibold text-stone-900"} truncate`}>{title}</span>
              {sub && <span className={`block text-[13px] mt-0.5 truncate ${subWarn ? "text-orange-700" : "text-stone-500"}`}>{sub}</span>}
            </span>
            {meta && <span className="text-[12px] text-stone-400 shrink-0">{meta}</span>}
          </button>
        </div>
      );

      const GroupLabel = ({ children, count }) => (
        <div className="relative flex items-center gap-2 py-1">
          <span className="absolute top-1/2 -right-[35px] w-3 h-3 rounded-full bg-[#F4F2EE] border-2 border-stone-300 -translate-y-1/2" />
          <span className="text-[13px] font-medium text-stone-500">{children}</span>
          <span className="text-[12px] text-stone-400">· {count}</span>
        </div>
      );

      const renderMap = () => (
        <div className="bg-[#EFECE6] rounded-[28px] p-5 sm:p-7">
          <div className="rounded-[22px] bg-[#1C1917] text-white px-5 py-4 flex items-center gap-4 max-w-md">
            <span className="w-11 h-11 rounded-full bg-white/10 inline-flex items-center justify-center"><PA2Icon name="tree" className="w-5 h-5" /></span>
            <div className="min-w-0">
              <div className="text-[16px] font-semibold">ميدان</div>
              <div className="text-[13px] text-stone-400 truncate">الإدارة التنفيذية · {executives.length} حساب</div>
            </div>
          </div>
          <div className="mr-[41px] pr-7 border-r-2 border-stone-200 pt-5 space-y-3">
            <GroupLabel count={departments.length}>الإدارات التشغيلية</GroupLabel>
            {departments.map((d, i) => {
              const mgr = findDeptManager(d.id);
              return (
                <TreeNode
                  key={d.id}
                  selected={isSel("dept", d.id)}
                  onClick={() => setStructSel({ kind: "dept", id: d.id })}
                  tone={pa2DeptTone(d, i)}
                  title={d.name}
                  sub={mgr ? pa2Short(mgr.name) : "بدون مدير"}
                  subWarn={!mgr}
                  meta={d.enabled === false ? "موقوفة" : `${(d.allowedTaskTypes || []).length} أنواع`}
                />
              );
            })}
            <TreeNode dashed title="إضافة إدارة" onClick={() => setStructSel({ kind: "new_dept" })} />
            <div className="pt-4">

                <span className="text-[13px] text-stone-400 shrink-0 hidden sm:block">{r.meta}</span>

      const renderList = () => (
        <div className="space-y-5">
          <ListSection
            title="الإدارات التشغيلية"
            addLabel="إدارة"
            onAdd={() => setStructSel({ kind: "new_dept" })}
            rows={departments.map((d, i) => {
              const mgr = findDeptManager(d.id);
              return {
                key: d.id, tone: pa2DeptTone(d, i), title: d.name, sub: mgr ? pa2Short(mgr.name) : "بدون مدير", warn: !mgr,
                meta: d.enabled === false ? "موقوفة" : `${(d.allowedTaskTypes || []).length} أنواع مهام`,
                selected: isSel("dept", d.id), onClick: () => setStructSel({ kind: "dept", id: d.id })
              };
            })}
          />
          <ListSection
            title="الوحدات التنظيمية"
            addLabel="وحدة"
            onAdd={() => setStructSel({ kind: "new_unit" })}
            rows={units.map(u => {
              const ld = findUnitLeader(u);
              return {
                key: u.id, tone: PA2_PASTELS[4], title: u.name, sub: ld ? pa2Short(ld.name) : "بدون قائد", warn: !ld,
                meta: `${unitCadreCount(u)} كادر`, selected: isSel("unit", u.id), onClick: () => setStructSel({ kind: "unit", id: u.id })
              };

          />
        </div>
      );

      const renderStructure = () => (
        <>
          <Header
            eyebrow="الهيكل التنظيمي"
            title="الإدارات والوحدات"

            actions={<>
              <PA2Segmented value={mapMode} onChange={setMapMode} options={[{ value: "map", label: "خريطة" }, { value: "list", label: "قائمة" }]} />
              <PrimaryBtn onClick={() => setStructSel({ kind: "new_dept" })}><PA2Icon name="plus" className="w-4 h-4" /> إدارة جديدة</PrimaryBtn>
            </>}
          />
          <div className="grid lg:grid-cols-[minmax(0,1fr)_400px] gap-6 items-start">
            <div>{mapMode === "map" ? renderMap() : renderList()}</div>
            <div className="lg:sticky lg:top-6">{renderStructurePanel()}</div>
          </div>
        </>
      );

      // ---------- شاشة: القادة والصلاحيات ----------
      const renderLeaders = () => {
        const q = leaderSearch.trim().toLowerCase();
        const isCadreTab = leaderFilter === "cadre";
        const pool = isCadreTab ? db.users.filter(u => u.roleType === "cadre") : leaders;
        const rows = pool
          .filter(u => isCadreTab || leaderFilter === "all" || (leaderFilter === "executive" ? u.roleType === "executive" : isOperational(u)))
          .filter(u => !q || (u.name || "").toLowerCase().includes(q) || (u.username || "").toLowerCase().includes(q))
          .sort((a, b) => {
            const rank = r => r === "platform_admin" ? 0 : r === "executive" ? 1 : 2;
            return rank(a.roleType) - rank(b.roleType);
          });
        const selUser = leaderSel && leaderSel !== "new_leader" && leaderSel !== "new_cadre" ? db.users.find(u => u.id === leaderSel) : null;
        const deptManagers = {};
        departments.forEach(d => { const m = findDeptManager(d.id); if (m) deptManagers[d.id] = { id: m.id, name: pa2Short(m.name) }; });

              actions={isCadreTab

                <div className="hidden md:grid grid-cols-[minmax(0,2fr)_minmax(0,1fr)_minmax(0,1.1fr)_96px] gap-4 px-4 py-2.5 text-[12px] text-stone-400 border-b border-stone-100">

                          <span className="min-w-0">
                            <span className="flex items-center gap-2">

                            <span className="block text-[13px] text-stone-500 truncate mt-0.5">{u.jobTitle}</span>
                          </span>
                        </span>

                      </button>

              </div>
              <div className="lg:sticky lg:top-6">

                    onClose={() => setLeaderSel(null)}
                    onSave={(draft) => { const id = mxSaveCadre(setDb, leaderSel === "new_cadre" ? null : selUser, leaderSel === "new_cadre", draft); setLeaderSel(id); showToast(leaderSel === "new_cadre" ? "أُنشئ الحساب" : "تم الحفظ"); }}
                    onDelete={() => { setDb(prev => ({ ...prev, users: prev.users.filter(u => u.id !== selUser.id) })); setLeaderSel(null); showToast("حُذف الحساب"); }}
                    onResetPassword={() => resetPassword(selUser.id)} />
                ) : leaderSel === "new_leader" ? (
                  <PA2LeaderPanel key="new_leader" isNew departments={departments} deptManagers={deptManagers} isUsernameTaken={isUsernameTaken} onSave={d => saveLeader(null, d)} onClose={() => setLeaderSel(null)} showToast={showToast} />
                ) : selUser ? (
                  <PA2LeaderPanel
                    key={selUser.id}
                    user={selUser}
                    isSelf={selUser.id === currentUser.id}
                    departments={departments}
                    deptManagers={deptManagers}
                    isUsernameTaken={isUsernameTaken}
                    onSave={d => saveLeader(selUser.id, d)}
                    onDelete={() => deleteLeader(selUser.id)}
                    onPreview={onPreviewUser}
                    onResetPassword={resetPassword}
                    onClose={() => setLeaderSel(null)}
                    showToast={showToast}
                  />
                ) : (
                  <PA2EmptyPanel title="اختر حساباً" text="تظهر بيانات الحساب وصلاحياته هنا، مع إعادة تعيين كلمة المرور بأمان." />

      // ---------- شاشة: ضوابط النظام ----------
      const RuleRow = ({ title, desc, children }) => (

          <div className="min-w-0">
            <div className="text-[15px] font-medium text-stone-900">{title}</div>

          <div className="shrink-0">{children}</div>
        </div>
      );
      const RuleCard = ({ title, desc, children }) => (
        <div className="bg-white rounded-[28px] px-6 pt-5 pb-2">
          <h2 className="text-[17px] font-bold text-stone-900">{title}</h2>

      const renderRules = () => (
        <>

            eyebrow="ضوابط النظام"

            actions={
              <span className={`h-9 px-4 rounded-full text-[13px] inline-flex items-center gap-1.5 transition ${savedPulse ? "bg-emerald-50 text-emerald-700" : "bg-white text-stone-400"}`}>
                <PA2Icon name="check" className="w-4 h-4" /> {savedPulse ? "تم الحفظ" : "يُحفظ تلقائياً"}
              </span>
            }
          />
          <div className="grid xl:grid-cols-2 gap-5 items-start">
            <div className="space-y-5">
              <RuleCard title="التقييم والنقاط" desc="كيف تُحسب إنجازات الكوادر.">
                <RuleRow title="نقاط التسليم المتأخر" desc="نسبة النقاط التي يحصل عليها الكادر عند التأخر.">
                  <PA2Stepper value={rules.latePointsPct} min={0} max={100} suffix="%" onChange={v => setRule("latePointsPct", v)} />
                </RuleRow>
                <RuleRow title="حد النجاح في الاختبار" desc="أقل نسبة لاعتبار اختبار المحاضرة ناجحاً.">
                  <PA2Stepper value={rules.quizPassThresholdPct} min={0} max={100} suffix="%" onChange={v => setRule("quizPassThresholdPct", v)} />
                </RuleRow>
                <RuleRow title="أيام الورد اليومي المطلوبة" desc="عدد الأيام في الأسبوع لاكتمال العادة اليومية.">
                  <PA2Stepper value={rules.dailyTaskTargetDays} min={1} max={7} suffix="أيام" onChange={v => setRule("dailyTaskTargetDays", v)} />
                </RuleRow>
              </RuleCard>
              <RuleCard title="الأمان">
                <RuleRow title="تغيير كلمة المرور عند أول دخول" desc="يُطلب من كل حساب جديد تعيين كلمة مرور خاصة.">
                  <PA2Switch checked={!!rules.forcePasswordChangeOnFirstLogin} onChange={v => setRule("forcePasswordChangeOnFirstLogin", v)} />
                </RuleRow>
              </RuleCard>
            </div>
            <div className="space-y-5">
              <RuleCard title="صلاحيات الكادر" desc="ما يستطيع الكادر تعديله بنفسه.">
                <RuleRow title="تعديل الاسم">
                  <PA2Switch checked={!!rules.allowCadreNameEdit} onChange={v => setRule("allowCadreNameEdit", v)} />
                </RuleRow>
                <RuleRow title="تغيير كلمة المرور">
                  <PA2Switch checked={!!rules.allowCadrePasswordChange} onChange={v => setRule("allowCadrePasswordChange", v)} />
                </RuleRow>
                <RuleRow title="تغيير موعد اللقاء الأسبوعي" desc={rules.allowCadreScheduleChange ? `حتى ${rules.maxScheduleChangesPerMonth} مرات في الشهر` : "الموعد يحدده المدير فقط"}>
                  <div className="flex items-center gap-3">
                    {rules.allowCadreScheduleChange && <PA2Stepper value={rules.maxScheduleChangesPerMonth} min={1} max={10} onChange={v => setRule("maxScheduleChangesPerMonth", v)} />}
                    <PA2Switch checked={!!rules.allowCadreScheduleChange} onChange={v => setRule("allowCadreScheduleChange", v)} />
                  </div>
                </RuleRow>
                <RuleRow title="التسليم المتأخر" desc={rules.allowLateSubmissions ? `للأسابيع الماضية حتى ${rules.maxPastWeeksEditable} أسابيع` : "لا يُقبل بعد انتهاء الأسبوع"}>
                  <div className="flex items-center gap-3">
                    {rules.allowLateSubmissions && <PA2Stepper value={rules.maxPastWeeksEditable} min={1} max={12} onChange={v => setRule("maxPastWeeksEditable", v)} />}
                    <PA2Switch checked={!!rules.allowLateSubmissions} onChange={v => setRule("allowLateSubmissions", v)} />
                  </div>
                </RuleRow>
              </RuleCard>
              <RuleCard title="البيانات">
                <RuleRow title="المزامنة السحابية" desc={cloudOk ? `متصلة${lastSyncAt ? ` · آخر مزامنة ${lastSyncAt}` : ""}` : "البيانات محفوظة على هذا الجهاز فقط"}>
                  <button onClick={onOpenCloudSetup} className="h-9 px-4 rounded-full bg-white border border-stone-200 text-[13px] text-stone-700 hover:bg-stone-50">{cloudOk ? "الإعدادات" : "ربط سحابي"}</button>
                </RuleRow>
              </RuleCard>
              <PA2DataCard db={db} setDb={setDb} onResetDemo={onResetDemo} showToast={showToast} />
            </div>
          </div>
        </>
      );

      // ---------- الإطار ----------
      return (
        <div dir="rtl" className="min-h-screen bg-[#F4F2EE] text-stone-900 lg:pr-[264px] -mb-20 pb-20">
          {/* العمود الجانبي */}
          <aside className="hidden lg:flex fixed top-0 right-0 h-screen w-[264px] bg-[#1C1917] text-stone-300 flex-col px-5 py-7 z-30">
            <div className="px-2">
              <div className="text-[24px] font-bold text-white leading-none">ميدان</div>
              <div className="text-[13px] text-stone-500 mt-2 flex items-center gap-2">
                إدارة المنصة
                <span className="text-[11px] px-2 py-0.5 rounded-full bg-orange-500/15 text-orange-300">نسخة كلاود</span>
              </div>
            </div>
            <nav className="mt-10 space-y-1">
              {NAV.map(n => (
                <button
                  key={n.id}
                  onClick={() => go(n.id)}
                  className={`w-full h-11 px-4 rounded-full flex items-center gap-3 text-[14px] transition ${
                    screen === n.id ? "bg-white/10 text-white font-semibold" : "text-stone-400 hover:text-white hover:bg-white/5"
                  }`}
                >
                  <PA2Icon name={n.icon} />
                  <span className="flex-1 text-right">{n.label}</span>
                  {n.badge ? <span className="min-w-[22px] h-[22px] px-1.5 rounded-full bg-orange-500 text-white text-[12px] font-semibold inline-flex items-center justify-center">{n.badge}</span> : null}
                </button>
              ))}
            </nav>
            <div className="mt-auto space-y-3">
              <button onClick={onOpenCloudSetup} className="w-full flex items-center gap-2.5 px-4 h-10 rounded-full bg-white/5 text-[13px] text-stone-400 hover:text-white">
                <span className={`w-2 h-2 rounded-full ${cloudOk ? "bg-emerald-400" : "bg-amber-400"}`} />
                {cloudOk ? "متصل بالسحابة" : "حفظ محلي فقط"}
              </button>
              {onSwitchVariant && (
                <button onClick={onSwitchVariant} className="w-full flex items-center gap-2.5 px-4 h-10 rounded-full text-[13px] text-stone-500 hover:text-white">

                </button>
              )}
              <div className="flex items-center gap-3 px-2 pt-3 border-t border-white/10">
                <PA2Avatar user={{ ...currentUser, roleType: "executive" }} size="w-9 h-9" />
                <div className="flex-1 min-w-0">
                  <div className="text-[14px] text-white truncate">{firstName}</div>
                  <div className="text-[12px] text-stone-500">مدير المنصة</div>
                </div>
                <button onClick={onLogout} className="w-9 h-9 rounded-full text-stone-400 hover:text-white hover:bg-white/10 inline-flex items-center justify-center" title="تسجيل الخروج">
                  <PA2Icon name="logout" />
                </button>
              </div>
            </div>
          </aside>

          {/* شريط الجوال */}
          <div className="lg:hidden sticky top-0 z-30 bg-[#1C1917] text-white px-4 pt-4 pb-3">
            <div className="flex items-center justify-between">
              <div className="text-[18px] font-bold">ميدان <span className="text-[12px] font-normal text-stone-400">· إدارة المنصة</span></div>
              <button onClick={onLogout} className="w-9 h-9 rounded-full hover:bg-white/10 inline-flex items-center justify-center"><PA2Icon name="logout" /></button>
            </div>
            <div className="flex gap-1.5 overflow-x-auto mt-3 -mx-1 px-1">
              {NAV.map(n => (
                <button key={n.id} onClick={() => go(n.id)} className={`h-9 px-3.5 rounded-full text-[13px] whitespace-nowrap ${screen === n.id ? "bg-white text-stone-900 font-semibold" : "text-stone-400 bg-white/5"}`}>
                  {n.label}{n.badge ? ` · ${n.badge}` : ""}

              ))}

          </div>

          <main className="px-5 sm:px-8 xl:px-12 py-8 lg:py-12 max-w-[1240px]">
            {screen === "overview" && renderOverview()}

            {screen === "leaders" && renderLeaders()}
            {screen === "rules" && renderRules()}

    }

    // ============================================================================
    // 9.7 MX CORE — محرك المهام الموحد + الإطار المشترك لكل الواجهات (نسخة كلاود)
    // ============================================================================
    const MX_TYPE_META = {
      lecture_quiz: { label: "محاضرة واختبار", icon: "🎬", approval: "self" },
      daily_habit: { label: "عادة يومية", icon: "🔄", approval: "self" },
      reading: { label: "مطالعة", icon: "📖", approval: "self" },
      meeting: { label: "حضور لقاء", icon: "🤝", approval: "manager" },
      practical: { label: "تكليف عملي", icon: "📋", approval: "manager" },
      agenda_minutes: { label: "أجندة أو محضر", icon: "📝", approval: "self" }
    };
    const MX_DAYS = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

    function mxBuildDefaultDeptTasks(sc) {
      const hrDefs = { ...INITIAL_STATE.systemConfig.taskDefinitions, ...(sc?.taskDefinitions || {}) };
      const hr = [
        { id: "lecture", type: "lecture_quiz", approval: "self", title: "المحاضرة الأسبوعية واختبارها", subtitle: hrDefs.lecture?.subtitle || "", instructions: hrDefs.lecture?.instructions || "", enabled: true },
        { id: "agenda", type: "agenda_minutes", approval: "self", title: "إرسال أجندة اللقاء", subtitle: hrDefs.agenda?.subtitle || "", instructions: hrDefs.agenda?.instructions || "", enabled: true },
        { id: "attendance", type: "meeting", approval: "manager", title: "حضور اللقاء الأسبوعي", subtitle: hrDefs.attendance?.subtitle || "", instructions: hrDefs.attendance?.instructions || "", enabled: true },
        { id: "minutes", type: "agenda_minutes", approval: "self", title: "توثيق محضر اللقاء", subtitle: hrDefs.minutes?.subtitle || "", instructions: hrDefs.minutes?.instructions || "", enabled: true }
      ];
      const tDefs = Array.isArray(sc?.tarbawiTaskDefinitions) && sc.tarbawiTaskDefinitions.length ? sc.tarbawiTaskDefinitions : DEFAULT_TARBAWI_TASKS;
      const tarbawi = tDefs.map(t => {
        const type = t.trackType === "daily_days" ? "daily_habit" : t.id === "tarbawi_majlis" ? "meeting" : t.id === "tarbawi_reading" ? "reading" : "practical";
        return {
          id: t.id, type,
          approval: type === "meeting" ? "manager" : "self",
          title: t.title, subtitle: t.subtitle || "", instructions: t.instructions || "",
          targetDays: type === "daily_habit" ? (t.targetDays || 5) : undefined,
          enabled: t.enabled !== false
        };
      });
      return { dept_hr: hr, dept_tarbawi: tarbawi };
    }

    const mxRules = (db) => ({ ...DEFAULT_GOVERNANCE_RULES, ...(db.systemConfig?.governanceRules || {}) });
    const mxDepartments = (db) => db.systemConfig?.departments || DEFAULT_DEPARTMENTS;
    const mxUnits = (db) => db.systemConfig?.organizationalUnits || DEFAULT_UNITS;
    const mxDeptById = (db, id) => mxDepartments(db).find(d => d.id === id) || null;
    const mxIsLeaderRole = (u) => u && (u.roleType === "platform_admin" || u.roleType === "executive");

    function mxDeptTaskDefs(db, deptId, includeDisabled = false) {
      const list = (db.systemConfig?.deptTasks && db.systemConfig.deptTasks[deptId]) || [];
      return includeDisabled ? list : list.filter(t => t.enabled !== false);
    }
    function mxUserDeptIds(db, user) {
      if (!user || mxIsLeaderRole(user)) return [];
      const list = Array.isArray(user.assignedDepartments) ? user.assignedDepartments : [];
      return list.filter(id => { const d = mxDeptById(db, id); return d && d.enabled !== false; });
    }
    function mxUserTasks(db, user, deptFilter = null) {
      return mxUserDeptIds(db, user)
        .filter(did => !deptFilter || did === deptFilter)
        .flatMap(did => mxDeptTaskDefs(db, did).map(t => ({ ...t, deptId: did })));
    }
    const mxCurrentWeek = (user) => calculateWeeksSinceJoin(user?.joinedAt);
    const mxRec = (user, week, taskId) => (user?.tasksRecord && user.tasksRecord[week] && user.tasksRecord[week][taskId]) || { status: "pending" };
    const mxApproval = (def) => def.approval || MX_TYPE_META[def.type]?.approval || "self";
    const mxTargetDays = (def, rules) => Math.max(1, Math.min(7, def.targetDays || rules?.dailyTaskTargetDays || 5));

    function mxTaskState(def, rec, rules) {
      const s = rec?.status || "pending";
      const latePct = Math.max(0, Math.min(100, parseInt(rules?.latePointsPct, 10) || 50));
      if (s === "on_time") return { key: "done", label: "مكتملة", points: 100, done: true };
      if (s === "late") return { key: "late", label: "مكتملة متأخرة", points: latePct, done: true };
      if (s === "submitted") return { key: "submitted", label: "بانتظار الاعتماد", points: 0, done: false };
      if (s === "rejected") return { key: "rejected", label: "أُعيدت للمراجعة", points: 0, done: false };
      const days = Array.isArray(rec?.daysCompleted) ? rec.daysCompleted.length : 0;
      if (def.type === "daily_habit" && days > 0) {
        const target = mxTargetDays(def, rules);
        return { key: "partial", label: `${days} من ${target} أيام`, points: Math.min(90, Math.round((days / target) * 100)), done: false };
      }
      return { key: "pending", label: "لم تُنجز", points: 0, done: false };
    }

    function mxWeekSummary(db, user, week, deptFilter = null) {
      const rules = mxRules(db);
      const tasks = mxUserTasks(db, user, deptFilter);
      const byDept = {};
      let points = 0, done = 0, submitted = 0;
      tasks.forEach(t => {
        const st = mxTaskState(t, mxRec(user, week, t.id), rules);
        points += st.points;
        if (st.done) done++;
        if (st.key === "submitted") submitted++;
        const b = byDept[t.deptId] || (byDept[t.deptId] = { total: 0, done: 0, points: 0, pct: 0 });
        b.total++; b.points += st.points; if (st.done) b.done++;
      });
      Object.values(byDept).forEach(b => { b.pct = b.total ? Math.round(b.points / b.total) : 0; });
      return { week, total: tasks.length, done, submitted, remaining: tasks.length - done - submitted, points, pct: tasks.length ? Math.round(points / tasks.length) : 0, byDept, tasks };
    }

    function mxRecentPct(db, user, weeks = 4, deptFilter = null) {
      const cur = mxCurrentWeek(user);
      const list = [];
      for (let w = Math.max(1, cur - weeks + 1); w <= cur; w++) list.push(mxWeekSummary(db, user, w, deptFilter).pct);
      return list.length ? Math.round(list.reduce((a, b) => a + b, 0) / list.length) : 0;
    }

    function mxStatusOf(pct) {
      if (pct >= 75) return { key: "committed", label: "ملتزم", dot: "bg-emerald-500", ink: "text-emerald-700", bg: "bg-emerald-50" };
      if (pct > 0) return { key: "behind", label: "متأخر", dot: "bg-amber-500", ink: "text-amber-700", bg: "bg-amber-50" };
      return { key: "not_started", label: "لم يبدأ", dot: "bg-stone-400", ink: "text-stone-500", bg: "bg-stone-100" };
    }

    // أعضاء إدارة = كل من أُسندت له مهام هذه الإدارة (أعضاء أو قادة)
    function mxDeptMembers(db, deptId) {
      return db.users.filter(u => !mxIsLeaderRole(u) && mxUserDeptIds(db, u).includes(deptId));
    }
    function mxDeptManager(db, deptId) {
      return db.users.find(u => (u.roleType === "operational_admin" || u.roleType === "admin") && u.departmentId === deptId) || null;
    }

    // المهام التي تنتظر اعتماد المدير (في كل الأسابيع)
    function mxPendingApprovals(db, deptId) {
      const defs = mxDeptTaskDefs(db, deptId);
      const out = [];
      mxDeptMembers(db, deptId).forEach(u => {
        Object.keys(u.tasksRecord || {}).forEach(wk => {
          defs.forEach(t => {
            const r = u.tasksRecord[wk] && u.tasksRecord[wk][t.id];
            if (r && r.status === "submitted") out.push({ user: u, task: t, week: Number(wk), rec: r });
          });
        });
      });
      return out.sort((a, b) => b.week - a.week);
    }

    function mxDeptStats(db, deptId) {
      const rules = mxRules(db);
      const defs = mxDeptTaskDefs(db, deptId);
      const rows = mxDeptMembers(db, deptId).map(u => {
        const week = mxCurrentWeek(u);
        let pts = 0, done = 0;
        defs.forEach(t => { const st = mxTaskState(t, mxRec(u, week, t.id), rules); pts += st.points; if (st.done) done++; });
        const pct = defs.length ? Math.round(pts / defs.length) : 0;
        return { user: u, week, pct, done, total: defs.length, status: mxStatusOf(pct), recentPct: mxRecentPct(db, u, 4, deptId) };
      });
      const avg = rows.length ? Math.round(rows.reduce((a, r) => a + r.pct, 0) / rows.length) : 0;
      const byUnit = mxUnits(db).map(un => {
        const r = rows.filter(x => x.user.unit === un.name);
        return { unit: un, count: r.length, pct: r.length ? Math.round(r.reduce((a, x) => a + x.pct, 0) / r.length) : 0 };
      }).filter(x => x.count > 0);
      const byTask = defs.map(t => ({
        task: t,
        done: rows.filter(r => mxTaskState(t, mxRec(r.user, r.week, t.id), rules).done).length,
        total: rows.length
      }));
      const counts = { committed: 0, behind: 0, not_started: 0 };
      rows.forEach(r => { counts[r.status.key]++; });
      return { deptId, defs, rows, avg, byUnit, byTask, counts, pending: mxPendingApprovals(db, deptId) };
    }

    function mxOrgStats(db) {
      const depts = mxDepartments(db).filter(d => d.enabled !== false);
      const weights = db.systemConfig?.deptWeights || {};
      const deptStats = depts.map(d => ({ dept: d, weight: Math.max(1, Math.min(3, Number(weights[d.id]) || 1)), ...mxDeptStats(db, d.id) }));
      const wSum = deptStats.reduce((a, s) => a + (s.rows.length ? s.weight : 0), 0);
      const index = wSum ? Math.round(deptStats.reduce((a, s) => a + (s.rows.length ? s.avg * s.weight : 0), 0) / wSum) : 0;
      const members = db.users.filter(u => !mxIsLeaderRole(u) && mxUserDeptIds(db, u).length > 0);
      const memberRows = members.map(u => {
        const s = mxWeekSummary(db, u, mxCurrentWeek(u));
        return { user: u, pct: s.pct, recentPct: mxRecentPct(db, u, 4), status: mxStatusOf(s.pct) };
      });
      const units = mxUnits(db).map(un => {
        const r = memberRows.filter(x => x.user.unit === un.name);
        return { unit: un, count: r.length, pct: r.length ? Math.round(r.reduce((a, x) => a + x.pct, 0) / r.length) : 0 };
      }).filter(x => x.count > 0).sort((a, b) => b.pct - a.pct);
      return { index, deptStats, memberRows, units };
    }

    // ---------- التعميمات ----------
    function mxBulletinRecipients(db, b) {
      const pool = db.users.filter(u => u.roleType !== "platform_admin" && u.id !== b.senderId && u.roleType !== "executive");
      if (!b.targetType || b.targetType === "all") return pool;
      if (b.targetType === "dept") return pool.filter(u => u.departmentId === b.targetDeptId || mxUserDeptIds(db, u).includes(b.targetDeptId));
      if (b.targetType === "unit") return pool.filter(u => u.unit === b.targetUnit);
      if (b.targetType === "custom") return pool.filter(u => (b.recipientIds || []).includes(u.id));
      return pool;
    }
    function mxBulletinsForUser(db, user) {
      return (db.bulletins || [])
        .map((b, i) => ({ b, i }))
        .filter(({ b }) => mxBulletinRecipients(db, b).some(u => u.id === user.id))
        .sort((x, y) => (y.b.createdAtTs || 0) - (x.b.createdAtTs || 0) || y.i - x.i)
        .map(({ b }) => b);
    }
    const mxIsAcked = (b, userId) => Boolean(b.acknowledgedBy && b.acknowledgedBy[userId]);
    function mxBulletinTargetLabel(db, b) {
      if (!b.targetType || b.targetType === "all") return "كل المنصة";
      if (b.targetType === "dept") return mxDeptById(db, b.targetDeptId)?.name || "إدارة";
      if (b.targetType === "unit") return b.targetUnit || "وحدة";
      return "أعضاء محددون";
    }
    function mxNowStamp() {
      const d = new Date();
      return `${d.getDate()} ${MONTHS_AR[d.getMonth()]} • ${formatTimeAr(`${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`)}`;
    }

    // تحديث سجل مهمة لعضو
    function mxPatchRecord(setDb, userId, week, taskId, patch) {
      setDb(prev => ({
        ...prev,
        users: prev.users.map(u => {
          if (u.id !== userId) return u;
          const rec = { ...(u.tasksRecord || {}) };
          const wk = { ...(rec[week] || {}) };
          wk[taskId] = { ...(wk[taskId] || { status: "pending" }), ...patch };
          rec[week] = wk;
          return { ...u, tasksRecord: rec };
        })
      }));
    }

    // ---------- عناصر واجهة مشتركة ----------
    function MXHeader({ eyebrow, title, desc, actions }) {
      return (
        <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-5 mb-8">
          <div className="min-w-0">
            <div className="text-[13px] font-medium text-orange-700">{eyebrow}</div>
            <h1 className="text-[30px] sm:text-[34px] font-bold text-stone-900 leading-tight mt-1.5">{title}</h1>
            {desc && <p className="text-[15px] text-stone-500 mt-2 leading-relaxed max-w-xl">{desc}</p>}
          </div>
          {actions && <div className="flex items-center gap-2 shrink-0 flex-wrap">{actions}</div>}
        </div>
      );
    }
    function MXPrimaryBtn({ onClick, children, disabled }) {
      return (
        <button onClick={onClick} disabled={disabled} className={`h-11 px-5 rounded-full text-[14px] font-semibold inline-flex items-center gap-2 transition ${disabled ? "bg-stone-200 text-stone-400 cursor-not-allowed" : "bg-stone-900 text-white hover:bg-stone-800"}`}>
          {children}
        </button>
      );
    }
    function MXGhostBtn({ onClick, children }) {
      return (
        <button onClick={onClick} className="h-10 px-4 rounded-full bg-white border border-stone-200 text-[13px] text-stone-700 hover:bg-stone-50 inline-flex items-center gap-1.5 transition">
          {children}
        </button>
      );
    }
    function MXCard({ children, className = "" }) {
      return <div className={`bg-white rounded-[28px] ${className}`}>{children}</div>;
    }
    function MXSectionTitle({ children, action }) {
      return (
        <div className="flex items-center justify-between mb-4">
          <h2 className="text-xl font-bold text-stone-900">{children}</h2>
          {action}
        </div>
      );
    }
    function MXProgress({ pct, tone }) {
      const color = tone || (pct >= 75 ? "bg-emerald-500" : pct > 0 ? "bg-orange-500" : "bg-stone-300");
      return (
        <div className="h-2 rounded-full bg-[#F1EEE9] overflow-hidden">
          <div className={`h-full rounded-full ${color} transition-all`} style={{ width: `${Math.max(0, Math.min(100, pct))}%` }} />
        </div>
      );
    }
    function MXStatusPill({ pct, status }) {
      const s = status || mxStatusOf(pct);
      return (
        <span className={`inline-flex items-center gap-1.5 h-7 px-2.5 rounded-full text-[12px] ${s.bg} ${s.ink}`}>
          <span className={`w-1.5 h-1.5 rounded-full ${s.dot}`} />{s.label}
        </span>
      );
    }
    function MXDeptChip({ dept, idx = 0 }) {
      if (!dept) return null;
      const tone = pa2DeptTone(dept, idx);
      return <span className={`inline-flex items-center h-6 px-2.5 rounded-full text-[12px] whitespace-nowrap shrink-0 ${tone.bg} ${tone.ink}`}>{dept.shortName || dept.name}</span>;
    }
    // شريط «يحتاج انتباهك»
    function MXAttention({ title, items, emptyText, onPrimary, primaryLabel = "معالجة الآن" }) {
      const [all, setAll] = useState(false);
      if (!items || items.length === 0) {
        return (
          <div className="rounded-[24px] bg-[#E3F1E8] px-6 py-5 mb-6 flex items-center gap-4">
            <span className="w-11 h-11 rounded-full bg-white text-emerald-600 inline-flex items-center justify-center shrink-0"><PA2Icon name="check" className="w-5 h-5" /></span>
            <div>
              <div className="text-[13px] font-medium text-emerald-700">{title}</div>
              <div className="text-[17px] font-semibold text-stone-900 mt-0.5">{emptyText}</div>
            </div>
          </div>
        );
      }
      const visible = all ? items : items.slice(0, 2);
      return (
        <div className="rounded-[24px] bg-[#FFF3E2] px-6 py-5 mb-6">
          <div className="flex flex-col sm:flex-row sm:items-center gap-4">
            <span className="w-11 h-11 rounded-full bg-white text-orange-600 inline-flex items-center justify-center shrink-0"><PA2Icon name="spark" className="w-5 h-5" /></span>
            <div className="flex-1 min-w-0">
              <div className="text-[13px] font-medium text-orange-700">{title}</div>
              <div className="text-[17px] font-semibold text-stone-900 mt-0.5">{items.length} {items.length === 1 ? "أمر يحتاج" : "أمور تحتاج"} انتباهك</div>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={onPrimary || items[0].go} className="h-10 px-5 rounded-full bg-stone-900 text-white text-[14px] font-semibold hover:bg-stone-800">{primaryLabel}</button>
              {items.length > 2 && <button onClick={() => setAll(v => !v)} className="h-10 px-4 rounded-full text-[14px] text-stone-700 hover:bg-white/70">{all ? "إخفاء" : "عرض الكل"}</button>}
            </div>
          </div>
          <div className="mt-4 sm:mr-[60px] divide-y divide-orange-200/60">
            {visible.map(g => (
              <button key={g.key} onClick={g.go} className="w-full flex items-center justify-between py-2.5 text-right group">
                <span className="flex items-center gap-2.5 text-[14px] text-stone-700 min-w-0"><span className="w-1.5 h-1.5 rounded-full bg-orange-500 shrink-0" /><span className="truncate">{g.text}</span></span>
                <span className="text-[13px] text-orange-700 opacity-70 group-hover:opacity-100 inline-flex items-center gap-1 shrink-0">{g.cta || "فتح"} <PA2Icon name="chevron" className="w-3.5 h-3.5" /></span>
              </button>
            ))}
          </div>
        </div>
      );
    }
    // بطاقة الأرقام: كتلة داكنة + أشرطة + أرقام
    function MXScoreCard({ label, pct, caption, bars = [], stats = [] }) {
      return (
        <div className="bg-white rounded-[28px] p-3 mb-10 flex flex-col md:flex-row gap-3">
          <div className="md:w-[280px] rounded-[22px] bg-[#1C1917] text-white p-6 flex flex-col justify-between min-h-[190px]">
            <div className="text-[14px] text-stone-400">{label}</div>
            <div>
              <div className="text-[56px] font-bold leading-none tabular-nums">{pct}<span className="text-[28px] text-stone-500">%</span></div>
              {caption && <div className="text-[13px] text-stone-400 mt-3">{caption}</div>}
            </div>
          </div>
          <div className="flex-1 px-4 py-4 md:px-6 flex flex-col justify-between gap-6">
            <div className="space-y-4">
              {bars.map(b => (
                <div key={b.label}>
                  <div className="flex items-center justify-between mb-2">

            {stats.length > 0 && (
              <div className={`grid grid-cols-${stats.length} divide-x divide-x-reverse divide-stone-200 border-t border-stone-100 pt-4`}>
                {stats.map(s => (
                  <div key={s.l} className="px-3 first:pr-0 text-right">
                    <div className="text-[24px] font-bold text-stone-900 tabular-nums">{s.n}</div>
                    <div className="text-[13px] text-stone-500">{s.l}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ---------- الإطار المشترك (العمود الجانبي + شريط الجوال) ----------
    // modeSwitch: { value, onChange, options: [{ value, label, badge }] } — يظهر فقط للواجهة المزدوجة
    function MXShell({ areaLabel, chip, modeSwitch, nav, active, onNav, user, roleLabel, onLogout, children }) {

      return (

                {chip && <span className="text-[11px] px-2 py-0.5 rounded-full bg-orange-500/15 text-orange-300">{chip}</span>}

            {modeSwitch && (

                    {o.label}

                  </button>

            <nav className={`${modeSwitch ? "mt-6" : "mt-10"} space-y-1`}>
              {nav.map(n => (
                <button key={n.id} onClick={() => go(n.id)} className={`w-full h-11 px-4 rounded-full flex items-center gap-3 text-[14px] transition ${active === n.id ? "bg-white/10 text-white font-semibold" : "text-stone-400 hover:text-white hover:bg-white/5"}`}>
                  <PA2Icon name={n.icon} />
                  <span className="flex-1 text-right">{n.label}</span>
                  {n.badge ? <span className="min-w-[22px] h-[22px] px-1.5 rounded-full bg-orange-500 text-white text-[12px] font-semibold inline-flex items-center justify-center">{n.badge}</span> : null}
                </button>
              ))}
            </nav>
            <div className="mt-auto">
              <div className="flex items-center gap-3 px-2 pt-3 border-t border-white/10">
                <PA2Avatar user={user} size="w-9 h-9" />
                <div className="flex-1 min-w-0">
                  <div className="text-[14px] text-white truncate">{pa2Short(user?.name)}</div>
                  <div className="text-[12px] text-stone-500 truncate">{roleLabel}</div>
                </div>
                <button onClick={onLogout} className="w-9 h-9 rounded-full text-stone-400 hover:text-white hover:bg-white/10 inline-flex items-center justify-center" title="تسجيل الخروج">
                  <PA2Icon name="logout" />
                </button>
              </div>
            </div>
          </aside>

          <div className="lg:hidden sticky top-0 z-30 bg-[#1C1917] text-white px-4 pt-4 pb-3">
            <div className="flex items-center justify-between">
              <div className="text-[18px] font-bold">ميدان <span className="text-[12px] font-normal text-stone-400">· {areaLabel}</span></div>
              <button onClick={onLogout} className="w-9 h-9 rounded-full hover:bg-white/10 inline-flex items-center justify-center"><PA2Icon name="logout" /></button>
            </div>
            {modeSwitch && (

                {modeSwitch.options.map(o => (

                    {o.label}{o.badge ? ` · ${o.badge}` : ""}

                ))}

    // ============================================================================
    // 9.8 MX WORKSPACE — الواجهة المزدوجة (إدارة القسم ⇄ مهماتي)
    // ============================================================================
    function MXWorkspace({ db, setDb, currentUser, isUsernameTaken, onAcknowledgeBulletin, onLogout, showToast }) {
      const myTasks = mxUserTasks(db, currentUser);
      const hasTasks = myTasks.length > 0;
      const [mode, setMode] = useState(() => {
        try { return new URLSearchParams(window.location.search).get("ws") === "mine" ? "mine" : "manage"; } catch (e) { return "manage"; }
      });
      const week = mxCurrentWeek(currentUser);
      const sum = hasTasks ? mxWeekSummary(db, currentUser, week) : null;
      const unread = mxBulletinsForUser(db, currentUser).filter(b => !mxIsAcked(b, currentUser.id)).length;
      const pendingApprovals = currentUser.departmentId ? mxPendingApprovals(db, currentUser.departmentId).length : 0;
      const modeSwitch = hasTasks ? {
        value: mode,
        onChange: setMode,
        options: [
          { value: "manage", label: "إدارة القسم", badge: pendingApprovals || null },
          { value: "mine", label: "مهماتي", badge: ((sum ? sum.remaining : 0) + unread) || null }
        ]
      } : null;
      if (hasTasks && mode === "mine") {
        return <CadrePortalV3 db={db} setDb={setDb} currentUser={currentUser} isUsernameTaken={isUsernameTaken} onAcknowledgeBulletin={onAcknowledgeBulletin} onLogout={onLogout} showToast={showToast} modeSwitch={modeSwitch} />;
      }
      return <OperationalPortalV3 db={db} setDb={setDb} currentUser={currentUser} isUsernameTaken={isUsernameTaken} onLogout={onLogout} showToast={showToast} modeSwitch={modeSwitch} />;
    }

    function mxMarkDirectiveRead(setDb, id) {
      setDb(prev => ({ ...prev, directives: (prev.directives || []).map(d => d.id === id ? { ...d, readAt: Date.now(), readAtLabel: mxNowStamp() } : d) }));
    }
    function MXDirectiveStrip({ directives, onRead }) {
      if (!directives || directives.length === 0) return null;
      const d = directives[0];
      return (
        <div className="rounded-[24px] bg-[#1C1917] text-white px-6 py-5 mb-6">
          <div className="flex flex-col sm:flex-row sm:items-start gap-4">
            <span className="w-11 h-11 rounded-full bg-white/10 text-orange-300 inline-flex items-center justify-center shrink-0"><PA2Icon name="send" className="w-5 h-5" /></span>
            <div className="flex-1 min-w-0">
              <div className="text-[13px] text-orange-300">توجيه من {d.fromName || "الإدارة التنفيذية"} · {d.createdAt}{directives.length > 1 ? ` · ${directives.length - 1} آخر` : ""}</div>
              <p className="text-[16px] text-white mt-1 leading-relaxed whitespace-pre-line">{d.text}</p>

            <button onClick={() => onRead(d.id)} className="h-10 px-5 rounded-full bg-white text-stone-900 text-[14px] font-semibold hover:bg-stone-100 shrink-0">تم الاطلاع</button>
          </div>
        </div>
      );
    }

        title: def?.title || "",

        approval: def?.approval || MX_TYPE_META[def?.type || allowedTypes[0]]?.approval || "self",

      }));

      const fixedSelf = d.type === "lecture_quiz" || d.type === "daily_habit";
      const dirty = isNew ? d.title.trim().length > 1 : (d.title !== def.title || d.type !== def.type || d.approval !== (def.approval || "self") || d.targetDays !== (def.targetDays || 5) || d.instructions !== (def.instructions || ""));
      const save = () => {
        if (!d.title.trim()) return;
